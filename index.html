// 샤크 (w58 h34): 회청색 상어
function drawShark(m, t, flash){
  const swim = Math.sin(t * 5);
  ctx.save();
  ctx.translate(0, Math.sin(t * 2.2) * 1.5);
  ctx.rotate(m.chase ? m.dir * 0.1 : 0); // 추격 시 몸 기울임
  // 꼬리지느러미 (초승달, 스윙)
  ctx.save();
  ctx.translate(-m.dir * 25, -17);
  ctx.rotate(swim * (m.chase ? 0.32 : 0.18));
  ctx.fillStyle = flash ? '#ddd' : '#54748e';
  ctx.beginPath();
  ctx.moveTo(0, -3);
  ctx.lineTo(-m.dir * 10, -12);
  ctx.quadraticCurveTo(-m.dir * 6, -1, -m.dir * 9, 9);
  ctx.lineTo(0, 3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  // 등지느러미
  ctx.fillStyle = flash ? '#ddd' : '#54748e';
  ctx.beginPath();
  ctx.moveTo(-m.dir * 10, -26);
  ctx.quadraticCurveTo(-m.dir * 5, -35, m.dir * 1, -34);
  ctx.quadraticCurveTo(m.dir * 2, -30, m.dir * 5, -27);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.stroke();
  // 유선형 몸통 (회청색)
  const sg = ctx.createLinearGradient(0, -30, 0, -5);
  sg.addColorStop(0, flash ? '#fff' : '#7a9ab4');
  sg.addColorStop(1, flash ? '#ddd' : '#50708c');
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(m.dir * 28, -15);
  ctx.quadraticCurveTo(m.dir * 16, -29, -m.dir * 4, -27);
  ctx.quadraticCurveTo(-m.dir * 22, -24, -m.dir * 27, -17);
  ctx.quadraticCurveTo(-m.dir * 22, -11, -m.dir * 4, -7);
  ctx.quadraticCurveTo(m.dir * 16, -4, m.dir * 28, -15);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  // 흰 배
  ctx.fillStyle = flash ? '#fff' : '#eef3f6';
  ctx.beginPath();
  ctx.moveTo(m.dir * 25, -12.5);
  ctx.quadraticCurveTo(m.dir * 12, -5.5, -m.dir * 6, -7.5);
  ctx.quadraticCurveTo(m.dir * 6, -10, m.dir * 25, -12.5);
  ctx.closePath(); ctx.fill();
  // 가슴지느러미
  ctx.save();
  ctx.translate(m.dir * 4, -9);
  ctx.rotate(m.dir * (0.5 + swim * 0.1));
  ctx.fillStyle = flash ? '#ddd' : '#5d7f9a';
  ctx.beginPath(); ctx.ellipse(0, 4, 3.2, 7, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.7)'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.restore();
  // 아가미 3줄
  ctx.strokeStyle = 'rgba(40,60,80,0.55)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++){
    ctx.beginPath();
    ctx.moveTo(m.dir * (10 - i * 3.5), -22);
    ctx.quadraticCurveTo(m.dir * (11.5 - i * 3.5), -17, m.dir * (10 - i * 3.5), -12);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  // 눈 (사나운)
  ctx.fillStyle = '#111a26';
  ctx.beginPath(); ctx.ellipse(m.dir * 17, -20, 2.2, 2.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.arc(m.dir * 16.4, -20.8, 0.8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#33506a'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.dir * 13, -23.5); ctx.lineTo(m.dir * 20, -22); ctx.stroke();
  ctx.lineCap = 'butt';
  // 입 — 추격 시 벌리고 이빨 드러냄
  if (m.chase){
    ctx.fillStyle = '#7a2836';
    ctx.beginPath();
    ctx.moveTo(m.dir * 27, -13.5);
    ctx.quadraticCurveTo(m.dir * 19, -14.5, m.dir * 14, -12);
    ctx.quadraticCurveTo(m.dir * 19, -6.5, m.dir * 26, -9.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 1.8; ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const tx of [15.5, 19, 22.5]){
      ctx.beginPath();
      ctx.moveTo(m.dir * tx, -12.8); ctx.lineTo(m.dir * (tx + 1.6), -9.8); ctx.lineTo(m.dir * (tx + 3.2), -12.4);
      ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.strokeStyle = 'rgba(30,45,60,0.8)'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.dir * 26, -11.5); ctx.quadraticCurveTo(m.dir * 20, -8.5, m.dir * 15, -9.5); ctx.stroke();
    ctx.lineCap = 'butt';
  }
  ctx.restore();
}

// 보스 크라켄 (w160 h140): 거대 보라 문어왕
function drawKraken(m, t, flash){
  const enraged = m.hp < m.maxHp * 0.35;
  // 격노 청록 오라 (가산합성 글로우)
  if (!m.dead && enraged){
    ctx.globalCompositeOperation = 'lighter';
    const ap = 0.14 + Math.abs(Math.sin(t * 4)) * 0.14;
    const ag = ctx.createRadialGradient(0, -80, 25, 0, -80, 140);
    ag.addColorStop(0, 'rgba(60,230,200,' + ap + ')');
    ag.addColorStop(1, 'rgba(60,230,200,0)');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.arc(0, -80, 140, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  const bob = Math.sin(t * 1.8) * 3;
  ctx.save();
  ctx.translate(0, bob);
  // 물결치는 촉수 6개 (사인 위상차)
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++){
    const bx = -55 + i * 22;
    const ph = i * 1.05;
    const wv = Math.sin(t * 2.8 + ph);
    const midX = bx + wv * 10;
    const tipX = bx + Math.sin(t * 2.8 + ph + 1.2) * 16;
    // 어두운 아웃라인 스트로크 → 본색 스트로크 (테이퍼 느낌)
    for (const [wOut, col] of [[16, 'rgba(45,30,22,0.85)'], [12, flash ? '#ddd' : '#6a44a6']]){
      ctx.strokeStyle = col; ctx.lineWidth = wOut;
      ctx.beginPath();
      ctx.moveTo(bx, -62);
      ctx.quadraticCurveTo(midX, -34, tipX, -8);
      ctx.stroke();
    }
    // 말린 촉수 끝
    ctx.fillStyle = flash ? '#ddd' : '#7a54b6';
    ctx.beginPath(); ctx.arc(tipX, -8, 7.5, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.arc(tipX, -8, 7.5, 0, 7); ctx.stroke();
    // 빨판 점
    ctx.fillStyle = flash ? '#eee' : '#c8a8e8';
    ctx.beginPath();
    ctx.arc(midX * 0.8 + bx * 0.2, -36, 2.4, 0, 7);
    ctx.arc(tipX * 0.75 + midX * 0.25, -20, 2.2, 0, 7);
    ctx.fill();
  }
  ctx.lineCap = 'butt';
  // 돔 머리 (거대 보라)
  const kg = ctx.createRadialGradient(-18, -110, 12, 0, -95, 90);
  kg.addColorStop(0, flash ? '#fff' : '#9a6cd4');
  kg.addColorStop(1, flash ? '#ddd' : '#5a3492');
  ctx.fillStyle = kg;
  ctx.beginPath();
  ctx.moveTo(-64, -54);
  ctx.quadraticCurveTo(-80, -100, -54, -126);
  ctx.quadraticCurveTo(-30, -144, 0, -144);
  ctx.quadraticCurveTo(30, -144, 54, -126);
  ctx.quadraticCurveTo(80, -100, 64, -54);
  ctx.quadraticCurveTo(0, -66, -64, -54);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round'; ctx.stroke();
  // 머리 광택 + 반점
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.ellipse(-26, -122, 16, 8, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(60,30,110,0.4)';
  ctx.beginPath();
  ctx.arc(-44, -84, 5, 0, 7); ctx.arc(46, -92, 6, 0, 7); ctx.arc(30, -70, 4, 0, 7);
  ctx.fill();
  // 왕관 문양 (이마의 금빛 각인)
  ctx.strokeStyle = flash ? '#eee' : '#f2c84a'; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-16, -120);
  ctx.lineTo(-16, -132); ctx.lineTo(-8, -125);
  ctx.lineTo(0, -136); ctx.lineTo(8, -125);
  ctx.lineTo(16, -132); ctx.lineTo(16, -120);
  ctx.closePath(); ctx.stroke();
  ctx.fillStyle = flash ? '#fff' : '#f2c84a';
  ctx.beginPath(); ctx.arc(0, -125, 2.6, 0, 7); ctx.fill();
  // 큰 눈 2개 (격노 시 붉게)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(m.dir * 4 - 24, -92, 11, 13, 0, 0, 7); ctx.ellipse(m.dir * 4 + 24, -92, 11, 13, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(m.dir * 4 - 24, -92, 11, 13, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(m.dir * 4 + 24, -92, 11, 13, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = enraged ? '#e02828' : '#2a1a4e';
  ctx.beginPath();
  ctx.arc(m.dir * 7 - 24, -92, enraged ? 6.5 : 5, 0, 7);
  ctx.arc(m.dir * 7 + 24, -92, enraged ? 6.5 : 5, 0, 7);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(m.dir * 7 - 26, -95, 1.8, 0, 7); ctx.arc(m.dir * 7 + 22, -95, 1.8, 0, 7); ctx.fill();
  if (enraged){
    ctx.strokeStyle = '#3a2060'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(m.dir * 4 - 38, -110); ctx.lineTo(m.dir * 4 - 12, -104);
    ctx.moveTo(m.dir * 4 + 38, -110); ctx.lineTo(m.dir * 4 + 12, -104);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }
  // 부리 입 (오므린)
  const pk = 1 + Math.max(0, Math.sin(t * 2.4)) * 0.3;
  ctx.fillStyle = flash ? '#eee' : '#3a2468';
  ctx.beginPath(); ctx.ellipse(m.dir * 4, -68, 7 * pk, 5.5 * pk, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(m.dir * 4, -68, 7 * pk, 5.5 * pk, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = flash ? '#ccc' : '#180e30';
  ctx.beginPath(); ctx.ellipse(m.dir * 4, -68, 3 * pk, 2.4 * pk, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// 구름양 (w44 h34): 뭉게구름 몸통의 순한 양
function drawWooly(m, t, flash){
  const bob = Math.sin(t * 1.8) * 3;
  ctx.save();
  ctx.translate(0, -5 + bob); // 두둥실 부유
  const puffs = [
    [-13, -15, 10], [0, -18, 12], [12, -14, 9.5], [-4, -10, 10], [8, -9, 8.5],
  ];
  // 작은 다리 (대롱대롱)
  ctx.fillStyle = flash ? '#eee' : '#e8dcc4';
  const dl = Math.sin(t * 2.6) * 1.2;
  rr(-9, -6 + dl * 0.5, 5, 8, 2.4); ctx.fill();
  rr(4, -6 - dl * 0.5, 5, 8, 2.4); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.7)'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  ctx.beginPath(); rr(-9, -6 + dl * 0.5, 5, 8, 2.4); ctx.stroke();
  ctx.beginPath(); rr(4, -6 - dl * 0.5, 5, 8, 2.4); ctx.stroke();
  // 뭉게구름 실루엣 아웃라인 (겹침 원을 확대해 한 겹)
  ctx.fillStyle = 'rgba(45,30,22,0.85)';
  for (const [px, py, pr] of puffs){
    ctx.beginPath(); ctx.arc(px, py, pr + 2.2, 0, 7); ctx.fill();
  }
  // 뭉게구름 몸통 (흰 원 겹침)
  const wg = ctx.createLinearGradient(0, -30, 0, -2);
  wg.addColorStop(0, '#ffffff');
  wg.addColorStop(1, flash ? '#eee' : '#dfe6f2');
  ctx.fillStyle = wg;
  for (const [px, py, pr] of puffs){
    ctx.beginPath(); ctx.arc(px, py, pr, 0, 7); ctx.fill();
  }
  // 얼굴 (크림색)
  ctx.fillStyle = flash ? '#fff' : '#f4e6c8';
  ctx.beginPath(); ctx.arc(m.dir * 11, -16, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.8)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(m.dir * 11, -16, 8, 0, 7); ctx.stroke();
  // 앞머리 뭉치
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(m.dir * 8, -23, 4.5, 0, 7); ctx.arc(m.dir * 13, -23.5, 3.6, 0, 7); ctx.fill();
  // 작은 귀
  ctx.fillStyle = flash ? '#eee' : '#e8d4ac';
  ctx.beginPath(); ctx.ellipse(m.dir * 4.5, -19, 3.4, 2, m.dir * 0.5, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.6)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(m.dir * 4.5, -19, 3.4, 2, m.dir * 0.5, 0, 7); ctx.stroke();
  // 잠자는 듯한 순한 눈 (감은 곡선)
  ctx.strokeStyle = '#6a5238'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(m.dir * 9, -16.5, 2.4, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.beginPath(); ctx.arc(m.dir * 14, -16.5, 2.4, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.lineCap = 'butt';
  // 볼터치 + 작은 입
  ctx.fillStyle = 'rgba(240,150,140,0.5)';
  ctx.beginPath(); ctx.ellipse(m.dir * 7.5, -12.5, 1.8, 1.1, 0, 0, 7); ctx.ellipse(m.dir * 15.5, -12.5, 1.8, 1.1, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6a5238'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(m.dir * 11.5, -12.5, 1.6, 0.4, Math.PI - 0.4); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.restore();
}

// 루나픽시 (w36 h40): 보라 픽시 — 잠자리 날개 + 별 지팡이
function drawCpix(m, t, flash){
  const bob = Math.sin(t * 2.6) * 3;
  ctx.save();
  ctx.translate(0, -7 + bob); // 부유
  // 잠자리 날개 2쌍 (빠른 펄럭임, 반투명)
  const fl = Math.sin(t * 24);
  ctx.save();
  ctx.translate(-m.dir * 5, -22);
  ctx.globalAlpha = 0.55;
  for (const [ang, len, wid] of [[-0.85, 14, 4.6], [-0.35, 15.5, 5], [0.15, 13, 4.2], [0.6, 10.5, 3.6]]){
    ctx.save();
    ctx.rotate(-m.dir * (ang + fl * 0.22));
    ctx.fillStyle = flash ? '#fff' : 'rgba(214,196,255,0.9)';
    ctx.beginPath(); ctx.ellipse(-m.dir * len * 0.6, 0, len * 0.62, wid, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(150,120,220,0.7)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-m.dir * len * 0.6, 0, len * 0.62, wid, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // 작은 다리
  ctx.strokeStyle = flash ? '#ddd' : '#7a4ab0'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  const kick = Math.sin(t * 3) * 1.5;
  ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(-4, -1 + kick * 0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -8); ctx.lineTo(4, -1 - kick * 0.5); ctx.stroke();
  ctx.lineCap = 'butt';
  // 작은 몸 (보라 원피스)
  const cg = ctx.createLinearGradient(0, -20, 0, -6);
  cg.addColorStop(0, flash ? '#fff' : '#a86ae0');
  cg.addColorStop(1, flash ? '#ddd' : '#7a3cb4');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.quadraticCurveTo(8, -16, 8.5, -7);
  ctx.quadraticCurveTo(0, -4.5, -8.5, -7);
  ctx.quadraticCurveTo(-8, -16, 0, -20);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  // 큰 머리
  ctx.fillStyle = flash ? '#fff' : '#f6e8fa';
  ctx.beginPath(); ctx.arc(m.dir * 1, -26, 10, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.arc(m.dir * 1, -26, 10, 0, 7); ctx.stroke();
  // 보라 머리카락 (앞머리 + 옆 뭉치)
  ctx.fillStyle = flash ? '#ddd' : '#8a4ecc';
  ctx.beginPath();
  ctx.arc(m.dir * 1, -26, 10, Math.PI + 0.35, -0.35);
  ctx.quadraticCurveTo(m.dir * 5, -30, m.dir * 1 - 2, -30.5);
  ctx.quadraticCurveTo(-m.dir * 4, -31, -m.dir * 8.5, -28.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-m.dir * 9.5, -23, 3, 4.6, m.dir * 0.4, 0, 7); ctx.fill();
  // 눈 + 미소
  ctx.fillStyle = '#3a2058';
  ctx.beginPath(); ctx.ellipse(m.dir * 4.5 - 3.2, -25, 1.7, 2.3, 0, 0, 7); ctx.ellipse(m.dir * 4.5 + 3.2, -25, 1.7, 2.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(m.dir * 4.5 - 3.7, -25.8, 0.7, 0, 7); ctx.arc(m.dir * 4.5 + 2.7, -25.8, 0.7, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3a2058'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(m.dir * 4.5, -21.5, 2, 0.4, Math.PI - 0.4); ctx.stroke();
  ctx.lineCap = 'butt';
  // 별 지팡이 (손에, 살짝 흔들)
  ctx.save();
  ctx.translate(m.dir * 8, -13);
  ctx.rotate(m.dir * (Math.sin(t * 2.2) * 0.12 - 0.35));
  ctx.strokeStyle = flash ? '#eee' : '#c89a4e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(0, -12); ctx.stroke();
  ctx.lineCap = 'butt';
  const tw = 0.8 + Math.abs(Math.sin(t * 5)) * 0.2;
  ctx.fillStyle = flash ? '#fff' : '#ffd94a';
  ctx.beginPath();
  for (let i = 0; i < 5; i++){
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    const a2 = a + Math.PI / 5;
    const R = 5.5 * tw, r2 = 2.3 * tw;
    if (i === 0) ctx.moveTo(Math.cos(a) * R, -14 + Math.sin(a) * R);
    else ctx.lineTo(Math.cos(a) * R, -14 + Math.sin(a) * R);
    ctx.lineTo(Math.cos(a2) * r2, -14 + Math.sin(a2) * r2);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(180,120,20,0.8)'; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
  // 손
  ctx.fillStyle = flash ? '#fff' : '#f6e8fa';
  ctx.beginPath(); ctx.arc(m.dir * 8, -13, 2.4, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.7)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(m.dir * 8, -13, 2.4, 0, 7); ctx.stroke();
  ctx.restore();
}

// 가시 선인장 (w46 h52): 화난 초록 선인장
function drawCact(m, t, flash){
  const sway = Math.sin(t * 1.9) * 0.045;
  ctx.save();
  ctx.rotate(sway); // 발밑 기준 흔들
  const body = flash ? '#ddd' : '#4e9c3c';
  const bodyD = flash ? '#ccc' : '#3a7c2c';
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';

  // 기둥 몸통
  const gg = ctx.createLinearGradient(-13, 0, 13, 0);

// 미라 (w44 h50): 붕대 감은 미라
function drawMummy(m, t, flash){
  const step = Math.sin(t * 4);
  const wr = flash ? '#eee' : '#e2d6b6';
  const wrD = flash ? '#ccc' : '#c0b28e';
  // 풀린 붕대 자락 (뒤로 날림)
  ctx.strokeStyle = wr; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-m.dir * 10, -37);
  ctx.quadraticCurveTo(-m.dir * 22, -41 + Math.sin(t * 5) * 3, -m.dir * 33, -33 + Math.sin(t * 5 + 1) * 5);
  ctx.stroke();
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-m.dir * 12, -18);
  ctx.quadraticCurveTo(-m.dir * 20, -20 + Math.sin(t * 4.4 + 0.7) * 3, -m.dir * 27, -13 + Math.sin(t * 4.4 + 1.8) * 4);
  ctx.stroke();
  ctx.lineCap = 'butt';
  // 다리 2개 (질질 끄는 걸음)
  ctx.fillStyle = wrD;
  ctx.strokeStyle = 'rgba(45,30,22,0.8)'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  rr(-10 + step * 1.4, -11, 9, 11, 3.6); ctx.fill(); ctx.stroke();
  rr(2 - step * 1.4, -11, 9, 11, 3.6); ctx.fill(); ctx.stroke();
  ctx.save();
  ctx.rotate(m.dir * 0.045); // 앞으로 기우뚱
  // 몸통+머리 (달걀형 통짜)
  const mg = ctx.createLinearGradient(0, -50, 0, -8);
  mg.addColorStop(0, flash ? '#fff' : '#eee2c4');
  mg.addColorStop(1, wrD);
  ctx.fillStyle = mg;
  ctx.beginPath();
  ctx.moveTo(0, -50);
  ctx.quadraticCurveTo(15, -48, 16, -30);
  ctx.quadraticCurveTo(16.5, -12, 0, -10);
  ctx.quadraticCurveTo(-16.5, -12, -16, -30);
  ctx.quadraticCurveTo(-15, -48, 0, -50);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  // 붕대 가로줄 여러 개 (엇갈린 기울기)
  ctx.strokeStyle = 'rgba(120,102,66,0.55)'; ctx.lineWidth = 1.6;
  for (const [ly, sl] of [[-46, 1.5], [-42.5, -1.5], [-31, 1.8], [-27, -1.5], [-23, 1.8], [-18.5, -1.8], [-14, 1.5]]){
    const hw = ly > -46 ? (ly > -31 ? 15.5 : 14) : 10;
    ctx.beginPath();
    ctx.moveTo(-hw, ly - sl); ctx.quadraticCurveTo(0, ly + sl, hw, ly - sl);
    ctx.stroke();
  }
  // 눈 틈 (붕대 사이 어두운 가로 띠)
  ctx.fillStyle = flash ? '#bbb' : '#3a3020';
  rr(-13, -40.5, 26, 6.5, 3); ctx.fill();
  // 빛나는 빨간 눈 한쪽 (가산합성 글로우)
  const ex = m.dir * 6, ey = -37.3;
  ctx.globalCompositeOperation = 'lighter';
  const eg = ctx.createRadialGradient(ex, ey, 0.5, ex, ey, 7);
  eg.addColorStop(0, 'rgba(255,70,50,' + (0.5 + Math.abs(Math.sin(t * 3)) * 0.3) + ')');
  eg.addColorStop(1, 'rgba(255,70,50,0)');
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(ex, ey, 7, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#ff3428';
  ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd0b0';
  ctx.beginPath(); ctx.arc(ex, ey, 1, 0, 7); ctx.fill();
  // 다른 눈 (죽은 점)
  ctx.fillStyle = 'rgba(160,140,100,0.7)';
  ctx.beginPath(); ctx.arc(-m.dir * 5, -37.3, 1.4, 0, 7); ctx.fill();
  // 앞으로 뻗은 팔 2개 (좀비 워킹)
  for (const [ay, ph] of [[-30, 0], [-24, Math.PI * 0.7]]){
    ctx.save();
    ctx.translate(m.dir * 11, ay);
    ctx.rotate(-m.dir * (0.12 + Math.sin(t * 4 + ph) * 0.09));
    ctx.fillStyle = wr;
    rr(m.dir > 0 ? 0 : -17, -3.4, 17, 6.8, 3.2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    // 손끝 붕대 매듭
    ctx.fillStyle = wrD;
    ctx.beginPath(); ctx.arc(m.dir * 17, 0, 3.4, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(45,30,22,0.7)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

// 보스 파라오 (w160 h150): 황금 석관의 왕
function drawPharaoh(m, t, flash){

  ctx.quadraticCurveTo(28, -90, 24, -100);

  ctx.closePath(); ctx.fill();

  ctx.fillStyle = enraged ? '#ffdf60' : '#241c10';

  ctx.ellipse(m.dir * 2 + 8.5, -125, 5, enraged ? 3.6 : 2.4, 0, 0, 7);
  ctx.fill();
  ctx.strokeStyle = '#241c10'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(m.dir * 2 - 13.5, -125); ctx.lineTo(m.dir * 2 - 17.5, -126.5);
  ctx.moveTo(m.dir * 2 + 13.5, -125); ctx.lineTo(m.dir * 2 + 17.5, -126.5);
  ctx.stroke();
  ctx.lineCap = 'butt';
  // 격노: 눈에서 금빛 광선
  if (!m.dead && enraged){
    ctx.globalCompositeOperation = 'lighter';

      ctx.lineTo(sx, sy + 3);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // 무표정 입 (일자) + 코 라인
  ctx.strokeStyle = '#241c10'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.dir * 2 - 6, -110); ctx.lineTo(m.dir * 2 + 6, -110); ctx.stroke();

  for (const by of [-102, -98, -94]){
    ctx.beginPath(); ctx.moveTo(m.dir * 2 - 3, by); ctx.lineTo(m.dir * 2 + 3, by); ctx.stroke();

}

// 산호 (수중 장식): sx=화면x, s=스케일 — 세로 원점이 지면(floor)인 상태에서 호출
function drawCoral(sx, s){
  const tt = (typeof game !== 'undefined' && game.time) ? game.time : 0;
  ctx.save();
  ctx.translate(sx, 0);
  ctx.scale(s, s);
  ctx.rotate(Math.sin(tt * 1.3 + sx * 0.013) * 0.025); // 물살에 살랑
  ctx.lineCap = 'round';
  // 가지 4개 (분홍/주황, 어두운 밑색 → 본색 2겹)

    { mx: -14, my: -16, tx: -20, ty: -30, w: 6.5, c: '#e87a9a' },
    { mx: -4, my: -22, tx: -7, ty: -40, w: 7.5, c: '#f09a62' },

  ];
  for (const b of branches){
    for (const [wAdd, col] of [[3.4, 'rgba(120,40,60,0.5)'], [0, b.c]]){
      ctx.strokeStyle = col; ctx.lineWidth = b.w + wAdd;
      ctx.beginPath();
      ctx.moveTo(b.mx * 0.25, 0);
      ctx.quadraticCurveTo(b.mx, b.my, b.tx, b.ty);
      ctx.stroke();
    }
    // 가지 끝 밝은 돌기
    ctx.fillStyle = 'rgba(255,220,225,0.85)';
    ctx.beginPath(); ctx.arc(b.tx, b.ty, b.w * 0.34, 0, 7); ctx.fill();
  }
  // 곁가지 2개
  ctx.strokeStyle = '#f0a276'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-5, -30); ctx.quadraticCurveTo(2, -36, 3, -44); ctx.stroke();
  ctx.strokeStyle = '#ee8aa4'; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(-17, -24); ctx.quadraticCurveTo(-24, -28, -27, -35); ctx.stroke();
  ctx.lineCap = 'butt';
  // 밑동 바위
  ctx.fillStyle = '#8a7668';
  ctx.beginPath(); ctx.ellipse(0, -1, 17, 5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.ellipse(-5, -3, 7, 2, -0.2, 0, 7); ctx.fill();
  ctx.restore();
}

function drawBoss(m, t, flash){

  // 갓 광택

const JOB_STYLE = {
  beginner: { hair:'#5a3a1e', top:'#3a6ecc', topD:'#2a4e9e', pants:'#3a2e6e', shoe:'#7a4a2a' },
  warrior:  { hair:'#4a2c14', top:'#b83a30', topD:'#8a2620', pants:'#43391f'.replace('43391f','3a3050'), shoe:'#54371f' },
  archer:   { hair:'#7a4f22', top:'#3a8a4a', topD:'#2a6236', pants:'#4a3a26', shoe:'#54371f' },
  mage:     { hair:'#3e2a4e', top:'#6a4ac0', topD:'#4e3494', pants:'#2e2440', shoe:'#3a2a50' },
  thief:    { hair:'#2e2438', top:'#8a3aa8', topD:'#5f2478', pants:'#2a2036', shoe:'#3a2a44' },
};
function drawPlayer(){
  const sx = player.x - camX;
  const blink = player.invul > 0 && Math.floor(game.time * 14) % 2 === 0;
  if (blink && game.state === 'play') return;
  const st = JOB_STYLE[player.job] || JOB_STYLE.beginner;
  const climbing = !!player.climbing;
  const moving = Math.abs(player.vx) > 30 && player.onGround;
  const air = !player.onGround && !climbing;
  const wt = player.walkT;
  const leg = moving ? Math.sin(wt) * 7 : 0;
  const armSwing = moving ? Math.sin(wt) * 0.5 : 0;
  const breathe = (!moving && !air && !climbing) ? Math.sin(game.time * 2.2) * 1.2 : 0;
  const atk = player.attackAnim > 0;
  const cast = player.castAnim > 0;
  const eyeBlink = ((game.time % 3.1) > 2.94);

  ctx.save();
  ctx.translate(sx, player.y);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
  // 마을 귀환 시전: 하늘색 마법진 + 진행 링
  if (player.returning != null){
    const rp = 1 - player.returning / 3;
    ctx.strokeStyle = 'rgba(130,215,255,0.85)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 9, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,240,255,0.95)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, -70, 14, -Math.PI / 2, -Math.PI / 2 + rp * Math.PI * 2); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(130,215,255,0.12)';
    ctx.beginPath(); ctx.ellipse(0, -30, 26, 42, 0, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  // 캐스팅 마법진
  if (cast && player.job === 'mage'){
    const ca = player.castAnim / 0.25;
    ctx.save();
    ctx.rotate(0);
    ctx.strokeStyle = 'rgba(154,122,255,' + (0.75 * ca) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 8, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,180,255,' + (0.55 * ca) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 5.5, 0, game.time * 5, game.time * 5 + 4.6); ctx.stroke();
    for (let i = 0; i < 4; i++){
      const ang = game.time * 4 + i * 1.57;
      ctx.fillStyle = 'rgba(190,160,255,' + (0.7 * ca) + ')';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 24, Math.sin(ang) * 7, 2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  ctx.scale(player.facing, 1);
  ctx.translate(0, breathe * 0.5);

  // ---- 엎드리기 (메이플 시그니처) ----
  if (player.prone && !climbing){
    // 다리 (뒤로 뻗음)
    ctx.fillStyle = st.pants;
    rr(-34, -10, 18, 8, 4); ctx.fill();
    ctx.fillStyle = st.shoe;
    rr(-40, -9, 9, 7, 3); ctx.fill();
    // 몸통 (수평)
    const pg2 = ctx.createLinearGradient(0, -16, 0, -2);
    pg2.addColorStop(0, st.top);
    pg2.addColorStop(1, st.topD);
    ctx.fillStyle = pg2;
    rr(-20, -16, 30, 14, 6); ctx.fill();
    // 팔 (턱 밑에)
    ctx.fillStyle = st.topD;
    rr(4, -12, 12, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(16, -8.5, 3.6, 0, 7); ctx.fill();
    // 머리 (앞쪽, 위를 봄)
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(14, -22, 14.5, 0, 7); ctx.fill();
    ctx.fillStyle = st.hair;
    ctx.beginPath(); ctx.arc(12, -25, 14.8, Math.PI * 0.8, Math.PI * 2.05); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -28); ctx.quadraticCurveTo(2, -37, 12, -38);
    ctx.lineTo(14, -32); ctx.lineTo(19, -37.5); ctx.lineTo(23, -31);

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(18.7, -22.2, 0.9, 0, 7); ctx.arc(25.2, -22.2, 0.9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(21.5, -15.5, 2.2, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,140,0.35)';
    ctx.beginPath(); ctx.ellipse(26.5, -16.5, 3, 2, 0, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }

  // ---- 다리/신발 ----
  const legY = air ? -16 : -15;
  ctx.fillStyle = st.pants;
  rr(-10 + (air ? -2 : leg * 0.55), legY, 9, 15, 3.5); ctx.fill();
  rr(2 + (air ? 3 : -leg * 0.55), legY + (air ? -4 : 0), 9, air ? 12 : 15, 3.5); ctx.fill();
  ctx.fillStyle = st.shoe;
  rr(-12 + (air ? -2 : leg * 0.55), -6, 12, 6, 2.5); ctx.fill();
  rr(1 + (air ? 3 : -leg * 0.55), -6 + (air ? -4 : 0), 12, 6, 2.5); ctx.fill();

  // ---- 4차: 은은한 금빛 오라 (몸 뒤) ----
  if (player.job4 && !climbing){
    ctx.globalCompositeOperation = 'lighter';
    const a4 = 0.10 + Math.sin(game.time * 3) * 0.05;
    ctx.fillStyle = 'rgba(255,220,120,' + a4 + ')';
    ctx.beginPath(); ctx.ellipse(0, -28, 24, 38, 0, 0, 7); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(-4, -36);
    ctx.quadraticCurveTo(-16, -29, -14 - wob, -8);
    ctx.quadraticCurveTo(-9, -12, -7, -18);
    ctx.quadraticCurveTo(-8, -28, -4, -36);
    ctx.closePath(); ctx.fill();

  ctx.fillStyle = topG;
  rr(-12, -36, 24, 23, 7); ctx.fill();
  // ---- 갑옷 (장비 외형 반영) ----
  if (player.equip.top){
    const tt = ITEMS[player.equip.top.id].tier;
    if (tt === 1){
      // 여행자의 조끼
      ctx.fillStyle = 'rgba(122,82,48,0.9)';
      rr(-12, -32, 24, 12, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(70,45,25,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, -20); ctx.stroke();
    } else if (tt === 2){
      // 사슬 갑옷 (리벳 점)
      ctx.fillStyle = 'rgba(150,158,176,0.95)';
      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.fillStyle = 'rgba(92,100,118,0.95)';
      for (const px of [-7, 0, 7]){
        ctx.beginPath(); ctx.arc(px, -31, 1.5, 0, 7); ctx.arc(px, -25, 1.5, 0, 7); ctx.fill();
      }
    } else if (tt === 3){
      // 용사의 판금 + 금 어깨
      ctx.fillStyle = '#c8ccd8';
      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      rr(-12, -36, 24, 5, 4); ctx.fill();
      ctx.fillStyle = '#e8c05a';
      rr(-14, -37, 8, 7, 3); ctx.fill();
      rr(6, -37, 8, 7, 3); ctx.fill();

    } else {
      // 용린 갑주 (붉은 비늘 + 금테)

      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(70,15,10,0.8)'; ctx.lineWidth = 1.4;
      for (const py of [-32, -27, -22]){

  if (player.job === 'warrior'){

    rr(-13, -37, 26, 7, 3); ctx.fill();   // 어깨 갑주 (2차: 금장)
  } else if (player.job === 'mage'){

  if (!climbing){
    ctx.save();
    ctx.translate(-9, -33);
    ctx.rotate(-armSwing);
    ctx.fillStyle = st.topD;
    rr(-3.5, 0, 7, 13, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, 13, 3.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // ---- 무기 + 앞팔 ----
  if (climbing){
    const ph = Math.sin(game.time * 8) * 4;
    ctx.fillStyle = st.top;
    rr(-14, -50 + ph, 7, 18, 3.5); ctx.fill();
    rr(7, -50 - ph, 7, 18, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-10.5, -50 + ph, 3.6, 0, 7); ctx.arc(10.5, -50 - ph, 3.6, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 활
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    const pull = atk && prog < 0.55 ? (0.55 - prog) * 16 : 0;
    ctx.save();
    ctx.translate(13, -27);
    ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 19, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = '#5a3512'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 19, -0.5, 0.5); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ece8d8'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.25) * 19, Math.sin(-1.25) * 19);
    ctx.lineTo(-5 - pull, 0);
    ctx.lineTo(Math.cos(1.25) * 19, Math.sin(1.25) * 19);
    ctx.stroke();
    if (pull > 0){
      ctx.strokeStyle = '#d8ccb8'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-5 - pull, 0); ctx.lineTo(17, 0); ctx.stroke();
      ctx.fillStyle = '#c8ccd8';
      ctx.beginPath(); ctx.moveTo(21, 0); ctx.lineTo(15, -3); ctx.lineTo(15, 3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // 앞팔
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else if (player.job === 'thief'){
    // 단검 + 투척 자세
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    const throwArm = atk && prog < 0.5 ? (0.5 - prog) * 2 : 0;
    ctx.save();
    ctx.translate(11, -30);
    ctx.rotate(-0.3 - throwArm * 0.8);
    ctx.fillStyle = '#c8ccd8';
    ctx.beginPath();
    ctx.moveTo(0, -4); ctx.lineTo(15, -1.5); ctx.lineTo(17, 0); ctx.lineTo(15, 1.5); ctx.lineTo(0, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5f2478';
    rr(-6, -3.5, 7, 7, 2.5); ctx.fill();
    ctx.restore();
    // 앞팔
    ctx.fillStyle = st.top;
    rr(1, -33 - throwArm * 6, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5 - throwArm * 7, 3.8, 0, 7); ctx.fill();
  } else if (player.job === 'mage'){
    // 지팡이
    ctx.save();
    ctx.translate(11, -28);
    ctx.rotate(cast ? -0.6 : 0.3);
    ctx.strokeStyle = '#6e4a26'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -24); ctx.stroke();
    ctx.lineCap = 'butt';
    const glow = cast || atk;
    if (glow){
      const og = ctx.createRadialGradient(0, -29, 2, 0, -29, 16);
      og.addColorStop(0, 'rgba(170,220,255,0.9)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, -29, 16, 0, 7); ctx.fill();
    }
    ctx.fillStyle = glow ? '#cfe6ff' : '#5a8ae0';
    ctx.beginPath(); ctx.arc(0, -29, glow ? 7.5 : 6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-1.8, -31, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, -29, 8.6, 2.4, 4.0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else {
    // 검 (전사/초보자) - 스윙
    const prog = (cast ? 1 - player.castAnim / 0.25 : (atk ? 1 - player.attackAnim / 0.2 : 1));
    const ang = (atk || cast) ? (-2.1 + prog * 2.9) : 0.75;
    // 스윙 잔상
    if ((atk || cast) && prog < 0.85){
      ctx.save();
      ctx.translate(9, -29);
      const trailN = 4;
      for (let i = 1; i <= trailN; i++){
        const ta = ang - i * 0.28;
        ctx.strokeStyle = 'rgba(200,230,255,' + (0.3 - i * 0.06) + ')';
        ctx.lineWidth = 8 - i;
        ctx.beginPath();
        ctx.arc(0, 0, 38, ta - 0.1, ta + 0.15);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.translate(9, -29);
    ctx.rotate(ang);
    // 팔
    ctx.fillStyle = st.top;
    rr(-2, -3.5, 13, 8, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(11, 0, 3.8, 0, 7); ctx.fill();
    // 검
    const blade = player.job === 'warrior' ? 40 : 32;
    const bg2 = ctx.createLinearGradient(0, -4, 0, 4);
    bg2.addColorStop(0, '#eef2fc');
    bg2.addColorStop(0.5, '#b8c0d4');
    bg2.addColorStop(1, '#8a94ac');
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(15, -4);
    ctx.lineTo(15 + blade - 7, -4);
    ctx.lineTo(15 + blade, 0);
    ctx.lineTo(15 + blade - 7, 4);
    ctx.lineTo(15, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillRect(15, -3.5, blade - 8, 2);
    // 가드/손잡이
    ctx.fillStyle = '#e0a82e';
    rr(12.5, -7, 4, 14, 2); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    rr(6, -3, 7, 6, 2.5); ctx.fill();
    ctx.restore();
  }

  // ---- 상위 무기 오라 (티어4 진홍 / 티어5 금빛) ----
  if (!climbing && player.equip.weapon){
    const wt5 = ITEMS[player.equip.weapon.id].tier || 1;
    if (wt5 >= 4){
      const gpos = { warrior:[16, -36], archer:[13, -27], mage:[11, -46], thief:[13, -31] }[player.job];
      if (gpos){
        ctx.globalCompositeOperation = 'lighter';
        const wa = 0.15 + Math.sin(game.time * 4) * 0.07;
        ctx.fillStyle = wt5 >= 5 ? 'rgba(255,200,80,' + wa + ')' : 'rgba(255,90,60,' + wa + ')';
        ctx.beginPath(); ctx.arc(gpos[0], gpos[1], 24, 0, 7); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  // ---- 머리 (2등신 대두) ----
  const headY = -50;
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, headY, 15.5, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  // 볼터치
  ctx.fillStyle = 'rgba(255,150,140,0.35)';
  ctx.beginPath(); ctx.ellipse(11, headY + 6, 3.4, 2.2, 0, 0, 7); ctx.fill();
  // 뒷머리
  ctx.fillStyle = st.hair;
  ctx.beginPath();
  ctx.arc(0, headY - 2.5, 15.8, Math.PI * 0.86, Math.PI * 2.14);
  ctx.fill();
  // 앞머리 (가르마 스파이크)
  ctx.beginPath();
  ctx.moveTo(-15, headY - 5);
  ctx.quadraticCurveTo(-13, headY - 12, -6, headY - 13);
  ctx.lineTo(-4, headY - 8);
  ctx.lineTo(0, headY - 14);
  ctx.lineTo(4, headY - 8.5);
  ctx.lineTo(8, headY - 13.5);
  ctx.lineTo(11, headY - 8);
  ctx.quadraticCurveTo(14.5, headY - 9, 15.5, headY - 4);
  ctx.quadraticCurveTo(15, headY - 15, 0, headY - 16.5);
  ctx.quadraticCurveTo(-14, headY - 15, -15, headY - 5);
  ctx.fill();
  // 옆머리
  ctx.beginPath();
  ctx.moveTo(-15.5, headY - 4);
  ctx.quadraticCurveTo(-17.5, headY + 4, -14.5, headY + 9);
  ctx.quadraticCurveTo(-13.5, headY + 2, -13, headY - 4);
  ctx.fill();
  // ---- 모자 (장비) ----
  if (player.equip.hat){
    const tier = ITEMS[player.equip.hat.id].tier;
    if (tier === 1){
      ctx.fillStyle = '#8a6238';
      ctx.beginPath(); ctx.ellipse(0, headY - 9, 17, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#a3763f';
      ctx.beginPath(); ctx.ellipse(0, headY - 12, 10.5, 7, 0, Math.PI, 0); ctx.fill();
    } else if (tier === 2){
      const hg2 = ctx.createLinearGradient(0, headY - 22, 0, headY - 4);
      hg2.addColorStop(0, '#c8cede');
      hg2.addColorStop(1, '#8a94ac');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#6a7490';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#d8dee8';
      ctx.fillRect(-2, headY - 23, 4, 6);
    } else if (tier === 3){
      const hg3 = ctx.createLinearGradient(0, headY - 24, 0, headY - 2);
      hg3.addColorStop(0, '#f0d068');
      hg3.addColorStop(1, '#c8901a');
      ctx.fillStyle = hg3;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#a87610';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#e05a6a';
      ctx.beginPath(); ctx.moveTo(0, headY - 20); ctx.lineTo(5, headY - 30); ctx.lineTo(-5, headY - 30); ctx.closePath(); ctx.fill();
    } else {
      // 드래곤 헬름: 진홍 투구 + 흰 뿔
      const hg4 = ctx.createLinearGradient(0, headY - 24, 0, headY - 2);
      hg4.addColorStop(0, '#d05040');
      hg4.addColorStop(1, '#8a2a1e');
      ctx.fillStyle = hg4;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#5f1c14';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#f0ead8';
      for (const sx2 of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(sx2 * 10, headY - 14);
        ctx.quadraticCurveTo(sx2 * 18, headY - 22, sx2 * 15, headY - 32);
        ctx.quadraticCurveTo(sx2 * 13, headY - 22, sx2 * 6, headY - 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ffd94a';
      ctx.beginPath(); ctx.arc(0, headY - 16, 3, 0, 7); ctx.fill();
    }
  } else if (player.job === 'mage'){
    // 마법사 고깔모자
    ctx.fillStyle = '#4e3494';
    ctx.beginPath();
    ctx.moveTo(-17, headY - 8);
    ctx.quadraticCurveTo(-2, headY - 13, 17, headY - 8);
    ctx.lineTo(8, headY - 34);
    ctx.quadraticCurveTo(4, headY - 38, 1, headY - 33);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6a4ac0';
    ctx.beginPath(); ctx.ellipse(0, headY - 8.5, 18, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8c05a';
    ctx.beginPath(); ctx.arc(4, headY - 33, 3, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 궁수 두건 깃털
    ctx.fillStyle = '#2a6236';
    ctx.beginPath(); ctx.ellipse(0, headY - 10, 16.5, 5.5, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = player.job2 ? '#e8c05a' : '#e05a4a';
    ctx.save();
    ctx.translate(-10, headY - 13);
    ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (player.job === 'warrior'){
    // 전사 머리띠
    ctx.fillStyle = '#b83a30';
    rr(-15.5, headY - 8, 31, 5, 2.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(-15.5, headY - 8, 31, 1.8, 1); ctx.fill();
  }
  // ---- 얼굴 ----
  // 눈썹 (표정)
  ctx.strokeStyle = 'rgba(46,32,24,0.85)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  if (atk || cast){
    ctx.moveTo(2, headY - 5); ctx.lineTo(7.5, headY - 3.5);
    ctx.moveTo(15, headY - 5); ctx.lineTo(9.5, headY - 3.5);
  } else {
    ctx.moveTo(2.5, headY - 4); ctx.lineTo(7.5, headY - 4.5);
    ctx.moveTo(9.5, headY - 4.5); ctx.lineTo(14.5, headY - 4);
  }
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#2e2018';
  if (eyeBlink){
    ctx.fillRect(3, headY + 1, 4.5, 1.6);
    ctx.fillRect(10, headY + 1, 4.5, 1.6);
  } else {
    ctx.beginPath();
    ctx.ellipse(5, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.ellipse(12, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5.8, headY - 0.5, 1, 0, 7); ctx.arc(12.8, headY - 0.5, 1, 0, 7); ctx.fill();
  }
  // 입
  ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (atk || cast) { ctx.arc(9, headY + 8, 2.4, 0, Math.PI); }
  else { ctx.moveTo(7, headY + 8.5); ctx.lineTo(11.5, headY + 8.5); }
  ctx.stroke();
  ctx.restore();
}

// ============================================================
// 투사체 / 이펙트
// ============================================================
function drawProjectiles(){
  for (const p of pProj){
    const sx = p.x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const dir = Math.sign(p.vx);
    if (p.kind === 'arrow'){
      ctx.strokeStyle = 'rgba(200,230,255,0.35)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx - dir * 30, p.y); ctx.lineTo(sx - dir * 8, p.y); ctx.stroke();
      ctx.strokeStyle = '#b89868'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx + dir * 9, p.y); ctx.stroke();
      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 16, p.y); ctx.lineTo(sx + dir * 6, p.y - 4.5); ctx.lineTo(sx + dir * 6, p.y + 4.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e05a4a';
      ctx.beginPath();
      ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx - dir * 20, p.y - 4); ctx.lineTo(sx - dir * 20, p.y + 4);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'orb'){
      const og = ctx.createRadialGradient(sx, p.y, 2, sx, p.y, 14);
      og.addColorStop(0, 'rgba(220,240,255,0.95)');
      og.addColorStop(0.5, 'rgba(120,170,255,0.6)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(sx, p.y, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#a8ccff';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx + dir * 1, p.y - 2, 2.8, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(150,190,255,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx - dir * 12, p.y, 5.5, 0, 7); ctx.stroke();
    } else if (p.kind === 'bomb'){
      ctx.fillStyle = '#e8a03a';
      ctx.beginPath(); ctx.arc(sx, p.y, 7.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#f8d060';
      ctx.beginPath(); ctx.arc(sx, p.y, 4, 0, 7); ctx.fill();
      for (let i = 1; i <= 3; i++){
        ctx.fillStyle = 'rgba(255,170,70,' + (0.4 - i * 0.1) + ')';
        ctx.beginPath(); ctx.arc(sx - dir * i * 9, p.y + Math.sin(game.time * 20 + i) * 2, 6 - i, 0, 7); ctx.fill();
      }
    } else if (p.kind === 'wave2'){
      // 지면 충격파: 대형 파도 + 가산 글로우 + 빛 커튼
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.scale(dir, 1);
      ctx.globalCompositeOperation = 'lighter';
      const wgl = ctx.createRadialGradient(10, -8, 4, 10, -8, 42);
      wgl.addColorStop(0, 'rgba(160,215,255,0.55)');
      wgl.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.fillStyle = wgl;
      ctx.beginPath(); ctx.arc(10, -8, 42, 0, 7); ctx.fill();
      const wc = ctx.createLinearGradient(0, -60, 0, 0);
      wc.addColorStop(0, 'rgba(150,210,255,0)');
      wc.addColorStop(1, 'rgba(150,210,255,0.5)');
      ctx.fillStyle = wc;
      ctx.fillRect(-14, -60, 34, 60);
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 4; i++){
        const a = 0.9 - i * 0.18;
        ctx.strokeStyle = 'rgba(150,210,255,' + a + ')';
        ctx.lineWidth = 7 - i;
        ctx.beginPath();
        ctx.arc(-i * 16, -2, 26 + i * 8, -2.2, -0.9);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(220,240,255,0.9)';
      ctx.beginPath(); ctx.ellipse(6, -20, 12, 20, -0.3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(160,190,220,0.45)';
      ctx.beginPath(); ctx.ellipse(-18, -5, 13, 6, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'rain' && p.fire){
      // 메테오: 화염 운석
      ctx.globalCompositeOperation = 'lighter';
      const mg9 = ctx.createRadialGradient(sx, p.y, 3, sx, p.y, 22);
      mg9.addColorStop(0, 'rgba(255,240,180,0.95)');
      mg9.addColorStop(0.5, 'rgba(255,140,50,0.6)');
      mg9.addColorStop(1, 'rgba(255,100,30,0)');
      ctx.fillStyle = mg9;
      ctx.beginPath(); ctx.arc(sx, p.y, 22, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,80,0.5)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx + 4, p.y - 34); ctx.lineTo(sx, p.y - 8); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#8a4a2a';
      ctx.beginPath(); ctx.arc(sx, p.y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff9a4a';
      ctx.beginPath(); ctx.arc(sx - 2, p.y - 2, 4, 0, 7); ctx.fill();
    } else if (p.kind === 'rain'){
      // 낙하 화살
      ctx.strokeStyle = 'rgba(200,230,255,0.3)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(sx, p.y - 26); ctx.lineTo(sx, p.y - 8); ctx.stroke();
      ctx.strokeStyle = '#b89868'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(sx, p.y - 15); ctx.lineTo(sx, p.y + 9); ctx.stroke();
      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(sx, p.y + 16); ctx.lineTo(sx - 4.5, p.y + 6); ctx.lineTo(sx + 4.5, p.y + 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e05a4a';
      ctx.beginPath();
      ctx.moveTo(sx, p.y - 15); ctx.lineTo(sx - 4, p.y - 20); ctx.lineTo(sx + 4, p.y - 20);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'holy'){
      const hg2 = ctx.createRadialGradient(sx, p.y, 2, sx, p.y, 16);
      hg2.addColorStop(0, 'rgba(255,250,220,0.95)');
      hg2.addColorStop(0.5, 'rgba(255,225,120,0.6)');
      hg2.addColorStop(1, 'rgba(255,225,120,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(sx, p.y, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe9a0';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx + dir, p.y - 2, 2.6, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,180,0.7)'; ctx.lineWidth = 2;
      const tw2 = 5 + Math.sin(game.time * 16) * 2;
      ctx.beginPath();
      ctx.moveTo(sx - tw2, p.y); ctx.lineTo(sx + tw2, p.y);
      ctx.moveTo(sx, p.y - tw2); ctx.lineTo(sx, p.y + tw2);
      ctx.stroke();

        ctx.beginPath(); ctx.arc(Math.cos(ang) * 156, Math.sin(ang) * 39, 3.5, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    } else if (e.kind === 'windfan'){
      // 폭풍의 시: 부채꼴 바람 잔상
      const pr = e.t / 0.25;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.scale(e.dir, 1);
      ctx.globalCompositeOperation = 'lighter';
      for (const [r0, lw] of [[40 + pr * 30, 3], [54 + pr * 34, 2]]){
        ctx.strokeStyle = 'rgba(140,255,190,' + a * 0.55 + ')';
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(-20, 0, r0, -0.5, 0.5); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    } else if (e.kind === 'whirl'){
      const pr = e.t / 0.4;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(e.dir * pr * 5.5);
      for (const off of [0, Math.PI]){
        ctx.strokeStyle = 'rgba(150,215,255,' + a * 0.9 + ')';
        ctx.lineWidth = Math.max(1, 6 - pr * 4);
        ctx.beginPath();
        ctx.arc(0, 0, 44 + pr * 40, off - 0.2, off + 1.5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + a * 0.6 + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 36 + pr * 34, off, off + 1.2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}
// ---------- 파티클 렌더 (2패스: 일반 -> 가산 배칭) ----------
function drawParticles(){
  // 패스1: 일반 합성 (파편/먼지)
  for (const p of particles){
    if (p.k !== 'shard' && p.k !== 'dust') continue;
    const sx = p.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const lf = 1 - p.t / p.life;
    if (p.k === 'shard'){
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.rotate(p.rot || 0);
      ctx.globalAlpha = Math.min(1, lf * 1.6);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.35);
      ctx.restore();
    } else {
      ctx.globalAlpha = lf * 0.4;
      ctx.fillStyle = '#cbb694';
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * (1 + p.t * 2.2), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 패스2: 가산 합성 (스파크/글로우/불티) — 전환 1회
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of particles){
    if (p.k === 'shard' || p.k === 'dust') continue;
    const sx = p.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const lf = 1 - p.t / p.life;
    if (p.k === 'spark'){
      const sp2 = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(16, sp2 * 0.03);
      const nx = p.vx / sp2, ny = p.vy / sp2;
      ctx.strokeStyle = p.col;
      ctx.globalAlpha = lf;
      ctx.lineWidth = p.size * lf + 0.6;
      ctx.beginPath();
      ctx.moveTo(sx - nx * len, p.y - ny * len);
      ctx.lineTo(sx, p.y);
      ctx.stroke();
    } else if (p.k === 'glow'){
      // 그라디언트 대신 2겹 원 (프레임당 gradient 생성 제거)
      ctx.fillStyle = p.col;
      ctx.globalAlpha = lf * 0.22;
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * 2.4, 0, 7); ctx.fill();
      ctx.globalAlpha = lf * 0.85;
      ctx.beginPath(); ctx.arc(sx, p.y, p.size, 0, 7); ctx.fill();
    } else if (p.k === 'ember'){
      ctx.globalAlpha = lf;
      ctx.fillStyle = lf > 0.55 ? '#ffd890' : '#ff8a4a';
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * lf + 0.5, 0, 7); ctx.fill();
    }
  }
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
function dmgFill(t, size, y){
  if (t.color === '#ffb642'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#fff4c0');
    dg.addColorStop(0.55, '#ffd24a');
    dg.addColorStop(1, '#f08a1e');
    return dg;
  }
  if (t.color === '#ff5ab0'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#ffe0f0');
    dg.addColorStop(0.5, '#ff7ac0');
    dg.addColorStop(1, '#e03a8a');
    return dg;
  }
  return t.color;
}
function drawDmgTexts(){
  ctx.textAlign = 'center';
  for (const t of dmgTexts){
    const sx = t.x - camX;
    const a = Math.max(0, Math.min(1, t.life / 0.4));
    const size = t.big ? 33 : 23;
    if (/^\d+$/.test(t.txt)){
      // 메이플식: 자릿수별로 개별 팝 + 아치 배치
      const n = t.txt.length;
      const isCrit = t.color === '#ff5ab0';
      const dw = size * 0.6;
      // 크리티컬: 뒤에 회전하는 4방 광선 플레어
      if (isCrit && t.pop < 0.4){
        ctx.save();
        ctx.translate(sx, t.y - size * 0.35);
        ctx.rotate(t.pop * 2.4);
        ctx.globalCompositeOperation = 'lighter';
        const fa = (1 - t.pop / 0.4) * a;
        ctx.fillStyle = 'rgba(255,140,200,' + fa * 0.55 + ')';
        for (let i = 0; i < 4; i++){
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(size * 1.9, -size * 0.28);
          ctx.lineTo(size * 1.9, size * 0.28);
          ctx.closePath(); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }
      for (let i = 0; i < n; i++){
        const dPop = t.pop - i * 0.035;
        if (dPop < 0) continue;
        const pop = dPop < 0.12 ? 1 + (0.12 - dPop) * 6 : 1;
        const dx = (i - (n - 1) / 2) * dw;
        const dy = -Math.sin((i / Math.max(1, n - 1)) * Math.PI) * (n > 1 ? 4 : 0);
        const ds = size * pop;
        ctx.save();
        ctx.translate(sx + dx, t.y + dy);
        ctx.rotate((i % 2 === 0 ? -1 : 1) * 0.05);
        ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
        ctx.lineWidth = isCrit ? 6 : 5;
        ctx.strokeStyle = isCrit ? 'rgba(90,10,50,' + a * 0.92 + ')' : 'rgba(50,25,0,' + a * 0.9 + ')';
        ctx.strokeText(t.txt[i], 0, 0);
        ctx.globalAlpha = a;
        // 팝 첫 순간은 흰색 플래시 → 본색
        ctx.fillStyle = dPop < 0.05 ? '#ffffff' : dmgFill(t, ds, 0);
        ctx.fillText(t.txt[i], 0, 0);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    } else {
      const pop = t.pop < 0.14 ? 1 + (0.14 - t.pop) * 5 : 1;
      const ds = size * pop;
      ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(50,25,0,' + a * 0.9 + ')';
      ctx.strokeText(t.txt, sx, t.y);
      ctx.globalAlpha = a;
      ctx.fillStyle = dmgFill(t, ds, t.y);
      ctx.fillText(t.txt, sx, t.y);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBar(x, y, w, h, ratio, c1, c2, label){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rr(x, y, w, h, h / 2); ctx.fill();
  if (ratio > 0.005){
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    rr(x + 2, y + 2, Math.max(4, (w - 4) * Math.min(1, ratio)), h - 4, (h - 4) / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(x + 3, y + 2.5, Math.max(3, (w - 6) * Math.min(1, ratio)), (h - 5) * 0.4, 2); ctx.fill();
  }
  if (label){
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(label, x + w / 2, y + h - 2.5);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + w / 2, y + h - 2.5);
  }
}
// 퀵슬롯 배치 (HUD 그리기와 드래그 드롭이 공유)
function quickslotRects(){
  const d1 = mySkills(), d2 = mySkills2(), d3 = mySkills3(), d4 = mySkills4();
  const sw2 = d3 ? 38 : (d2 ? 46 : 52);
  const gap = d3 ? 3 : (d2 ? 4 : 6);
  let qx = d3 ? 300 : (d2 ? 336 : 360);
  const rects = [{ key:'Z', x:qx, y:H - 76 + 12, w:sw2, h:52 }];
  qx += sw2 + gap;
  const unlocked = { 1:true, 2:!!d2, 3:!!d3, 4:!!d4, 5:!!mySkillsX() };

}

    sf:'연사', arn:'화살비', hk:'호크', ha:'홀리', heal:'힐', bl:'축복',
    l7:'럭키7', sv:'새비지', haste:'신속', ts:'트리플', sdash:'대시', cloak:'은신',
    bs:'브레', eq:'대지', wh:'심장', hur:'폭풍', phx:'피닉', se:'샤프',
    sr:'레이', ang:'천사', hs:'심볼', ss:'수리검', sp:'분신', sm:'연막',
    rb:'레이징', en:'격노', ca:'천벌', wq:'질풍', gen:'제네', inf:'무한', qd:'쿼드', sdm:'그림자',
    rst:'레이지', bw:'흡혈', fz:'광란', bolt:'볼트', exar:'파열', aim:'조준', fb:'화염구', chl:'체인', amp:'증폭', dstab:'스탭', mbomb:'메소봄', sstep:'발놀림',
    hcx:'성십자', bfy:'혈노', wwl:'질풍', snp:'저격', sct:'성역', mtr:'메테오', sdc:'무도', jkp:'한탕' };
  const rects = quickslotRects();
  const jobCol = player.job !== 'beginner' ? JOBS[player.job].color : '#8a94b8';
  let lastRect = rects[0];
  for (const r of rects){
    lastRect = r;
    const sy0 = r.y, sw2 = r.w, qx = r.x;
    let sl;
    if (r.key === 'Z'){
      sl = { key:'Z', name:'기본', cd:player.cdBasic, cdMax:0.4, ok:true };
    } else {
      const bid = bindOf(r.key);
      const d = bid ? skillDefById(bid) : null;
      sl = d
        ? { key:r.key, name:SLOT_LABELS[d.id] || d.name.slice(0, 4), cd:player.cds[d.id] || 0, cdMax:d.cd, ok: skillLevel(d.id) > 0 && player.mp >= d.mp }
        : { key:r.key, name:'-', cd:0, cdMax:1, ok:false };
    }
    ctx.fillStyle = sl.ok ? 'rgba(52,64,116,0.5)' : 'rgba(255,255,255,0.04)';
    rr(qx, sy0, sw2, 52, 8); ctx.fill();
    ctx.fillStyle = sl.ok ? 'rgba(120,145,215,0.22)' : 'rgba(255,255,255,0.03)';
    rr(qx + 2, sy0 + 2, sw2 - 4, 13, 6); ctx.fill();
    ctx.strokeStyle = sl.ok ? 'rgba(160,190,255,0.4)' : 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    rr(qx + 0.5, sy0 + 0.5, sw2 - 1, 51, 8); ctx.stroke();
    // 드래그 중: 드롭 가능한 슬롯 금색 하이라이트
    if (game.drag && r.key !== 'Z'){
      ctx.strokeStyle = 'rgba(255,217,74,' + (0.5 + Math.sin(game.time * 6) * 0.3) + ')';
      ctx.lineWidth = 2;
      rr(qx + 1, sy0 + 1, sw2 - 2, 50, 8); ctx.stroke();
    }
    if (sl.ok && sl.cd <= 0){
      ctx.fillStyle = jobCol;
      rr(qx + 5, sy0 + 46, sw2 - 10, 3, 1.5); ctx.fill();
    }
    ctx.fillStyle = sl.ok && !(sl.cd > 0.95) ? '#eaf0ff' : 'rgba(255,255,255,0.25)';
    ctx.font = 'bold ' + (defs3 ? 10 : (defs2 ? 11 : 12)) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(sl.name, qx + sw2 / 2, H - bh + 37);
    if (sl.cd > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      const r2 = Math.min(1, sl.cd / sl.cdMax);
      ctx.save();
      rr(qx, sy0, sw2, 52, 8); ctx.clip();
      ctx.fillRect(qx, sy0 + 52 * (1 - r2), sw2, 52 * r2);
      ctx.restore();
      if (sl.cd > 0.95){
        ctx.font = 'bold 16px sans-serif';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.strokeText(Math.ceil(sl.cd), qx + sw2 / 2, sy0 + 34);
        ctx.fillStyle = '#ffe9a8';
        ctx.fillText(Math.ceil(sl.cd), qx + sw2 / 2, sy0 + 34);
      }
    }
    // 키캡
    ctx.fillStyle = 'rgba(12,10,26,0.85)';
    rr(qx + sw2 / 2 - 11, H - bh + 52, 22, 14, 4); ctx.fill();
    ctx.fillStyle = sl.ok ? '#ffd94a' : 'rgba(255,255,255,0.4)'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(sl.key, qx + sw2 / 2, H - bh + 62);
  }
  // 물약 4칸 (1빨간/2파란/3엘릭서/4마나엘릭서)
  const pw = defs3 ? 32 : 42;
  let px3 = lastRect.x + lastRect.w + 8;
  for (const [keyLbl, pk] of [['1','hp'], ['2','mp'], ['3','hp2'], ['4','mp2'], ['5','hp3'], ['6','mp3']]){
    const P = POTIONS[pk];
    const cnt = player.potions[pk] || 0;
    const big = pk !== 'hp' && pk !== 'mp';
    ctx.fillStyle = cnt > 0 ? 'rgba(52,64,116,0.4)' : 'rgba(255,255,255,0.05)';
    rr(px3, H - bh + 12, pw, 52, 8); ctx.fill();
    // 병
    ctx.fillStyle = P.color;
    if (big){
      ctx.beginPath(); ctx.arc(px3 + pw / 2, H - bh + 30, 8.5, 0, 7); ctx.fill();
      ctx.fillRect(px3 + pw / 2 - 3.5, H - bh + 17, 7, 7);
    } else {
      rr(px3 + pw / 2 - 8, H - bh + 20, 16, 18, 5); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(px3 + pw / 2 - 3, H - bh + 26, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9a25a'; ctx.fillRect(px3 + pw / 2 - 3.5, H - bh + 15, 7, 4);
    const cdR = player.potionCd[P.grp] / POTION_CD[P.grp];
    if (cdR > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.save();
      rr(px3, H - bh + 12, pw, 52, 8); ctx.clip();
      ctx.fillRect(px3, H - bh + 12 + 52 * (1 - Math.min(1, cdR)), pw, 52 * Math.min(1, cdR));
      ctx.restore();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('x' + cnt, px3 + pw / 2, H - bh + 50);
    ctx.fillStyle = 'rgba(12,10,26,0.85)';
    rr(px3 + pw / 2 - 9, H - bh + 52, 18, 14, 4); ctx.fill();
    ctx.fillStyle = cnt > 0 ? '#ffd94a' : 'rgba(255,255,255,0.4)'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(keyLbl, px3 + pw / 2, H - bh + 62);
    px3 += pw + 4;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  if (defs2){
    ctx.fillText('U월드맵 N도감 O귀환 E K S L' + (isMuted() ? ' 소리OFF' : ''), px3 + 8, H - bh + 30);
    ctx.fillText('↑포탈·NPC ↓엎드리기' + (game.bossRespawn > 0 ? '  보스 ' + Math.ceil(game.bossRespawn) + '초' : ''), px3 + 8, H - bh + 50);
  } else {
    ctx.fillText('E 인벤토리  K 스킬  S 스탯  L 퀘스트  M 소리' + (isMuted() ? ' OFF' : ''), px3 + 8, H - bh + 30);
    ctx.fillText('Space 점프x2  ↓ 엎드리기' + (game.bossRespawn > 0 ? '   보스 리스폰 ' + Math.ceil(game.bossRespawn) + '초' : ''), px3 + 8, H - bh + 50);
  }
  // EXP 바 (+ 흐르는 반짝임)
  ctx.fillStyle = '#2a2438';
  ctx.fillRect(0, H - 8, W, 8);
  const expW = W * Math.min(1, player.exp / expNeed());
  const eg2 = ctx.createLinearGradient(0, H - 8, 0, H);
  eg2.addColorStop(0, '#ffe86a'); eg2.addColorStop(1, '#d8b012');
  ctx.fillStyle = eg2;
  ctx.fillRect(0, H - 8, expW, 8);
  if (expW > 40){
    const shX = (game.time * 260) % (expW + 120) - 60;
    const shG = ctx.createLinearGradient(shX - 40, 0, shX + 40, 0);
    shG.addColorStop(0, 'rgba(255,255,255,0)');
    shG.addColorStop(0.5, 'rgba(255,255,255,0.5)');
    shG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.beginPath(); ctx.rect(0, H - 8, expW, 8); ctx.clip();
    ctx.fillStyle = shG;
    ctx.fillRect(shX - 40, H - 8, 80, 8);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++){
    ctx.beginPath(); ctx.moveTo(W * i / 10, H - 8); ctx.lineTo(W * i / 10, H); ctx.stroke();
  }
  // 레벨업 임박: EXP 93%+ 시 펄스 + 안내
  if (player.exp / expNeed() > 0.93){
    const lp = 0.25 + Math.abs(Math.sin(game.time * 5)) * 0.45;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,232,106,' + lp * 0.4 + ')';
    ctx.fillRect(0, H - 8, expW, 8);
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,40,0,0.8)';
    ctx.strokeText('레벨업 임박!', W - 12, H - 14);
    ctx.fillStyle = 'rgba(255,232,106,' + (0.6 + lp * 0.4) + ')';
    ctx.fillText('레벨업 임박!', W - 12, H - 14);
  }
}

function drawOverlays(){
  // 수중 틴트 (아쿠아 로드)
  if (game.state !== 'title' && curMap().theme.amb === 'bubble'){
    ctx.fillStyle = 'rgba(30,110,190,0.14)';
    ctx.fillRect(0, 0, W, H);
    // 수면 광선
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(150,220,255,0.05)';
    for (const lx8 of [0.15, 0.45, 0.75]){
      const wob8 = Math.sin(game.time * 0.7 + lx8 * 9) * 30;
      ctx.beginPath();
      ctx.moveTo(W * lx8 + wob8, 0);
      ctx.lineTo(W * lx8 + 130 + wob8, 0);
      ctx.lineTo(W * lx8 + 40 + wob8, H);
      ctx.lineTo(W * lx8 - 50 + wob8, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // 비네트 (캐시된 오프스크린 — 매 프레임 그라디언트 생성 제거)
  const vc = vigCanvas();
  if (vc) ctx.drawImage(vc, 0, 0);
  // 저체력 경고: 붉은 맥동 테두리 (캐시 + 알파 변조)
  if (game.state === 'play' && player.hp < maxHp() * 0.25 && player.hp > 0){
    const pulse = 0.16 + Math.abs(Math.sin(game.time * 3.2)) * 0.2;
    const lc = lowHpCanvas();
    if (lc){
      ctx.globalAlpha = pulse;
      ctx.drawImage(lc, 0, 0);
      ctx.globalAlpha = 1;
    }
  }
  if (game.flash > 0){
    ctx.fillStyle = 'rgba(255,255,240,' + (game.flash / 0.13) * 0.45 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (game.state === 'pause'){
    ctx.fillStyle = 'rgba(10,8,20,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('일시정지', W / 2, H / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('P 또는 Enter로 계속', W / 2, H / 2 + 30);
  }
  if (game.state === 'dead'){
    ctx.fillStyle = 'rgba(40,0,0,' + Math.min(0.7, game.deadTimer) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff6a6a'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('쓰러졌다...', W / 2, H / 2 - 10);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '16px sans-serif';
    ctx.fillText('경험치 일부를 잃고 맵 입구에서 부활합니다', W / 2, H / 2 + 28);
  }
  if (game.state === 'victory'){
    ctx.fillStyle = 'rgba(20,10,40,0.65)';
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createLinearGradient(0, H / 2 - 80, 0, H / 2 - 20);
    vg.addColorStop(0, '#fff0b0'); vg.addColorStop(1, '#f0a02e');
    ctx.font = '900 54px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(90,40,0,0.9)';
    ctx.strokeText('머쉬맘 처치!', W / 2, H / 2 - 40);
    ctx.fillStyle = vg;
    ctx.fillText('머쉬맘 처치!', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('단풍 숲의 평화를 되찾았다', W / 2, H / 2 + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '15px sans-serif';
    ctx.fillText('Enter를 눌러 계속 (촌장에게 보고하는 것을 잊지 마세요)', W / 2, H / 2 + 44);
  }
  if (game.fade > 0){
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, game.fade) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function drawMiniChar(x, y, job){

  ctx.save();
  ctx.translate(x, y + bob * 0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 14, 4.5, 0, 0, 7); ctx.fill();
  // 다리
  ctx.fillStyle = st.pants;
  rr(-9, -14, 8, 14, 3); ctx.fill();
  rr(2, -14, 8, 14, 3); ctx.fill();
  ctx.fillStyle = st.shoe;
  rr(-10, -5, 10, 5, 2); ctx.fill();
  rr(1, -5, 10, 5, 2); ctx.fill();

  const tg = ctx.createLinearGradient(0, -33, 0, -13);
  tg.addColorStop(0, st.top); tg.addColorStop(1, st.topD);
  ctx.fillStyle = tg;

    ctx.fillStyle = '#c8ccd8'; rr(-2.5, -26, 5, 26, 2); ctx.fill();

  } else if (job === 'thief'){
    ctx.save();
    ctx.translate(14, -26);
    ctx.rotate(game.time * 3);
    ctx.fillStyle = '#c8ccd8';
    for (let s = 0; s < 4; s++){
      ctx.save(); ctx.rotate(s * Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(9, 0); ctx.lineTo(0, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#7a2a8e';
    ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, 7); ctx.fill();
    ctx.restore();
  } else {
    ctx.strokeStyle = '#6e4a26'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(13, -6); ctx.lineTo(13, -40); ctx.stroke();
    ctx.fillStyle = '#5a8ae0';
    ctx.beginPath(); ctx.arc(13, -44, 5.5, 0, 7); ctx.fill();
  }
  // 머리
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, -46, 14, 0, 7); ctx.fill();
  ctx.fillStyle = st.hair;
  ctx.beginPath(); ctx.arc(0, -49, 14.3, Math.PI * 0.88, Math.PI * 2.12); ctx.fill();
  if (job === 'mage'){
    ctx.fillStyle = '#4e3494';
    ctx.beginPath();
    ctx.moveTo(-15, -54); ctx.quadraticCurveTo(0, -58, 15, -54);
    ctx.lineTo(6, -76); ctx.closePath(); ctx.fill();
  } else if (job === 'archer'){
    ctx.fillStyle = '#2a6236';
    ctx.beginPath(); ctx.ellipse(0, -55, 14.5, 5, 0, Math.PI, 0); ctx.fill();
  } else if (job === 'thief'){
    ctx.fillStyle = '#5f2478';
    rr(-14.5, -56, 29, 6, 3); ctx.fill();
    ctx.fillStyle = '#8a3aa8';
    ctx.beginPath(); ctx.moveTo(13, -53); ctx.lineTo(22, -48); ctx.lineTo(14, -49); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#b83a30';
    rr(-14, -54, 28, 4.5, 2); ctx.fill();
  }
  ctx.fillStyle = '#2e2018';
  ctx.beginPath();
  ctx.ellipse(4, -45, 2, 3, 0, 0, 7);

function drawTitle(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7ec8f0'); g.addColorStop(1, '#eef9ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 태양 + 광선
  const sg = ctx.createRadialGradient(160, 110, 10, 160, 110, 100);
  sg.addColorStop(0, 'rgba(255,245,200,0.95)');
  sg.addColorStop(1, 'rgba(255,240,180,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(40, 0, 280, 240);
  ctx.fillStyle = '#fff7d8';
  ctx.beginPath(); ctx.arc(160, 110, 32, 0, 7); ctx.fill();
  // 3색 원근 언덕 (인게임과 동일한 깊이감)
  const drift = game.time * 6;
  ctx.fillStyle = '#aede9c';
  ctx.beginPath(); ctx.moveTo(-20, H);
  for (let i = -1; i < 4; i++){
    const hx = i * 420 - (drift * 0.4) % 420;
    ctx.quadraticCurveTo(hx + 105, FLOOR_Y - 300, hx + 420, FLOOR_Y - 60);
  }
  ctx.lineTo(W + 20, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#78c266';
  ctx.beginPath(); ctx.moveTo(-20, H);
  for (let i = -1; i < 4; i++){
    const hx = i * 380 - (drift * 0.8) % 380;
    ctx.quadraticCurveTo(hx + 95, FLOOR_Y - 150, hx + 380, FLOOR_Y - 25);
  }
  ctx.lineTo(W + 20, H); ctx.closePath(); ctx.fill();
  // 지면 + 풀
  ctx.fillStyle = '#5fae49'; ctx.fillRect(0, FLOOR_Y - 20, W, H - FLOOR_Y + 20);
  ctx.fillStyle = '#4f9e42';
  for (let x = 0; x < W; x += 24){
    const hh2 = 8 + h1(x) * 8;
    const sway2 = Math.sin(game.time * 1.6 + x * 0.05) * 2.5;
    ctx.beginPath();
    ctx.moveTo(x, FLOOR_Y - 18);
    ctx.quadraticCurveTo(x + 3, FLOOR_Y - 18 - hh2 * 0.6, x + 5 + sway2, FLOOR_Y - 18 - hh2);
    ctx.lineTo(x + 11, FLOOR_Y - 18);
    ctx.fill();
  }
  for (let i = 0; i < 16; i++){
    const lx = (i * 173 + game.time * 30 * (1 + i % 3 * 0.3)) % (W + 40) - 20;
    const ly = (i * 97 + game.time * (40 + i % 4 * 15)) % (H + 40) - 20;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(game.time * 1.6 + i);
    ctx.fillStyle = i % 2 === 0 ? '#e8843a' : '#d4552f';
    const s = 0.9 + h1(i + 6) * 0.5;
    ctx.beginPath();
    ctx.moveTo(0, 5 * s);
    ctx.quadraticCurveTo(-6 * s, 2 * s, -4.5 * s, -3.5 * s);
    ctx.quadraticCurveTo(-2 * s, -2 * s, 0, -6 * s);
    ctx.quadraticCurveTo(2 * s, -2 * s, 4.5 * s, -3.5 * s);
    ctx.quadraticCurveTo(6 * s, 2 * s, 0, 5 * s);
    ctx.fill();
    ctx.restore();
  }
  // 대형 단풍잎 심볼
  ctx.save();
  ctx.translate(W / 2, 84);
  ctx.rotate(Math.sin(game.time * 1.2) * 0.08);
  const ls = 5.5;
  const lfg = ctx.createLinearGradient(0, -6 * ls, 0, 5 * ls);
  lfg.addColorStop(0, '#f0923a'); lfg.addColorStop(1, '#d4552f');
  ctx.fillStyle = lfg;
  ctx.beginPath();
  ctx.moveTo(0, 5 * ls);

'use strict';

// 입력(키보드+마우스), 창 UI(인벤/스킬/스탯/퀘스트/상점/대화/전직), 메인 루프

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 마우스 ----------
let mouseX = -1, mouseY = -1;
let pendingClick = null;
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', e => {
  audioUnlock();
  const p = canvasPos(e);
  pendingClick = p;
});
canvas.addEventListener('mouseup', e => {
  const p = canvasPos(e);
  if (game.drag){
    for (const r of quickslotRects()){
      if (r.key !== 'Z' && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h){
        setBind(r.key, game.drag.id);
        break;
      }
    }
    game.drag = null;
  }
});
canvas.addEventListener('mouseleave', () => { game.drag = null; });

// 즉시 모드 버튼: 그리고, 클릭됐으면 true
function btn(x, y, w, h, label, opts){
  opts = opts || {};
  const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  const enabled = opts.enabled !== false;
  ctx.fillStyle = enabled ? (hover ? (opts.hoverColor || '#5a6ea8') : (opts.color || '#3a4a7a')) : '#3a3a44';
  rr(x, y, w, h, 7); ctx.fill();
  // 상단 글로시 하이라이트
  ctx.fillStyle = enabled ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)';
  rr(x + 2, y + 2, w - 4, Math.max(4, h * 0.38), 5); ctx.fill();
  ctx.strokeStyle = enabled ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 7); ctx.stroke();
  ctx.fillStyle = enabled ? '#fff' : 'rgba(255,255,255,0.4)';
  ctx.font = 'bold ' + (opts.font || 14) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 5);
  if (enabled && pendingClick && pendingClick.x >= x && pendingClick.x <= x + w && pendingClick.y >= y && pendingClick.y <= y + h){
    pendingClick = null;
    return true;
  }
  return false;
}
function windowFrame(x, y, w, h, title){
  ctx.fillStyle = 'rgba(10,8,20,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#242038';
  rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
  rr(x, y, w, h, 14); ctx.stroke();
  const hg = ctx.createLinearGradient(0, y, 0, y + 44);
  hg.addColorStop(0, '#3a5a9e'); hg.addColorStop(1, '#2a3a6e');
  ctx.fillStyle = hg;
  rr(x, y, w, 44, 14); ctx.fill();
  ctx.fillRect(x, y + 22, w, 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(title, x + w / 2, y + 30);
  // 내부 이중 보더 + 코너 리벳 (메이플식 패널 마감)
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
  rr(x + 4, y + 4, w - 8, h - 8, 11); ctx.stroke();
  ctx.fillStyle = 'rgba(245,197,66,0.8)';
  for (const [rx, ry] of [[x + 10, y + h - 10], [x + w - 10, y + h - 10]]){
    ctx.beginPath(); ctx.arc(rx, ry, 2.5, 0, 7); ctx.fill();
  }
  if (btn(x + w - 40, y + 8, 30, 28, 'X', { color:'#7a3a3a', hoverColor:'#a84a4a' })){
    game.uiWindow = null;
  }
}
function itemLabel(inst){
  return ITEMS[inst.id].name + (itemUp(inst) > 0 ? ' +' + itemUp(inst) : '') + (inst.rar > 0 ? ' [' + RARITIES[inst.rar].name + ']' : '');
}
function itemStatText(inst){
  const def = ITEMS[inst.id];
  const parts = [];
  if (def.atk) parts.push('공격력 +' + (def.atk + RARITIES[inst.rar].bonus));
  if (def.def) parts.push('방어 +' + (def.def + RARITIES[inst.rar].bonus));
  if (def.spd) parts.push('이속 +' + (def.spd + RARITIES[inst.rar].bonus + itemUp(inst) * 2));
  if (def.slot === 'weapon') parts.push(JOBS[def.job] ? JOBS[def.job].name + ' 전용' : '');
  parts.push('Lv' + itemLvReq(def));
  return parts.join('  ');
}

  // 그리드 6x4
  const gx = wx + 220, gy = wy + 82, cell = 58, pad = 4;

      const def = ITEMS[inst.id];
      ctx.strokeStyle = RARITIES[inst.rar].color; ctx.lineWidth = 2;
      rr(cx + 1, cy + 1, cell - 2, cell - 2, 7); ctx.stroke();
      // 아이콘
      ctx.save();
      ctx.translate(cx + cell / 2, cy + cell / 2);
      const tierCol = t => t >= 5 ? '#ffd94a' : (t === 4 ? '#e86a4a' : (t === 3 ? '#d4b04a' : (t === 2 ? '#9aa0b0' : '#8a6a3a')));
      if (def.slot === 'weapon'){
        const kind = def.job;
        if (kind === 'warrior'){
          ctx.rotate(-0.7);
          ctx.fillStyle = '#c8ccd8'; rr(-3, -20, 6, 30, 2); ctx.fill();

        } else if (kind === 'thief'){
          ctx.fillStyle = '#c8ccd8';
          for (let s = 0; s < 4; s++){
            ctx.save();
            ctx.rotate(s * Math.PI / 2 + 0.4);
            ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(13, 0); ctx.lineTo(0, 3); ctx.closePath(); ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = '#7a2a8e';
          ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, 7); ctx.fill();
        } else {
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4;

          ctx.fillStyle = '#6a9dff'; ctx.beginPath(); ctx.arc(0, -15, 6, 0, 7); ctx.fill();
        }
      } else if (def.slot === 'hat'){
        ctx.fillStyle = tierCol(def.tier);
        ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
        ctx.fillRect(-15, 0, 30, 5);
      } else if (def.slot === 'glove'){
        ctx.fillStyle = tierCol(def.tier);
        rr(-9, -12, 18, 20, 7); ctx.fill();
        rr(-14, -4, 7, 9, 3.5); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-9, 4, 18, 4);
      } else if (def.slot === 'shoe'){
        ctx.fillStyle = tierCol(def.tier);
        rr(-11, -12, 12, 18, 4); ctx.fill();
        rr(-11, 2, 22, 8, 4); ctx.fill();

        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-13, -4, 26, 4);
      }
      ctx.restore();
      const hov = mouseX >= cx && mouseX <= cx + cell && mouseY >= cy && mouseY <= cy + cell;
      if (hov) hoverItem = { inst, cx, cy };
      if (pendingClick && pendingClick.x >= cx && pendingClick.x <= cx + cell && pendingClick.y >= cy && pendingClick.y <= cy + cell){
        pendingClick = null;
        equipFromInv(i);
      }
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(player.inv.length + ' / 24 칸', gx, wy + wh - 18);

    { name:'3차', sub:JOB3[player.job].name, defs:(mySkills3() ? [...mySkills3(), ...(mySkillsX() ? [mySkillsX()] : [])] : null), lockMsg:'Lv20에 3차 전직 시 해금 (현재 Lv' + player.level + ')' },
    { name:'4차', sub:JOB4[player.job].name, defs:mySkills4(), lockMsg:'Lv28에 촌장에게서 4차 전직 (현재 Lv' + player.level + ')' },
  ];
  if (game.skillTab == null){
    game.skillTab = player.job4 ? 3 : (player.job3 ? 2 : (player.job2 ? 1 : 0));
  }
  // 창 높이 = 헤더/탭(120) + 스킬 행 + 시퀀스 편집(150) — 탭 내용에 맞춰 동적
  const curPre = tiers[clamp(game.skillTab, 0, 3)];
  const nRows = curPre.defs ? curPre.defs.length : 0;
  const bodyH = curPre.defs ? nRows * 76 + 24 : 170;
  const wh = Math.min(H - 20, 120 + bodyH + 150);
  const wy = Math.max(10, Math.floor((H - wh) / 2));
  windowFrame(wx, wy, ww, wh, '스킬 (SP: ' + player.sp + ')');

  for (let i = 0; i < 4; i++){

      game.skillTab = i;
    }
    if (active){
      ctx.fillStyle = '#f5c542';
      ctx.fillRect(tx + 8, wy + 84, 78, 2.5);
    }
  }
  const cur = curPre;
  let sy = wy + 100;
  if (!cur.defs){
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';

    sy += 156;

    return;
  }
  ctx.fillStyle = '#8ab8ff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(cur.name + ' 스킬 · ' + cur.sub, wx + 24, sy + 8);
  sy += 20;
  for (const d of cur.defs){
    const lvl = skillLevel(d.id);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    rr(wx + 20, sy, ww - 40, 68, 9); ctx.fill();
    ctx.fillStyle = lvl > 0 ? '#3a5a9e' : '#33333e';
    rr(wx + 30, sy + 12, 40, 40, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(d.key, wx + 50, sy + 38);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 14px sans-serif';
    ctx.fillText(d.name + '  Lv.' + lvl + '/10', wx + 84, sy + 26);
    const now = Math.round((d.base + d.per * Math.max(1, lvl)) * 100);
    const numText = d.id === 'inf'
      ? '초당 MP +' + Math.round(d.base + d.per * Math.max(1, lvl)) + ' · ' + d.dur + '초 · MP' + d.mp
      : (d.dur
        ? '효과 ' + now + '% · ' + d.dur + '초 · MP' + d.mp
        : '데미지 ' + now + '% · MP' + d.mp + ' · 쿨 ' + d.cd + '초');
    ctx.fillStyle = '#8ab8ff'; ctx.font = '11px sans-serif';
    ctx.fillText(numText + (lvl === 0 ? ' (미습득)' : ''), wx + 84, sy + 44);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(d.desc, wx + 84, sy + 60);
    if (btn(wx + ww - 84, sy + 14, 52, 40, '+', { enabled: player.sp > 0 && lvl < 10, color:'#3a7a4a', hoverColor:'#4a9e5a', font:20 })){
      investSkill(d.id);
    }
    // 드래그 시작: 행(+ 버튼 제외)을 잡으면 퀵슬롯에 배치 가능
    if (pendingClick && pendingClick.x >= wx + 20 && pendingClick.x <= wx + ww - 96 && pendingClick.y >= sy && pendingClick.y <= sy + 68){
      pendingClick = null;
      game.drag = { id: d.id };
    }
    sy += 76;
  }
  // 시퀀스 편집은 스킬 행 아래에 (겹침 방지)
  drawSeqEditor(wx, ww, wy, wh, sy + 4);
}

function drawSeqEditor(wx, ww, wy, wh, seqY){
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(wx + 20, seqY - 2); ctx.lineTo(wx + ww - 20, seqY - 2); ctx.stroke();
  const SEQ_ROWS = [['buff', 'H 버프'], ['hunt', 'B 사냥'], ['boss', 'J 보스']];
  let sqy = seqY + 6;
  for (const [nm, lbl] of SEQ_ROWS){
    ctx.fillStyle = '#8ab8ff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(lbl, wx + 24, sqy + 16);
    let tx5 = wx + 86;
    for (const k of BIND_KEYS){
      const arr = (player.seqs && player.seqs[nm]) || [];
      const inSeq = arr.includes(k);
      if (btn(tx5, sqy, 30, 22, k, { color: inSeq ? '#8a6a1e' : '#2c3352', hoverColor: inSeq ? '#b08a2e' : '#3a4a7a', font:10 })){
        if (!player.seqs) player.seqs = { hunt:[], buff:[], boss:[] };
        if (inSeq) player.seqs[nm] = arr.filter(x2 => x2 !== k);
        else player.seqs[nm] = [...arr, k];
        saveGame();
      }
      tx5 += 34;
    }
    sqy += 26;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('H/B/J = 시퀀스 순차 발동 · O = 마을 귀환 · 스킬을 끌어 퀵슬롯 키에 드롭하면 배치 변경', wx + 86, sqy + 12);
  if (btn(wx + ww - 130, sqy - 2, 110, 26, '배치 초기화', { color:'#5a3a3a', hoverColor:'#7a4a4a', font:11 })){
    player.binds = {};
    notify('스킬 배치를 기본값으로 되돌렸습니다');
    saveGame();
  }
}

function drawSageDialog(npc){
  const tier = { sage2:2, sage3:3, sage4:4 }[npc.id];
  const NAME = { 2:'숲의 현자', 3:'거인의 현자', 4:'설산의 은자' }[tier];
  const wx = W / 2 - 280, wy = 140, ww = 560, wh = 300;
  windowFrame(wx, wy, ww, wh, NAME);
  const done = tier === 2 ? !!player.job2 : tier === 3 ? !!player.job3 : !!player.job4;
  const preOk = tier === 2 ? player.job !== 'beginner' : tier === 3 ? !!player.job2 : !!player.job3;
  const lvReq = { 2:15, 3:20, 4:28 }[tier];
  const can = preOk && !done && player.level >= lvReq;
  let text, sub;
  if (done){
    text = '그대에게서 완성된 힘의 기운이 느껴지는군.';
    sub = '이미 ' + tier + '차의 길을 걷고 있네. 정진하게.';
  } else if (!preOk){
    text = '아직 그대의 그릇이 준비되지 않았네.';
    sub = (tier === 2 ? '먼저 촌장에게서 전직(Lv8)을 마치게.' : '먼저 ' + (tier - 1) + '차 전직을 마치고 오게.');
  } else if (player.level < lvReq){
    text = '그 기개는 좋으나, 아직 이르다.';
    sub = 'Lv' + lvReq + '에 다시 찾아오게. (현재 Lv' + player.level + ')';
  } else {
    text = '기다리고 있었네. 그대 안의 힘이 다음 문을 두드리는군.';
    sub = tier + '차 전직 의식을 시작할 준비가 되었네.';
  }
  ctx.fillStyle = '#fff'; ctx.font = '15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(text, wx + 36, wy + 90);
  ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.font = '13px sans-serif';
  ctx.fillText(sub, wx + 36, wy + 118);
  let bx2 = wx + 36;
  if (can){
    if (btn(bx2, wy + 180, 160, 42, tier + '차 전직 의식', { color:'#8a6a1e', hoverColor:'#b08a2e' })){
      game.uiWindow = 'job' + tier;
      game.uiArm = 0.25;
    }
    bx2 += 176;
  }
  if (btn(bx2, wy + 180, 100, 42, '닫기')){ game.uiWindow = null; }
}
