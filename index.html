<script>
'use strict';
// ============================================================
// 오디오: 효과음(비프) + 칩튠 BGM 시퀀서
// 전역 제공: SFX, audioUnlock, audioTick, setBgm, toggleMute, isMuted
// ============================================================
let audioCtx = null;
let muted = false;
let bgmGain = null;
function ensureBgmGain(){
  if (!audioCtx) return null;
  if (!bgmGain){
    bgmGain = audioCtx.createGain();
    bgmGain.connect(audioCtx.destination);
  }
  return bgmGain;
}
function isMuted(){ return muted; }
function toggleMute(){
  muted = !muted;
  if (muted) stopBgmNodes();
  else if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch(e){}
  }
  return muted;
}
function audioUnlock(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function beep(freq, dur, type, vol, slide){
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
let noiseBuf = null;
function playNoise(vol, dur){
  if (muted || !audioCtx) return;
  try {
    if (!noiseBuf){
      noiseBuf = audioCtx.createBuffer(1, 8820, 44100);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const SFX = {
  jump:    () => beep(300, 0.12, 'square', 0.035, 200),
  hit:     () => { beep(320 + Math.random() * 100, 0.08, 'square', 0.045, -120); playNoise(0.035, 0.05); },
  crit:    () => { beep(600, 0.15, 'sawtooth', 0.055, -300); playNoise(0.05, 0.09); },
  arrow:   () => beep(700, 0.07, 'square', 0.03, 300),
  magic:   () => beep(450, 0.14, 'sine', 0.05, 250),
  skill:   () => { beep(500, 0.2, 'sawtooth', 0.045, 300); beep(250, 0.25, 'square', 0.035, 150); },
  thunder: () => { beep(120, 0.35, 'sawtooth', 0.07, -60); beep(900, 0.12, 'square', 0.04, -500); },
  explode: () => beep(100, 0.4, 'sawtooth', 0.08, -50),
  buff:    () => { beep(520, 0.12, 'sine', 0.05, 200); setTimeout(() => beep(780, 0.18, 'sine', 0.05, 150), 100); },
  hurt:    () => beep(140, 0.25, 'sawtooth', 0.06, -60),
  pickup:  () => beep(880, 0.09, 'square', 0.035, 220),
  equip:   () => { beep(400, 0.08, 'square', 0.05); setTimeout(() => beep(600, 0.1, 'square', 0.05), 70); },
  potion:  () => beep(520, 0.15, 'sine', 0.05, 260),

};

// ---------- BGM 시퀀서 ----------
let bgmTrackName = null;
let bgmStep = 0;
let bgmNextTime = 0;
const midi2freq = n => 440 * Math.pow(2, (n - 69) / 12);

function stopBgmNodes(){
  bgmNextTime = 0;
  if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); } catch(e){}
  }
}

function setBgm(name){
  if (bgmTrackName === name) return;
  bgmTrackName = name;
  bgmStep = 0;
  bgmNextTime = 0;
}

function playNote(freq, when, dur, type, vol){
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ensureBgmGain() || audioCtx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  } catch(e){}
}

// 매 프레임 호출: 룩어헤드 스케줄링
function audioTick(){
  if (muted || !audioCtx || !bgmTrackName) return;
  const tr = BGM_TRACKS[bgmTrackName];
  if (!tr) return;
  const stepDur = 60 / tr.tempo / 2;   // 8분음표
  const now = audioCtx.currentTime;
  if (bgmNextTime === 0) bgmNextTime = now + 0.1;
  // 0.25초 룩어헤드
  while (bgmNextTime < now + 0.25){
    const mi = tr.mel[bgmStep % tr.mel.length];
    const bi = tr.bass[bgmStep % tr.bass.length];
    if (mi > 0){
      playNote(midi2freq(mi), bgmNextTime, stepDur * 0.9, 'square', 0.018);
      // 부드러운 에코 (깊이감)
      playNote(midi2freq(mi), bgmNextTime + stepDur * 1.5, stepDur * 0.7, 'square', 0.006);
    }
    if (bi > 0) playNote(midi2freq(bi), bgmNextTime, stepDur * 1.7, 'triangle', 0.035);
    bgmStep = (bgmStep + 1) % tr.mel.length;
    bgmNextTime += stepDur;
  }
}

<script>

const curMap = () => MAPS[game.mapIdx];

// ---------- 스탯 ----------
function itemStat(inst, field){
  if (!inst) return 0;

const moveSpd = () => 285 * (player.job === 'archer' ? 1.08 : 1);

// ---------- 알림 ----------
function notify(txt){

// ---------- 저장 ----------
const SAVE_V2 = 'mapleQuestSave_v2';
const SAVE_V1 = 'mapleQuestSave_v1';
function saveGame(){
  try {
    localStorage.setItem(SAVE_V2, JSON.stringify({
      v:2, job:player.job, level:player.level, exp:player.exp, sp:player.sp,
      skills:player.skills, meso:player.meso, potions:player.potions,
      inv:player.inv, equip:player.equip, quests:player.quests,

}
function validItem(it){
  return it && ITEMS[it.id] && typeof it.rar === 'number' && it.rar >= 0 && it.rar < RARITIES.length;
}
function loadSaveData(){
  try {
    let d2 = null;

      if (d2.skills) for (const k in d2.skills) player.skills[k] = clamp(d2.skills[k] | 0, 0, 10);
      player.meso = Math.max(0, d2.meso || 0);
      player.potions = { hp: clamp((d2.potions && d2.potions.hp) || 0, 0, 99), mp: clamp((d2.potions && d2.potions.mp) || 0, 0, 99) };
      player.inv = Array.isArray(d2.inv) ? d2.inv.filter(validItem).slice(0, 24) : [];
      player.equip = { weapon:null, hat:null, top:null };
      if (d2.equip) for (const s of ['weapon','hat','top']) if (validItem(d2.equip[s])) player.equip[s] = d2.equip[s];
      player.quests = {};
      if (d2.quests) for (const q of QUESTS){
        const qs = d2.quests[q.id];
        if (qs && (qs.st === 'active' || qs.st === 'done')) player.quests[q.id] = { st:qs.st, c: clamp(qs.c | 0, 0, q.need.n) };
      }
      game.mapIdx = clamp(d2.mapIdx || 0, 0, MAPS.length - 1);
      game.cleared = !!d2.cleared;
      game.bossRespawn = Math.max(0, d2.bossRespawn || 0);
      game.bossAlerted = !!d2.bossAlerted;
      return true;
    }
    // v1 마이그레이션
    let d1 = null;

    if (d1 && typeof d1.level === 'number'){
      player.job = 'beginner';
      player.level = clamp(d1.level, 1, 200);
      player.exp = Math.max(0, d1.exp || 0);
      player.sp = 0; player.skills = {};
      player.meso = Math.max(0, d1.meso || 0) + (d1.weaponTier || 0) * 800;
      player.potions = { hp: clamp((d1.potions && d1.potions.hp) || 0, 0, 99), mp: clamp((d1.potions && d1.potions.mp) || 0, 0, 99) };
      player.inv = []; player.equip = { weapon:null, hat:null, top:null };
      player.quests = {};
      game.mapIdx = 0;
      game.cleared = !!d1.cleared;
      game.bossRespawn = 0;
      game.bossAlerted = !!d1.cleared;
      // v1 경험치 곡선(30·L^1.7) → v2(20·L^1.7) 차이 정산
      while (player.exp >= expNeed()){

}
function hasAnySave(){
  try { return !!(localStorage.getItem(SAVE_V2) || localStorage.getItem(SAVE_V1)); } catch(e){ return false; }
}

// ---------- 게임 시작 / 맵 ----------
function startGame(useSave){

function spawnMonster(t, x, fromSpawner){

function loadMap(idx, appear){

// ---------- 인벤토리 / 장비 ----------
function rollEquip(tier, forceRar){
  const pool = DROP_POOLS[tier];
  const id = pool[irand(0, pool.length - 1)];
  let rar = 0;
  if (typeof forceRar === 'number') rar = forceRar;
  else {
    const r = Math.random();
    rar = r < RARITIES[2].chance ? 2 : (r < RARITIES[2].chance + RARITIES[1].chance ? 1 : 0);
  }

}
function addItem(inst){
  if (player.inv.length >= 24) return false;
  player.inv.push(inst);

}
function canEquip(inst){
  const def = ITEMS[inst.id];

}

  const inst = player.inv[idx];

  const def = ITEMS[inst.id];
  if (!canEquip(inst)){
    notify(def.slot === 'weapon' ? '이 무기는 다른 직업 전용입니다' : '장착할 수 없습니다');
    return;
  }
  const prev = player.equip[def.slot];
  player.inv.splice(idx, 1);
  player.equip[def.slot] = inst;

  notify(def.name + ' 장착');

}
function unequipSlot(slot){
  const inst = player.equip[slot];
  if (!inst) return;
  if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }

function sellPrice(inst){

}
function sellFromInv(idx){
  const inst = player.inv[idx];
  if (!inst) return;
  player.meso += sellPrice(inst);
  player.inv.splice(idx, 1);
  SFX.buy();
  saveGame();
}

// ---------- 상점 ----------
function shopEntries(){
  const list = [
    { kind:'potion', pot:'hp', name:'빨간 포션 (HP +100)', price:50 },
    { kind:'potion', pot:'mp', name:'파란 포션 (MP +70)',  price:60 },
  ];
  if (player.job !== 'beginner'){
    const base = { warrior:'sword', archer:'bow', mage:'staff' }[player.job];
    list.push({ kind:'item', id:base + '1' });

  list.push({ kind:'item', id:'hat2' });
  list.push({ kind:'item', id:'top2' });
  return list;
}
function buyShop(entry){
  if (entry.kind === 'potion'){
    const price = entry.price;
    if (player.meso < price){ notify('메소가 부족합니다'); return; }
    if (player.potions[entry.pot] >= 99){ notify('더 가질 수 없습니다'); return; }
    player.meso -= price;
    player.potions[entry.pot]++;
    SFX.buy();
  } else {
    const def = ITEMS[entry.id];
    if (player.meso < def.price){ notify('메소가 부족합니다'); return; }
    if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }
    player.meso -= def.price;
    player.inv.push({ id:entry.id, rar:0 });
    SFX.buy();
    notify(def.name + ' 구매');
  }
  saveGame();
}

// ---------- 퀘스트 ----------
function chainState(){
  // 순서대로 진행되는 체인에서 현재 퀘스트와 상태 반환
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (!qs){
      if (player.level < q.minLv) return { q, status:'locked' };
      return { q, status:'avail' };
    }
    if (qs.st === 'active'){
      return { q, status: qs.c >= q.need.n ? 'complete' : 'active' };
    }
    // done → 다음 퀘스트로
  }
  return { q:null, status:'alldone' };
}
function acceptQuest(q){
  player.quests[q.id] = { st:'active', c:0 };
  notify('퀘스트 수락: ' + q.name);
  SFX.questOk();
  saveGame();
}
function questOnKill(type){
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (qs && qs.st === 'active' && q.need.t === type && qs.c < q.need.n){
      qs.c++;
      if (qs.c === q.need.n){ notify('퀘스트 목표 달성: ' + q.name); SFX.questOk(); }
    }
  }
}
function jobWeaponId(tier){
  const base = { warrior:'sword', archer:'bow', mage:'staff' }[player.job];
  return base ? base + tier : null;
}
function completeQuest(q){
  const qs = player.quests[q.id];
  if (!qs || qs.st !== 'active' || qs.c < q.need.n) return;
  const rw = q.reward;
  // 아이템 보상 먼저 확인 (인벤토리 공간)
  let inst = null;
  if (rw.item){
    let id = null, rar = rw.item.rar || 0;
    if (rw.item.kind === 'id') id = rw.item.id;
    else if (rw.item.kind === 'weapon'){
      id = jobWeaponId(rw.item.tier);
      if (!id){ // 미전직: 메소로 대체
        player.meso += rw.item.tier * 1000;
        notify('무기 대신 ' + (rw.item.tier * 1000) + ' 메소를 받았습니다');
      }
    }
    if (id){
      if (player.inv.length >= 24){ notify('인벤토리를 비우고 다시 오세요'); return; }
      inst = { id, rar };
      player.inv.push(inst);
      notify('보상 획득: ' + ITEMS[id].name + (rar > 0 ? ' (' + RARITIES[rar].name + ')' : ''));
    }
  }
  qs.st = 'done';
  if (rw.meso) player.meso += rw.meso;
  if (rw.hpPot) player.potions.hp = Math.min(99, player.potions.hp + rw.hpPot);
  if (rw.mpPot) player.potions.mp = Math.min(99, player.potions.mp + rw.mpPot);
  notify('퀘스트 완료: ' + q.name);
  SFX.questOk();
  if (rw.exp) gainExp(rw.exp);
  saveGame();
}

// ---------- 전직 / 스킬 ----------
function doJobAdvance(jobKey){
  if (player.job !== 'beginner' || !JOBS[jobKey]) return;
  player.job = jobKey;
  player.sp += Math.max(0, (player.level - 7)) * 3;
  const wid = JOBS[jobKey].startWeapon;
  player.equip.weapon = { id:wid, rar:0 };
  player.hp = maxHp(); player.mp = maxMp();
  addEffect('jobadv', player.x, player.y, 1);
  SFX.jobadv();
  notify(JOBS[jobKey].name + '(으)로 전직했습니다!');
  game.uiWindow = null;
  game.jobPromptPending = false;
  saveGame();
}
function investSkill(id){
  if (player.sp <= 0) return;
  const defs = mySkills();
  if (!defs || !defs.some(d => d.id === id)) return;
  const cur = skillLevel(id);
  if (cur >= 10) return;
  player.skills[id] = cur + 1;
  player.sp--;
  SFX.buff();
  saveGame();
}
function addBuff(id, dur, lvl){
  player.buffs[id] = { t:dur, lvl };
  addEffect('buff', player.x, player.y, 1);
  SFX.buff();
}
function useSkillSlot(i){
  if (player.climbing || player.prone) return;
  const defs = mySkills();
  if (!defs){ notify('Lv8에 전직하면 스킬을 배웁니다'); return; }
  const def = defs[i];
  const lvl = skillLevel(def.id);
  if (lvl < 1){ notify('스킬창(K)에서 ' + def.name + '에 SP를 투자하세요'); return; }
  if ((player.cds[def.id] || 0) > 0) return;
  if (player.mp < def.mp){ notify('MP가 부족합니다'); return; }
  player.mp -= def.mp;

  const mult = def.base + def.per * lvl;
  player.castAnim = 0.25;
  switch (def.id){
    case 'ps': {
      const box = { x: player.facing > 0 ? player.x : player.x - 105, y:player.y - 80, w:105, h:88 };
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      SFX.skill();
      if (best){
        hitMonster(best, mult);
        addEffect('impact', best.x, best.y - best.T.h / 2, player.facing);
      }
      break;
    }
    case 'sb': {
      const box = { x:player.x - 140, y:player.y - 120, w:280, h:130 };
      let hits = 0;
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      addEffect('slash', player.x - player.facing * 45, player.y - 36, -player.facing);
      addEffect('whirl', player.x, player.y - 42, player.facing);
      SFX.skill();
      for (const m of monsters){
        if (m.dead || hits >= 8) continue;
        if (overlap(box, monsterRect(m))){ hitMonster(m, mult); hits++; }
      }
      break;
    }
    case 'rage': addBuff('rage', def.dur, lvl); break;
    case 'focus': addBuff('focus', def.dur, lvl); break;
    case 'shield': addBuff('shield', def.dur, lvl); break;
    case 'ds':
      spawnArrow(mult, -6);
      spawnArrow(mult, 0);
      SFX.arrow();
      break;
    case 'ab':
      pProj.push({ kind:'bomb', x:player.x + player.facing * 20, y:player.y - 28, vx:player.facing * 640, mult, dist:0, maxDist:560 });
      SFX.skill();
      break;
    case 'mc': {
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x;
        if (dx * player.facing < 0) continue;
        const d = Math.abs(dx);
        if (d < 430 && Math.abs((m.y - m.T.h / 2) - (player.y - 30)) < 130 && d < bestD){ bestD = d; best = m; }
      }
      SFX.magic();
      if (best){
        addEffect('claw', best.x, best.y - best.T.h / 2, player.facing);
        hitMonster(best, mult);
        if (!best.dead) hitMonster(best, mult);
      } else {
        addEffect('claw', player.x + player.facing * 120, player.y - 40, player.facing);
      }
      break;
    }
    case 'tb': {
      SFX.thunder();
      game.shake = Math.max(game.shake, 0.25);
      game.flash = 0.13;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x, dy = (m.y - m.T.h / 2) - (player.y - 30);
        if (dx * dx + dy * dy < 210 * 210){
          addEffect('lightning', m.x, m.y - m.T.h, 1);
          hitMonster(m, mult);
        }
      }
      break;
    }
  }
}
function spawnArrow(mult, yOff){
  pProj.push({ kind:'arrow', x:player.x + player.facing * 16, y:player.y - 28 + (yOff || 0), vx:player.facing * 760, mult, dist:0, maxDist:540 });
}

// ---------- 전투 ----------
function addDmgText(x, y, txt, color, big){
  dmgTexts.push({ x:x + rand(-8, 8), y, vy:-70, life:0.95, txt, color, big:!!big, pop:0 });
}
function addEffect(kind, x, y, dir){
  effects.push({ kind, x, y, dir:dir || 1, t:0 });
}
function monsterRect(m){
  return { x:m.x - m.T.w / 2, y:m.y - m.T.h, w:m.T.w, h:m.T.h };
}
function hitMonster(m, mult){
  if (m.dead) return;
  let dmg = totalAtk() * mult * rand(0.85, 1.15);
  const crit = Math.random() < critChance();
  if (crit) dmg *= 1.5;
  dmg = Math.max(1, Math.round(dmg));
  m.hp -= dmg;
  m.hitFlash = 0.15;
  if (m.type !== 'boss'){ m.stun = 0.18; m.kb = player.facing * 150; }
  addDmgText(m.x, m.y - m.T.h - 8, String(dmg), crit ? '#ff5ab0' : '#ffb642', crit);
  addEffect('hitstar', m.x + rand(-8, 8), m.y - m.T.h / 2 + rand(-8, 8), 1);
  player.combo.n++; player.combo.t = 2.2;
  if (crit) SFX.crit(); else SFX.hit();
  if (m.hp <= 0) killMonster(m);
}
function explodeAt(x, y, mult){
  addEffect('explosion', x, y, 1);
  SFX.explode();
  game.shake = Math.max(game.shake, 0.2);
  for (const m of monsters){
    if (m.dead) continue;
    const dx = m.x - x, dy = (m.y - m.T.h / 2) - y;
    if (dx * dx + dy * dy < 120 * 120) hitMonster(m, mult);
  }
}
function killMonster(m){
  m.dead = true; m.deadT = 0;
  addEffect('deathburst', m.x, m.y - m.T.h / 2, 1);
  gainExp(m.T.exp);
  questOnKill(m.type);
  if (m.spawner) m.spawner.respawnT = 6;
  // 드랍
  drops.push({ kind:'meso', x:m.x + rand(-10, 10), y:m.y - 20, vy:-260, value:irand(m.T.meso[0], m.T.meso[1]), t:0 });
  if (Math.random() < 0.12) drops.push({ kind:'hpPot', x:m.x + rand(-16, 16), y:m.y - 20, vy:-300, t:0 });
  if (Math.random() < 0.10) drops.push({ kind:'mpPot', x:m.x + rand(-16, 16), y:m.y - 20, vy:-300, t:0 });
  if (m.T.dropTier > 0 && Math.random() < m.T.dropRate && m.type !== 'boss'){
    drops.push({ kind:'equip', item:rollEquip(m.T.dropTier), x:m.x + rand(-12, 12), y:m.y - 20, vy:-340, t:0 });
  }
  if (m.type === 'boss'){
    game.bossRespawn = 60;
    game.shake = 0.8;
    for (let i = 0; i < 6; i++) drops.push({ kind:'meso', x:m.x + rand(-80, 80), y:m.y - 40, vy:rand(-420, -220), value:irand(150, 350), t:0 });
    const r = Math.random();
    const rar = r < 0.2 ? 2 : (r < 0.6 ? 1 : 0);
    const wid = jobWeaponId(3);
    const bossItem = wid ? { id:wid, rar } : rollEquip(3, rar);
    drops.push({ kind:'equip', item:bossItem, x:m.x, y:m.y - 40, vy:-420, t:0 });
    drops.push({ kind:'hpPot', x:m.x - 40, y:m.y - 40, vy:-380, t:0 });
    drops.push({ kind:'hpPot', x:m.x + 40, y:m.y - 40, vy:-380, t:0 });
    if (!game.cleared) game.state = 'victory';
    else addDmgText(m.x, m.y - m.T.h - 40, '머쉬맘 처치!', '#ffd94a', true);
    game.cleared = true;
    saveGame();
  }
}
function gainExp(e){
  player.exp += e;
  addDmgText(player.x, player.y - player.h - 26, '+' + e + ' EXP', '#a8ff78');
  let leveled = false;
  while (player.exp >= expNeed()){
    player.exp -= expNeed();
    player.level++;
    if (player.job !== 'beginner') player.sp += 3;
    leveled = true;
  }
  if (leveled){
    player.hp = maxHp(); player.mp = maxMp();
    addEffect('levelup', player.x, player.y, 1);
    SFX.levelup();
    if (player.job === 'beginner' && player.level >= 8) game.jobPromptPending = true;
    saveGame();
  }
}
function hurtPlayer(dmg, fromX){
  if (player.invul > 0 || game.state !== 'play') return;
  let d = dmg * rand(0.9, 1.1);
  const sl = buffLevel('shield');
  if (sl >= 0) d *= 1 - (0.20 + 0.02 * sl);
  const reduced = Math.max(1, Math.round(d - totalDef() * 0.7 - player.level * 0.3));
  player.hp -= reduced;
  player.invul = 1.3;
  player.climbing = null;
  player.vy = -320;
  player.vx = (player.x < fromX ? -1 : 1) * 240;
  player.combo = { n:0, t:0 };
  addDmgText(player.x, player.y - player.h - 10, String(reduced), '#ff4646');
  SFX.hurt();
  game.shake = Math.max(game.shake, 0.25);
  if (player.hp <= 0){
    player.hp = 0;
    game.state = 'dead';
    game.uiWindow = null;
    game.deadTimer = 0;
    SFX.die();
  }
}

// ---------- 상호작용 (↑키) ----------
function ladderAt(){
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && player.y > l[1] + 8 && player.y <= l[2] + 2) return l;
  }
  return null;
}
function ladderBelow(){
  // 사다리 꼭대기 발판 위에 서 있을 때 (아래로 진입)
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && Math.abs(player.y - l[1]) < 5 && player.onGround) return l;
  }
  return null;
}
function startClimb(l, fromTop){
  player.climbing = { x:l[0], y1:l[1], y2:l[2] };
  player.x = l[0];
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.jumpsUsed = 1; player.dropT = 0;
  if (fromTop) player.y = l[1] + 14;
  SFX.climb();
}
function openNpc(n){
  if (n.id === 'merchant'){
    game.uiWindow = 'shop';
  } else {
    game.uiWindow = 'dialog';
    game.dialogNpc = n;
  }
}
function startPortal(p){
  SFX.portal();
  game.fadeDir = 1; game.fade = 0;
  game.pendingMap = { to:p.to, appear:p.appear };
}
function interact(){
  const M = curMap();
  for (const n of M.npcs){
    if (Math.abs(player.x - n.x) < 50 && player.onGround && !player.groundIsPlat){ openNpc(n); return true; }
  }
  for (const p of M.portals){
    if (Math.abs(player.x - p.x) < 36 && player.y >= M.floor - 4){ startPortal(p); return true; }
  }
  const l = ladderAt();
  if (l && !player.climbing){ startClimb(l, false); return true; }
  return false;
}
function jumpPressed(){
  if (player.climbing){
    player.climbing = null;
    player.vy = -450;
    player.vx = keys.ArrowLeft ? -200 : (keys.ArrowRight ? 200 : 0);
    player.jumpsUsed = 1;
    SFX.jump();
    return;
  }
  if (keys.ArrowDown && player.onGround){
    const l = ladderBelow();
    if (l){ startClimb(l, true); return; }
    if (player.groundIsPlat){
      player.dropT = 0.22; player.vy = 160; player.onGround = false;
      return;
    }
  }
  if (player.onGround){
    player.vy = -820; player.jumpsUsed = 1; player.onGround = false; SFX.jump();
  } else if (player.jumpsUsed < 2){
    player.vy = -720; player.jumpsUsed = 2; SFX.jump();
    addEffect('djump', player.x, player.y, player.facing);
  }
}
const POTION_CD = { hp:3.5, mp:5 };
function usePotion(kind){
  if (player.potionCd[kind] > 0) return;
  if (kind === 'hp'){
    if (player.potions.hp <= 0 || player.hp >= maxHp()) return;
    player.potions.hp--;
    player.hp = Math.min(maxHp(), player.hp + 100);
    addDmgText(player.x, player.y - player.h - 10, '+100', '#66ff8a');
  } else {
    if (player.potions.mp <= 0 || player.mp >= maxMp()) return;
    player.potions.mp--;
    player.mp = Math.min(maxMp(), player.mp + 70);
    addDmgText(player.x, player.y - player.h - 10, '+70 MP', '#6ab8ff');
  }
  player.potionCd[kind] = POTION_CD[kind];
  SFX.potion();
}

// ---------- 물리 ----------
function resolveVertical(ent, prevY, isPlayer){
  const M = curMap();
  let landed = false, onPlat = false;
  if (ent.vy >= 0){
    if (prevY <= M.floor && ent.y >= M.floor){
      ent.y = M.floor; ent.vy = 0; landed = true;
    } else if (!(isPlayer && player.dropT > 0)){
      for (const p of M.plats){
        if (ent.x > p[0] - 4 && ent.x < p[0] + p[2] + 4 && prevY <= p[1] && ent.y >= p[1]){
          ent.y = p[1]; ent.vy = 0; landed = true; onPlat = true;
          if (!isPlayer) ent.plat = p;
          break;
        }
      }
    }
  }
  return { landed, onPlat };
}

// ---------- 플레이어 업데이트 ----------
function doBasicAttack(){
  const job = player.job;
  if (job === 'archer'){
    player.cdBasic = 0.42;
    player.attackAnim = 0.2;
    spawnArrow(1.0, 0);
    SFX.arrow();
  } else if (job === 'mage'){
    player.cdBasic = 0.48;
    player.attackAnim = 0.2;
    pProj.push({ kind:'orb', x:player.x + player.facing * 16, y:player.y - 28, vx:player.facing * 600, mult:1.05, dist:0, maxDist:480 });
    SFX.magic();
  } else {
    const range = job === 'warrior' ? 95 : 80;
    const multB = job === 'warrior' ? 1.1 : 1.0;
    player.cdBasic = job === 'warrior' ? 0.36 : 0.4;
    player.attackAnim = 0.2;
    player.attackAlt = 1 - player.attackAlt;
    const box = { x: player.facing > 0 ? player.x + 4 : player.x - 4 - range, y:player.y - 66, w:range, h:74 };
    let hit = false;
    for (const m of monsters){
      if (m.dead) continue;
      if (overlap(box, monsterRect(m))){ hitMonster(m, multB); hit = true; }
    }
    if (!hit) beep(180, 0.05, 'square', 0.02);
  }
}
function updatePlayer(dt){
  const M = curMap();
  player.invul = Math.max(0, player.invul - dt);
  player.cdBasic = Math.max(0, player.cdBasic - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);
  player.castAnim = Math.max(0, player.castAnim - dt);
  player.dropT = Math.max(0, player.dropT - dt);
  player.potionCd.hp = Math.max(0, player.potionCd.hp - dt);
  player.potionCd.mp = Math.max(0, player.potionCd.mp - dt);
  for (const k in player.cds) player.cds[k] = Math.max(0, player.cds[k] - dt);
  for (const k in player.buffs){
    player.buffs[k].t -= dt;
    if (player.buffs[k].t <= 0) delete player.buffs[k];
  }
  if (player.combo.t > 0){
    player.combo.t -= dt;
    if (player.combo.t <= 0) player.combo = { n:0, t:0 };
  }

  // 등반 중
  if (player.climbing){
    const c = player.climbing;
    if (keys.ArrowUp) player.y -= 155 * dt;
    if (keys.ArrowDown) player.y += 165 * dt;
    if (player.y <= c.y1){
      player.y = c.y1; player.climbing = null;
      player.onGround = true; player.groundIsPlat = (c.y1 !== M.floor); player.jumpsUsed = 0;
    } else if (player.y >= c.y2){
      player.y = c.y2; player.climbing = null;
      player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
    }
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
    return;
  }

  // 이동
  const L = keys.ArrowLeft, R = keys.ArrowRight;
  let mv = 0;
  if (L && !R) mv = -1;
  if (R && !L) mv = 1;
  // 엎드리기 (메이플식: 지상에서 ↓ 홀드)
  player.prone = !!(keys.ArrowDown && player.onGround && mv === 0);
  if (mv !== 0){ player.facing = mv; player.walkT += dt * 9; }
  const targetVx = player.prone ? 0 : mv * moveSpd();
  player.vx += (targetVx - player.vx) * Math.min(1, dt * 14);

  // 기본 공격 (Z 홀드, 엎드린 상태 불가)
  if (keys.KeyZ && player.cdBasic <= 0 && !player.prone) doBasicAttack();

  // 중력
  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  const prevY = player.y;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 18, M.w - 18);

  const res = resolveVertical(player, prevY, true);
  player.onGround = res.landed;
  player.groundIsPlat = res.onPlat;
  if (res.landed) player.jumpsUsed = 0;
  else if (player.jumpsUsed === 0 && player.vy > 0) player.jumpsUsed = 1; // 발판 낙하 = 첫 점프 소모

  // 자연 회복
  if (M.safe){
    player.hp = Math.min(maxHp(), player.hp + 25 * dt);
    player.mp = Math.min(maxMp(), player.mp + 15 * dt);
  } else {
    if (player.onGround && mv === 0) player.hp = Math.min(maxHp(), player.hp + 3.5 * dt);
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
  }
}

// ---------- 몬스터 업데이트 ----------
function updateMonster(m, dt){
  const M = curMap();
  m.animT += dt;
  if (m.dead){ m.deadT += dt; return; }
  if (m.spawnT > 0){ m.spawnT -= dt; return; }
  m.hitFlash = Math.max(0, m.hitFlash - dt);
  m.stun = Math.max(0, m.stun - dt);
  m.kb *= Math.pow(0.0015, dt);

  if (m.type === 'boss'){ updateBoss(m, dt); return; }

  const dx = player.x - m.x, dy = player.y - m.y;
  if (m.T.aggro && Math.abs(dx) < 270 && Math.abs(dy) < 90 && game.state === 'play') m.chase = true;
  if (Math.abs(dx) > 500) m.chase = false;

  let dir = m.dir;
  if (m.chase) dir = dx > 0 ? 1 : -1;

  let vx = 0;
  if (m.stun <= 0){
    vx = dir * m.T.spd;
    if (!m.chase){
      if (m.x > m.homeX + 130) dir = -1;
      if (m.x < m.homeX - 130) dir = 1;
      vx = dir * m.T.spd * 0.6;
      if (m.plat){
        if (m.x < m.plat[0] + 14) dir = 1;
        if (m.x > m.plat[0] + m.plat[2] - 14) dir = -1;
        vx = dir * m.T.spd * 0.6;
      }
    }
    m.dir = dir;
  }
  m.vy += GRAV * dt;
  if (m.vy > 900) m.vy = 900;
  const prevY = m.y;
  m.x += (vx + m.kb) * dt;
  m.y += m.vy * dt;
  m.x = clamp(m.x, 20, M.w - 20);
  m.plat = null;
  resolveVertical(m, prevY, false);
}
function updateBoss(b, dt){
  const M = curMap();
  const dx = player.x - b.x;
  b.dir = dx > 0 ? 1 : -1;
  const enraged = b.hp < b.maxHp * 0.5;
  b.jumpTimer -= dt;
  b.sporeTimer -= dt;

  if (b.landed && b.jumpTimer <= 0){
    b.vy = -880;
    b.vx = clamp(dx, -420, 420) / 1.1;
    b.landed = false;
    b.jumpTimer = enraged ? 3.2 : 5;
  }
  // 포자 던지기 (착지 상태에서)
  if (b.landed && b.sporeTimer <= 0){
    b.sporeTimer = enraged ? 3.2 : 4.5;
    for (const a of [-140, 0, 140]){
      eProj.push({ x:b.x + b.dir * 40, y:b.y - b.T.h + 30, vx: clamp(dx * 0.8, -350, 350) + a, vy:-rand(380, 480), kind:'spore' });
    }
    SFX.explode();
  }
  if (b.landed && b.stun <= 0){
    b.x += b.dir * b.T.spd * dt;
  } else if (!b.landed){
    b.x += (b.vx || 0) * dt;
  }
  b.vy += GRAV * dt;
  if (b.vy > 1000) b.vy = 1000;
  const prevY = b.y;
  b.y += b.vy * dt;
  b.x = clamp(b.x, 90, M.w - 90);
  if (prevY <= M.floor && b.y >= M.floor && b.vy >= 0){
    b.y = M.floor; b.vy = 0;
    if (!b.landed){
      b.landed = true;
      game.shake = Math.max(game.shake, 0.5);
      SFX.boss();
      eProj.push({ x:b.x - 60, y:M.floor, vx:-430, vy:0, kind:'wave', life:1.5 });
      eProj.push({ x:b.x + 60, y:M.floor, vx:430, vy:0, kind:'wave', life:1.5 });
    }
  }
  if (!b.summoned1 && b.hp < b.maxHp * 0.6){
    b.summoned1 = true;
    for (const ox of [-200, 180, 280]){
      const mm = spawnMonster('shroom', clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, '부하들이여!', '#ffdd66', true);
  }
  if (!b.summoned2 && b.hp < b.maxHp * 0.3){
    b.summoned2 = true;
    for (const ox of [-240, 240]){
      const mm = spawnMonster('zshroom', clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, '일어나라, 저주받은 자들이여!', '#c77aff', true);
  }
}

// ---------- 월드 업데이트 ----------
function updateWorld(dt){
  const M = curMap();
  for (const sp of spawners){
    if (sp.respawnT > 0){
      sp.respawnT -= dt;
      if (sp.respawnT <= 0) spawnMonster(sp.t, sp.x, sp);
    }
  }
  if (game.bossRespawn > 0){
    game.bossRespawn -= dt;
    if (game.bossRespawn <= 0 && game.mapIdx === 5){
      const bx = player.x < 750 ? 1200 : 300;
      const b = spawnMonster('boss', bx, null);
      addDmgText(b.x, b.y - b.T.h - 30, '머쉬맘이 나타났다!', '#ff8a8a', true);
      SFX.boss();
    }
  }
  for (let i = monsters.length - 1; i >= 0; i--){
    updateMonster(monsters[i], dt);
    if (monsters[i].dead && monsters[i].deadT > 0.5) monsters.splice(i, 1);
  }
  // 플레이어 투사체
  for (let i = pProj.length - 1; i >= 0; i--){
    const p = pProj[i];
    p.x += p.vx * dt;
    p.dist += Math.abs(p.vx) * dt;
    let remove = p.dist > p.maxDist || p.x < 0 || p.x > M.w;
    if (!remove){
      for (const m of monsters){
        if (m.dead) continue;
        const r = monsterRect(m);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y - 24 && p.y < r.y + r.h + 6){
          if (p.kind === 'bomb') explodeAt(p.x, p.y, p.mult);
          else hitMonster(m, p.mult);
          remove = true;
          break;
        }
      }
    } else if (p.kind === 'bomb'){
      explodeAt(p.x, p.y, p.mult);
    }
    if (remove) pProj.splice(i, 1);
  }
  // 적 투사체 (포자, 충격파)
  const pr = { x:player.x - player.w / 2, y:player.y - player.h, w:player.w, h:player.h };
  for (let i = eProj.length - 1; i >= 0; i--){
    const p = eProj[i];
    if (p.kind === 'spore'){
      p.vy += 850 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (overlap({ x:p.x - 10, y:p.y - 10, w:20, h:20 }, pr)){
        hurtPlayer(30, p.x);
        eProj.splice(i, 1);
        continue;
      }
      if (p.y > M.floor){ addEffect('poof', p.x, M.floor, 1); eProj.splice(i, 1); }
    } else { // wave
      p.x += p.vx * dt;
      p.life -= dt;
      if (overlap({ x:p.x - 22, y:p.y - 30, w:44, h:30 }, pr)) hurtPlayer(28, p.x);
      if (p.life <= 0 || p.x < 0 || p.x > M.w) eProj.splice(i, 1);
    }
  }
  // 몬스터 접촉 피해 (등반 중에도)
  if (player.invul <= 0){
    for (const m of monsters){
      if (m.dead || m.spawnT > 0) continue;
      if (overlap(pr, monsterRect(m))){ hurtPlayer(m.T.touch, m.x); break; }
    }
  }
  // 드랍
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.vy += 1900 * dt;
    d.y += d.vy * dt;
    if (d.y > M.floor - 6){ d.y = M.floor - 6; d.vy = 0; }
    if (d.noPickT) d.noPickT -= dt;
    const dx = player.x - d.x, dy = (player.y - 24) - d.y;
    const dist = Math.hypot(dx, dy);
    if (d.t > 0.45 && dist < 60 && !(d.noPickT > 0)){
      d.x += dx * dt * 9; d.y += dy * dt * 9;
    }
    if (d.t > 0.45 && dist < 24 && !(d.noPickT > 0)){
      if (d.kind === 'meso'){
        player.meso += d.value;
        addDmgText(player.x, player.y - player.h - 12, '+' + d.value + ' 메소', '#ffd94a');
      } else if (d.kind === 'hpPot'){
        player.potions.hp = Math.min(99, player.potions.hp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'HP 물약 획득', '#ff8a8a');
      } else if (d.kind === 'mpPot'){
        player.potions.mp = Math.min(99, player.potions.mp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'MP 물약 획득', '#8ab8ff');
      } else if (d.kind === 'equip'){
        if (!addItem(d.item)){
          if (!d.notified){ notify('인벤토리가 가득 찼습니다'); d.notified = true; }
          d.noPickT = 2.5;
          continue;
        }
        const def = ITEMS[d.item.id];
        addDmgText(player.x, player.y - player.h - 12, def.name + ' 획득', RARITIES[d.item.rar].color);
      }
      SFX.pickup();
      drops.splice(i, 1);
      continue;
    }
    if (d.t > 40) drops.splice(i, 1);
  }
  // 카메라
  const target = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  camX += (target - camX) * Math.min(1, dt * 8);
  game.shake = Math.max(0, game.shake - dt);
  game.saveTimer += dt;
  if (game.saveTimer > 10){ game.saveTimer = 0; saveGame(); }
}

function updateFloaters(dt){
  game.flash = Math.max(0, game.flash - dt);
  for (let i = dmgTexts.length - 1; i >= 0; i--){
    const t = dmgTexts[i];
    t.y += t.vy * dt; t.vy *= Math.pow(0.3, dt); t.life -= dt; t.pop += dt;
    if (t.life <= 0) dmgTexts.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--){
    effects[i].t += dt;
    if (effects[i].t > 0.7) effects.splice(i, 1);
  }
  for (let i = game.notifs.length - 1; i >= 0; i--){
    game.notifs[i].t -= dt;
    if (game.notifs[i].t <= 0) game.notifs.splice(i, 1);
  }
}

// ---------- 메인 업데이트 ----------
function updateAll(dt){
  game.time += dt;
  if (game.fadeDir === 1){
    game.fade += dt * 3;
    if (game.fade >= 1){
      game.fade = 1; game.fadeDir = -1;
      if (game.pendingMap){ loadMap(game.pendingMap.to, game.pendingMap.appear); game.pendingMap = null; }
    }
  } else if (game.fadeDir === -1){
    game.fade -= dt * 3;
    if (game.fade <= 0){ game.fade = 0; game.fadeDir = 0; }
  }
  if (game.state === 'title') return;
  game.uiArm = Math.max(0, game.uiArm - dt);
  updateFloaters(dt);

  if (game.state === 'play' && game.fadeDir === 0 && !game.uiWindow){
    if (game.jobPromptPending && player.job === 'beginner'){
      game.uiWindow = 'job';
      game.uiArm = 0.45;   // 자동 오픈 직후 오입력 방지
      return;
    }
    updatePlayer(dt);
    if (game.state === 'play') updateWorld(dt);
  } else if (game.state === 'dead'){
    game.deadTimer += dt;
    if (game.deadTimer > 2.6){
      player.exp = Math.max(0, Math.floor(player.exp - expNeed() * 0.05));
      player.hp = maxHp(); player.mp = maxMp();
      game.state = 'play';
      loadMap(game.mapIdx, 'left');
    }
  }
}

<script>
'use strict';
// ============================================================
// 렌더링 v3: 메이플풍 2등신 캐릭터, 몬스터 리디자인, 레이어드 배경,
//            앰비언트 파티클, 강화 이펙트, HUD
// 전역 제공: canvas, ctx, rr, draw
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 결정적 의사난수 (장식 배치용)
function h1(i){ const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }

// ============================================================
// 배경 (하늘 + 3단 패럴랙스 + 앰비언트)
// ============================================================
function drawCloud(cx, cy, s, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, 22 * s, 0, 7);
  ctx.arc(cx + 26 * s, cy - 8 * s, 18 * s, 0, 7);
  ctx.arc(cx + 50 * s, cy, 20 * s, 0, 7);
  ctx.arc(cx + 26 * s, cy + 8 * s, 24 * s, 0, 7);
  ctx.arc(cx - 22 * s, cy + 5 * s, 16 * s, 0, 7);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function drawBG(){
  const M = curMap(), th = M.theme, style = M.bgm;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky1); g.addColorStop(1, th.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 해/달
  if (style === 'swamp' || style === 'boss'){
    ctx.fillStyle = 'rgba(240,240,215,0.85)';
    ctx.beginPath(); ctx.arc(190, 100, 34, 0, 7); ctx.fill();
    ctx.fillStyle = th.sky1;
    ctx.beginPath(); ctx.arc(204, 91, 30, 0, 7); ctx.fill();
    // 별
    for (let i = 0; i < 14; i++){
      const tw = 0.3 + Math.max(0, Math.sin(game.time * 1.6 + i * 2.1)) * 0.6;
      ctx.fillStyle = 'rgba(255,255,240,' + tw + ')';
      ctx.beginPath();
      ctx.arc(60 + h1(i + 61) * (W - 120), 30 + h1(i + 71) * 220, 1.4 + h1(i) * 1.2, 0, 7);
      ctx.fill();
    }
  } else {
    const sg = ctx.createRadialGradient(150, 100, 10, 150, 100, 90);
    sg.addColorStop(0, 'rgba(255,245,200,0.95)');
    sg.addColorStop(0.35, 'rgba(255,240,180,0.45)');
    sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(30, 0, 260, 220);
    ctx.fillStyle = '#fff7d8';
    ctx.beginPath(); ctx.arc(150, 100, 30, 0, 7); ctx.fill();
    // 햇살 광선
    ctx.save();
    ctx.translate(150, 100);
    for (const ang of [0.55, 0.85, 1.2]){
      ctx.save();
      ctx.rotate(ang + Math.sin(game.time * 0.4) * 0.03);
      const rg = ctx.createLinearGradient(0, 0, 620, 0);
      rg.addColorStop(0, 'rgba(255,245,200,0.16)');
      rg.addColorStop(1, 'rgba(255,245,200,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(660, -46);
      ctx.lineTo(660, 46);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // 구름
  for (let i = 0; i < 5; i++){
    const cx = ((i * 300 + game.time * (8 + i * 2) - camX * 0.06) % (W + 360) + W + 360) % (W + 360) - 180;
    drawCloud(cx, 66 + h1(i + 3) * 120, 0.8 + h1(i) * 0.7, style === 'swamp' || style === 'boss' ? 0.18 : 0.7);
  }
  // 원경 산 (레이어 1) - 단일 연속 실루엣
  ctx.fillStyle = th.hill;
  ctx.globalAlpha = 0.24;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  {
    const off1 = (camX * 0.15) % 840;
    for (let i = -1; i < 4; i++){
      const hx = i * 420 - off1;
      ctx.quadraticCurveTo(hx + 105, M.floor - 340 - (((i % 2) + 2) % 2) * 70, hx + 420, M.floor - 60);
    }
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  // 중경 언덕 (레이어 2) - 단일 연속 실루엣
  ctx.globalAlpha = 0.42;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  {
    const off2 = (camX * 0.3) % 760;
    for (let i = -1; i < 4; i++){
      const hx = i * 380 - off2;
      ctx.quadraticCurveTo(hx + 95, M.floor - 160 - (((i % 2) + 2) % 2) * 60, hx + 380, M.floor - 30);
    }
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  // 보스맵 배경 버섯 군락 실루엣
  if (style === 'boss'){
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#c07888';
    for (let i = 0; i < 6; i++){
      const bx = ((i * 300 + 90 - camX * 0.4) % (W + 400) + W + 400) % (W + 400) - 200;
      const s = 0.6 + h1(i + 83) * 0.9;
      ctx.fillRect(bx - 9 * s, M.floor - 95 * s, 18 * s, 95 * s);
      ctx.beginPath(); ctx.ellipse(bx, M.floor - 95 * s, 46 * s, 30 * s, 0, Math.PI, 0); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 근경 나무 실루엣 (레이어 3)
  ctx.globalAlpha = 0.26;
  for (let i = -1; i < 14; i++){
    const tx = i * 260 - (camX * 0.55) % 260;
    const r = h1(i + 40 + game.mapIdx * 7);
    if (r < 0.45) continue;
    const s = 0.5 + r * 0.45;
    ctx.fillStyle = th.hill;
    if (style === 'swamp' || style === 'boss'){
      ctx.fillRect(tx - 4 * s, M.floor - 110 * s, 8 * s, 110 * s);
      ctx.lineWidth = 8 * s; ctx.strokeStyle = th.hill; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, M.floor - 88 * s); ctx.lineTo(tx - 26 * s, M.floor - 112 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx, M.floor - 70 * s); ctx.lineTo(tx + 24 * s, M.floor - 96 * s);
      ctx.stroke();
      ctx.lineCap = 'butt';
    } else {
      ctx.fillRect(tx - 5 * s, M.floor - 90 * s, 10 * s, 90 * s);
      ctx.beginPath(); ctx.arc(tx, M.floor - 105 * s, 34 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx - 22 * s, M.floor - 85 * s, 24 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx + 22 * s, M.floor - 85 * s, 24 * s, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- 앰비언트 파티클 (무상태, 시간 기반) ----------
function drawAmbient(){
  const style = curMap().bgm, t = game.time;
  if (style === 'town' || style === 'field'){
    // 흩날리는 단풍잎 (3갈래 잎 실루엣)
    for (let i = 0; i < 10; i++){
      const speed = 26 + h1(i) * 30;
      const lx = ((h1(i + 11) * (W + 80) + t * speed * 0.7 + Math.sin(t * 1.4 + i) * 22 - camX * 0.2) % (W + 80) + W + 80) % (W + 80) - 40;
      const ly = ((h1(i + 23) * H + t * speed) % (H - 60));
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(t * 1.6 + i * 2);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = h1(i + 41) < 0.5 ? '#e8843a' : '#d4552f';
      const s = 0.8 + h1(i + 6) * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 5 * s);
      ctx.quadraticCurveTo(-6 * s, 2 * s, -4.5 * s, -3.5 * s);
      ctx.quadraticCurveTo(-2 * s, -2 * s, 0, -6 * s);
      ctx.quadraticCurveTo(2 * s, -2 * s, 4.5 * s, -3.5 * s);
      ctx.quadraticCurveTo(6 * s, 2 * s, 0, 5 * s);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,50,20,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 6.5 * s); ctx.lineTo(0, -4 * s); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (style === 'forest'){
    // 떠오르는 포자 빛
    for (let i = 0; i < 12; i++){
      const lx = ((h1(i + 7) * (W + 60) - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - ((h1(i + 31) * 300 + t * (14 + h1(i) * 16)) % 380);
      const pulse = 0.35 + Math.sin(t * 2 + i * 3) * 0.25;
      ctx.fillStyle = 'rgba(200,255,190,' + Math.max(0.05, pulse) + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.5 + h1(i + 5) * 2, 0, 7); ctx.fill();
    }
  } else if (style === 'coast'){
    // 햇살 반짝임
    for (let i = 0; i < 8; i++){
      const lx = ((h1(i + 9) * (W + 60) - camX * 0.3) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = 120 + h1(i + 17) * 320;
      const tw = Math.max(0, Math.sin(t * 3 + i * 2.4));
      ctx.strokeStyle = 'rgba(255,250,210,' + tw * 0.7 + ')';
      ctx.lineWidth = 1.6;
      const r = 4 + tw * 4;
      ctx.beginPath();
      ctx.moveTo(lx - r, ly); ctx.lineTo(lx + r, ly);
      ctx.moveTo(lx, ly - r); ctx.lineTo(lx, ly + r);
      ctx.stroke();
    }
  } else if (style === 'swamp'){
    // 반딧불
    for (let i = 0; i < 9; i++){
      const lx = ((h1(i + 3) * (W + 60) + Math.sin(t * 0.6 + i) * 40 - camX * 0.3) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - 40 - h1(i + 13) * 260 + Math.sin(t * 1.4 + i * 2) * 18;
      const pulse = Math.max(0, Math.sin(t * 1.8 + i * 2.7));
      ctx.fillStyle = 'rgba(210,255,140,' + pulse * 0.8 + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(210,255,140,' + pulse * 0.25 + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 6.5, 0, 7); ctx.fill();
    }
    // 안개
    ctx.fillStyle = 'rgba(160,180,165,0.12)';
    for (let i = 0; i < 3; i++){
      const fy = 320 + i * 85 + Math.sin(t * 0.5 + i * 2) * 18;
      ctx.beginPath();
      ctx.ellipse(((t * (12 + i * 6)) % (W + 700)) - 350, fy, 330, 44, 0, 0, 7);
      ctx.fill();
    }
  } else if (style === 'boss'){
    // 떠오르는 포자 + 떨어지는 재
    for (let i = 0; i < 10; i++){
      const lx = ((h1(i + 7) * (W + 60) + Math.sin(t * 0.8 + i) * 30 - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - ((h1(i + 31) * 300 + t * (12 + h1(i) * 14)) % 420);
      const pulse = 0.3 + Math.sin(t * 2 + i * 3) * 0.2;
      ctx.fillStyle = 'rgba(210,150,235,' + Math.max(0.08, pulse) + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.5 + h1(i + 5) * 2.2, 0, 7); ctx.fill();
    }
    for (let i = 0; i < 8; i++){
      const speed = 18 + h1(i) * 22;
      const lx = ((h1(i + 19) * (W + 60) + Math.sin(t + i) * 24) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = ((h1(i + 29) * H + t * speed) % (H - 40));
      ctx.fillStyle = 'rgba(200,140,220,' + (0.25 + h1(i + 2) * 0.3) + ')';
      ctx.fillRect(lx, ly, 3, 3);
    }
  }
}

// ============================================================
// 지형 / 장식 / NPC
// ============================================================
function drawDecor(d, floor){
  const sx = d.x - camX;
  if (sx < -280 || sx > W + 280) return;
  ctx.save();
  ctx.translate(sx, floor);
  if (d.k === 'tree'){
    const coast = curMap().bgm === 'coast';
    const c1 = coast ? '#9a6a34' : '#3f8034';
    const c2 = coast ? '#b8834a' : '#559a45';
    ctx.fillStyle = '#6e4a26';
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.quadraticCurveTo(-7, -50, -6, -95);
    ctx.lineTo(6, -95); ctx.quadraticCurveTo(7, -50, 11, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.arc(0, -128, 46, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-32, -100, 33, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(32, -100, 33, 0, 7); ctx.fill();
    ctx.fillStyle = c2;
    ctx.beginPath(); ctx.arc(-10, -132, 30, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -114, 24, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8762a';
    ctx.beginPath(); ctx.arc(-18, -118, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(24, -100, 4.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -142, 4.5, 0, 7); ctx.fill();
  } else if (d.k === 'deadtree'){
    ctx.strokeStyle = '#3a3028'; ctx.lineCap = 'round';
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-8, -60, -4, -105); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-5, -70); ctx.quadraticCurveTo(-28, -88, -46, -108); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, -95); ctx.quadraticCurveTo(14, -112, 30, -134); ctx.stroke();
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-46, -108); ctx.lineTo(-56, -124); ctx.stroke();
    ctx.lineCap = 'butt';
  } else if (d.k === 'rock'){
    ctx.fillStyle = '#6a6f7a';
    ctx.beginPath();
    ctx.moveTo(-32, 0);
    ctx.quadraticCurveTo(-33, -20, -14, -27);
    ctx.quadraticCurveTo(4, -33, 20, -24);
    ctx.quadraticCurveTo(33, -14, 32, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a8f9a';
    ctx.beginPath();
    ctx.moveTo(-26, -8);
    ctx.quadraticCurveTo(-26, -20, -12, -25);
    ctx.quadraticCurveTo(2, -29, 14, -22);
    ctx.quadraticCurveTo(6, -16, -4, -14);
    ctx.quadraticCurveTo(-16, -12, -26, -8);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(8, -6, 12, 6, 0, 0, 7); ctx.fill();
  } else if (d.k === 'mushtree'){
    ctx.fillStyle = '#c9b89a';
    ctx.beginPath();
    ctx.moveTo(-13, 0); ctx.quadraticCurveTo(-9, -50, -8, -88);
    ctx.lineTo(8, -88); ctx.quadraticCurveTo(9, -50, 13, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a34a64';
    ctx.beginPath(); ctx.ellipse(0, -88, 58, 36, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#c05a78';
    ctx.beginPath(); ctx.ellipse(-8, -96, 40, 22, -0.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,0.85)';
    ctx.beginPath(); ctx.arc(-26, -104, 8, 0, 7); ctx.fill();

function drawTerrain(){
  const M = curMap(), th = M.theme;
  for (const d of M.decor) drawDecor(d, M.floor);
  // 지면 (흙 + 텍스처)
  ctx.fillStyle = th.ground;
  ctx.fillRect(-camX, M.floor, M.w, H - M.floor);
  // 흙 얼룩
  for (let i = 0; i < M.w / 46; i++){
    const px = i * 46 + h1(i) * 30 - camX;
    if (px < -20 || px > W + 20) continue;
    const py = M.floor + 22 + h1(i + 51) * 50;
    if (py > H - 6) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.beginPath(); ctx.ellipse(px, py, 7 + h1(i + 3) * 8, 4, 0, 0, 7); ctx.fill();
  }
  // 잔디 층
  const gg = ctx.createLinearGradient(0, M.floor, 0, M.floor + 16);
  gg.addColorStop(0, th.grass);
  gg.addColorStop(1, th.ground);
  ctx.fillStyle = gg;
  ctx.fillRect(-camX, M.floor, M.w, 16);
  ctx.fillStyle = th.grass;
  for (let x = 0; x < M.w; x += 22){
    const sx = x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const hh = 7 + h1(x) * 6;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.lineTo(sx + 5, M.floor - hh);
    ctx.lineTo(sx + 11, M.floor);
    ctx.lineTo(sx + 14, M.floor - hh * 0.7);
    ctx.lineTo(sx + 19, M.floor);
    ctx.fill();
  }
  // 풀꽃/돌 (밝은 맵)
  if (M.bgm === 'town' || M.bgm === 'field'){
    for (let i = 0; i < M.w / 120; i++){
      const fx = i * 120 + h1(i + 77) * 90 - camX;
      if (fx < -20 || fx > W + 20) continue;
      if (h1(i + 91) < 0.5){
        ctx.fillStyle = h1(i + 13) < 0.5 ? '#ffde59' : '#ff8fb3';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 3, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 1.2, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'coast'){
    // 조개 / 불가사리
    for (let i = 0; i < M.w / 150; i++){
      const fx = i * 150 + h1(i + 57) * 110 - camX;
      if (fx < -20 || fx > W + 20) continue;
      const r = h1(i + 67);
      if (r < 0.35){
        // 조개
        ctx.fillStyle = '#f2e0c8';
        ctx.beginPath(); ctx.arc(fx, M.floor + 8, 6.5, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#c9a882'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx - 3.5, M.floor + 2.5);
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx, M.floor + 1.5);
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx + 3.5, M.floor + 2.5);
        ctx.stroke();
      } else if (r < 0.55){
        // 불가사리
        ctx.save();
        ctx.translate(fx, M.floor + 8);
        ctx.rotate(h1(i + 3) * 6);
        ctx.fillStyle = '#e88a5a';
        ctx.beginPath();
        for (let k = 0; k < 10; k++){
          const ang = k * Math.PI / 5 - Math.PI / 2;
          const rad = k % 2 === 0 ? 7 : 3;
          ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  } else if (M.bgm === 'swamp'){
    // 물웅덩이
    for (let i = 0; i < M.w / 260; i++){
      const fx = i * 260 + h1(i + 87) * 160 - camX;
      if (fx < -60 || fx > W + 60) continue;
      if (h1(i + 97) < 0.55){
        const pw = 26 + h1(i + 5) * 22;
        ctx.fillStyle = 'rgba(30,50,45,0.75)';
        ctx.beginPath(); ctx.ellipse(fx, M.floor + 10, pw, 5.5, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(160,200,180,0.35)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(fx, M.floor + 10, pw, 5.5, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.fillStyle = 'rgba(180,220,200,' + (0.12 + Math.sin(game.time * 1.2 + i) * 0.06) + ')';
        ctx.beginPath(); ctx.ellipse(fx - pw * 0.3, M.floor + 9, pw * 0.3, 2, 0, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'boss'){
    // 빛나는 독버섯
    for (let i = 0; i < M.w / 180; i++){
      const fx = i * 180 + h1(i + 27) * 120 - camX;
      if (fx < -20 || fx > W + 20) continue;
      if (h1(i + 37) < 0.5){
        const glow = 0.4 + Math.sin(game.time * 2 + i * 2) * 0.25;
        ctx.fillStyle = '#cfcbb4';
        ctx.fillRect(fx - 1.5, M.floor - 8, 3, 8);
        ctx.fillStyle = 'rgba(200,120,235,0.95)';
        ctx.beginPath(); ctx.ellipse(fx, M.floor - 8, 5.5, 4, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = 'rgba(220,160,255,' + glow * 0.4 + ')';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 9, 0, 7); ctx.fill();
      }
    }
  }
  // 플랫폼 (나무 판자 + 잔디)
  for (const p of M.plats){
    const sx = p[0] - camX;
    if (sx + p[2] < -20 || sx > W + 20) continue;
    ctx.fillStyle = '#6e4a26';
    rr(sx, p[1], p[2], 17, 6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (let px = 14; px < p[2] - 6; px += 26){
      ctx.fillRect(sx + px, p[1] + 4, 2, 11);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(sx + 2, p[1] + 1, p[2] - 4, 2.5);
    ctx.fillStyle = th.grass;
    rr(sx - 1, p[1] - 4, p[2] + 2, 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(sx - 1, p[1] - 4, p[2] + 2, 3, 2); ctx.fill();
  }
  // 사다리 (로프)
  for (const l of M.ladders){
    const sx = l[0] - camX;
    if (sx < -30 || sx > W + 30) continue;
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(sx, l[1] + 6); ctx.lineTo(sx, l[2]); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx + 1.5, l[1]); ctx.lineTo(sx + 1.5, l[2]); ctx.stroke();
    ctx.fillStyle = '#6b4a2c';
    for (let y = l[1] + 10; y < l[2] - 4; y += 17){
      rr(sx - 10, y, 20, 5.5, 2.5); ctx.fill();
    }
  }
  // 포탈
  for (const p of M.portals){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    const pulse = Math.sin(game.time * 4) * 4;
    ctx.save();
    ctx.translate(sx, M.floor - 48);
    const pg = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
    pg.addColorStop(0, 'rgba(150,190,255,0.85)');
    pg.addColorStop(0.6, 'rgba(80,120,255,0.35)');
    pg.addColorStop(1, 'rgba(80,120,255,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(0, 0, 34 + pulse, 50, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7aa8ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 25 + pulse * 0.6, 42, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,225,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 30, Math.sin(game.time * 3) * 0.5, 0, 7); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    const ptxt = '↑ ' + MAPS[p.to].name + (p.to === 5 ? ' (권장 Lv13+)' : '');
    const ptw = ctx.measureText(ptxt).width;
    ctx.fillText(ptxt, Math.max(ptw / 2 + 8, Math.min(W - ptw / 2 - 8, sx)), M.floor - 108);
  }
  for (const n of M.npcs) drawNpc(n, M.floor);
}

  } else {
    ctx.fillStyle = '#6e3f96';
    rr(-15, -42 + bob, 30, 42 - bob, 9); ctx.fill();
    ctx.fillStyle = '#5a3080';
    ctx.fillRect(-15, -18 + bob, 30, 5);
    // 팔
    ctx.fillStyle = '#5c3382';
    rr(-20, -38 + bob, 7, 15, 3.5); ctx.fill();
    rr(13, -38 + bob, 7, 15, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-16.5, -23 + bob, 3.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(16.5, -23 + bob, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#f5c542';
    ctx.beginPath(); ctx.arc(-7, -30 + bob, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, -52 + bob, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a2a6e';
    ctx.beginPath(); ctx.moveTo(-17, -57 + bob); ctx.lineTo(17, -57 + bob); ctx.lineTo(2, -84 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a3a8e';
    ctx.beginPath(); ctx.ellipse(0, -57 + bob, 17, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a1e';
    ctx.beginPath(); ctx.arc(-5, -53 + bob, 1.8, 0, 7); ctx.arc(5, -53 + bob, 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47 + bob, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();
  // 명찰 (근처 플랫폼과 겹치면 위로 회피)
  let labelY = floor - 104;
  for (const p of curMap().plats){
    if (n.x > p[0] - 40 && n.x < p[0] + p[2] + 40 && p[1] > floor - 130 && p[1] < floor - 80){
      labelY = p[1] - 26;
      break;
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  const label = n.id === 'chief' ? '촌장 (↑)' : '상인 (↑)';

}

function drawDrops(){
  for (const d of drops){
    const sx = d.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const bob = d.vy === 0 ? Math.sin(game.time * 5 + d.x) * 3 : 0;
    if (d.kind === 'meso'){
      ctx.save();
      ctx.translate(sx, d.y - 9 + bob);
      const sq = Math.abs(Math.sin(game.time * 3 + d.x));
      ctx.scale(0.4 + sq * 0.6, 1);
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-2.5, -3, 2, 0, 7); ctx.fill();
      ctx.restore();
    } else if (d.kind === 'equip'){
      const def = ITEMS[d.item.id];
      const col = RARITIES[d.item.rar].color;
      ctx.save();
      ctx.translate(sx, d.y - 13 + bob);
      ctx.rotate(Math.sin(game.time * 2 + d.x) * 0.2);
      if (def.slot === 'weapon'){
        ctx.rotate(-0.6);
        ctx.fillStyle = '#c8ccd8'; rr(-3, -16, 6, 24, 2); ctx.fill();
        ctx.fillStyle = '#e8ecf8'; rr(-3, -16, 2.5, 24, 1); ctx.fill();
        ctx.fillStyle = '#c8901a'; rr(-7, 8, 14, 4, 2); ctx.fill();
        ctx.fillStyle = '#6b4a2c'; rr(-2, 12, 4, 7, 2); ctx.fill();
      } else {
        ctx.fillStyle = '#9a8a7a';
        rr(-10, -9, 20, 17, 5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        rr(-10, -9, 20, 5, 3); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5 + Math.sin(game.time * 6) * 0.3;
      ctx.beginPath(); ctx.arc(sx, d.y - 13 + bob, 16, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = d.kind === 'hpPot' ? '#e84545' : '#4576e8';
      ctx.beginPath();
      ctx.arc(sx, d.y - 10 + bob, 7, 0, 7);
      ctx.fill();
      ctx.fillRect(sx - 4, d.y - 18 + bob, 8, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(sx - 2.5, d.y - 12 + bob, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9a25a';
      rr(sx - 3.5, d.y - 22 + bob, 7, 5, 1.5); ctx.fill();
    }
  }
}

function drawMonster(m){
  const sx = m.x - camX;
  if (sx < -240 || sx > W + 240) return;
  const t = m.animT;
  ctx.save();
  ctx.translate(sx, m.y);
  if (m.dead){
    ctx.globalAlpha = Math.max(0, 1 - m.deadT * 2);
    ctx.rotate(m.deadT * 2.5 * m.dir);
    const s = Math.max(0.05, 1 - m.deadT * 1.2);
    ctx.scale(s, s);
  } else if (m.spawnT > 0){
    const sp = 1 - m.spawnT / 0.45;
    ctx.globalAlpha = Math.max(0.05, sp);
    const ss = 0.35 + sp * 0.65;
    ctx.scale(ss, ss);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, m.T.w * 0.48, 6, 0, 0, 7); ctx.fill();

  const flash = m.hitFlash > 0;
  if (m.type === 'snail') drawSnail(m, t, flash);
  else if (m.type === 'slime') drawSlime(m, t, flash);
  else if (m.type === 'shroom') drawShroom(m, t, flash);
  else if (m.type === 'pig') drawPig(m, t, flash);
  else if (m.type === 'stump') drawStump(m, t, flash);
  else if (m.type === 'zshroom') drawZshroom(m, t, flash);
  else if (m.type === 'boss') drawBoss(m, t, flash);
  if (flash && !m.dead){
    ctx.globalAlpha = 0.35;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, -m.T.h / 2, m.T.w * 0.65, m.T.h * 0.65, 0, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (!m.dead && m.type !== 'boss' && m.hp < m.maxHp){
    const bw = 38;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rr(sx - bw / 2 - 1, m.y - m.T.h - 14, bw + 2, 7, 3); ctx.fill();
    ctx.fillStyle = '#4ade4a';
    const r = Math.max(0, m.hp / m.maxHp);
    if (r > 0.02){ rr(sx - bw / 2, m.y - m.T.h - 13, Math.max(3, bw * r), 5, 2); ctx.fill(); }
  }
}
function drawSnail(m, t, flash){
  const slide = Math.sin(t * 3) * 0.06;
  // 몸 (연노랑)
  ctx.fillStyle = flash ? '#fff' : '#f0e2b8';
  ctx.beginPath();
  ctx.moveTo(-16, 0);
  ctx.quadraticCurveTo(-18, -8, -8, -9);
  ctx.lineTo(m.dir * 14, -9);
  ctx.quadraticCurveTo(m.dir * 20, -9, m.dir * 19, -3);
  ctx.quadraticCurveTo(m.dir * 18, 0, m.dir * 14, 0);
  ctx.closePath(); ctx.fill();
  // 머리
  ctx.fillStyle = flash ? '#fff' : '#f0e2b8';
  ctx.beginPath(); ctx.arc(m.dir * 13, -12, 7.5, 0, 7); ctx.fill();
  // 껍질 (파랑 나선)
  ctx.save();
  ctx.translate(-m.dir * 4, -15);
  ctx.scale(1 + slide, 1 - slide);

const JOB_STYLE = {
  beginner: { hair:'#5a3a1e', top:'#3a6ecc', topD:'#2a4e9e', pants:'#3a2e6e', shoe:'#7a4a2a' },
  warrior:  { hair:'#4a2c14', top:'#b83a30', topD:'#8a2620', pants:'#43391f'.replace('43391f','3a3050'), shoe:'#54371f' },
  archer:   { hair:'#7a4f22', top:'#3a8a4a', topD:'#2a6236', pants:'#4a3a26', shoe:'#54371f' },
  mage:     { hair:'#3e2a4e', top:'#6a4ac0', topD:'#4e3494', pants:'#2e2440', shoe:'#3a2a50' },
};
function drawPlayer(){
  const sx = player.x - camX;
  const blink = player.invul > 0 && Math.floor(game.time * 14) % 2 === 0;
  if (blink && game.state === 'play') return;
  const st = JOB_STYLE[player.job] || JOB_STYLE.beginner;
  const climbing = !!player.climbing;
  const moving = Math.abs(player.vx) > 30 && player.onGround;
  const air = !player.onGround && !climbing;
  const wt = player.walkT;
  const leg = moving ? Math.sin(wt) * 7 : 0;
  const armSwing = moving ? Math.sin(wt) * 0.5 : 0;
  const breathe = (!moving && !air && !climbing) ? Math.sin(game.time * 2.2) * 1.2 : 0;
  const atk = player.attackAnim > 0;
  const cast = player.castAnim > 0;
  const eyeBlink = ((game.time % 3.1) > 2.94);

  ctx.save();
  ctx.translate(sx, player.y);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
  // 캐스팅 마법진
  if (cast && player.job === 'mage'){
    const ca = player.castAnim / 0.25;
    ctx.save();
    ctx.rotate(0);
    ctx.strokeStyle = 'rgba(154,122,255,' + (0.75 * ca) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 8, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,180,255,' + (0.55 * ca) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 5.5, 0, game.time * 5, game.time * 5 + 4.6); ctx.stroke();
    for (let i = 0; i < 4; i++){
      const ang = game.time * 4 + i * 1.57;
      ctx.fillStyle = 'rgba(190,160,255,' + (0.7 * ca) + ')';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 24, Math.sin(ang) * 7, 2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  ctx.scale(player.facing, 1);
  ctx.translate(0, breathe * 0.5);

  // ---- 엎드리기 (메이플 시그니처) ----
  if (player.prone && !climbing){
    // 다리 (뒤로 뻗음)
    ctx.fillStyle = st.pants;
    rr(-34, -10, 18, 8, 4); ctx.fill();
    ctx.fillStyle = st.shoe;
    rr(-40, -9, 9, 7, 3); ctx.fill();
    // 몸통 (수평)
    const pg2 = ctx.createLinearGradient(0, -16, 0, -2);
    pg2.addColorStop(0, st.top);
    pg2.addColorStop(1, st.topD);
    ctx.fillStyle = pg2;
    rr(-20, -16, 30, 14, 6); ctx.fill();
    // 팔 (턱 밑에)
    ctx.fillStyle = st.topD;
    rr(4, -12, 12, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(16, -8.5, 3.6, 0, 7); ctx.fill();
    // 머리 (앞쪽, 위를 봄)
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(14, -22, 14.5, 0, 7); ctx.fill();
    ctx.fillStyle = st.hair;
    ctx.beginPath(); ctx.arc(12, -25, 14.8, Math.PI * 0.8, Math.PI * 2.05); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -28); ctx.quadraticCurveTo(2, -37, 12, -38);
    ctx.lineTo(14, -32); ctx.lineTo(19, -37.5); ctx.lineTo(23, -31);
    ctx.quadraticCurveTo(27, -32, 28, -25);
    ctx.quadraticCurveTo(26, -38, 12, -39.5);
    ctx.quadraticCurveTo(0, -37, -2, -28);
    ctx.fill();
    // 얼굴 (편안)
    ctx.fillStyle = '#2e2018';
    ctx.beginPath();
    ctx.ellipse(18, -21, 2.1, 3, 0, 0, 7);
    ctx.ellipse(24.5, -21, 2.1, 3, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(18.7, -22.2, 0.9, 0, 7); ctx.arc(25.2, -22.2, 0.9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(21.5, -15.5, 2.2, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,140,0.35)';
    ctx.beginPath(); ctx.ellipse(26.5, -16.5, 3, 2, 0, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }

  // ---- 다리/신발 ----
  const legY = air ? -16 : -15;
  ctx.fillStyle = st.pants;
  rr(-10 + (air ? -2 : leg * 0.55), legY, 9, 15, 3.5); ctx.fill();
  rr(2 + (air ? 3 : -leg * 0.55), legY + (air ? -4 : 0), 9, air ? 12 : 15, 3.5); ctx.fill();
  ctx.fillStyle = st.shoe;
  rr(-12 + (air ? -2 : leg * 0.55), -6, 12, 6, 2.5); ctx.fill();
  rr(1 + (air ? 3 : -leg * 0.55), -6 + (air ? -4 : 0), 12, 6, 2.5); ctx.fill();

  // ---- 몸통 ----
  const topG = ctx.createLinearGradient(0, -36, 0, -13);
  topG.addColorStop(0, st.top);
  topG.addColorStop(1, st.topD);
  ctx.fillStyle = topG;
  rr(-12, -36, 24, 23, 7); ctx.fill();
  // 벨트
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-12, -18, 24, 4);
  ctx.fillStyle = '#e8c05a';
  ctx.fillRect(-3, -18.5, 6, 5);
  // 직업 디테일
  if (player.job === 'warrior'){
    ctx.fillStyle = '#d8dce8';
    rr(-13, -37, 26, 7, 3); ctx.fill();   // 어깨 갑주
  } else if (player.job === 'mage'){
    ctx.fillStyle = st.topD;
    ctx.beginPath();
    ctx.moveTo(-12, -14); ctx.lineTo(-15, -2); ctx.lineTo(15, -2); ctx.lineTo(12, -14);
    ctx.closePath(); ctx.fill();          // 로브 자락
  } else if (player.job === 'archer'){
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-12, -34); ctx.lineTo(12, -18); ctx.stroke();  // 화살통 끈
    // 등의 화살통
    ctx.save();
    ctx.translate(-13, -33);
    ctx.rotate(0.35);
    ctx.fillStyle = '#6e4a26';
    rr(-4, -6, 8, 18, 3.5); ctx.fill();
    ctx.fillStyle = '#e05a4a';
    ctx.beginPath(); ctx.moveTo(-3, -6); ctx.lineTo(-5, -12); ctx.lineTo(-1, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -6); ctx.lineTo(5, -12); ctx.lineTo(1, -8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c8b89a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(-3.5, -10); ctx.moveTo(2, -6); ctx.lineTo(3.5, -10); ctx.stroke();
    ctx.restore();
  }

  // ---- 뒷팔 ----
  if (!climbing){
    ctx.save();
    ctx.translate(-9, -33);
    ctx.rotate(-armSwing);
    ctx.fillStyle = st.topD;
    rr(-3.5, 0, 7, 13, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, 13, 3.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // ---- 무기 + 앞팔 ----
  if (climbing){
    const ph = Math.sin(game.time * 8) * 4;
    ctx.fillStyle = st.top;
    rr(-14, -50 + ph, 7, 18, 3.5); ctx.fill();
    rr(7, -50 - ph, 7, 18, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-10.5, -50 + ph, 3.6, 0, 7); ctx.arc(10.5, -50 - ph, 3.6, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 활
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    const pull = atk && prog < 0.55 ? (0.55 - prog) * 16 : 0;
    ctx.save();
    ctx.translate(13, -27);
    ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 19, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = '#5a3512'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 19, -0.5, 0.5); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ece8d8'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.25) * 19, Math.sin(-1.25) * 19);
    ctx.lineTo(-5 - pull, 0);
    ctx.lineTo(Math.cos(1.25) * 19, Math.sin(1.25) * 19);
    ctx.stroke();
    if (pull > 0){
      ctx.strokeStyle = '#d8ccb8'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-5 - pull, 0); ctx.lineTo(17, 0); ctx.stroke();
      ctx.fillStyle = '#c8ccd8';
      ctx.beginPath(); ctx.moveTo(21, 0); ctx.lineTo(15, -3); ctx.lineTo(15, 3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // 앞팔
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else if (player.job === 'mage'){
    // 지팡이
    ctx.save();
    ctx.translate(11, -28);
    ctx.rotate(cast ? -0.6 : 0.3);
    ctx.strokeStyle = '#6e4a26'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -24); ctx.stroke();
    ctx.lineCap = 'butt';
    const glow = cast || atk;
    if (glow){
      const og = ctx.createRadialGradient(0, -29, 2, 0, -29, 16);
      og.addColorStop(0, 'rgba(170,220,255,0.9)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, -29, 16, 0, 7); ctx.fill();
    }
    ctx.fillStyle = glow ? '#cfe6ff' : '#5a8ae0';
    ctx.beginPath(); ctx.arc(0, -29, glow ? 7.5 : 6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-1.8, -31, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, -29, 8.6, 2.4, 4.0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else {
    // 검 (전사/초보자) - 스윙
    const prog = (cast ? 1 - player.castAnim / 0.25 : (atk ? 1 - player.attackAnim / 0.2 : 1));
    const ang = (atk || cast) ? (-2.1 + prog * 2.9) : 0.75;
    // 스윙 잔상
    if ((atk || cast) && prog < 0.85){
      ctx.save();
      ctx.translate(9, -29);
      const trailN = 4;
      for (let i = 1; i <= trailN; i++){
        const ta = ang - i * 0.28;
        ctx.strokeStyle = 'rgba(200,230,255,' + (0.3 - i * 0.06) + ')';
        ctx.lineWidth = 8 - i;
        ctx.beginPath();
        ctx.arc(0, 0, 38, ta - 0.1, ta + 0.15);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.translate(9, -29);
    ctx.rotate(ang);
    // 팔
    ctx.fillStyle = st.top;
    rr(-2, -3.5, 13, 8, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(11, 0, 3.8, 0, 7); ctx.fill();
    // 검
    const blade = player.job === 'warrior' ? 40 : 32;
    const bg2 = ctx.createLinearGradient(0, -4, 0, 4);
    bg2.addColorStop(0, '#eef2fc');
    bg2.addColorStop(0.5, '#b8c0d4');
    bg2.addColorStop(1, '#8a94ac');
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(15, -4);
    ctx.lineTo(15 + blade - 7, -4);
    ctx.lineTo(15 + blade, 0);
    ctx.lineTo(15 + blade - 7, 4);
    ctx.lineTo(15, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillRect(15, -3.5, blade - 8, 2);
    // 가드/손잡이
    ctx.fillStyle = '#e0a82e';
    rr(12.5, -7, 4, 14, 2); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    rr(6, -3, 7, 6, 2.5); ctx.fill();
    ctx.restore();
  }

  // ---- 머리 (2등신 대두) ----
  const headY = -50;
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, headY, 15.5, 0, 7); ctx.fill();
  // 볼터치
  ctx.fillStyle = 'rgba(255,150,140,0.35)';
  ctx.beginPath(); ctx.ellipse(11, headY + 6, 3.4, 2.2, 0, 0, 7); ctx.fill();
  // 뒷머리
  ctx.fillStyle = st.hair;
  ctx.beginPath();
  ctx.arc(0, headY - 2.5, 15.8, Math.PI * 0.86, Math.PI * 2.14);
  ctx.fill();
  // 앞머리 (가르마 스파이크)
  ctx.beginPath();
  ctx.moveTo(-15, headY - 5);
  ctx.quadraticCurveTo(-13, headY - 12, -6, headY - 13);
  ctx.lineTo(-4, headY - 8);
  ctx.lineTo(0, headY - 14);
  ctx.lineTo(4, headY - 8.5);
  ctx.lineTo(8, headY - 13.5);
  ctx.lineTo(11, headY - 8);
  ctx.quadraticCurveTo(14.5, headY - 9, 15.5, headY - 4);
  ctx.quadraticCurveTo(15, headY - 15, 0, headY - 16.5);
  ctx.quadraticCurveTo(-14, headY - 15, -15, headY - 5);
  ctx.fill();
  // 옆머리
  ctx.beginPath();
  ctx.moveTo(-15.5, headY - 4);
  ctx.quadraticCurveTo(-17.5, headY + 4, -14.5, headY + 9);
  ctx.quadraticCurveTo(-13.5, headY + 2, -13, headY - 4);
  ctx.fill();
  // ---- 모자 (장비) ----
  if (player.equip.hat){
    const tier = ITEMS[player.equip.hat.id].tier;
    if (tier === 1){
      ctx.fillStyle = '#8a6238';
      ctx.beginPath(); ctx.ellipse(0, headY - 9, 17, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#a3763f';
      ctx.beginPath(); ctx.ellipse(0, headY - 12, 10.5, 7, 0, Math.PI, 0); ctx.fill();
    } else if (tier === 2){
      const hg2 = ctx.createLinearGradient(0, headY - 22, 0, headY - 4);
      hg2.addColorStop(0, '#c8cede');
      hg2.addColorStop(1, '#8a94ac');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#6a7490';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#d8dee8';
      ctx.fillRect(-2, headY - 23, 4, 6);
    } else {
      const hg3 = ctx.createLinearGradient(0, headY - 24, 0, headY - 2);
      hg3.addColorStop(0, '#f0d068');
      hg3.addColorStop(1, '#c8901a');
      ctx.fillStyle = hg3;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#a87610';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#e05a6a';
      ctx.beginPath(); ctx.moveTo(0, headY - 20); ctx.lineTo(5, headY - 30); ctx.lineTo(-5, headY - 30); ctx.closePath(); ctx.fill();
    }
  } else if (player.job === 'mage'){
    // 마법사 고깔모자
    ctx.fillStyle = '#4e3494';
    ctx.beginPath();
    ctx.moveTo(-17, headY - 8);
    ctx.quadraticCurveTo(-2, headY - 13, 17, headY - 8);
    ctx.lineTo(8, headY - 34);
    ctx.quadraticCurveTo(4, headY - 38, 1, headY - 33);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6a4ac0';
    ctx.beginPath(); ctx.ellipse(0, headY - 8.5, 18, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8c05a';
    ctx.beginPath(); ctx.arc(4, headY - 33, 3, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 궁수 두건 깃털
    ctx.fillStyle = '#2a6236';
    ctx.beginPath(); ctx.ellipse(0, headY - 10, 16.5, 5.5, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#e05a4a';
    ctx.save();
    ctx.translate(-10, headY - 13);
    ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (player.job === 'warrior'){
    // 전사 머리띠
    ctx.fillStyle = '#b83a30';
    rr(-15.5, headY - 8, 31, 5, 2.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(-15.5, headY - 8, 31, 1.8, 1); ctx.fill();
  }
  // ---- 얼굴 ----
  ctx.fillStyle = '#2e2018';
  if (eyeBlink){
    ctx.fillRect(3, headY + 1, 4.5, 1.6);
    ctx.fillRect(10, headY + 1, 4.5, 1.6);
  } else {
    ctx.beginPath();
    ctx.ellipse(5, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.ellipse(12, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5.8, headY - 0.5, 1, 0, 7); ctx.arc(12.8, headY - 0.5, 1, 0, 7); ctx.fill();
  }
  // 입
  ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (atk || cast) { ctx.arc(9, headY + 8, 2.4, 0, Math.PI); }
  else { ctx.moveTo(7, headY + 8.5); ctx.lineTo(11.5, headY + 8.5); }
  ctx.stroke();
  ctx.restore();
}
