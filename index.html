<script>
'use strict';
// ============================================================
// 오디오: 효과음(비프) + 칩튠 BGM 시퀀서
// 전역 제공: SFX, audioUnlock, audioTick, setBgm, toggleMute, isMuted
// ============================================================
let audioCtx = null;
let muted = false;
let bgmGain = null;
function ensureBgmGain(){
  if (!audioCtx) return null;
  if (!bgmGain){
    bgmGain = audioCtx.createGain();
    bgmGain.connect(audioCtx.destination);
  }
  return bgmGain;
}
function isMuted(){ return muted; }
function toggleMute(){
  muted = !muted;
  if (muted) stopBgmNodes();
  else if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch(e){}
  }
  return muted;
}
function audioUnlock(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function beep(freq, dur, type, vol, slide){
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const SFX = {
  jump:    () => beep(300, 0.12, 'square', 0.035, 200),
  hit:     () => beep(320 + Math.random() * 100, 0.08, 'square', 0.045, -120),
  crit:    () => beep(600, 0.15, 'sawtooth', 0.055, -300),
  arrow:   () => beep(700, 0.07, 'square', 0.03, 300),
  magic:   () => beep(450, 0.14, 'sine', 0.05, 250),
  skill:   () => { beep(500, 0.2, 'sawtooth', 0.045, 300); beep(250, 0.25, 'square', 0.035, 150); },
  thunder: () => { beep(120, 0.35, 'sawtooth', 0.07, -60); beep(900, 0.12, 'square', 0.04, -500); },
  explode: () => beep(100, 0.4, 'sawtooth', 0.08, -50),
  buff:    () => { beep(520, 0.12, 'sine', 0.05, 200); setTimeout(() => beep(780, 0.18, 'sine', 0.05, 150), 100); },
  hurt:    () => beep(140, 0.25, 'sawtooth', 0.06, -60),
  pickup:  () => beep(880, 0.09, 'square', 0.035, 220),
  equip:   () => { beep(400, 0.08, 'square', 0.05); setTimeout(() => beep(600, 0.1, 'square', 0.05), 70); },
  potion:  () => beep(520, 0.15, 'sine', 0.05, 260),
  portal:  () => beep(200, 0.4, 'sine', 0.05, 500),
  climb:   () => beep(240, 0.05, 'square', 0.02, 60),
  die:     () => beep(220, 0.6, 'sawtooth', 0.06, -180),
  buy:     () => { beep(700, 0.08, 'square', 0.045); setTimeout(() => beep(1050, 0.12, 'square', 0.045), 80); },
  questOk: () => { [659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.05), i * 100)); },
  levelup: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'square', 0.05), i * 110)); },
  jobadv:  () => { [523, 587, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'square', 0.05), i * 90)); },
  boss:    () => beep(90, 0.8, 'sawtooth', 0.08, 30),
};

// ---------- BGM 시퀀서 ----------
let bgmTrackName = null;
let bgmStep = 0;
let bgmNextTime = 0;
const midi2freq = n => 440 * Math.pow(2, (n - 69) / 12);

function stopBgmNodes(){
  bgmNextTime = 0;
  if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); } catch(e){}
  }
}

function setBgm(name){
  if (bgmTrackName === name) return;
  bgmTrackName = name;
  bgmStep = 0;
  bgmNextTime = 0;
}

function playNote(freq, when, dur, type, vol){
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ensureBgmGain() || audioCtx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  } catch(e){}
}

// 매 프레임 호출: 룩어헤드 스케줄링
function audioTick(){
  if (muted || !audioCtx || !bgmTrackName) return;
  const tr = BGM_TRACKS[bgmTrackName];
  if (!tr) return;
  const stepDur = 60 / tr.tempo / 2;   // 8분음표
  const now = audioCtx.currentTime;
  if (bgmNextTime === 0) bgmNextTime = now + 0.1;
  // 0.25초 룩어헤드
  while (bgmNextTime < now + 0.25){
    const mi = tr.mel[bgmStep % tr.mel.length];
    const bi = tr.bass[bgmStep % tr.bass.length];
    if (mi > 0) playNote(midi2freq(mi), bgmNextTime, stepDur * 0.9, 'square', 0.018);
    if (bi > 0) playNote(midi2freq(bi), bgmNextTime, stepDur * 1.7, 'triangle', 0.035);
    bgmStep = (bgmStep + 1) % tr.mel.length;
    bgmNextTime += stepDur;
  }
}

const SAVE_V2 = 'mapleQuestSave_v2';

      player.inv = []; player.equip = { weapon:null, hat:null, top:null };

// ---------- 상점 ----------
function shopEntries(){
  const list = [
    { kind:'potion', pot:'hp', name:'빨간 포션 (HP +100)', price:50 },

function buyShop(entry){
  if (entry.kind === 'potion'){
    const price = entry.price;
    if (player.meso < price){ notify('메소가 부족합니다'); return; }
    if (player.potions[entry.pot] >= 99){ notify('더 가질 수 없습니다'); return; }

// ---------- 퀘스트 ----------
function chainState(){
  // 순서대로 진행되는 체인에서 현재 퀘스트와 상태 반환
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (!qs){
      if (player.level < q.minLv) return { q, status:'locked' };
      return { q, status:'avail' };
    }
    if (qs.st === 'active'){
      return { q, status: qs.c >= q.need.n ? 'complete' : 'active' };
    }
    // done → 다음 퀘스트로
  }
  return { q:null, status:'alldone' };
}
function acceptQuest(q){
  player.quests[q.id] = { st:'active', c:0 };

  saveGame();
}
function questOnKill(type){
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (qs && qs.st === 'active' && q.need.t === type && qs.c < q.need.n){
      qs.c++;
      if (qs.c === q.need.n){ notify('퀘스트 목표 달성: ' + q.name); SFX.questOk(); }
    }
  }
}
function jobWeaponId(tier){

  return base ? base + tier : null;
}
function completeQuest(q){
  const qs = player.quests[q.id];
  if (!qs || qs.st !== 'active' || qs.c < q.need.n) return;
  const rw = q.reward;
  // 아이템 보상 먼저 확인 (인벤토리 공간)
  let inst = null;
  if (rw.item){
    let id = null, rar = rw.item.rar || 0;
    if (rw.item.kind === 'id') id = rw.item.id;
    else if (rw.item.kind === 'weapon'){
      id = jobWeaponId(rw.item.tier);
      if (!id){ // 미전직: 메소로 대체
        player.meso += rw.item.tier * 1000;
        notify('무기 대신 ' + (rw.item.tier * 1000) + ' 메소를 받았습니다');

      if (player.inv.length >= 24){ notify('인벤토리를 비우고 다시 오세요'); return; }
      inst = { id, rar };
      player.inv.push(inst);
      notify('보상 획득: ' + ITEMS[id].name + (rar > 0 ? ' (' + RARITIES[rar].name + ')' : ''));
    }
  }
  qs.st = 'done';
  if (rw.meso) player.meso += rw.meso;
  if (rw.hpPot) player.potions.hp = Math.min(99, player.potions.hp + rw.hpPot);
  if (rw.mpPot) player.potions.mp = Math.min(99, player.potions.mp + rw.mpPot);
  notify('퀘스트 완료: ' + q.name);
  SFX.questOk();
  if (rw.exp) gainExp(rw.exp);
  saveGame();
}

// ---------- 전직 / 스킬 ----------
function doJobAdvance(jobKey){
  if (player.job !== 'beginner' || !JOBS[jobKey]) return;
  player.job = jobKey;
  player.sp += Math.max(0, (player.level - 7)) * 3;
  const wid = JOBS[jobKey].startWeapon;
  player.equip.weapon = { id:wid, rar:0 };
  player.hp = maxHp(); player.mp = maxMp();

  notify(JOBS[jobKey].name + '(으)로 전직했습니다!');
  game.uiWindow = null;
  game.jobPromptPending = false;
  saveGame();
}
function investSkill(id){
  if (player.sp <= 0) return;
  const defs = mySkills();
  if (!defs || !defs.some(d => d.id === id)) return;
  const cur = skillLevel(id);
  if (cur >= 10) return;
  player.skills[id] = cur + 1;
  player.sp--;
  SFX.buff();
  saveGame();
}
function addBuff(id, dur, lvl){
  player.buffs[id] = { t:dur, lvl };
  addEffect('buff', player.x, player.y, 1);

}
function useSkillSlot(i){
  if (player.climbing) return;
  const defs = mySkills();
  if (!defs){ notify('Lv8에 전직하면 스킬을 배웁니다'); return; }

    case 'ps': {
      const box = { x: player.facing > 0 ? player.x : player.x - 105, y:player.y - 80, w:105, h:88 };
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }

      SFX.skill();

      break;
    }
    case 'sb': {

      addEffect('slash', player.x - player.facing * 45, player.y - 36, -player.facing);
      SFX.skill();
      for (const m of monsters){
        if (m.dead || hits >= 8) continue;
        if (overlap(box, monsterRect(m))){ hitMonster(m, mult); hits++; }
      }
      break;
    }
    case 'rage': addBuff('rage', def.dur, lvl); break;
    case 'focus': addBuff('focus', def.dur, lvl); break;
    case 'shield': addBuff('shield', def.dur, lvl); break;
    case 'ds':
      spawnArrow(mult, -6);
      spawnArrow(mult, 0);
      SFX.arrow();
      break;
    case 'ab':
      pProj.push({ kind:'bomb', x:player.x + player.facing * 20, y:player.y - 28, vx:player.facing * 640, mult, dist:0, maxDist:560 });
      SFX.skill();
      break;
    case 'mc': {
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x;
        if (dx * player.facing < 0) continue;
        const d = Math.abs(dx);
        if (d < 430 && Math.abs((m.y - m.T.h / 2) - (player.y - 30)) < 130 && d < bestD){ bestD = d; best = m; }
      }
      SFX.magic();
      if (best){
        addEffect('claw', best.x, best.y - best.T.h / 2, player.facing);
        hitMonster(best, mult);
        if (!best.dead) hitMonster(best, mult);
      } else {
        addEffect('claw', player.x + player.facing * 120, player.y - 40, player.facing);
      }
      break;
    }
    case 'tb': {
      SFX.thunder();
      game.shake = Math.max(game.shake, 0.25);
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x, dy = (m.y - m.T.h / 2) - (player.y - 30);
        if (dx * dx + dy * dy < 210 * 210){
          addEffect('lightning', m.x, m.y - m.T.h, 1);
          hitMonster(m, mult);
        }
      }
      break;
    }
  }
}
function spawnArrow(mult, yOff){
  pProj.push({ kind:'arrow', x:player.x + player.facing * 16, y:player.y - 28 + (yOff || 0), vx:player.facing * 760, mult, dist:0, maxDist:540 });
}

// ---------- 전투 ----------
function addDmgText(x, y, txt, color, big){
  dmgTexts.push({ x:x + rand(-8, 8), y, vy:-70, life:0.95, txt, color, big:!!big, pop:0 });
}
function addEffect(kind, x, y, dir){
  effects.push({ kind, x, y, dir:dir || 1, t:0 });
}
function monsterRect(m){
  return { x:m.x - m.T.w / 2, y:m.y - m.T.h, w:m.T.w, h:m.T.h };
}
function hitMonster(m, mult){
  if (m.dead) return;
  let dmg = totalAtk() * mult * rand(0.85, 1.15);
  const crit = Math.random() < critChance();
  if (crit) dmg *= 1.5;
  dmg = Math.max(1, Math.round(dmg));
  m.hp -= dmg;
  m.hitFlash = 0.15;
  if (m.type !== 'boss'){ m.stun = 0.18; m.kb = player.facing * 150; }
  addDmgText(m.x, m.y - m.T.h - 8, String(dmg), crit ? '#ff5ab0' : '#ffb642', crit);
  addEffect('hitstar', m.x + rand(-8, 8), m.y - m.T.h / 2 + rand(-8, 8), 1);
  player.combo.n++; player.combo.t = 2.2;
  if (crit) SFX.crit(); else SFX.hit();
  if (m.hp <= 0) killMonster(m);
}
function explodeAt(x, y, mult){
  addEffect('explosion', x, y, 1);
  SFX.explode();
  game.shake = Math.max(game.shake, 0.2);
  for (const m of monsters){
    if (m.dead) continue;
    const dx = m.x - x, dy = (m.y - m.T.h / 2) - y;
    if (dx * dx + dy * dy < 120 * 120) hitMonster(m, mult);
  }
}
function killMonster(m){
  m.dead = true; m.deadT = 0;
  gainExp(m.T.exp);
  questOnKill(m.type);
  if (m.spawner) m.spawner.respawnT = 6;
  // 드랍
  drops.push({ kind:'meso', x:m.x + rand(-10, 10), y:m.y - 20, vy:-260, value:irand(m.T.meso[0], m.T.meso[1]), t:0 });
  if (Math.random() < 0.12) drops.push({ kind:'hpPot', x:m.x + rand(-16, 16), y:m.y - 20, vy:-300, t:0 });
  if (Math.random() < 0.10) drops.push({ kind:'mpPot', x:m.x + rand(-16, 16), y:m.y - 20, vy:-300, t:0 });
  if (m.T.dropTier > 0 && Math.random() < m.T.dropRate && m.type !== 'boss'){
    drops.push({ kind:'equip', item:rollEquip(m.T.dropTier), x:m.x + rand(-12, 12), y:m.y - 20, vy:-340, t:0 });
  }
  if (m.type === 'boss'){
    game.bossRespawn = 60;
    game.shake = 0.8;
    for (let i = 0; i < 6; i++) drops.push({ kind:'meso', x:m.x + rand(-80, 80), y:m.y - 40, vy:rand(-420, -220), value:irand(150, 350), t:0 });
    const r = Math.random();
    const rar = r < 0.2 ? 2 : (r < 0.6 ? 1 : 0);
    const wid = jobWeaponId(3);
    const bossItem = wid ? { id:wid, rar } : rollEquip(3, rar);
    drops.push({ kind:'equip', item:bossItem, x:m.x, y:m.y - 40, vy:-420, t:0 });
    drops.push({ kind:'hpPot', x:m.x - 40, y:m.y - 40, vy:-380, t:0 });
    drops.push({ kind:'hpPot', x:m.x + 40, y:m.y - 40, vy:-380, t:0 });
    if (!game.cleared) game.state = 'victory';
    else addDmgText(m.x, m.y - m.T.h - 40, '머쉬맘 처치!', '#ffd94a', true);
    game.cleared = true;
    saveGame();
  }
}
function gainExp(e){
  player.exp += e;
  addDmgText(player.x, player.y - player.h - 26, '+' + e + ' EXP', '#a8ff78');
  let leveled = false;
  while (player.exp >= expNeed()){
    player.exp -= expNeed();
    player.level++;
    if (player.job !== 'beginner') player.sp += 3;
    leveled = true;
  }
  if (leveled){
    player.hp = maxHp(); player.mp = maxMp();
    addEffect('levelup', player.x, player.y, 1);
    SFX.levelup();
    if (player.job === 'beginner' && player.level >= 8) game.jobPromptPending = true;
    saveGame();
  }
}
function hurtPlayer(dmg, fromX){
  if (player.invul > 0 || game.state !== 'play') return;
  let d = dmg * rand(0.9, 1.1);
  const sl = buffLevel('shield');
  if (sl >= 0) d *= 1 - (0.20 + 0.02 * sl);
  const reduced = Math.max(1, Math.round(d - totalDef() * 0.7 - player.level * 0.3));
  player.hp -= reduced;
  player.invul = 1.3;
  player.climbing = null;
  player.vy = -320;
  player.vx = (player.x < fromX ? -1 : 1) * 240;
  player.combo = { n:0, t:0 };
  addDmgText(player.x, player.y - player.h - 10, String(reduced), '#ff4646');
  SFX.hurt();
  game.shake = Math.max(game.shake, 0.25);
  if (player.hp <= 0){
    player.hp = 0;
    game.state = 'dead';
    game.uiWindow = null;
    game.deadTimer = 0;
    SFX.die();
  }
}

// ---------- 상호작용 (↑키) ----------
function ladderAt(){
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && player.y > l[1] + 8 && player.y <= l[2] + 2) return l;
  }
  return null;
}
function ladderBelow(){
  // 사다리 꼭대기 발판 위에 서 있을 때 (아래로 진입)
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && Math.abs(player.y - l[1]) < 5 && player.onGround) return l;
  }
  return null;
}
function startClimb(l, fromTop){
  player.climbing = { x:l[0], y1:l[1], y2:l[2] };
  player.x = l[0];
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.jumpsUsed = 1; player.dropT = 0;
  if (fromTop) player.y = l[1] + 14;
  SFX.climb();
}
function openNpc(n){
  if (n.id === 'merchant'){
    game.uiWindow = 'shop';
  } else {
    game.uiWindow = 'dialog';
    game.dialogNpc = n;
  }
}
function startPortal(p){
  SFX.portal();
  game.fadeDir = 1; game.fade = 0;
  game.pendingMap = { to:p.to, appear:p.appear };
}
function interact(){
  const M = curMap();
  for (const n of M.npcs){
    if (Math.abs(player.x - n.x) < 50 && player.onGround && !player.groundIsPlat){ openNpc(n); return true; }
  }
  for (const p of M.portals){
    if (Math.abs(player.x - p.x) < 36 && player.y >= M.floor - 4){ startPortal(p); return true; }
  }
  const l = ladderAt();
  if (l && !player.climbing){ startClimb(l, false); return true; }
  return false;
}
function jumpPressed(){
  if (player.climbing){
    player.climbing = null;
    player.vy = -450;
    player.vx = keys.ArrowLeft ? -200 : (keys.ArrowRight ? 200 : 0);
    player.jumpsUsed = 1;
    SFX.jump();
    return;
  }
  if (keys.ArrowDown && player.onGround){
    const l = ladderBelow();
    if (l){ startClimb(l, true); return; }
    if (player.groundIsPlat){
      player.dropT = 0.22; player.vy = 160; player.onGround = false;
      return;
    }
  }
  if (player.onGround){
    player.vy = -820; player.jumpsUsed = 1; player.onGround = false; SFX.jump();
  } else if (player.jumpsUsed < 2){
    player.vy = -720; player.jumpsUsed = 2; SFX.jump();
    addEffect('djump', player.x, player.y, player.facing);
  }
}
const POTION_CD = { hp:3.5, mp:5 };
function usePotion(kind){
  if (player.potionCd[kind] > 0) return;
  if (kind === 'hp'){
    if (player.potions.hp <= 0 || player.hp >= maxHp()) return;
    player.potions.hp--;
    player.hp = Math.min(maxHp(), player.hp + 100);
    addDmgText(player.x, player.y - player.h - 10, '+100', '#66ff8a');
  } else {
    if (player.potions.mp <= 0 || player.mp >= maxMp()) return;
    player.potions.mp--;
    player.mp = Math.min(maxMp(), player.mp + 70);
    addDmgText(player.x, player.y - player.h - 10, '+70 MP', '#6ab8ff');
  }
  player.potionCd[kind] = POTION_CD[kind];
  SFX.potion();
}

// ---------- 물리 ----------
function resolveVertical(ent, prevY, isPlayer){
  const M = curMap();
  let landed = false, onPlat = false;
  if (ent.vy >= 0){
    if (prevY <= M.floor && ent.y >= M.floor){
      ent.y = M.floor; ent.vy = 0; landed = true;
    } else if (!(isPlayer && player.dropT > 0)){
      for (const p of M.plats){
        if (ent.x > p[0] - 4 && ent.x < p[0] + p[2] + 4 && prevY <= p[1] && ent.y >= p[1]){
          ent.y = p[1]; ent.vy = 0; landed = true; onPlat = true;
          if (!isPlayer) ent.plat = p;
          break;
        }
      }
    }
  }
  return { landed, onPlat };
}

// ---------- 플레이어 업데이트 ----------
function doBasicAttack(){
  const job = player.job;
  if (job === 'archer'){
    player.cdBasic = 0.42;
    player.attackAnim = 0.2;
    spawnArrow(1.0, 0);
    SFX.arrow();
  } else if (job === 'mage'){
    player.cdBasic = 0.48;
    player.attackAnim = 0.2;
    pProj.push({ kind:'orb', x:player.x + player.facing * 16, y:player.y - 28, vx:player.facing * 600, mult:1.05, dist:0, maxDist:480 });
    SFX.magic();
  } else {
    const range = job === 'warrior' ? 95 : 80;
    const multB = job === 'warrior' ? 1.1 : 1.0;
    player.cdBasic = job === 'warrior' ? 0.36 : 0.4;
    player.attackAnim = 0.2;
    player.attackAlt = 1 - player.attackAlt;
    const box = { x: player.facing > 0 ? player.x + 4 : player.x - 4 - range, y:player.y - 66, w:range, h:74 };
    let hit = false;
    for (const m of monsters){
      if (m.dead) continue;
      if (overlap(box, monsterRect(m))){ hitMonster(m, multB); hit = true; }
    }
    if (!hit) beep(180, 0.05, 'square', 0.02);
  }
}
function updatePlayer(dt){
  const M = curMap();
  player.invul = Math.max(0, player.invul - dt);
  player.cdBasic = Math.max(0, player.cdBasic - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);
  player.castAnim = Math.max(0, player.castAnim - dt);
  player.dropT = Math.max(0, player.dropT - dt);
  player.potionCd.hp = Math.max(0, player.potionCd.hp - dt);
  player.potionCd.mp = Math.max(0, player.potionCd.mp - dt);
  for (const k in player.cds) player.cds[k] = Math.max(0, player.cds[k] - dt);
  for (const k in player.buffs){
    player.buffs[k].t -= dt;
    if (player.buffs[k].t <= 0) delete player.buffs[k];
  }
  if (player.combo.t > 0){
    player.combo.t -= dt;
    if (player.combo.t <= 0) player.combo = { n:0, t:0 };
  }

  // 등반 중
  if (player.climbing){
    const c = player.climbing;
    if (keys.ArrowUp) player.y -= 155 * dt;
    if (keys.ArrowDown) player.y += 165 * dt;
    if (player.y <= c.y1){
      player.y = c.y1; player.climbing = null;
      player.onGround = true; player.groundIsPlat = (c.y1 !== M.floor); player.jumpsUsed = 0;
    } else if (player.y >= c.y2){
      player.y = c.y2; player.climbing = null;
      player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
    }
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
    return;
  }

  // 이동
  const L = keys.ArrowLeft, R = keys.ArrowRight;
  let mv = 0;
  if (L && !R) mv = -1;
  if (R && !L) mv = 1;
  if (mv !== 0){ player.facing = mv; player.walkT += dt * 9; }
  const targetVx = mv * moveSpd();
  player.vx += (targetVx - player.vx) * Math.min(1, dt * 14);

  // 기본 공격 (Z 홀드)
  if (keys.KeyZ && player.cdBasic <= 0) doBasicAttack();

  // 중력
  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  const prevY = player.y;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 18, M.w - 18);

  const res = resolveVertical(player, prevY, true);
  player.onGround = res.landed;
  player.groundIsPlat = res.onPlat;
  if (res.landed) player.jumpsUsed = 0;
  else if (player.jumpsUsed === 0 && player.vy > 0) player.jumpsUsed = 1; // 발판 낙하 = 첫 점프 소모

  // 자연 회복
  if (M.safe){
    player.hp = Math.min(maxHp(), player.hp + 25 * dt);
    player.mp = Math.min(maxMp(), player.mp + 15 * dt);
  } else {
    if (player.onGround && mv === 0) player.hp = Math.min(maxHp(), player.hp + 3.5 * dt);
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
  }
}

// ---------- 몬스터 업데이트 ----------
function updateMonster(m, dt){
  const M = curMap();
  m.animT += dt;
  if (m.dead){ m.deadT += dt; return; }
  m.hitFlash = Math.max(0, m.hitFlash - dt);
  m.stun = Math.max(0, m.stun - dt);
  m.kb *= Math.pow(0.0015, dt);

  if (m.type === 'boss'){ updateBoss(m, dt); return; }

  const dx = player.x - m.x, dy = player.y - m.y;
  if (m.T.aggro && Math.abs(dx) < 270 && Math.abs(dy) < 90 && game.state === 'play') m.chase = true;
  if (Math.abs(dx) > 500) m.chase = false;

  let dir = m.dir;
  if (m.chase) dir = dx > 0 ? 1 : -1;

  let vx = 0;
  if (m.stun <= 0){
    vx = dir * m.T.spd;
    if (!m.chase){
      if (m.x > m.homeX + 130) dir = -1;
      if (m.x < m.homeX - 130) dir = 1;
      vx = dir * m.T.spd * 0.6;
      if (m.plat){
        if (m.x < m.plat[0] + 14) dir = 1;
        if (m.x > m.plat[0] + m.plat[2] - 14) dir = -1;
        vx = dir * m.T.spd * 0.6;
      }
    }
    m.dir = dir;
  }
  m.vy += GRAV * dt;
  if (m.vy > 900) m.vy = 900;
  const prevY = m.y;
  m.x += (vx + m.kb) * dt;
  m.y += m.vy * dt;
  m.x = clamp(m.x, 20, M.w - 20);
  m.plat = null;
  resolveVertical(m, prevY, false);
}
function updateBoss(b, dt){
  const M = curMap();
  const dx = player.x - b.x;
  b.dir = dx > 0 ? 1 : -1;
  const enraged = b.hp < b.maxHp * 0.5;
  b.jumpTimer -= dt;
  b.sporeTimer -= dt;

  if (b.landed && b.jumpTimer <= 0){
    b.vy = -880;
    b.vx = clamp(dx, -420, 420) / 1.1;
    b.landed = false;
    b.jumpTimer = enraged ? 3.2 : 5;
  }
  // 포자 던지기 (착지 상태에서)
  if (b.landed && b.sporeTimer <= 0){
    b.sporeTimer = enraged ? 3.2 : 4.5;
    for (const a of [-140, 0, 140]){
      eProj.push({ x:b.x + b.dir * 40, y:b.y - b.T.h + 30, vx: clamp(dx * 0.8, -350, 350) + a, vy:-rand(380, 480), kind:'spore' });
    }
    SFX.explode();
  }
  if (b.landed && b.stun <= 0){
    b.x += b.dir * b.T.spd * dt;
  } else if (!b.landed){
    b.x += (b.vx || 0) * dt;
  }
  b.vy += GRAV * dt;
  if (b.vy > 1000) b.vy = 1000;
  const prevY = b.y;
  b.y += b.vy * dt;
  b.x = clamp(b.x, 90, M.w - 90);
  if (prevY <= M.floor && b.y >= M.floor && b.vy >= 0){
    b.y = M.floor; b.vy = 0;
    if (!b.landed){
      b.landed = true;
      game.shake = Math.max(game.shake, 0.5);
      SFX.boss();
      eProj.push({ x:b.x - 60, y:M.floor, vx:-430, vy:0, kind:'wave', life:1.5 });
      eProj.push({ x:b.x + 60, y:M.floor, vx:430, vy:0, kind:'wave', life:1.5 });
    }
  }
  if (!b.summoned1 && b.hp < b.maxHp * 0.6){
    b.summoned1 = true;
    for (const ox of [-200, 180, 280]){
      const mm = spawnMonster('shroom', clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, '부하들이여!', '#ffdd66', true);
  }
  if (!b.summoned2 && b.hp < b.maxHp * 0.3){
    b.summoned2 = true;
    for (const ox of [-240, 240]){
      const mm = spawnMonster('zshroom', clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, '일어나라, 저주받은 자들이여!', '#c77aff', true);
  }
}

// ---------- 월드 업데이트 ----------
function updateWorld(dt){
  const M = curMap();
  for (const sp of spawners){
    if (sp.respawnT > 0){
      sp.respawnT -= dt;
      if (sp.respawnT <= 0) spawnMonster(sp.t, sp.x, sp);
    }
  }
  if (game.bossRespawn > 0){
    game.bossRespawn -= dt;
    if (game.bossRespawn <= 0 && game.mapIdx === 5){
      const bx = player.x < 750 ? 1200 : 300;
      const b = spawnMonster('boss', bx, null);
      addDmgText(b.x, b.y - b.T.h - 30, '머쉬맘이 나타났다!', '#ff8a8a', true);
      SFX.boss();
    }
  }
  for (let i = monsters.length - 1; i >= 0; i--){
    updateMonster(monsters[i], dt);
    if (monsters[i].dead && monsters[i].deadT > 0.5) monsters.splice(i, 1);
  }
  // 플레이어 투사체
  for (let i = pProj.length - 1; i >= 0; i--){
    const p = pProj[i];
    p.x += p.vx * dt;
    p.dist += Math.abs(p.vx) * dt;
    let remove = p.dist > p.maxDist || p.x < 0 || p.x > M.w;
    if (!remove){
      for (const m of monsters){
        if (m.dead) continue;
        const r = monsterRect(m);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y - 24 && p.y < r.y + r.h + 6){
          if (p.kind === 'bomb') explodeAt(p.x, p.y, p.mult);
          else hitMonster(m, p.mult);
          remove = true;
          break;
        }
      }
    } else if (p.kind === 'bomb'){
      explodeAt(p.x, p.y, p.mult);
    }
    if (remove) pProj.splice(i, 1);
  }
  // 적 투사체 (포자, 충격파)
  const pr = { x:player.x - player.w / 2, y:player.y - player.h, w:player.w, h:player.h };
  for (let i = eProj.length - 1; i >= 0; i--){
    const p = eProj[i];
    if (p.kind === 'spore'){
      p.vy += 850 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (overlap({ x:p.x - 10, y:p.y - 10, w:20, h:20 }, pr)){
        hurtPlayer(30, p.x);
        eProj.splice(i, 1);
        continue;
      }
      if (p.y > M.floor){ addEffect('poof', p.x, M.floor, 1); eProj.splice(i, 1); }
    } else { // wave
      p.x += p.vx * dt;
      p.life -= dt;
      if (overlap({ x:p.x - 22, y:p.y - 30, w:44, h:30 }, pr)) hurtPlayer(28, p.x);
      if (p.life <= 0 || p.x < 0 || p.x > M.w) eProj.splice(i, 1);
    }
  }
  // 몬스터 접촉 피해 (등반 중에도)
  if (player.invul <= 0){
    for (const m of monsters){
      if (m.dead) continue;
      if (overlap(pr, monsterRect(m))){ hurtPlayer(m.T.touch, m.x); break; }
    }
  }
  // 드랍
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.vy += 1900 * dt;
    d.y += d.vy * dt;
    if (d.y > M.floor - 6){ d.y = M.floor - 6; d.vy = 0; }
    if (d.noPickT) d.noPickT -= dt;
    const dx = player.x - d.x, dy = (player.y - 24) - d.y;
    const dist = Math.hypot(dx, dy);
    if (d.t > 0.45 && dist < 60 && !(d.noPickT > 0)){
      d.x += dx * dt * 9; d.y += dy * dt * 9;
    }
    if (d.t > 0.45 && dist < 24 && !(d.noPickT > 0)){
      if (d.kind === 'meso'){
        player.meso += d.value;
        addDmgText(player.x, player.y - player.h - 12, '+' + d.value + ' 메소', '#ffd94a');
      } else if (d.kind === 'hpPot'){
        player.potions.hp = Math.min(99, player.potions.hp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'HP 물약 획득', '#ff8a8a');
      } else if (d.kind === 'mpPot'){
        player.potions.mp = Math.min(99, player.potions.mp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'MP 물약 획득', '#8ab8ff');
      } else if (d.kind === 'equip'){
        if (!addItem(d.item)){
          if (!d.notified){ notify('인벤토리가 가득 찼습니다'); d.notified = true; }
          d.noPickT = 2.5;
          continue;
        }
        const def = ITEMS[d.item.id];
        addDmgText(player.x, player.y - player.h - 12, def.name + ' 획득', RARITIES[d.item.rar].color);
      }
      SFX.pickup();
      drops.splice(i, 1);
      continue;
    }
    if (d.t > 40) drops.splice(i, 1);
  }
  // 카메라
  const target = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  camX += (target - camX) * Math.min(1, dt * 8);
  game.shake = Math.max(0, game.shake - dt);
  game.saveTimer += dt;
  if (game.saveTimer > 10){ game.saveTimer = 0; saveGame(); }
}

function updateFloaters(dt){
  for (let i = dmgTexts.length - 1; i >= 0; i--){
    const t = dmgTexts[i];
    t.y += t.vy * dt; t.vy *= Math.pow(0.3, dt); t.life -= dt; t.pop += dt;
    if (t.life <= 0) dmgTexts.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--){
    effects[i].t += dt;
    if (effects[i].t > 0.7) effects.splice(i, 1);
  }
  for (let i = game.notifs.length - 1; i >= 0; i--){
    game.notifs[i].t -= dt;
    if (game.notifs[i].t <= 0) game.notifs.splice(i, 1);
  }
}

// ---------- 메인 업데이트 ----------
function updateAll(dt){
  game.time += dt;
  if (game.fadeDir === 1){
    game.fade += dt * 3;
    if (game.fade >= 1){
      game.fade = 1; game.fadeDir = -1;
      if (game.pendingMap){ loadMap(game.pendingMap.to, game.pendingMap.appear); game.pendingMap = null; }
    }
  } else if (game.fadeDir === -1){
    game.fade -= dt * 3;
    if (game.fade <= 0){ game.fade = 0; game.fadeDir = 0; }
  }
  if (game.state === 'title') return;
  game.uiArm = Math.max(0, game.uiArm - dt);
  updateFloaters(dt);

  if (game.state === 'play' && game.fadeDir === 0 && !game.uiWindow){
    if (game.jobPromptPending && player.job === 'beginner'){
      game.uiWindow = 'job';
      game.uiArm = 0.45;   // 자동 오픈 직후 오입력 방지
      return;
    }
    updatePlayer(dt);
    if (game.state === 'play') updateWorld(dt);
  } else if (game.state === 'dead'){
    game.deadTimer += dt;
    if (game.deadTimer > 2.6){
      player.exp = Math.max(0, Math.floor(player.exp - expNeed() * 0.05));
      player.hp = maxHp(); player.mp = maxMp();
      game.state = 'play';
      loadMap(game.mapIdx, 'left');
    }
  }
}

<script>
'use strict';
// ============================================================
// 렌더링: 배경, 지형, 캐릭터(직업별), 몬스터, 이펙트, HUD, 오버레이
// 전역 제공: canvas, ctx, rr, draw
// (UI 창은 main.js에서 그림)
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- 배경 ----------
function drawBG(){
  const th = curMap().theme;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky1); g.addColorStop(1, th.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 구름
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 6; i++){
    const cx = ((i * 420 + game.time * 12) % (W + 300)) - 150;
    const cy = 60 + (i % 3) * 55;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 55, 18, 0, 0, 7);
    ctx.ellipse(cx + 35, cy - 10, 38, 15, 0, 0, 7);
    ctx.ellipse(cx - 38, cy - 6, 32, 13, 0, 0, 7);
    ctx.fill();
  }
  // 원경 언덕
  ctx.fillStyle = th.hill;
  ctx.globalAlpha = 0.45;
  for (let i = -2; i < 9; i++){
    const hx = i * 380 - (camX * 0.3) % 760;
    ctx.beginPath();
    ctx.ellipse(hx, FLOOR_Y + 20, 260, 150 + (((i % 2) + 2) % 2) * 60, 0, Math.PI, 0);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- 장식물 ----------
function drawDecor(d, floor){
  const sx = d.x - camX;
  if (sx < -260 || sx > W + 260) return;
  ctx.save();
  ctx.translate(sx, floor);
  if (d.k === 'tree'){
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(-10, -95, 20, 95);
    ctx.fillStyle = '#4f9440';
    ctx.beginPath(); ctx.arc(0, -120, 45, 0, 7); ctx.arc(-30, -95, 32, 0, 7); ctx.arc(30, -95, 32, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8762a';
    ctx.beginPath(); ctx.arc(-14, -112, 6, 0, 7); ctx.arc(20, -100, 5, 0, 7); ctx.fill();
  } else if (d.k === 'deadtree'){
    ctx.strokeStyle = '#3a3028'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-6, -100); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-5, -70); ctx.lineTo(-42, -105); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, -95); ctx.lineTo(28, -130); ctx.stroke();
    ctx.lineCap = 'butt';
  } else if (d.k === 'rock'){
    ctx.fillStyle = '#8a8a92';
    ctx.beginPath(); ctx.ellipse(0, -14, 30, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#a0a0a8';
    ctx.beginPath(); ctx.ellipse(-8, -20, 14, 9, -0.3, 0, 7); ctx.fill();
  } else if (d.k === 'mushtree'){
    ctx.fillStyle = '#c9b89a';
    ctx.fillRect(-12, -85, 24, 85);
    ctx.fillStyle = '#b8506a';
    ctx.beginPath(); ctx.ellipse(0, -88, 56, 34, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,0.8)';
    ctx.beginPath(); ctx.arc(-24, -102, 7, 0, 7); ctx.arc(14, -110, 9, 0, 7); ctx.fill();
  } else if (d.k === 'house'){
    ctx.fillStyle = '#c9a25a';
    ctx.fillRect(-65, -85, 130, 85);
    ctx.fillStyle = '#a3452a';
    ctx.beginPath(); ctx.moveTo(-80, -85); ctx.lineTo(80, -85); ctx.lineTo(0, -145); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    ctx.fillRect(-18, -50, 36, 50);
    ctx.fillStyle = '#8ecff0';
    ctx.fillRect(28, -70, 24, 22);
    ctx.fillRect(-52, -70, 24, 22);
  } else if (d.k === 'sign'){
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(-4, -46, 8, 46);
    ctx.fillStyle = '#a3763f';
    rr(-34, -66, 68, 26, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('사냥터 →', 0, -48);
  }
  ctx.restore();
}

// ---------- 지형 ----------
function drawTerrain(){
  const M = curMap(), th = M.theme;
  for (const d of M.decor) drawDecor(d, M.floor);
  // 지면
  ctx.fillStyle = th.ground;
  ctx.fillRect(-camX, M.floor, M.w, H - M.floor);
  ctx.fillStyle = th.grass;
  ctx.fillRect(-camX, M.floor, M.w, 14);
  for (let x = 0; x < M.w; x += 26){
    const sx = x - camX;
    if (sx < -30 || sx > W + 30) continue;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.lineTo(sx + 8, M.floor - 8);
    ctx.lineTo(sx + 16, M.floor);
    ctx.fill();
  }
  // 플랫폼
  for (const p of M.plats){
    const sx = p[0] - camX;
    if (sx + p[2] < -20 || sx > W + 20) continue;
    ctx.fillStyle = '#7a5230';
    rr(sx, p[1], p[2], 16, 6); ctx.fill();
    ctx.fillStyle = th.grass;
    rr(sx, p[1] - 3, p[2], 8, 4); ctx.fill();
  }
  // 사다리 (로프)
  for (const l of M.ladders){
    const sx = l[0] - camX;
    if (sx < -30 || sx > W + 30) continue;
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(sx, l[1]); ctx.lineTo(sx, l[2]); ctx.stroke();
    ctx.fillStyle = '#6b4a2c';
    for (let y = l[1] + 10; y < l[2] - 4; y += 18){
      rr(sx - 9, y, 18, 5, 2); ctx.fill();
    }
  }
  // 포탈
  for (const p of M.portals){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    const pulse = Math.sin(game.time * 4) * 4;
    ctx.save();
    ctx.translate(sx, M.floor - 46);
    ctx.fillStyle = 'rgba(70,120,255,0.25)';
    ctx.beginPath(); ctx.ellipse(0, 0, 30 + pulse, 46, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6a9dff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 24 + pulse * 0.6, 40, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#aecdff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 28, Math.sin(game.time * 3) * 0.4, 0, 7); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('↑ ' + MAPS[p.to].name + (p.to === 5 ? ' (권장 Lv13+)' : ''), sx, M.floor - 102);
  }
  // NPC
  for (const n of M.npcs) drawNpc(n, M.floor);
}
function drawNpc(n, floor){
  const sx = n.x - camX;
  if (sx < -70 || sx > W + 70) return;
  const bob = Math.sin(game.time * 2) * 2;
  ctx.save();
  ctx.translate(sx, floor);
  if (n.id === 'chief'){
    ctx.fillStyle = '#4a6e3a';
    rr(-15, -42 + bob, 30, 42 - bob, 8); ctx.fill();
    ctx.fillStyle = '#ffd9b0';
    ctx.beginPath(); ctx.arc(0, -52 + bob, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8e8e8';   // 흰 수염
    ctx.beginPath(); ctx.ellipse(0, -44 + bob, 9, 7, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#8a6a3a';   // 밀짚모자
    ctx.beginPath(); ctx.ellipse(0, -60 + bob, 18, 6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -63 + bob, 10, 7, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.fillRect(-5, -55 + bob, 3, 3); ctx.fillRect(3, -55 + bob, 3, 3);
  } else {
    ctx.fillStyle = '#7a4a9e';
    rr(-14, -40 + bob, 28, 40 - bob, 8); ctx.fill();
    ctx.fillStyle = '#ffd9b0';
    ctx.beginPath(); ctx.arc(0, -50 + bob, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a2a6e';
    ctx.beginPath(); ctx.moveTo(-16, -54 + bob); ctx.lineTo(16, -54 + bob); ctx.lineTo(0, -78 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.fillRect(-5, -52 + bob, 3, 3); ctx.fillRect(2, -52 + bob, 3, 3);
  }
  ctx.restore();
  // 이름표 + 퀘스트 마커
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  const label = n.id === 'chief' ? '촌장 (↑)' : '상인 (↑)';
  rr(sx - 34, floor - 100, 68, 20, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, sx, floor - 86);
  if (n.id === 'chief'){
    const cs = chainState();
    let mark = null, color = '#ffd94a';
    if (cs.status === 'avail') mark = '!';
    else if (cs.status === 'complete') mark = '?';
    else if (cs.status === 'active'){ mark = '?'; color = '#b0b0b0'; }
    else if (cs.status === 'locked' && player.job === 'beginner' && player.level >= 8) mark = '!';
    if (mark){
      const my = floor - 116 + Math.sin(game.time * 3) * 3;
      ctx.font = 'bold 26px sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(60,30,0,0.8)';
      ctx.strokeText(mark, sx, my);
      ctx.fillStyle = color;
      ctx.fillText(mark, sx, my);
    }
  }
}

// ---------- 드랍 ----------
function drawDrops(){
  for (const d of drops){
    const sx = d.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const bob = d.vy === 0 ? Math.sin(game.time * 5 + d.x) * 3 : 0;
    if (d.kind === 'meso'){
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.arc(sx, d.y - 8 + bob, 8, 0, 7); ctx.fill();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx, d.y - 8 + bob, 5, 0, 7); ctx.stroke();
    } else if (d.kind === 'equip'){
      const def = ITEMS[d.item.id];
      const col = RARITIES[d.item.rar].color;
      ctx.save();
      ctx.translate(sx, d.y - 12 + bob);
      ctx.rotate(Math.sin(game.time * 2 + d.x) * 0.2);
      if (def.slot === 'weapon'){
        ctx.fillStyle = '#c8ccd8';
        rr(-3, -14, 6, 24, 2); ctx.fill();
        ctx.fillStyle = '#8a6a3a';
        rr(-6, 8, 12, 5, 2); ctx.fill();
      } else {
        ctx.fillStyle = '#9a8a7a';
        rr(-10, -8, 20, 16, 5); ctx.fill();
      }
      ctx.restore();
      // 등급 반짝임
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5 + Math.sin(game.time * 6) * 0.3;
      ctx.beginPath(); ctx.arc(sx, d.y - 12 + bob, 16, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = d.kind === 'hpPot' ? '#e84545' : '#4576e8';
      rr(sx - 6, d.y - 16 + bob, 12, 14, 5); ctx.fill();
      ctx.fillStyle = '#c9a25a';
      ctx.fillRect(sx - 3, d.y - 20 + bob, 6, 5);
    }
  }
}

// ---------- 몬스터 ----------
function drawMonster(m){
  const sx = m.x - camX;
  if (sx < -220 || sx > W + 220) return;
  const t = m.animT;
  ctx.save();
  ctx.translate(sx, m.y);
  if (m.dead){
    ctx.globalAlpha = Math.max(0, 1 - m.deadT * 2);
    ctx.scale(1 + m.deadT, Math.max(0.05, 1 - m.deadT * 1.4));
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, m.T.w * 0.45, 6, 0, 0, 7); ctx.fill();

  const flash = m.hitFlash > 0;
  if (m.type === 'snail'){
    ctx.fillStyle = flash ? '#fff' : '#e8d9b8';
    ctx.beginPath(); ctx.ellipse(m.dir * 4, -7, 15, 7, 0, 0, 7); ctx.fill();
    // 껍질
    ctx.fillStyle = flash ? '#eee' : '#4576c8';
    ctx.beginPath(); ctx.arc(-m.dir * 5, -14, 11, 0, 7); ctx.fill();
    ctx.strokeStyle = flash ? '#ccc' : '#2a4e9e'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(-m.dir * 5, -14, 6, 0, 4.5); ctx.stroke();
    // 더듬이 + 눈
    ctx.strokeStyle = '#c9b89a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(m.dir * 12, -12); ctx.lineTo(m.dir * 16, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(m.dir * 8, -12); ctx.lineTo(m.dir * 10, -22); ctx.stroke();
    ctx.fillStyle = '#233';
    ctx.beginPath(); ctx.arc(m.dir * 16, -23, 2, 0, 7); ctx.arc(m.dir * 10, -23, 2, 0, 7); ctx.fill();
  } else if (m.type === 'slime'){
    const sq = 1 + Math.sin(t * 6) * 0.08;
    ctx.fillStyle = flash ? '#fff' : '#5abf4a';
    ctx.beginPath(); ctx.ellipse(0, -13 * sq, 18 / sq * 1.05, 13 * sq, 0, 0, 7); ctx.fill();
    ctx.fillStyle = flash ? '#ddd' : '#7fd96e';
    ctx.beginPath(); ctx.ellipse(-4, -17 * sq, 7, 5, -0.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#233';
    ctx.beginPath(); ctx.arc(m.dir * 5 - 3, -14, 2.2, 0, 7); ctx.arc(m.dir * 5 + 5, -14, 2.2, 0, 7); ctx.fill();
  } else if (m.type === 'shroom'){
    const hop = Math.abs(Math.sin(t * 7)) * 4;
    ctx.translate(0, -hop);
    ctx.fillStyle = flash ? '#fff' : '#f0d9b8';
    rr(-10, -26, 20, 26, 6); ctx.fill();
    ctx.fillStyle = flash ? '#eee' : '#e8762a';
    ctx.beginPath(); ctx.ellipse(0, -28, 21, 15, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-8, -34, 3.4, 0, 7); ctx.arc(7, -31, 2.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#412';
    ctx.beginPath(); ctx.arc(m.dir * 3 - 4, -18, 2, 0, 7); ctx.arc(m.dir * 3 + 4, -18, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#412'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(3, -12); ctx.stroke();
  } else if (m.type === 'pig'){
    const trot = Math.sin(t * 10) * 3;
    ctx.fillStyle = flash ? '#fff' : '#f2a0b8';
    rr(-22, -30, 44, 28, 12); ctx.fill();
    ctx.fillStyle = flash ? '#eee' : '#d9899e';
    ctx.fillRect(-16, -6 + trot * 0.4, 7, 6);
    ctx.fillRect(9, -6 - trot * 0.4, 7, 6);
    const fx = m.dir * 14;
    ctx.fillStyle = flash ? '#fff' : '#f7b8ca';
    ctx.beginPath(); ctx.arc(fx, -24, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#e87f9c';
    ctx.beginPath(); ctx.ellipse(fx + m.dir * 8, -22, 5, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#a34';
    ctx.beginPath(); ctx.arc(fx + m.dir * 6, -23, 1.2, 0, 7); ctx.arc(fx + m.dir * 10, -23, 1.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(fx - m.dir * 2, -28, 2, 0, 7); ctx.fill();
    ctx.fillStyle = '#e87f9c';
    ctx.beginPath(); ctx.moveTo(fx - 6, -34); ctx.lineTo(fx - 1, -42); ctx.lineTo(fx + 3, -33); ctx.closePath(); ctx.fill();
  } else if (m.type === 'stump'){
    const sway = Math.sin(t * 2) * 0.02;
    ctx.rotate(sway);
    ctx.fillStyle = flash ? '#fff' : '#8a6a44';
    rr(-24, -44, 48, 44, 6); ctx.fill();
    ctx.fillStyle = flash ? '#eee' : '#a3835a';
    ctx.beginPath(); ctx.ellipse(0, -44, 24, 8, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#6b4a2c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -44, 15, 5, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -44, 8, 2.6, 0, 0, 7); ctx.stroke();
    // 뿌리 발
    ctx.fillStyle = flash ? '#eee' : '#6b4a2c';
    ctx.fillRect(-26, -6, 12, 6); ctx.fillRect(14, -6, 12, 6);
    // 얼굴
    ctx.fillStyle = '#332417';
    ctx.beginPath(); ctx.arc(m.dir * 4 - 8, -30, 3, 0, 7); ctx.arc(m.dir * 4 + 8, -30, 3, 0, 7); ctx.fill();
    ctx.strokeStyle = '#332417'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(m.dir * 3, -20, 6, 0.2, Math.PI - 0.2); ctx.stroke();
  } else if (m.type === 'zshroom'){
    const wob = Math.sin(t * 5) * 0.06;
    ctx.rotate(wob);
    ctx.fillStyle = flash ? '#fff' : '#c9c9b0';
    rr(-10, -28, 20, 28, 6); ctx.fill();
    // 처진 보라 갓
    ctx.fillStyle = flash ? '#eee' : '#7a4a9e';
    ctx.beginPath();
    ctx.ellipse(0, -30, 22, 16, 0, Math.PI, 0);
    ctx.fill();
    ctx.beginPath(); ctx.moveTo(-22, -30); ctx.quadraticCurveTo(-24, -18, -18, -16); ctx.lineTo(-16, -28); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22, -30); ctx.quadraticCurveTo(24, -18, 18, -16); ctx.lineTo(16, -28); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(200,255,180,0.6)';
    ctx.beginPath(); ctx.arc(-8, -38, 3, 0, 7); ctx.arc(9, -34, 2.4, 0, 7); ctx.fill();
    // X자 눈
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 2;
    const ex = m.dir * 3;
    ctx.beginPath();
    ctx.moveTo(ex - 7, -22); ctx.lineTo(ex - 1, -16); ctx.moveTo(ex - 1, -22); ctx.lineTo(ex - 7, -16);
    ctx.moveTo(ex + 1, -22); ctx.lineTo(ex + 7, -16); ctx.moveTo(ex + 7, -22); ctx.lineTo(ex + 1, -16);
    ctx.stroke();
  } else if (m.type === 'boss'){
    const hop = m.landed ? Math.abs(Math.sin(t * 3)) * 5 : 0;
    ctx.translate(0, -hop);
    ctx.fillStyle = flash ? '#fff' : '#f0d9b8';
    rr(-42, -86, 84, 86, 18); ctx.fill();
    ctx.fillStyle = flash ? '#eee' : '#b8302e';
    ctx.beginPath(); ctx.ellipse(0, -90, 78, 52, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,0.85)';
    ctx.beginPath();
    ctx.arc(-38, -112, 10, 0, 7); ctx.arc(10, -122, 12, 0, 7); ctx.arc(48, -104, 8, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#ffd94a';
    ctx.beginPath();
    ctx.moveTo(-18, -134); ctx.lineTo(-18, -154); ctx.lineTo(-8, -142);
    ctx.lineTo(0, -158); ctx.lineTo(8, -142); ctx.lineTo(18, -154); ctx.lineTo(18, -134);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#412';
    ctx.beginPath(); ctx.arc(m.dir * 6 - 14, -52, 5, 0, 7); ctx.arc(m.dir * 6 + 14, -52, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#412'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(m.dir * 4, -36, 9, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.dir * 6 - 22, -62); ctx.lineTo(m.dir * 6 - 7, -57);
    ctx.moveTo(m.dir * 6 + 22, -62); ctx.lineTo(m.dir * 6 + 7, -57);
    ctx.stroke();
  }
  ctx.restore();
  if (!m.dead && m.type !== 'boss' && m.hp < m.maxHp){
    const bw = 36;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx - bw / 2, m.y - m.T.h - 12, bw, 5);
    ctx.fillStyle = '#4ade4a';
    ctx.fillRect(sx - bw / 2, m.y - m.T.h - 12, bw * Math.max(0, m.hp / m.maxHp), 5);
  }
}

// ---------- 플레이어 ----------
function drawPlayer(){
  const sx = player.x - camX;
  const blink = player.invul > 0 && Math.floor(game.time * 14) % 2 === 0;
  if (blink && game.state === 'play') return;
  ctx.save();
  ctx.translate(sx, player.y);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 15, 5, 0, 0, 7); ctx.fill();
  ctx.scale(player.facing, 1);

  const climbing = !!player.climbing;
  const moving = Math.abs(player.vx) > 30 && player.onGround;
  const leg = moving ? Math.sin(player.walkT) * 6 : 0;
  const air = !player.onGround && !climbing;
  const job = player.job;
  const tunic = { beginner:'#3a6ecc', warrior:'#c04a3a', archer:'#3a8a4a', mage:'#6a4ac0' }[job];
  const tunicDark = { beginner:'#2a4e9e', warrior:'#8a3428', archer:'#2a6236', mage:'#4a3390' }[job];

  // 다리
  ctx.fillStyle = '#3a2e6e';
  rr(-9 + (air ? -2 : leg * 0.5), -14, 8, 14, 3); ctx.fill();
  rr(2 + (air ? 2 : -leg * 0.5), -14, 8, 14, 3); ctx.fill();
  ctx.fillStyle = '#7a4a2a';
  rr(-10 + (air ? -2 : leg * 0.5), -5, 10, 5, 2); ctx.fill();
  rr(1 + (air ? 2 : -leg * 0.5), -5, 10, 5, 2); ctx.fill();
  // 몸통
  ctx.fillStyle = tunic;
  rr(-11, -34, 22, 22, 6); ctx.fill();
  ctx.fillStyle = tunicDark;
  ctx.fillRect(-11, -20, 22, 4);

  const atk = player.attackAnim > 0;
  const cast = player.castAnim > 0;

  if (climbing){
    // 등반 자세: 양팔 위로
    ctx.fillStyle = '#ffd9b0';
    const ph = Math.sin(game.time * 8) * 4;
    rr(-14, -48 + ph, 6, 16, 3); ctx.fill();
    rr(8, -48 - ph, 6, 16, 3); ctx.fill();
  } else if (job === 'archer'){
    // 활
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    ctx.save();
    ctx.translate(10, -28);
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, 16, -1.2, 1.2); ctx.stroke();
    ctx.strokeStyle = '#e8e8d8'; ctx.lineWidth = 1.5;
    const pull = atk ? (1 - prog) * 8 : 0;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.2) * 16, Math.sin(-1.2) * 16);
    ctx.lineTo(-4 - pull, 0);
    ctx.lineTo(Math.cos(1.2) * 16, Math.sin(1.2) * 16);
    ctx.stroke();
    if (atk && prog < 0.5){
      ctx.strokeStyle = '#c8ccd8'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-4 - pull, 0); ctx.lineTo(14, 0); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#ffd9b0';
    rr(0, -31, 12, 7, 3); ctx.fill();
  } else if (job === 'mage'){
    // 지팡이
    ctx.save();
    ctx.translate(9, -28);
    ctx.rotate(cast ? -0.5 : 0.25);
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -22); ctx.stroke();
    const glow = cast || atk;
    ctx.fillStyle = glow ? '#aef' : '#6a9dff';
    ctx.beginPath(); ctx.arc(0, -26, glow ? 7 : 5, 0, 7); ctx.fill();
    if (glow){
      ctx.strokeStyle = 'rgba(170,220,255,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, -26, 11, 0, 7); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#ffd9b0';
    rr(0, -31, 12, 7, 3); ctx.fill();
  } else {
    // 검 (전사/초보자)
    const prog = (cast ? 1 - player.castAnim / 0.25 : (atk ? 1 - player.attackAnim / 0.2 : 1));
    const ang = (atk || cast) ? (-1.9 + prog * 2.6) : 0.7;
    ctx.save();
    ctx.translate(8, -28);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffd9b0';
    rr(-2, -3, 12, 7, 3); ctx.fill();
    const blade = job === 'warrior' ? 36 : 30;
    ctx.fillStyle = '#c8ccd8';
    rr(10, -3.4, blade, 6.8, 3); ctx.fill();
    ctx.fillStyle = '#e8ecf8';
    rr(10, -3.4, blade, 2.6, 1); ctx.fill();
    ctx.fillStyle = '#8a6a3a';
    rr(6, -5, 5, 10, 2); ctx.fill();
    ctx.restore();
  }
  // 뒷팔
  if (!climbing){
    ctx.fillStyle = '#ffd9b0';
    rr(-13, -31, 6, 12, 3); ctx.fill();
  }
  // 머리
  ctx.fillStyle = '#ffd9b0';
  ctx.beginPath(); ctx.arc(0, -45, 12, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3a1e';
  ctx.beginPath(); ctx.arc(0, -48, 12, Math.PI * 0.95, Math.PI * 2.05); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-8, -50, 6, 9, 0.4, 0, 7); ctx.fill();
  // 모자 (장비) 또는 머리띠
  if (player.equip.hat){
    const tier = ITEMS[player.equip.hat.id].tier;
    if (tier === 1){
      ctx.fillStyle = '#8a6a3a';
      ctx.beginPath(); ctx.ellipse(0, -53, 13, 5, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(-13, -53, 26, 3);
    } else {
      ctx.fillStyle = tier === 2 ? '#9aa0b0' : '#d4b04a';
      ctx.beginPath(); ctx.arc(0, -50, 12.5, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
      ctx.fillRect(-13, -51, 26, 4);
      if (tier === 3){
        ctx.fillStyle = '#e04a4a';
        ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(4, -70); ctx.lineTo(-4, -70); ctx.closePath(); ctx.fill();
      }
    }
  } else {
    ctx.fillStyle = '#cc3a3a';
    ctx.fillRect(-12, -52, 24, 4);
  }
  // 눈
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(4, -44, 2, 0, 7); ctx.arc(9, -44, 2, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- 투사체 ----------
function drawProjectiles(){
  for (const p of pProj){
    const sx = p.x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const dir = Math.sign(p.vx);
    if (p.kind === 'arrow'){
      ctx.strokeStyle = '#c8b89a'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(sx - dir * 14, p.y); ctx.lineTo(sx + dir * 8, p.y); ctx.stroke();
      ctx.fillStyle = '#c8ccd8';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 14, p.y); ctx.lineTo(sx + dir * 5, p.y - 4); ctx.lineTo(sx + dir * 5, p.y + 4);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'orb'){
      ctx.fillStyle = 'rgba(120,170,255,0.4)';
      ctx.beginPath(); ctx.arc(sx - dir * 10, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#8ab8ff';
      ctx.beginPath(); ctx.arc(sx, p.y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#d8e8ff';
      ctx.beginPath(); ctx.arc(sx + dir * 2, p.y - 2, 3.5, 0, 7); ctx.fill();
    } else { // bomb
      ctx.fillStyle = '#e8a03a';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,180,80,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx - dir * 10, p.y, 5, 0, 7); ctx.stroke();
    }
  }
  for (const p of eProj){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    if (p.kind === 'spore'){
      ctx.fillStyle = '#b86ad4';
      ctx.beginPath(); ctx.arc(sx, p.y, 9, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,240,0.7)';
      ctx.beginPath(); ctx.arc(sx - 2, p.y - 3, 3, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(180,90,220,0.7)';
      for (let i = 0; i < 3; i++){
        const h = 26 - i * 7;
        ctx.beginPath();
        ctx.ellipse(sx - Math.sign(p.vx) * i * 14, p.y - h / 2, 12 - i * 3, h / 2, 0, 0, 7);
        ctx.fill();
      }
    }
  }
}

// ---------- 이펙트 ----------
function drawEffects(){
  for (const e of effects){
    const sx = e.x - camX;
    if (e.kind === 'slash'){
      const pr = e.t / 0.35;
      if (pr > 1) continue;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.scale(e.dir, 1);
      ctx.strokeStyle = 'rgba(120,200,255,' + (1 - pr) + ')';
      ctx.lineWidth = 7 - pr * 4;
      ctx.beginPath(); ctx.arc(0, 0, 55 + pr * 45, -1.1, 1.1); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - pr) * 0.8 + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 45 + pr * 40, -0.9, 0.9); ctx.stroke();
      ctx.restore();
    } else if (e.kind === 'hitstar'){
      const pr = e.t / 0.25;
      if (pr > 1) continue;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(pr * 1.5);
      ctx.fillStyle = 'rgba(255,240,150,' + (1 - pr) + ')';
      const r1 = 4 + pr * 10, r2 = r1 * 0.4;
      ctx.beginPath();
      for (let i = 0; i < 8; i++){
        const a = i * Math.PI / 4;
        const r = i % 2 === 0 ? r1 : r2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    } else if (e.kind === 'explosion'){
      const pr = e.t / 0.45;
      if (pr > 1) continue;
      ctx.fillStyle = 'rgba(255,150,60,' + (1 - pr) * 0.7 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y, 20 + pr * 100, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,120,' + (1 - pr) + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(sx, e.y, 30 + pr * 100, 0, 7); ctx.stroke();
    } else if (e.kind === 'lightning'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      ctx.strokeStyle = 'rgba(255,255,150,' + (1 - pr) + ')';
      ctx.lineWidth = 4 - pr * 2;
      ctx.beginPath();
      let ly = e.y - 180, lx = sx;
      ctx.moveTo(lx, ly);
      while (ly < e.y){
        ly += 30;
        lx = sx + rand(-14, 14);
        ctx.lineTo(lx, Math.min(ly, e.y));
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,200,' + (1 - pr) * 0.8 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y, 14 * (1 - pr), 0, 7); ctx.fill();
    } else if (e.kind === 'claw'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.strokeStyle = 'rgba(200,120,255,' + (1 - pr) + ')';
      ctx.lineWidth = 4;
      for (const off of [-12, 0, 12]){
        ctx.beginPath();
        ctx.moveTo(-24 * e.dir + off * 0.4, off - 24 + pr * 12);
        ctx.lineTo(24 * e.dir + off * 0.4, off + 12 + pr * 12);
        ctx.stroke();
      }
      ctx.restore();
    } else if (e.kind === 'levelup'){
      const pr = e.t / 0.7;
      ctx.strokeStyle = 'rgba(255,220,80,' + Math.max(0, 1 - pr) + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(sx, e.y - 25, 20 + pr * 80, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,240,150,' + Math.max(0, 1 - pr) + ')';
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('LEVEL UP!', sx, e.y - 95 - pr * 30);
    } else if (e.kind === 'jobadv'){
      const pr = e.t / 0.7;
      ctx.fillStyle = 'rgba(255,240,150,' + Math.max(0, (1 - pr)) * 0.5 + ')';
      ctx.fillRect(sx - 40, e.y - 220, 80, 220);
      ctx.strokeStyle = 'rgba(255,220,80,' + Math.max(0, 1 - pr) + ')';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(sx, e.y - 30, 30 + pr * 90, 0, 7); ctx.stroke();
    } else if (e.kind === 'buff'){
      const pr = e.t / 0.5;
      if (pr > 1) continue;
      ctx.strokeStyle = 'rgba(150,255,180,' + (1 - pr) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sx, e.y - 24, 22 + pr * 20, 34 + pr * 14, 0, 0, 7); ctx.stroke();
    } else if (e.kind === 'djump'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - pr) * 0.7 + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sx, e.y, 18 + pr * 14, 6, 0, 0, 7); ctx.stroke();
    } else if (e.kind === 'poof'){
      const pr = e.t / 0.35;
      if (pr > 1) continue;
      ctx.fillStyle = 'rgba(184,106,212,' + (1 - pr) * 0.5 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y - 6, 6 + pr * 16, 0, 7); ctx.fill();
    }
  }
}

// ---------- 데미지 텍스트 ----------
function drawDmgTexts(){
  ctx.textAlign = 'center';
  for (const t of dmgTexts){
    const sx = t.x - camX;
    const a = Math.max(0, Math.min(1, t.life / 0.4));
    const pop = t.pop < 0.12 ? 1 + (0.12 - t.pop) * 4 : 1;
    const size = (t.big ? 26 : 19) * pop;
    ctx.font = 'bold ' + size.toFixed(0) + 'px sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(40,20,0,' + a * 0.9 + ')';
    ctx.strokeText(t.txt, sx, t.y);
    ctx.globalAlpha = a;
    ctx.fillStyle = t.color;
    ctx.fillText(t.txt, sx, t.y);
    ctx.globalAlpha = 1;
  }
}

// ---------- HUD ----------
function drawBar(x, y, w, h, ratio, c1, c2, label){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rr(x, y, w, h, h / 2); ctx.fill();
  if (ratio > 0.005){
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    rr(x + 2, y + 2, Math.max(4, (w - 4) * Math.min(1, ratio)), h - 4, (h - 4) / 2); ctx.fill();
  }
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h - 5);
}
function drawHUD(){
  const M = curMap();
  // 맵 이름 + 목표
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(12, 12, 260, 30, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(M.name, 24, 33);
  const cs = chainState();
  let goal = '';
  if (cs.status === 'alldone') goal = game.cleared ? '모든 퀘스트 완료! 자유 사냥' : '머쉬맘을 처치하라';
  else if (cs.status === 'avail') goal = '촌장에게서 퀘스트를 받으세요';
  else if (cs.status === 'locked') goal = '다음 퀘스트: Lv' + cs.q.minLv + ' 달성';
  else if (cs.status === 'active'){
    const qs = player.quests[cs.q.id];
    goal = cs.q.name + ': ' + MTYPES[cs.q.need.t].name + ' ' + qs.c + '/' + cs.q.need.n;
  }
  else if (cs.status === 'complete') goal = cs.q.name + ' 완료! 촌장에게 보고';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '12px sans-serif';
  ctx.fillText(goal, 24, 58);
  // 미니맵
  const mmW = 190, mmH = 44, mmX = W - mmW - 14, mmY = 12;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(mmX - 4, mmY - 4, mmW + 8, mmH + 8, 8); ctx.fill();
  ctx.fillStyle = 'rgba(120,160,200,0.25)';
  ctx.fillRect(mmX, mmY, mmW, mmH);
  const mscale = mmW / M.w;
  ctx.fillStyle = '#6a9dff';
  for (const p of M.portals) ctx.fillRect(mmX + p.x * mscale - 2, mmY + mmH - 10, 4, 8);
  ctx.fillStyle = '#5ac25a';
  for (const n of M.npcs) ctx.fillRect(mmX + n.x * mscale - 2, mmY + mmH - 10, 4, 8);
  ctx.fillStyle = '#ff6a6a';
  for (const m of monsters){
    if (m.dead) continue;
    ctx.fillRect(mmX + m.x * mscale - 1.5, mmY + mmH - 9 - (M.floor - m.y) * 0.06, 3, 6);
  }
  ctx.fillStyle = '#ffe24a';
  ctx.fillRect(mmX + player.x * mscale - 2.5, mmY + mmH - 11 - (M.floor - player.y) * 0.06, 5, 9);
  // 버프 아이콘
  let bx = W - 14 - 30;
  for (const id in player.buffs){
    const b = player.buffs[id];
    const names = { rage:'분', focus:'집', shield:'막' };
    const cols = { rage:'#e05a4a', focus:'#5ac25a', shield:'#6a8ae0' };
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rr(bx, 68, 30, 38, 6); ctx.fill();
    ctx.fillStyle = cols[id] || '#888';
    rr(bx + 3, 71, 24, 24, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(names[id] || '?', bx + 15, 88);
    ctx.font = '10px sans-serif';
    ctx.fillText(Math.ceil(b.t) + 's', bx + 15, 103);
    bx -= 36;
  }
  // 메소
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(W - 190, mmY + mmH + 14, 176, 28, 8); ctx.fill();
  ctx.fillStyle = '#f5c542';
  ctx.beginPath(); ctx.arc(W - 172, mmY + mmH + 28, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W - 172, mmY + mmH + 28, 5, 0, 7); ctx.stroke();
  ctx.fillStyle = '#ffe28a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(player.meso.toLocaleString() + ' 메소', W - 158, mmY + mmH + 33);
  // 콤보
  if (player.combo.n >= 3){
    ctx.textAlign = 'right';
    ctx.font = 'bold 30px sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,20,0,0.8)';
    ctx.strokeText(player.combo.n + ' COMBO', W - 30, 200);
    ctx.fillStyle = '#ffb642';
    ctx.fillText(player.combo.n + ' COMBO', W - 30, 200);
  }
  // 알림

  if (game.hasSave){
    ctx.fillStyle = '#fff';

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(W / 2 - 300, 396, 600, 168, 12); ctx.fill();

  ctx.fillText('조작법', W / 2, 421);
  ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fillText('이동 ← →  |  점프 Space (2단)  |  아래점프 ↓+Space  |  로프 ↑/↓', W / 2, 446);
  ctx.fillText('공격 Z (꾹)  |  스킬 X C V  |  물약 1 2  |  포탈·NPC 대화 ↑', W / 2, 468);
  ctx.fillText('인벤토리 E  |  스킬창 K  |  스탯 S  |  퀘스트 L  |  소리 M  |  정지 P', W / 2, 490);

// ---------- 늪 안개 ----------
function drawFog(){
  if (curMap().bgm !== 'swamp') return;
  ctx.fillStyle = 'rgba(150,170,160,0.13)';
  for (let i = 0; i < 3; i++){
    const fy = 300 + i * 90 + Math.sin(game.time * 0.5 + i * 2) * 20;

    ctx.ellipse((game.time * (14 + i * 6)) % (W + 600) - 300, fy, 320, 42, 0, 0, 7);

// ---------- 메인 draw ----------
function draw(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (game.state === 'title'){ drawTitle(); return; }
  if (game.shake > 0){
    ctx.translate(rand(-1, 1) * game.shake * 14, rand(-1, 1) * game.shake * 10);
  }
  drawBG();
  drawTerrain();
  drawDrops();
  for (const m of monsters) drawMonster(m);
  drawPlayer();
  drawProjectiles();
  drawEffects();
  drawFog();
  drawDmgTexts();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawHUD();
  drawOverlays();
}

<script>
'use strict';
// ============================================================
// 입력(키보드+마우스), 창 UI(인벤/스킬/스탯/퀘스트/상점/대화/전직), 메인 루프
// ============================================================
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 마우스 ----------
let mouseX = -1, mouseY = -1;
let pendingClick = null;
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', e => {
  audioUnlock();
  const p = canvasPos(e);
  pendingClick = p;
});

// 즉시 모드 버튼: 그리고, 클릭됐으면 true
function btn(x, y, w, h, label, opts){
  opts = opts || {};
  const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  const enabled = opts.enabled !== false;
  ctx.fillStyle = enabled ? (hover ? (opts.hoverColor || '#5a6ea8') : (opts.color || '#3a4a7a')) : '#3a3a44';
  rr(x, y, w, h, 7); ctx.fill();
  ctx.strokeStyle = enabled ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 7); ctx.stroke();
  ctx.fillStyle = enabled ? '#fff' : 'rgba(255,255,255,0.4)';
  ctx.font = 'bold ' + (opts.font || 14) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 5);
  if (enabled && pendingClick && pendingClick.x >= x && pendingClick.x <= x + w && pendingClick.y >= y && pendingClick.y <= y + h){
    pendingClick = null;
    return true;
  }
  return false;
}
function windowFrame(x, y, w, h, title){
  ctx.fillStyle = 'rgba(10,8,20,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#242038';
  rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 2;
  rr(x, y, w, h, 14); ctx.stroke();
  const hg = ctx.createLinearGradient(0, y, 0, y + 44);
  hg.addColorStop(0, '#3a5a9e'); hg.addColorStop(1, '#2a3a6e');
  ctx.fillStyle = hg;
  rr(x, y, w, 44, 14); ctx.fill();
  ctx.fillRect(x, y + 22, w, 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 19px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(title, x + w / 2, y + 30);
  if (btn(x + w - 40, y + 8, 30, 28, 'X', { color:'#7a3a3a', hoverColor:'#a84a4a' })){
    game.uiWindow = null;
  }
}
function itemLabel(inst){
  return ITEMS[inst.id].name + (inst.rar > 0 ? ' [' + RARITIES[inst.rar].name + ']' : '');
}
function itemStatText(inst){
  const def = ITEMS[inst.id];
  const parts = [];
  if (def.atk) parts.push('공격력 +' + (def.atk + RARITIES[inst.rar].bonus));
  if (def.def) parts.push('방어 +' + (def.def + RARITIES[inst.rar].bonus));
  if (def.slot === 'weapon') parts.push(JOBS[def.job] ? JOBS[def.job].name + ' 전용' : '');
  return parts.join('  ');
}

// ---------- 각 창 ----------
function drawInvWindow(){
  const wx = W / 2 - 300, wy = 70, ww = 600, wh = 470;
  windowFrame(wx, wy, ww, wh, '인벤토리');
  // 장착 패널
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  rr(wx + 20, wy + 58, 180, 160, 10); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('장착 중 (클릭=해제)', wx + 32, wy + 80);
  const slotNames = { weapon:'무기', hat:'모자', top:'갑옷' };
  let ey = wy + 96;
  for (const s of ['weapon','hat','top']){
    const inst = player.equip[s];
    const label = inst ? itemLabel(inst) : '(' + slotNames[s] + ' 없음)';
    if (btn(wx + 30, ey, 160, 30, label, { color: inst ? '#3a5a4a' : '#33333e', font:11, enabled:!!inst })){
      unequipSlot(s);
    }
    ey += 38;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('아이템 클릭 = 장착', wx + 30, wy + 236);
  ctx.fillText('판매는 상인에게', wx + 30, wy + 252);
  // 그리드 6x4
  const gx = wx + 220, gy = wy + 58, cell = 58, pad = 4;
  let hoverItem = null;
  for (let i = 0; i < 24; i++){
    const cx = gx + (i % 6) * (cell + pad), cy = gy + Math.floor(i / 6) * (cell + pad);
    const inst = player.inv[i];
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    rr(cx, cy, cell, cell, 8); ctx.fill();
    if (inst){
      const def = ITEMS[inst.id];
      ctx.strokeStyle = RARITIES[inst.rar].color; ctx.lineWidth = 2;
      rr(cx + 1, cy + 1, cell - 2, cell - 2, 7); ctx.stroke();
      // 아이콘
      ctx.save();
      ctx.translate(cx + cell / 2, cy + cell / 2);
      if (def.slot === 'weapon'){
        const kind = def.job;
        if (kind === 'warrior'){
          ctx.rotate(-0.7);
          ctx.fillStyle = '#c8ccd8'; rr(-3, -20, 6, 30, 2); ctx.fill();
          ctx.fillStyle = '#8a6a3a'; rr(-7, 10, 14, 5, 2); ctx.fill();
        } else if (kind === 'archer'){
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(0, 0, 15, -1.2, 1.2); ctx.stroke();
          ctx.strokeStyle = '#e8e8d8'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(Math.cos(-1.2) * 15, Math.sin(-1.2) * 15); ctx.lineTo(Math.cos(1.2) * 15, Math.sin(1.2) * 15); ctx.stroke();
        } else {
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -12); ctx.stroke();
          ctx.fillStyle = '#6a9dff'; ctx.beginPath(); ctx.arc(0, -15, 6, 0, 7); ctx.fill();
        }
      } else if (def.slot === 'hat'){
        ctx.fillStyle = def.tier === 3 ? '#d4b04a' : (def.tier === 2 ? '#9aa0b0' : '#8a6a3a');
        ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
        ctx.fillRect(-15, 0, 30, 5);
      } else {
        ctx.fillStyle = def.tier === 3 ? '#c07a4a' : (def.tier === 2 ? '#8a94a8' : '#a3835a');
        rr(-13, -14, 26, 28, 6); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-13, -4, 26, 4);
      }
      ctx.restore();
      const hov = mouseX >= cx && mouseX <= cx + cell && mouseY >= cy && mouseY <= cy + cell;
      if (hov) hoverItem = { inst, cx, cy };
      if (pendingClick && pendingClick.x >= cx && pendingClick.x <= cx + cell && pendingClick.y >= cy && pendingClick.y <= cy + cell){
        pendingClick = null;
        equipFromInv(i);
      }
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(player.inv.length + ' / 24 칸', gx, wy + wh - 18);
  // 툴팁
  if (hoverItem){
    const tx = Math.min(hoverItem.cx, W - 240), ty = hoverItem.cy + 62;
    ctx.fillStyle = 'rgba(10,8,25,0.95)';
    rr(tx, ty, 225, 62, 8); ctx.fill();
    ctx.strokeStyle = RARITIES[hoverItem.inst.rar].color; ctx.lineWidth = 1.5;
    rr(tx, ty, 225, 62, 8); ctx.stroke();
    ctx.fillStyle = RARITIES[hoverItem.inst.rar].color; ctx.font = 'bold 13px sans-serif';
    ctx.fillText(itemLabel(hoverItem.inst), tx + 12, ty + 22);
    ctx.fillStyle = '#dfe8ff'; ctx.font = '12px sans-serif';
    ctx.fillText(itemStatText(hoverItem.inst), tx + 12, ty + 42);
  }
}

function drawQuestWindow(){
  const wx = W / 2 - 280, wy = 80, ww = 560, wh = 440;
  windowFrame(wx, wy, ww, wh, '퀘스트 일지');
  let qy = wy + 66;

function drawWindows(){
  if (!game.uiWindow) { pendingClick = null; return; }
  switch (game.uiWindow){
    case 'inv': drawInvWindow(); break;
    case 'skill': drawSkillWindow(); break;
    case 'stat': drawStatWindow(); break;
    case 'quest': drawQuestWindow(); break;
    case 'shop': drawShopWindow(); break;
    case 'dialog': drawDialogWindow(); break;
    case 'job': drawJobWindow(); break;
  }
  pendingClick = null;
}

// ---------- 키보드 ----------
const HANDLED = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyV',
  'KeyE','KeyK','KeyS','KeyL','KeyM','KeyP','Digit1','Digit2','Digit3','Enter','Escape'];
addEventListener('keydown', e => {
  if (HANDLED.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  audioUnlock();
  onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const WINDOW_KEYS = { KeyE:'inv', KeyK:'skill', KeyS:'stat', KeyL:'quest' };
function onKeyPress(code){
  if (code === 'KeyM'){ toggleMute(); return; }

  if (game.state === 'title'){
    if (code === 'Enter'){
      // 저장이 있으면 파괴적 새 게임에 확인 단계
      if (game.hasSave && !game.newConfirm){ game.newConfirm = true; return; }
      startGame(false);
    }
    if (code === 'Digit3' && game.hasSave){ game.newConfirm = false; startGame(true); }
    if (code === 'Escape') game.newConfirm = false;
    return;
  }
  if (game.state === 'victory'){
    if (code === 'Enter') game.state = 'play';
    return;
  }
  if (game.state === 'dead') return;
  if (game.state === 'pause'){
    if (code === 'KeyP' || code === 'Enter') game.state = 'play';
    return;
  }
  // 창이 열려 있을 때
  if (game.uiWindow){
    if (code === 'Escape'){ game.uiWindow = null; return; }
    if (WINDOW_KEYS[code]){
      game.uiWindow = game.uiWindow === WINDOW_KEYS[code] ? null : WINDOW_KEYS[code];
      return;
    }
    if (game.uiWindow === 'job' && game.uiArm <= 0){
      if (code === 'Digit1') doJobAdvance('warrior');
      if (code === 'Digit2') doJobAdvance('archer');
      if (code === 'Digit3') doJobAdvance('mage');
    }
    return;
  }
  if (game.state !== 'play') return;
  if (game.fadeDir !== 0) return;

  if (code === 'KeyP'){ game.state = 'pause'; return; }
  if (WINDOW_KEYS[code]){ game.uiWindow = WINDOW_KEYS[code]; return; }
  if (code === 'Space'){ jumpPressed(); return; }
  if (code === 'KeyX'){ useSkillSlot(0); return; }
  if (code === 'KeyC'){ useSkillSlot(1); return; }
  if (code === 'KeyV'){ useSkillSlot(2); return; }
  if (code === 'Digit1'){ usePotion('hp'); return; }
  if (code === 'Digit2'){ usePotion('mp'); return; }
  if (code === 'ArrowUp'){
    if (!player.climbing) interact();
    return;
  }
  if (code === 'ArrowDown'){
    if (!player.climbing && player.onGround){
      const l = ladderBelow();
      if (l) startClimb(l, true);
    }
    return;
  }
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
function frame(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  updateAll(dt);
  draw();
  drawWindows();
  audioTick();
  requestAnimationFrame(frame);
}
game.hasSave = hasAnySave();
requestAnimationFrame(frame);
