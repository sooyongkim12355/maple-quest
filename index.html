'use strict';
// ============================================================
// 오디오: 효과음(비프) + 칩튠 BGM 시퀀서
// 전역 제공: SFX, audioUnlock, audioTick, setBgm, toggleMute, isMuted
// ============================================================
let audioCtx = null;
let muted = false;
let bgmGain = null;
function ensureBgmGain(){
  if (!audioCtx) return null;
  if (!bgmGain){
    bgmGain = audioCtx.createGain();
    bgmGain.connect(audioCtx.destination);
  }
  return bgmGain;
}
function isMuted(){ return muted; }
function toggleMute(){
  muted = !muted;
  if (muted) stopBgmNodes();
  else if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch(e){}
  }
  return muted;
}
function audioUnlock(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function beep(freq, dur, type, vol, slide){
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
let noiseBuf = null;
function playNoise(vol, dur){
  if (muted || !audioCtx) return;
  try {
    if (!noiseBuf){
      noiseBuf = audioCtx.createBuffer(1, 8820, 44100);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const SFX = {
  jump:    () => beep(300, 0.12, 'square', 0.035, 200),
  hit:     () => { beep(320 + Math.random() * 100, 0.08, 'square', 0.045, -120); playNoise(0.035, 0.05); },

  arrow:   () => beep(700, 0.07, 'square', 0.03, 300),
  magic:   () => beep(450, 0.14, 'sine', 0.05, 250),
  skill:   () => { beep(500, 0.2, 'sawtooth', 0.045, 300); beep(250, 0.25, 'square', 0.035, 150); },
  thunder: () => { beep(120, 0.35, 'sawtooth', 0.07, -60); beep(900, 0.12, 'square', 0.04, -500); },
  explode: () => beep(100, 0.4, 'sawtooth', 0.08, -50),
  buff:    () => { beep(520, 0.12, 'sine', 0.05, 200); setTimeout(() => beep(780, 0.18, 'sine', 0.05, 150), 100); },
  hurt:    () => beep(140, 0.25, 'sawtooth', 0.06, -60),
  pickup:  () => beep(880, 0.09, 'square', 0.035, 220),
  equip:   () => { beep(400, 0.08, 'square', 0.05); setTimeout(() => beep(600, 0.1, 'square', 0.05), 70); },
  potion:  () => beep(520, 0.15, 'sine', 0.05, 260),
  portal:  () => beep(200, 0.4, 'sine', 0.05, 500),
  climb:   () => beep(240, 0.05, 'square', 0.02, 60),
  die:     () => beep(220, 0.6, 'sawtooth', 0.06, -180),
  buy:     () => { beep(700, 0.08, 'square', 0.045); setTimeout(() => beep(1050, 0.12, 'square', 0.045), 80); },
  questOk: () => { [659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, 'square', 0.05), i * 100)); },
  levelup: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'square', 0.05), i * 110)); },
  jobadv:  () => { [523, 587, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'square', 0.05), i * 90)); },

// ---------- BGM 시퀀서 ----------
let bgmTrackName = null;
let bgmStep = 0;
let bgmNextTime = 0;
const midi2freq = n => 440 * Math.pow(2, (n - 69) / 12);

function stopBgmNodes(){
  bgmNextTime = 0;
  if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); } catch(e){}
  }
}

function setBgm(name){
  if (bgmTrackName === name) return;
  bgmTrackName = name;
  bgmStep = 0;
  bgmNextTime = 0;
}

function playNote(freq, when, dur, type, vol){
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ensureBgmGain() || audioCtx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  } catch(e){}
}

// 매 프레임 호출: 룩어헤드 스케줄링
function audioTick(){
  if (muted || !audioCtx || !bgmTrackName) return;
  const tr = BGM_TRACKS[bgmTrackName];
  if (!tr) return;
  const stepDur = 60 / tr.tempo / 2;   // 8분음표
  const now = audioCtx.currentTime;
  if (bgmNextTime === 0) bgmNextTime = now + 0.1;
  // 0.25초 룩어헤드
  while (bgmNextTime < now + 0.25){
    const mi = tr.mel[bgmStep % tr.mel.length];
    const bi = tr.bass[bgmStep % tr.bass.length];
    if (mi > 0){
      playNote(midi2freq(mi), bgmNextTime, stepDur * 0.9, 'square', 0.018);
      // 부드러운 에코 (깊이감)
      playNote(midi2freq(mi), bgmNextTime + stepDur * 1.5, stepDur * 0.7, 'square', 0.006);
    }
    if (bi > 0) playNote(midi2freq(bi), bgmNextTime, stepDur * 1.7, 'triangle', 0.035);
    bgmStep = (bgmStep + 1) % tr.mel.length;
    bgmNextTime += stepDur;
  }
}

// ---------- 스탯 ----------
function itemUp(inst){
  if (!inst) return 0;
  const u = inst.up | 0;
  return u < 0 ? 0 : (u > 10 ? 10 : u);
}
function itemStat(inst, field){
  if (!inst) return 0;
  const base = ITEMS[inst.id][field] || 0;
  return base > 0 ? base + RARITIES[inst.rar].bonus + itemUp(inst) * 2 : 0;
}
function buffLevel(id){ return player.buffs[id] ? player.buffs[id].lvl : -1; }
const maxHp = () => Math.round((100 + (player.level - 1) * 20) * (player.job === 'warrior' ? 1.3 : 1));
const maxMp = () => Math.round((60 + (player.level - 1) * 12) * (player.job === 'mage' ? 1.6 : 1));
function totalAtk(){
  let a = 8 + player.level * 3 + itemStat(player.equip.weapon, 'atk') + itemStat(player.equip.glove, 'atk');
  const rl = buffLevel('rage');
  if (rl >= 0) a *= 1 + 0.10 + 0.01 * rl;
  const bll = buffLevel('bless');
  if (bll >= 0) a *= 1.10 + 0.01 * bll;
  const el = buffLevel('en');
  if (el >= 0) a *= 1.25 + 0.02 * el;
  const apl = buffLevel('amp');
  if (apl >= 0) a *= 1.13 + 0.012 * apl;
  const bfl = buffLevel('bfy');
  if (bfl >= 0) a *= 1.20 + 0.018 * bfl;
  return Math.round(a);
}
function totalDef(){
  let d = itemStat(player.equip.hat, 'def') + itemStat(player.equip.top, 'def') + itemStat(player.equip.shoe, 'def');
  const bll = buffLevel('bless');
  if (bll >= 0) d += 10 + bll;
  return d;
}
function critChance(){
  let c = 0.12 + (player.job === 'archer' ? 0.08 : 0) + (player.job === 'thief' ? 0.06 : 0);
  const fl = buffLevel('focus');
  if (fl >= 0) c += 0.15 + 0.015 * fl;
  if (buffLevel('bless') >= 0) c += 0.05;
  const sel = buffLevel('se');
  if (sel >= 0) c += 0.15 + 0.015 * sel;
  const aml = buffLevel('aim');
  if (aml >= 0) c += 0.18 + 0.015 * aml;
  const sdl = buffLevel('sdm');
  if (sdl >= 0) c += 0.15 + 0.012 * sdl;
  return c;
}
function moveSpd(){
  let s = 285 * (player.job === 'archer' ? 1.08 : (player.job === 'thief' ? 1.05 : 1)) + itemStat(player.equip.shoe, 'spd');
  const hl = buffLevel('haste');
  if (hl >= 0) s *= 1.12 + 0.012 * hl;
  const ssl = buffLevel('sstep');
  if (ssl >= 0) s *= 1.10 + 0.01 * ssl;
  if (buffLevel('wq') >= 0) s *= 1.10;
  if (buffLevel('sdm') >= 0) s *= 1.10;
  return s;
}
const expNeed = () => Math.floor(20 * Math.pow(player.level, 1.7));
function skillLevel(id){ return player.skills[id] || 0; }
function mySkills(){ return SKILL_DEFS[player.job] || null; }
function mySkills2(){ return player.job2 ? SKILL2_DEFS[player.job2] : null; }
function job2Info(){ return player.job2 && JOB2[player.job] ? JOB2[player.job].find(o => o.key === player.job2) || null : null; }
function mySkills3(){ return player.job3 ? SKILL3_DEFS[player.job] : null; }
function mySkillsX(){ return player.job3 && player.job2 && SKILL3X_DEFS[player.job2] ? SKILL3X_DEFS[player.job2] : null; }
function mySkills4(){ return player.job4 ? SKILL4_DEFS[player.job] : null; }
// ---------- 스킬 퀵슬롯 바인딩 (드래그로 재배치) ----------
const BIND_KEYS = ['X','C','V','A','D','F','Q','W','R','Y','T','G'];
const KEY_TIER = { X:1, C:1, V:1, A:2, D:2, F:2, Q:3, W:3, R:3, Y:5, T:4, G:4 };
function allMySkillDefs(){
  const list = [mySkills(), mySkills2(), mySkills3(), mySkills4()].filter(Boolean).flat();
  const xd = mySkillsX();
  if (xd) list.push(xd);
  return list;
}
function skillDefById(id){
  return allMySkillDefs().find(d => d.id === id) || null;
}
function defaultBindMap(){
  const map = {};
  const tiers = [mySkills(), mySkills2(), mySkills3(), mySkills4()];
  const keysByTier = [['X','C','V'], ['A','D','F'], ['Q','W','R'], ['T','G']];
  tiers.forEach((defs, ti) => {
    if (!defs) return;
    defs.forEach((d, i) => { if (keysByTier[ti][i]) map[keysByTier[ti][i]] = d.id; });
  });
  const xd = mySkillsX();
  if (xd) map.Y = xd.id;
  return map;
}
function bindOf(key){
  const v = player.binds && player.binds[key];
  if (v && skillDefById(v)) return v;
  return defaultBindMap()[key] || null;
}
function castSkillById(id){
  if (!id) return;
  const xd = mySkillsX();
  if (xd && xd.id === id){ useSkillSlotX(); return; }
  const tiers = [[mySkills(), useSkillSlot], [mySkills2(), useSkillSlot2], [mySkills3(), useSkillSlot3], [mySkills4(), useSkillSlot4]];
  for (const [defs, fn] of tiers){
    if (!defs) continue;
    const i = defs.findIndex(d => d.id === id);
    if (i >= 0){ fn(i); return; }
  }
}
function castBindKey(key){
  const id = bindOf(key);
  if (id){ castSkillById(id); return; }
  // 미해금 안내 (해당 키의 기본 티어 안내 재사용)
  const t = KEY_TIER[key];
  if (t === 1) useSkillSlot(0);
  else if (t === 2) useSkillSlot2(0);
  else if (t === 3 || t === 5) useSkillSlot3(0);
  else useSkillSlot4(0);
}
const SEQ_DEFAULTS = { hunt:['X', 'C', 'A', 'D'], buff:['V', 'F', 'R', 'G'], boss:['V', 'F', 'T', 'Q', 'A'] };
function castSequence(name){
  name = name || 'hunt';
  const raw = player.seqs && Array.isArray(player.seqs[name]) && player.seqs[name].length ? player.seqs[name] : SEQ_DEFAULTS[name];
  const seq = raw.filter(k => BIND_KEYS.includes(k));
  seq.forEach((k, i) => {
    if (i === 0) castBindKey(k);
    else after(0.07 * i, () => { if (game.state === 'play' && !game.uiWindow) castBindKey(k); });
  });
}
// 마을 귀환 (3초 시전, 피격 시 취소)
function startReturn(){
  if (game.state !== 'play') return;
  if (game.mapIdx === 0){ notify('이미 마을에 있습니다'); return; }
  if (player.returning != null) return;
  player.returning = 3;
  notify('마을로 귀환 중… (3초, 피격 시 취소)');
  SFX.portal();
}
function setBind(key, id){
  if (!BIND_KEYS.includes(key) || !skillDefById(id)) return;
  const prevOfKey = bindOf(key);
  for (const k of BIND_KEYS){
    if (k !== key && bindOf(k) === id) player.binds[k] = prevOfKey;
  }
  player.binds[key] = id;
  notify('[' + key + '] ' + skillDefById(id).name + ' 배치');
  SFX.equip();
  saveGame();
}
function jobDisplayName(){
  if (player.job === 'beginner') return '초보자';
  if (player.job4) return JOB4[player.job].name;
  if (player.job3) return JOB3[player.job].name;
  if (player.job2){ const o = job2Info(); return o ? o.name : JOBS[player.job].name; }
  return JOBS[player.job].name;
}

    player.inv = []; player.equip = { weapon:null, hat:null, top:null, glove:null, shoe:null };

function spawnMonster(t, x, fromSpawner){
  const T = MTYPES[t];
  const m = {
    type:t, T, x, y:curMap().floor, vx:0, vy:0, dir:Math.random() < 0.5 ? -1 : 1,
    hp:T.hp, maxHp:T.hp, homeX:x, chase:false, plat:null, spawnT:0.45,
    hitFlash:0, squash:0, stun:0, kb:0, dead:false, deadT:0, animT:rand(0, 6),
    spawner:fromSpawner || null,
    jumpTimer:5, sporeTimer:3, landed:true, summoned1:false, summoned2:false,
  };
  monsters.push(m);
  addEffect('spawnpoof', x, curMap().floor - T.h / 2, 1);
  return m;
}
function loadMap(idx, appear){
  game.mapIdx = idx;
  if (!player.visited) player.visited = {};
  player.visited[idx] = true;
  monsters = []; drops = []; effects = []; dmgTexts = []; pProj = []; eProj = [];
  spawners = []; particles = []; delayed = [];
  game.hitstop = 0; game.kickX = 0; game.kickY = 0;
  player.channel = null;
  player.returning = null;
  const M = MAPS[idx];
  for (const s of M.spawns){
    const sp = { t:s.t, x:s.x, respawnT:0 };
    spawners.push(sp);
    spawnMonster(s.t, s.x, sp);
  }
  const bossType = BOSS_OF_MAP[idx];
  if (bossType && (game.bossRespawn <= 0 || game.bossRespawnMap !== idx)){
    spawnMonster(bossType, 950, null);
    if (!game.bossAlerted){ SFX.boss(); game.bossAlerted = true; }
  }
  player.x = appear === 'right' ? M.w - 120 : 120;
  player.y = M.floor; player.vx = 0; player.vy = 0;
  player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
  player.climbing = null;
  camX = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  setBgm(M.bgm);
  saveGame();
}

// ---------- 인벤토리 / 장비 ----------
function rollEquip(tier, forceRar){
  const pool = DROP_POOLS[tier];
  const id = pool[irand(0, pool.length - 1)];
  let rar = 0;
  if (typeof forceRar === 'number') rar = forceRar;
  else {
    // 희귀할수록 낮은 확률 (전설 0.7%부터 누적 판정)
    const r = Math.random();
    let acc = 0;
    for (let i = RARITIES.length - 1; i >= 1; i--){
      acc += RARITIES[i].chance;
      if (r < acc){ rar = i; break; }
    }
  }
  return { id, rar };
}
function addItem(inst){
  if (player.inv.length >= 24) return false;
  player.inv.push(inst);
  return true;
}
function itemLvReq(def){ return def.lv || TIER_LV[def.tier] || 1; }
function canEquip(inst){
  const def = ITEMS[inst.id];
  if (player.level < itemLvReq(def)) return false;
  if (def.slot === 'weapon') return def.job === player.job;
  return true;
}
function equipFromInv(idx){
  const inst = player.inv[idx];
  if (!inst) return;
  const def = ITEMS[inst.id];
  if (!canEquip(inst)){
    if (player.level < itemLvReq(def)) notify('레벨이 부족합니다 (Lv' + itemLvReq(def) + ' 필요)');
    else notify(def.slot === 'weapon' ? '이 무기는 다른 직업 전용입니다' : '장착할 수 없습니다');
    return;
  }
  const prev = player.equip[def.slot];
  player.inv.splice(idx, 1);
  player.equip[def.slot] = inst;
  if (prev) player.inv.push(prev);
  SFX.equip();
  notify(def.name + ' 장착');
  saveGame();
}
function unequipSlot(slot){
  const inst = player.equip[slot];
  if (!inst) return;
  if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }
  player.equip[slot] = null;
  player.inv.push(inst);
  SFX.equip();
  saveGame();
}
function sellPrice(inst){
  return Math.max(1, Math.floor((ITEMS[inst.id].price || 10) * 0.3)) + RARITIES[inst.rar].bonus * 50 + itemUp(inst) * Math.floor((ITEMS[inst.id].price || 100) * 0.05);
}
// ---------- 강화 (메소 소비처) ----------
function enhanceCost(inst){
  return Math.max(50, Math.round((ITEMS[inst.id].price || 100) * 0.2)) * (itemUp(inst) + 1);
}
function enhanceRate(inst){
  const up = itemUp(inst);
  return up < 4 ? 1.0 : (up < 7 ? 0.7 : (up < 9 ? 0.5 : 0.35));
}
function tryEnhance(slot){
  const inst = player.equip[slot];
  if (!inst) return;
  const up = itemUp(inst);
  if (up >= 10){ notify('이미 최대 강화(+10)입니다'); return; }
  const cost = enhanceCost(inst);
  if (player.meso < cost){ notify('메소가 부족합니다 (' + cost.toLocaleString() + ' 필요)'); return; }
  player.meso -= cost;
  if (Math.random() < enhanceRate(inst)){
    inst.up = up + 1;
    addEffect('jobadv', player.x, player.y, 1);
    burstGlow(player.x, player.y - 30, 8, '#ffd94a', true);
    SFX.levelup();
    notify(ITEMS[inst.id].name + ' 강화 성공! +' + inst.up);
  } else {
    SFX.hurt();
    notify('강화 실패… 장비는 무사합니다 (+' + up + ' 유지, 메소만 소모)');
  }
  saveGame();
}
function sellFromInv(idx){
  const inst = player.inv[idx];
  if (!inst) return;
  player.meso += sellPrice(inst);
  player.inv.splice(idx, 1);
  SFX.buy();
  saveGame();
}

// ---------- 상점 ----------
function shopEntries(){
  const list = Object.keys(POTIONS).map(k => ({
    kind:'potion', pot:k,
    name:POTIONS[k].name + ' (' + (POTIONS[k].stat === 'hp' ? 'HP' : 'MP') + ' +' + POTIONS[k].amt + ')',
    price:POTIONS[k].price,
  }));
  if (player.job !== 'beginner'){
    const base = { warrior:'sword', archer:'bow', mage:'staff', thief:'dagger' }[player.job];
    list.push({ kind:'item', id:base + '1' });
    list.push({ kind:'item', id:base + '2' });
  }
  list.push({ kind:'item', id:'hat1' });
  list.push({ kind:'item', id:'top1' });
  list.push({ kind:'item', id:'glove1' });
  list.push({ kind:'item', id:'shoe1' });
  list.push({ kind:'item', id:'hat2' });
  list.push({ kind:'item', id:'top2' });
  list.push({ kind:'item', id:'glove2' });
  list.push({ kind:'item', id:'shoe2' });
  return list;
}
function buyShop(entry, qty){
  qty = qty || 1;
  if (entry.kind === 'potion'){
    const P = POTIONS[entry.pot];
    const cur = player.potions[entry.pot] || 0;
    let n = Math.min(qty, 99 - cur, Math.floor(player.meso / P.price));
    if (99 - cur <= 0){ notify('더 가질 수 없습니다'); return; }
    if (n <= 0){ notify('메소가 부족합니다'); return; }
    player.meso -= P.price * n;
    player.potions[entry.pot] = cur + n;
    SFX.buy();
    if (qty > 1) notify(P.name + ' ' + n + '개 구매 (' + (P.price * n).toLocaleString() + '메소)');
  } else {
    const def = ITEMS[entry.id];
    if (player.meso < def.price){ notify('메소가 부족합니다'); return; }
    if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }
    player.meso -= def.price;
    player.inv.push({ id:entry.id, rar:0 });
    SFX.buy();
    notify(def.name + ' 구매');
  }
  saveGame();
}

// ---------- 퀘스트 ----------
function chainState(){
  // 순서대로 진행되는 체인에서 현재 퀘스트와 상태 반환
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (!qs){
      if (player.level < q.minLv) return { q, status:'locked' };
      return { q, status:'avail' };
    }
    if (qs.st === 'active'){
      return { q, status: qs.c >= q.need.n ? 'complete' : 'active' };
    }
    // done → 다음 퀘스트로
  }
  return { q:null, status:'alldone' };
}
function acceptQuest(q){
  player.quests[q.id] = { st:'active', c:0 };
  notify('퀘스트 수락: ' + q.name);
  SFX.questOk();
  saveGame();
}
function questOnKill(type){
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (qs && qs.st === 'active' && q.need.t === type && qs.c < q.need.n){
      qs.c++;
      if (qs.c === q.need.n){ notify('퀘스트 목표 달성: ' + q.name); SFX.questOk(); }
    }
  }
}
function jobWeaponId(tier){
  const base = { warrior:'sword', archer:'bow', mage:'staff', thief:'dagger' }[player.job];
  return base ? base + tier : null;
}
function completeQuest(q){
  const qs = player.quests[q.id];
  if (!qs || qs.st !== 'active' || qs.c < q.need.n) return;
  const rw = q.reward;
  // 아이템 보상 먼저 확인 (인벤토리 공간)
  let inst = null;
  if (rw.item){
    let id = null, rar = rw.item.rar || 0;
    if (rw.item.kind === 'id') id = rw.item.id;
    else if (rw.item.kind === 'weapon'){
      id = jobWeaponId(rw.item.tier);
      if (!id){ // 미전직: 메소로 대체
        player.meso += rw.item.tier * 1000;
        notify('무기 대신 ' + (rw.item.tier * 1000) + ' 메소를 받았습니다');
      }
    }
    if (id){
      if (player.inv.length >= 24){ notify('인벤토리를 비우고 다시 오세요'); return; }
      inst = { id, rar };
      player.inv.push(inst);
      notify('보상 획득: ' + ITEMS[id].name + (rar > 0 ? ' (' + RARITIES[rar].name + ')' : ''));
    }
  }
  qs.st = 'done';
  if (rw.meso) player.meso += rw.meso;
  if (rw.hpPot) player.potions.hp = Math.min(99, player.potions.hp + rw.hpPot);
  if (rw.mpPot) player.potions.mp = Math.min(99, player.potions.mp + rw.mpPot);
  notify('퀘스트 완료: ' + q.name);
  SFX.questOk();
  if (rw.exp) gainExp(rw.exp);
  saveGame();
}

function investSkill(id){
  if (player.sp <= 0) return;
  const xd0 = mySkillsX();
  const known = (xd0 && xd0.id === id) || [mySkills(), mySkills2(), mySkills3(), mySkills4()]
    .some(defs => defs && defs.some(d => d.id === id));
  if (!known) return;
  const cur = skillLevel(id);
  if (cur >= 10) return;
  player.skills[id] = cur + 1;
  player.sp--;
  SFX.buff();
  saveGame();
}
function addBuff(id, dur, lvl){
  player.buffs[id] = { t:dur, lvl };
  addEffect('buff', player.x, player.y, 1);
  SFX.buff();
}
function useSkillSlot(i){
  if (player.climbing || player.prone || player.channel) return;
  const defs = mySkills();
  if (!defs){ notify('Lv8에 전직하면 스킬을 배웁니다'); return; }
  const def = defs[i];
  const lvl = skillLevel(def.id);
  if (lvl < 1){ notify('스킬창(K)에서 ' + def.name + '에 SP를 투자하세요'); return; }
  if ((player.cds[def.id] || 0) > 0) return;
  if (player.mp < def.mp){ notify('MP가 부족합니다'); return; }
  player.mp -= def.mp;
  player.cds[def.id] = def.cd;
  const mult = def.base + def.per * lvl;
  player.castAnim = 0.25;
  switch (def.id){
    case 'ps': {
      const box = { x: player.facing > 0 ? player.x : player.x - 105, y:player.y - 80, w:105, h:88 };
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      SFX.skill();
      if (best){
        hitMonster(best, mult);
        addEffect('impact', best.x, best.y - best.T.h / 2, player.facing);
      }
      break;
    }
    case 'sb': {
      const box = { x:player.x - 140, y:player.y - 120, w:280, h:130 };
      let hits = 0;
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      addEffect('slash', player.x - player.facing * 45, player.y - 36, -player.facing);
      addEffect('whirl', player.x, player.y - 42, player.facing);
      SFX.skill();
      for (const m of monsters){
        if (m.dead || hits >= 8) continue;
        if (overlap(box, monsterRect(m))){ hitMonster(m, mult); hits++; }
      }
      break;
    }
    case 'rage': addBuff('rage', def.dur, lvl); break;
    case 'focus': addBuff('focus', def.dur, lvl); break;
    case 'shield': addBuff('shield', def.dur, lvl); break;
    case 'ds':
      spawnArrow(mult, -6);
      spawnArrow(mult, 0);
      SFX.arrow();
      break;
    case 'ab':
      pProj.push({ kind:'bomb', x:player.x + player.facing * 20, y:player.y - 28, vx:player.facing * 640, mult, dist:0, maxDist:560 });
      SFX.skill();
      break;
    case 'mc': {
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x;
        if (dx * player.facing < 0) continue;
        const d = Math.abs(dx);
        if (d < 430 && Math.abs((m.y - m.T.h / 2) - (player.y - 30)) < 130 && d < bestD){ bestD = d; best = m; }
      }
      SFX.magic();
      if (best){
        addEffect('claw', best.x, best.y - best.T.h / 2, player.facing);
        hitMonster(best, mult);
        const bm = best;
        after(0.08, () => {
          if (game.state !== 'play' || bm.dead) return;
          addEffect('claw', bm.x, bm.y - bm.T.h / 2, -player.facing);
          hitMonster(bm, mult);
        });
      } else {
        addEffect('claw', player.x + player.facing * 120, player.y - 40, player.facing);
      }
      break;
    }
    case 'tb': {
      SFX.thunder();
      game.shake = Math.max(game.shake, 0.35);
      game.flash = 0.13;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x, dy = (m.y - m.T.h / 2) - (player.y - 30);
        if (dx * dx + dy * dy < 210 * 210){
          addEffect('lightning', m.x, m.y - m.T.h, 1);
          hitMonster(m, mult);
        }
      }
      break;
    }
    case 'l7':
      spawnStar(mult, -5);
      spawnStar(mult, 2);
      SFX.arrow();
      break;
    case 'sv': {
      // 새비지 블로우: 전방 최근접 1마리 4연타
      let best = null, bestD = 1e9;
      const box = { x: player.facing > 0 ? player.x : player.x - 110, y:player.y - 84, w:110, h:92 };
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }
      addEffect('claw', player.x + player.facing * 55, player.y - 36, player.facing);
      SFX.skill();
      if (best){
        for (let k = 0; k < 4 && !best.dead; k++) hitMonster(best, mult);
        addEffect('impact', best.x, best.y - best.T.h / 2, player.facing);
      }
      break;
    }
    case 'haste': addBuff('haste', def.dur, lvl); break;

// ---------- 전투 ----------
function addDmgText(x, y, txt, color, big){
  dmgTexts.push({ x:x + rand(-8, 8), y, vy:-70, life:0.95, txt, color, big:!!big, pop:0 });
}
function addEffect(kind, x, y, dir, col){
  effects.push({ kind, x, y, dir:dir || 1, t:0, col:col || null });
}
// ---------- 파티클 ----------
const P_MAX = 420;
function spawnP(o){
  if (particles.length >= P_MAX) particles.shift();
  o.t = 0;
  particles.push(o);
}
// 스파크: 진행 방향으로 튀는 빛줄기 (가산합성)
function burstSparks(x, y, dir, n, col){
  for (let i = 0; i < n; i++){
    const ang = (dir >= 0 ? 0 : Math.PI) + rand(-1.1, 1.1);
    const sp = rand(220, 560);
    spawnP({ k:'spark', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp - rand(40, 160),
      g:1500, dr:2.6, life:rand(0.22, 0.4), size:rand(1.6, 3), col });
  }
}
// 파편: 회전하는 사각 조각 (몬스터 색)
function burstShards(x, y, n, col){
  for (let i = 0; i < n; i++){
    const ang = rand(0, Math.PI * 2);
    const sp = rand(120, 380);
    spawnP({ k:'shard', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp - rand(120, 280),
      g:1900, dr:0.6, life:rand(0.4, 0.75), size:rand(2.5, 5.5), col,
      rot:rand(0, 6), vr:rand(-11, 11) });
  }
}
// 먼지: 지면에서 퍼지는 흙먼지
function burstDust(x, y, n, spread){
  for (let i = 0; i < n; i++){
    const dx2 = rand(-1, 1);
    spawnP({ k:'dust', x:x + dx2 * (spread || 14), y:y - rand(0, 5),
      vx:dx2 * rand(50, 160), vy:-rand(15, 75),
      g:-60, dr:2.2, life:rand(0.35, 0.6), size:rand(4, 9), col:null });
  }
}
// 글로우: 떠오르는 빛 입자 (버프/트레일)
function burstGlow(x, y, n, col, up){
  for (let i = 0; i < n; i++){
    spawnP({ k:'glow', x:x + rand(-16, 16), y:y + rand(-10, 10),
      vx:rand(-22, 22), vy:up ? -rand(35, 95) : rand(-22, 22),
      g:0, dr:1, life:rand(0.35, 0.7), size:rand(2, 4.5), col });
  }
}
// 불티: 폭발 잔불
function burstEmbers(x, y, n){
  for (let i = 0; i < n; i++){
    const ang = rand(0, Math.PI * 2);
    const sp = rand(140, 420);
    spawnP({ k:'ember', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp * 0.75 - rand(60, 200),
      g:1100, dr:1.4, life:rand(0.35, 0.7), size:rand(1.8, 3.6), col:null });
  }
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.vy += (p.g || 0) * dt;
    const d = Math.pow(Math.max(0.0001, 1 - (p.dr || 0) * dt), 1);
    p.vx *= d; p.vy *= (p.k === 'dust' ? d : 1 - Math.min(0.9, (p.dr || 0) * 0.4 * dt));
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    // 바닥에 닿은 파편은 튕김
    if ((p.k === 'shard' || p.k === 'ember') && p.y > curMap().floor && p.vy > 0){
      p.y = curMap().floor; p.vy *= -0.45; p.vx *= 0.6;
    }
  }
}

function updateDelayed(dt){
  for (let i = delayed.length - 1; i >= 0; i--){
    delayed[i].t -= dt;

function hurtPlayer(dmg, fromX){
  if (player.invul > 0 || game.state !== 'play') return;

  const il = buffLevel('iron');
  if (il >= 0) d *= 1 - (0.15 + 0.015 * il);
  const cl = buffLevel('cloak');
  if (cl >= 0) d *= 1 - (0.18 + 0.015 * cl);
  const ssl2 = buffLevel('sstep');
  if (ssl2 >= 0) d *= 1 - (0.10 + 0.01 * ssl2);
  const reduced = Math.max(1, Math.round(d - totalDef() * 0.7 - player.level * 0.3));

function usePotion(kind){

// ---------- 물리 ----------
function resolveVertical(ent, prevY, isPlayer){
  const M = curMap();
  let landed = false, onPlat = false;
  if (ent.vy >= 0){
    if (prevY <= M.floor && ent.y >= M.floor){
      ent.y = M.floor; ent.vy = 0; landed = true;
    } else if (!(isPlayer && player.dropT > 0)){
      for (const p of M.plats){
        if (ent.x > p[0] - 4 && ent.x < p[0] + p[2] + 4 && prevY <= p[1] && ent.y >= p[1]){
          ent.y = p[1]; ent.vy = 0; landed = true; onPlat = true;
          if (!isPlayer) ent.plat = p;
          break;
        }
      }
    }
  }
  return { landed, onPlat };
}

function updatePlayer(dt){
  const M = curMap();
  player.invul = Math.max(0, player.invul - dt);
  player.cdBasic = Math.max(0, player.cdBasic - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);
  player.castAnim = Math.max(0, player.castAnim - dt);
  player.dropT = Math.max(0, player.dropT - dt);
  player.potionCd.hp = Math.max(0, player.potionCd.hp - dt);
  player.potionCd.mp = Math.max(0, player.potionCd.mp - dt);
  for (const k in player.cds) player.cds[k] = Math.max(0, player.cds[k] - dt);
  for (const k in player.buffs){
    player.buffs[k].t -= dt;
    if (player.buffs[k].t <= 0) delete player.buffs[k];
  }
  if (player.combo.t > 0){
    player.combo.t -= dt;
    if (player.combo.t <= 0) player.combo = { n:0, t:0 };
  }

  // 마을 귀환 시전
  if (player.returning != null){
    player.returning -= dt;
    if (Math.random() < dt * 8) burstGlow(player.x, player.y - 20, 1, '#8ad8ff', true);
    if (player.returning <= 0){
      player.returning = null;
      SFX.portal();
      game.fadeDir = 1; game.fade = 0;
      game.pendingMap = { to:0, appear:'left' };
    }
  }
  // 폭풍의 시 채널링: 0.1초마다 화살 발사
  if (player.channel){
    const ch = player.channel;
    ch.t -= dt; ch.tickT -= dt;
    if (ch.tickT <= 0){
      ch.tickT = 0.1;
      spawnArrow(ch.mult, rand(-18, 4), 'hurr');
      player.attackAnim = 0.14;
      ch.n = (ch.n || 0) + 1;
      if (ch.n % 3 === 1) addEffect('windfan', player.x + player.facing * 30, player.y - 28, player.facing);
      SFX.arrow();
    }
    if (ch.t <= 0) player.channel = null;
  }
  // 지속 재생 버프 (워리어 하트 / 인피니티)
  const whl = buffLevel('wh');
  if (whl >= 0) player.hp = Math.min(maxHp(), player.hp + maxHp() * (0.02 + 0.002 * whl) * dt);
  const ifl = buffLevel('inf');
  if (ifl >= 0) player.mp = Math.min(maxMp(), player.mp + (12 + 1.2 * ifl) * dt);

  // 등반 중
  if (player.climbing){
    const c = player.climbing;
    if (keys.ArrowUp) player.y -= 155 * dt;
    if (keys.ArrowDown) player.y += 165 * dt;
    if (player.y <= c.y1){
      player.y = c.y1; player.climbing = null;
      player.onGround = true; player.groundIsPlat = (c.y1 !== M.floor); player.jumpsUsed = 0;
    } else if (player.y >= c.y2){
      player.y = c.y2; player.climbing = null;
      player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
    }
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
    return;
  }

  // 이동
  const L = keys.ArrowLeft, R = keys.ArrowRight;
  let mv = 0;
  if (L && !R) mv = -1;
  if (R && !L) mv = 1;
  // 엎드리기 (메이플식: 지상에서 ↓ 홀드)
  player.prone = !!(keys.ArrowDown && player.onGround && mv === 0);
  if (mv !== 0){ player.facing = mv; player.walkT += dt * 9; }
  const targetVx = player.prone ? 0 : mv * moveSpd() * (player.channel ? 0.25 : 1);
  player.vx += (targetVx - player.vx) * Math.min(1, dt * 14);

  // 기본 공격 (Z 홀드, 엎드린 상태 불가)
  if (keys.KeyZ && player.cdBasic <= 0 && !player.prone) doBasicAttack();

  // 달리기 흙먼지
  player.dustT = (player.dustT || 0) - dt;
  if (player.onGround && Math.abs(player.vx) > 190 && player.dustT <= 0){
    player.dustT = 0.16;
    burstDust(player.x - player.facing * 12, player.y, 1, 4);
  }
  // 버프 오라 (첫 버프 색으로 상승 글로우)
  player.auraT = (player.auraT || 0) - dt;
  if (player.auraT <= 0){
    const AURA_COL = { rage:'#ff9a6a', focus:'#8affa0', shield:'#8ab8ff', iron:'#d8d8e8', hawk:'#b8ffa0', bless:'#ffe98a' };
    for (const bid in player.buffs){
      if (AURA_COL[bid]){ burstGlow(player.x, player.y - 28, 1, AURA_COL[bid], true); break; }
    }
    player.auraT = 0.14;
  }

  // 중력
  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  const prevY = player.y;
  const fallVy = player.vy;
  const wasGround = player.onGround;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 18, M.w - 18);

  const res = resolveVertical(player, prevY, true);
  player.onGround = res.landed;
  player.groundIsPlat = res.onPlat;
  if (res.landed) player.jumpsUsed = 0;
  else if (player.jumpsUsed === 0 && player.vy > 0) player.jumpsUsed = 1; // 발판 낙하 = 첫 점프 소모
  // 착지 먼지
  if (res.landed && !wasGround && fallVy > 480){
    burstDust(player.x, player.y, fallVy > 860 ? 7 : 4, 16);
    if (fallVy > 860) addEffect('shockring', player.x, player.y, 1);
  }

  // 자연 회복
  if (M.safe){
    player.hp = Math.min(maxHp(), player.hp + 25 * dt);
    player.mp = Math.min(maxMp(), player.mp + 15 * dt);
  } else {
    if (player.onGround && mv === 0) player.hp = Math.min(maxHp(), player.hp + 3.5 * dt);
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
  }
  // 아이언 바디 재생
  if (buffLevel('iron') >= 0) player.hp = Math.min(maxHp(), player.hp + maxHp() * 0.01 * dt);
}

// ---------- 몬스터 업데이트 ----------
function updateMonster(m, dt){
  const M = curMap();
  m.animT += dt;
  if (m.dead){ m.deadT += dt; return; }
  if (m.spawnT > 0){ m.spawnT -= dt; return; }
  m.hitFlash = Math.max(0, m.hitFlash - dt);
  m.squash = Math.max(0, m.squash - dt);
  m.stun = Math.max(0, m.stun - dt);
  m.kb *= Math.pow(0.0015, dt);

  if (m.T.isBoss){ updateBoss(m, dt); return; }

  const dx = player.x - m.x, dy = player.y - m.y;
  if (m.T.aggro && Math.abs(dx) < 270 && Math.abs(dy) < 90 && game.state === 'play') m.chase = true;
  if (Math.abs(dx) > 500) m.chase = false;

  // 원거리 투척몹 (MTYPES.throw 일반화)
  if (m.T.throw && m.stun <= 0 && game.state === 'play'){
    if (m.throwT == null) m.throwT = rand(1, 2.5);
    m.throwT -= dt;
    const adx = Math.abs(dx);
    if (m.throwT <= 0 && adx > 120 && adx < 340 && Math.abs(dy) < 70){
      m.throwT = 2.5;
      eProj.push({ x:m.x + Math.sign(dx) * 12, y:m.y - m.T.h * 0.7, vx:Math.sign(dx) * 260, vy:-300, kind:'spore', vis:m.T.throw.vis, dmg:m.T.throw.dmg });
      SFX.arrow();
    }
  }
  // 골렘 계열: 근접 내리찍기 (예고 진동 후 충격)
  if ((m.type === 'golem' || m.type === 'igolem') && m.stun <= 0 && game.state === 'play'){
    if (m.slamT == null) m.slamT = 2;
    m.slamT -= dt;
    if (m.slamT <= 0 && Math.abs(dx) < 100){
      m.slamT = 4;
      addEffect('shockring', m.x, m.y, 1);
      burstDust(m.x, m.y, 6, 34);
      game.shake = Math.max(game.shake, 0.3);
      SFX.boss();
      if (Math.abs(player.x - m.x) < 140 && Math.abs(player.y - m.y) < 70) hurtPlayer(m.type === 'igolem' ? 78 : 45, m.x);
    }
  }

  let dir = m.dir;
  if (m.chase) dir = dx > 0 ? 1 : -1;

  let vx = 0;
  if (m.stun <= 0){
    vx = dir * m.T.spd;
    if (m.chase && m.T.charge) vx *= m.T.charge; // 돌진 가속 일반화
    if (!m.chase){
      if (m.x > m.homeX + 130) dir = -1;
      if (m.x < m.homeX - 130) dir = 1;
      vx = dir * m.T.spd * 0.6;
      if (m.plat){
        if (m.x < m.plat[0] + 14) dir = 1;
        if (m.x > m.plat[0] + m.plat[2] - 14) dir = -1;
        vx = dir * m.T.spd * 0.6;
      }
    }
    m.dir = dir;
  }
  m.vy += GRAV * dt;
  if (m.vy > 900) m.vy = 900;
  const prevY = m.y;
  m.x += (vx + m.kb) * dt;
  m.y += m.vy * dt;
  m.x = clamp(m.x, 20, M.w - 20);
  m.plat = null;
  resolveVertical(m, prevY, false);
}
// 보스 패턴 테이블: enr 격노 임계 / jn·je 점프주기 / wv·wd 파동 속도·피해 / spread·vd 살포 / s1·s2 소환 임계
const BOSS_TUNE = {
  boss:       { enr:0.5,  jn:5,   je:3.2, wv:430, wd:28, vis:null,    spread:[-140, 0, 140],          vd:30, s1:0.6,  k1:[['shroom', -200], ['shroom', 180], ['shroom', 280]], s2:0.3,  k2:[['zshroom', -240], ['zshroom', 240]], dbl:false,
                c1:'부하들이여!', c2:'일어나라, 저주받은 자들이여!' },
  kslime:     { enr:0.3,  jn:5,   je:1.8, wv:460, wd:32, vis:'jelly', spread:[-160, -80, 0, 80, 160], vd:26, s1:0.65, k1:[['slime', -260], ['slime', -160], ['slime', 180], ['slime', 280]], s2:0.35, k2:[['slime', -280], ['slime', -180], ['slime', 200], ['slime', 300]], dbl:true,
                c1:'나의 아이들아!', c2:'왕국을 지켜라!' },
  yeti:       { enr:0.35, jn:4.2, je:2.2, wv:520, wd:44, vis:'ice',   spread:[-180, -60, 60, 180],    vd:38, s1:0.6,  k1:[['fang', -240], ['fang', 200], ['fang', 300]], s2:0.3,  k2:[['pepe', -260], ['pepe', 260]], dbl:true,
                c1:'크아아앙!', c2:'설산이 분노한다!' },
  timekeeper: { enr:0.4,  jn:3.6, je:1.6, wv:600, wd:55, vis:'clock', spread:[-200, -100, 0, 100, 200], vd:48, s1:0.65, k1:[['tick', -240], ['tick', 240]], s2:0.35, k2:[['tick', -280], ['tick', 0], ['tick', 280]], dbl:true,
                c1:'시간은 나의 것.', c2:'종말의 태엽이 감긴다.' },
  kraken:     { enr:0.35, jn:4.5, je:2.4, wv:500, wd:42, vis:'bubble', spread:[-180, -90, 0, 90, 180], vd:36, s1:0.6,  k1:[['shark', -240], ['shark', 240]], s2:0.3,  k2:[['bfish', -260], ['bfish', -160], ['bfish', 180], ['bfish', 280]], dbl:true,
                c1:'심해가 삼키리라…', c2:'폭풍 해일이여!' },
  pharaoh:    { enr:0.4,  jn:3.2, je:1.5, wv:650, wd:70, vis:'sand', spread:[-220, -110, 0, 110, 220], vd:62, s1:0.65, k1:[['mummy', -240], ['mummy', 240]], s2:0.35, k2:[['mummy', -280], ['cact', 0], ['mummy', 280]], dbl:true,
                c1:'모래의 왕 앞에 무릎 꿇어라.', c2:'천년의 저주를 받으라!' },
};
function updateBoss(b, dt){
  const M = curMap();
  const P = BOSS_TUNE[b.type] || BOSS_TUNE.boss;
  const dx = player.x - b.x;
  b.dir = dx > 0 ? 1 : -1;
  const enraged = b.hp < b.maxHp * P.enr;
  b.jumpTimer -= dt;
  b.sporeTimer -= dt;
  // 격노 시 착지 후 지연 저속 파동 (2중 파동 — 틈 읽기)
  if (b.waveDelay != null){
    b.waveDelay -= dt;
    if (b.waveDelay <= 0){
      b.waveDelay = null;
      eProj.push({ x:b.x - 60, y:M.floor, vx:-P.wv * 0.62, vy:0, kind:'wave', life:1.8, dmg:Math.round(P.wd * 0.8), vis:P.vis });
      eProj.push({ x:b.x + 60, y:M.floor, vx:P.wv * 0.62, vy:0, kind:'wave', life:1.8, dmg:Math.round(P.wd * 0.8), vis:P.vis });
    }
  }

  if (b.landed && b.jumpTimer <= 0){
    b.vy = -880;
    b.vx = clamp(dx, -420, 420) / 1.1;
    b.landed = false;
    b.jumpTimer = enraged ? P.je : P.jn;
  }
  // 투사체 살포 (착지 상태에서)
  if (b.landed && b.sporeTimer <= 0){
    b.sporeTimer = enraged ? 3.2 : 4.5;
    for (const a of P.spread){
      eProj.push({ x:b.x + b.dir * 40, y:b.y - b.T.h + 30, vx: clamp(dx * 0.8, -350, 350) + a, vy:-rand(380, 480), kind:'spore', dmg:P.vd, vis:P.vis });
    }
    SFX.explode();
  }
  if (b.landed && b.stun <= 0){
    b.x += b.dir * b.T.spd * dt;
  } else if (!b.landed){
    b.x += (b.vx || 0) * dt;
  }
  b.vy += GRAV * dt;
  if (b.vy > 1000) b.vy = 1000;
  const prevY = b.y;
  b.y += b.vy * dt;
  b.x = clamp(b.x, 90, M.w - 90);
  if (prevY <= M.floor && b.y >= M.floor && b.vy >= 0){
    b.y = M.floor; b.vy = 0;
    if (!b.landed){
      b.landed = true;
      game.shake = Math.max(game.shake, 0.75);
      SFX.boss();
      burstDust(b.x, M.floor, 12, 80);
      addEffect('shockring', b.x, M.floor, 1);
      eProj.push({ x:b.x - 60, y:M.floor, vx:-P.wv, vy:0, kind:'wave', life:1.5, dmg:P.wd, vis:P.vis });
      eProj.push({ x:b.x + 60, y:M.floor, vx:P.wv, vy:0, kind:'wave', life:1.5, dmg:P.wd, vis:P.vis });
      if (P.dbl && enraged) b.waveDelay = 0.3;
    }
  }
  if (!b.summoned1 && b.hp < b.maxHp * P.s1){
    b.summoned1 = true;
    for (const [kk, ox] of P.k1){
      const mm = spawnMonster(kk, clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, P.c1, '#ffdd66', true);
  }
  if (!b.summoned2 && b.hp < b.maxHp * P.s2){
    b.summoned2 = true;
    for (const [kk, ox] of P.k2){
      const mm = spawnMonster(kk, clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, P.c2, '#c77aff', true);
  }
}

// ---------- 월드 업데이트 ----------
function updateWorld(dt){
  const M = curMap();
  for (const sp of spawners){
    if (sp.respawnT > 0){
      sp.respawnT -= dt;
      if (sp.respawnT <= 0) spawnMonster(sp.t, sp.x, sp);
    }
  }
  if (game.bossRespawn > 0){
    game.bossRespawn -= dt;
    if (game.bossRespawn <= 0 && BOSS_OF_MAP[game.mapIdx] && game.mapIdx === game.bossRespawnMap){
      const bx = player.x < 750 ? 1200 : 300;
      const b = spawnMonster(BOSS_OF_MAP[game.mapIdx], bx, null);
      addDmgText(b.x, b.y - b.T.h - 30, b.T.name + '이(가) 나타났다!', '#ff8a8a', true);
      SFX.boss();
    }
  }
  for (let i = monsters.length - 1; i >= 0; i--){
    updateMonster(monsters[i], dt);
    if (monsters[i].dead && monsters[i].deadT > 0.5) monsters.splice(i, 1);
  }
  // 플레이어 투사체
  const TRAIL_COL = { arrow:'#cfe6ff', rain:'#cfe6ff', orb:'#9ac2ff', bomb:'#ffc270', holy:'#ffe9a0', wave2:'#aadcff', star:'#d8a0f0', phx:'#ffb060', holybig:'#fff0b0' };
  for (let i = pProj.length - 1; i >= 0; i--){
    const p = pProj[i];
    if (p.kind === 'wave2'){
      p.dustT = (p.dustT || 0) - dt;
      if (p.dustT <= 0){ p.dustT = 0.05; burstDust(p.x, M.floor, 2, 8); }
      game.shake = Math.max(game.shake, 0.06);
    }
    if (p.kind === 'phx'){
      p.emberT = (p.emberT || 0) - dt;
      if (p.emberT <= 0){ p.emberT = 0.08; burstEmbers(p.x - Math.sign(p.vx) * 20, p.y, 2); }
    }
    p.trailT = (p.trailT || 0) - dt;
    if (p.trailT <= 0){
      p.trailT = 0.035;
      spawnP({ k:'glow', x:p.x, y:p.y, vx:rand(-14, 14), vy:rand(-14, 14), g:0, dr:1,
        life:0.22, size:p.kind === 'arrow' || p.kind === 'rain' ? 2 : 3.2, col:TRAIL_COL[p.kind] || '#fff' });
    }
    p.x += p.vx * dt;
    if (p.vy) p.y += p.vy * dt;
    p.dist += (Math.abs(p.vx) + Math.abs(p.vy || 0)) * dt;
    let remove = p.dist > p.maxDist || p.x < 0 || p.x > M.w;
    if (remove && p.kind === 'phx'){
      // 불사조 소멸: 대폭발 피니시
      addEffect('explosion', p.x, p.y, 1);
      burstEmbers(p.x, p.y, 12);
      game.shake = Math.max(game.shake, 0.25);
      SFX.explode();
    }
    if (p.kind === 'rain' && p.y > M.floor - 4){
      addEffect('djump', p.x, M.floor, 1);
      remove = true;
    }
    if (!remove){
      for (const m of monsters){
        if (m.dead || m.spawnT > 0) continue;
        if (p.pierce && p.hit.has(m)) continue;
        const r = monsterRect(m);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y - 24 && p.y < r.y + r.h + 6){
          if (p.kind === 'bomb'){ explodeAt(p.x, p.y, p.mult); remove = true; }
          else {
            hitMonster(m, p.mult);
            if (p.kind === 'wave2'){ addEffect('shockring', m.x, M.floor, 1); feelHit(0.05, player.facing); }
            if (p.pierce){ p.hit.add(m); if (p.hit.size >= (p.maxHits || 8)) remove = true; }
            else remove = true;
          }
          break;
        }
      }
    } else if (p.kind === 'bomb'){
      explodeAt(p.x, p.y, p.mult);
    }
    if (remove) pProj.splice(i, 1);
  }
  // 적 투사체 (포자, 충격파)
  const pr = { x:player.x - player.w / 2, y:player.y - player.h, w:player.w, h:player.h };
  for (let i = eProj.length - 1; i >= 0; i--){
    const p = eProj[i];
    if (p.kind === 'spore'){
      p.vy += 850 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (overlap({ x:p.x - 10, y:p.y - 10, w:20, h:20 }, pr)){
        hurtPlayer(p.dmg || 30, p.x);
        eProj.splice(i, 1);
        continue;
      }
      if (p.y > M.floor){ addEffect('poof', p.x, M.floor, 1); eProj.splice(i, 1); }
    } else { // wave
      p.x += p.vx * dt;
      p.life -= dt;
      if (overlap({ x:p.x - 22, y:p.y - 30, w:44, h:30 }, pr)) hurtPlayer(p.dmg || 28, p.x);
      if (p.life <= 0 || p.x < 0 || p.x > M.w) eProj.splice(i, 1);
    }
  }
  // 몬스터 접촉 피해 (등반 중에도)
  if (player.invul <= 0){
    for (const m of monsters){
      if (m.dead || m.spawnT > 0) continue;
      if (overlap(pr, monsterRect(m))){ hurtPlayer(m.T.touch, m.x); break; }
    }
  }
  // 드랍
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.vy += 1900 * dt;
    d.y += d.vy * dt;
    if (d.y > M.floor - 6){ d.y = M.floor - 6; d.vy = 0; }
    if (d.noPickT) d.noPickT -= dt;
    const dx = player.x - d.x, dy = (player.y - 24) - d.y;
    const dist = Math.hypot(dx, dy);
    if (d.t > 0.45 && dist < 60 && !(d.noPickT > 0)){
      d.x += dx * dt * 9; d.y += dy * dt * 9;
    }
    if (d.t > 0.45 && dist < 24 && !(d.noPickT > 0)){
      if (d.kind === 'meso'){
        player.meso += d.value;
        addDmgText(player.x, player.y - player.h - 12, '+' + d.value + ' 메소', '#ffd94a');
      } else if (d.kind === 'hpPot'){
        player.potions.hp = Math.min(99, player.potions.hp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'HP 물약 획득', '#ff8a8a');
      } else if (d.kind === 'mpPot'){
        player.potions.mp = Math.min(99, player.potions.mp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'MP 물약 획득', '#8ab8ff');
      } else if (d.kind === 'equip'){
        if (!addItem(d.item)){
          if (!d.notified){ notify('인벤토리가 가득 찼습니다'); d.notified = true; }
          d.noPickT = 2.5;
          continue;
        }
        const def = ITEMS[d.item.id];
        addDmgText(player.x, player.y - player.h - 12, def.name + ' 획득', RARITIES[d.item.rar].color);
      }
      SFX.pickup();
      drops.splice(i, 1);
      continue;
    }
    if (d.t > 40) drops.splice(i, 1);
  }
  // 카메라
  const target = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  camX += (target - camX) * Math.min(1, dt * 8);
  game.saveTimer += dt;
  if (game.saveTimer > 10){ game.saveTimer = 0; saveGame(); }
}

function updateFloaters(dt){
  game.flash = Math.max(0, game.flash - dt);
  updateParticles(dt);
  updateDelayed(dt);
  // 셰이크/킥 감쇠: 전 상태(승리/사망/창 열림)에서 지속되도록 여기서 처리
  // 지수 감쇠 — 초반 펀치 강조, 잔진동 빠르게 컷
  game.shake = Math.max(0, game.shake * Math.pow(0.002, dt) - dt * 0.25);
  game.kickX *= Math.pow(0.0005, dt);
  game.kickY *= Math.pow(0.0005, dt);
  for (let i = dmgTexts.length - 1; i >= 0; i--){
    const t = dmgTexts[i];
    t.y += t.vy * dt; t.vy *= Math.pow(0.3, dt); t.life -= dt; t.pop += dt;
    if (t.life <= 0) dmgTexts.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--){
    effects[i].t += dt;
    if (effects[i].t > 0.7) effects.splice(i, 1);
  }
  for (let i = game.notifs.length - 1; i >= 0; i--){
    game.notifs[i].t -= dt;
    if (game.notifs[i].t <= 0) game.notifs.splice(i, 1);
  }
}

// ---------- 메인 업데이트 ----------
function updateAll(dt){
  game.time += dt;
  if (game.fadeDir === 1){
    game.fade += dt * 3;
    if (game.fade >= 1){
      game.fade = 1; game.fadeDir = -1;
      if (game.pendingMap){ loadMap(game.pendingMap.to, game.pendingMap.appear); game.pendingMap = null; }
    }
  } else if (game.fadeDir === -1){
    game.fade -= dt * 3;
    if (game.fade <= 0){ game.fade = 0; game.fadeDir = 0; }
  }
  if (game.state === 'title') return;
  game.uiArm = Math.max(0, game.uiArm - dt);
  updateFloaters(dt);

  if (game.state === 'play') player.stats.time += dt;
  if (game.state === 'play' && game.fadeDir === 0 && !game.uiWindow){
    if (game.jobPromptPending && player.job === 'beginner'){
      game.uiWindow = 'job';
      game.uiArm = 0.45;   // 자동 오픈 직후 오입력 방지
      return;
    }
    updatePlayer(dt);
    if (game.state === 'play') updateWorld(dt);
  } else if (game.state === 'dead'){
    game.deadTimer += dt;
    if (game.deadTimer > 2.6){
      player.exp = Math.max(0, Math.floor(player.exp - expNeed() * 0.05));
      player.hp = maxHp(); player.mp = maxMp();
      game.state = 'play';
      loadMap(game.mapIdx, 'left');
    }
  }
}

'use strict';
// ============================================================
// 렌더링 v3: 메이플풍 2등신 캐릭터, 몬스터 리디자인, 레이어드 배경,
//            앰비언트 파티클, 강화 이펙트, HUD
// 전역 제공: canvas, ctx, rr, draw
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 결정적 의사난수 (장식 배치용)
function h1(i){ const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
// 오프스크린 캔버스 (매 프레임 그라디언트 생성 방지) — 스텁 환경이면 null
function makeCanvas(w, h){
  try {
    if (typeof document.createElement === 'function'){
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
  } catch(e){}
  return null;
}
// 정적 에셋 베이크: 1회 정밀 드로잉 → 이미지로 굳혀 매 프레임 블릿
const bakeCache = {};
function baked(key, w, h, painter){
  if (bakeCache[key] !== undefined) return bakeCache[key];
  const c = makeCanvas(w, h);
  if (c){
    const g = c.getContext('2d');
    painter(g, w, h);
  }
  bakeCache[key] = c || null;
  return bakeCache[key];
}
let _vigCv = null, _lowCv = null;
function vigCanvas(){
  if (_vigCv !== null) return _vigCv;
  _vigCv = makeCanvas(W, H);
  if (_vigCv){
    const g2 = _vigCv.getContext('2d');
    const vg = g2.createRadialGradient(W / 2, H * 0.44, H * 0.52, W / 2, H * 0.44, H * 1.02);
    vg.addColorStop(0, 'rgba(10,8,24,0)');
    vg.addColorStop(1, 'rgba(10,8,24,0.34)');
    g2.fillStyle = vg;
    g2.fillRect(0, 0, W, H);
  }
  return _vigCv;
}
function lowHpCanvas(){
  if (_lowCv !== null) return _lowCv;
  _lowCv = makeCanvas(W, H);
  if (_lowCv){
    const g2 = _lowCv.getContext('2d');
    const rg = g2.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.85);
    rg.addColorStop(0, 'rgba(200,20,20,0)');
    rg.addColorStop(1, 'rgba(200,20,20,1)');
    g2.fillStyle = rg;
    g2.fillRect(0, 0, W, H);
  }
  return _lowCv;
}
// 색상 밝기 조절: f>0 밝게(0~1), f<0 어둡게(-1~0)
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0){ r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

}

      ctx.beginPath();
      ctx.ellipse(((t * (12 + i * 6)) % (W + 700)) - 350, fy, 330, 44, 0, 0, 7);

    }
  } else if (style === 'boss'){
    // 떠오르는 포자 + 떨어지는 재
    for (let i = 0; i < 10; i++){
      const lx = ((h1(i + 7) * (W + 60) + Math.sin(t * 0.8 + i) * 30 - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - ((h1(i + 31) * 300 + t * (12 + h1(i) * 14)) % 420);
      const pulse = 0.3 + Math.sin(t * 2 + i * 3) * 0.2;

      ctx.beginPath(); ctx.arc(lx, ly, 2.5 + h1(i + 5) * 2.2, 0, 7); ctx.fill();
    }
    for (let i = 0; i < 8; i++){

      ctx.fillStyle = 'rgba(200,140,220,' + (0.25 + h1(i + 2) * 0.3) + ')';

}

function paintPalm(g, w, h){
  const bx = w / 2, by = h - 8;
  // 휘어진 줄기 (마디 텍스처)
  g.strokeStyle = '#8a6238'; g.lineWidth = 13; g.lineCap = 'round';
  g.beginPath(); g.moveTo(bx - 8, by); g.quadraticCurveTo(bx + 4, by - 90, bx + 26, by - 168); g.stroke();
  g.strokeStyle = 'rgba(60,40,20,0.5)'; g.lineWidth = 2;
  for (let i = 1; i < 8; i++){
    const tt = i / 8;
    const px = bx - 8 + (12 * tt) + 22 * tt * tt, py = by - 168 * tt;
    g.beginPath(); g.moveTo(px - 7, py); g.quadraticCurveTo(px, py - 3, px + 7, py); g.stroke();
  }
  // 잎 6장 (호 곡선 + 잎맥 톱니)
  const tipX = bx + 26, tipY = by - 172;
  for (const [ang, len] of [[-2.6, 78], [-2.1, 88], [-1.45, 92], [-0.85, 88], [-0.3, 80], [0.15, 66]]){
    const ex = tipX + Math.cos(ang) * len, ey = tipY + Math.sin(ang) * len * 0.62;
    const midX = tipX + Math.cos(ang) * len * 0.5, midY = tipY + Math.sin(ang) * len * 0.5 * 0.62 - 16;
    g.strokeStyle = '#2e8a46'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(tipX, tipY); g.quadraticCurveTo(midX, midY, ex, ey); g.stroke();
    g.strokeStyle = '#3fae5a'; g.lineWidth = 3.5;
    g.beginPath(); g.moveTo(tipX, tipY); g.quadraticCurveTo(midX, midY - 2, ex, ey - 2); g.stroke();
  }
  // 코코넛
  g.fillStyle = '#6b4a2c';
  g.beginPath(); g.arc(tipX - 8, tipY + 8, 7, 0, 7); g.arc(tipX + 5, tipY + 11, 6.5, 0, 7); g.fill();
  g.strokeStyle = 'rgba(45,30,22,0.5)'; g.lineWidth = 1.5;
  g.beginPath(); g.arc(tipX - 8, tipY + 8, 7, 0, 7); g.stroke();
}

function paintCactusDecor(g, w, h){
  const bx = w / 2, by = h - 8;
  const grad = g.createLinearGradient(bx - 20, 0, bx + 20, 0);
  grad.addColorStop(0, '#3f8a34'); grad.addColorStop(0.5, '#5aae48'); grad.addColorStop(1, '#357a2c');
  g.fillStyle = grad;
  // 본체 기둥
  g.beginPath();
  g.moveTo(bx - 16, by);
  g.lineTo(bx - 16, by - 96);
  g.quadraticCurveTo(bx - 16, by - 118, bx, by - 118);
  g.quadraticCurveTo(bx + 16, by - 118, bx + 16, by - 96);
  g.lineTo(bx + 16, by);
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(30,60,25,0.8)'; g.lineWidth = 2.4; g.stroke();
  // 팔 2개
  for (const sgn of [-1, 1]){
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(bx + sgn * 14, by - 62);
    g.lineTo(bx + sgn * 40, by - 62);
    g.quadraticCurveTo(bx + sgn * 52, by - 62, bx + sgn * 52, by - 76);
    g.lineTo(bx + sgn * 52, by - (sgn < 0 ? 96 : 86));
    g.quadraticCurveTo(bx + sgn * 52, by - (sgn < 0 ? 108 : 98), bx + sgn * 40, by - (sgn < 0 ? 108 : 98));
    g.quadraticCurveTo(bx + sgn * 28, by - (sgn < 0 ? 108 : 98), bx + sgn * 28, by - (sgn < 0 ? 92 : 84));
    g.lineTo(bx + sgn * 28, by - 76);
    g.lineTo(bx + sgn * 14, by - 76);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(30,60,25,0.8)'; g.lineWidth = 2.2; g.stroke();
  }
  // 세로 골 + 가시
  g.strokeStyle = 'rgba(30,70,25,0.5)'; g.lineWidth = 1.6;
  for (const off of [-8, 0, 8]){
    g.beginPath(); g.moveTo(bx + off, by - 4); g.lineTo(bx + off, by - 112); g.stroke();
  }
  g.strokeStyle = 'rgba(240,250,230,0.9)'; g.lineWidth = 1.4;
  for (let i = 0; i < 14; i++){
    const px = bx - 14 + (i % 3) * 14 + ((i * 7) % 5);
    const py = by - 12 - i * 7.4;
    g.beginPath(); g.moveTo(px - 3, py); g.lineTo(px + 3, py - 2); g.stroke();
  }
  // 꽃
  g.fillStyle = '#e85a7a';
  for (let i = 0; i < 5; i++){
    const ang = i * 1.256;
    g.beginPath(); g.ellipse(bx + Math.cos(ang) * 7, by - 122 + Math.sin(ang) * 5, 5, 3.4, ang, 0, 7); g.fill();
  }
  g.fillStyle = '#ffd94a';
  g.beginPath(); g.arc(bx, by - 122, 3.4, 0, 7); g.fill();
}

function paintCloudbush(g, w, h){

function drawTerrain(){
  const M = curMap(), th = M.theme;
  for (const d of M.decor) drawDecor(d, M.floor);

  ctx.fillStyle = th.ground;
  ctx.fillRect(-camX, M.floor, M.w, H - M.floor);
  // 지면 텍스처 (PNG 오버레이 타일 — 흙 입자·자갈·지층)
  const gt = typeof assetReady === 'function' ? assetReady('groundTex') : null;
  if (gt){
    const tw = gt.naturalWidth / 2, thh = gt.naturalHeight / 2;
    const x0 = Math.floor(camX / tw) * tw;
    for (let x = x0; x < camX + W + tw; x += tw){
      ctx.drawImage(gt, x - camX, M.floor, tw, thh);
    }
  } else {
    // 폴백: 흙 얼룩
    for (let i = 0; i < M.w / 46; i++){
      const px = i * 46 + h1(i) * 30 - camX;
      if (px < -20 || px > W + 20) continue;
      const py = M.floor + 22 + h1(i + 51) * 50;
      if (py > H - 6) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.beginPath(); ctx.ellipse(px, py, 7 + h1(i + 3) * 8, 4, 0, 0, 7); ctx.fill();
    }
  }
  // 잔디 층
  const gg = ctx.createLinearGradient(0, M.floor, 0, M.floor + 16);
  gg.addColorStop(0, th.grass);
  gg.addColorStop(1, th.ground);
  ctx.fillStyle = gg;
  ctx.fillRect(-camX, M.floor, M.w, 16);
  // 뒷층 풀: 키 큰 풀잎이 바람에 흔들림 (밝은 톤)
  ctx.fillStyle = shade(th.grass, 0.16);
  for (let x = 0; x < M.w; x += 36){
    const sx = x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const hh = 13 + h1(x + 7) * 12;
    const sway = Math.sin(game.time * 1.5 + x * 0.045) * 3;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.quadraticCurveTo(sx + 2, M.floor - hh * 0.6, sx + 3.5 + sway, M.floor - hh);
    ctx.lineTo(sx + 7, M.floor);
    ctx.fill();
  }
  // 중간층 풀: 촘촘한 포기
  ctx.fillStyle = th.grass;
  for (let x = 0; x < M.w; x += 30){
    const sx = x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const hh = 9 + h1(x) * 9;
    const sway = Math.sin(game.time * 1.8 + x * 0.06) * 2;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.quadraticCurveTo(sx + 3, M.floor - hh * 0.55, sx + 5 + sway, M.floor - hh);
    ctx.lineTo(sx + 11, M.floor);
    ctx.quadraticCurveTo(sx + 12, M.floor - hh * 0.4, sx + 14 + sway, M.floor - hh * 0.7);
    ctx.lineTo(sx + 19, M.floor);
    ctx.fill();
  }
  // 풀꽃/돌 (밝은 맵)
  if (M.bgm === 'town' || M.bgm === 'field'){
    for (let i = 0; i < M.w / 120; i++){
      const fx = i * 120 + h1(i + 77) * 90 - camX;
      if (fx < -20 || fx > W + 20) continue;
      if (h1(i + 91) < 0.5){
        ctx.fillStyle = h1(i + 13) < 0.5 ? '#ffde59' : '#ff8fb3';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 3, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 1.2, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'coast'){
    // 조개 / 불가사리
    for (let i = 0; i < M.w / 150; i++){
      const fx = i * 150 + h1(i + 57) * 110 - camX;
      if (fx < -20 || fx > W + 20) continue;
      const r = h1(i + 67);
      if (r < 0.35){
        // 조개
        ctx.fillStyle = '#f2e0c8';
        ctx.beginPath(); ctx.arc(fx, M.floor + 8, 6.5, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#c9a882'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx - 3.5, M.floor + 2.5);
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx, M.floor + 1.5);

    // 물웅덩이
    for (let i = 0; i < M.w / 260; i++){
      const fx = i * 260 + h1(i + 87) * 160 - camX;
      if (fx < -60 || fx > W + 60) continue;

        ctx.beginPath(); ctx.ellipse(fx, M.floor + 10, pw, 5.5, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.fillStyle = 'rgba(180,220,200,' + (0.12 + Math.sin(game.time * 1.2 + i) * 0.06) + ')';
        ctx.beginPath(); ctx.ellipse(fx - pw * 0.3, M.floor + 9, pw * 0.3, 2, 0, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'boss'){
    // 빛나는 독버섯
    for (let i = 0; i < M.w / 180; i++){
      const fx = i * 180 + h1(i + 27) * 120 - camX;
      if (fx < -20 || fx > W + 20) continue;

      }
    }
  }
  // 플랫폼 (나무 판자 + 잔디)
  for (const p of M.plats){
    const sx = p[0] - camX;
    if (sx + p[2] < -20 || sx > W + 20) continue;
    if (th.platStyle === 'cloud'){
      // 구름 발판: 뭉게 타원 겹침
      ctx.fillStyle = 'rgba(170,196,228,0.85)';
      ctx.beginPath(); ctx.ellipse(sx + p[2] / 2 + 3, p[1] + 12, p[2] / 2 + 4, 13, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffffff';
      for (let bxi = 0; bxi <= p[2]; bxi += 26){
        const brr = 15 + h1(p[0] + bxi) * 7;
        ctx.beginPath(); ctx.arc(sx + Math.min(bxi, p[2]), p[1] + 6, brr, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(sx + p[2] / 2, p[1] + 2, p[2] / 2 + 2, 9, 0, 0, 7); ctx.fill();
      continue;
    }
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    rr(sx + 3, p[1] + 15, p[2] - 6, 8, 4); ctx.fill();
    ctx.fillStyle = '#57381c';
    rr(sx + 1, p[1] + 11, p[2] - 2, 9, 4); ctx.fill();
    ctx.fillStyle = '#6e4a26';
    rr(sx, p[1], p[2], 17, 6); ctx.fill();
    // 널판 텍스처 (PNG 오버레이 — 나뭇결·못·옹이)
    const pt = typeof assetReady === 'function' ? assetReady('plankTex') : null;
    if (pt){
      ctx.save();
      rr(sx, p[1], p[2], 17, 6); ctx.clip();
      const ptw = pt.naturalWidth / 2;
      for (let px2 = 0; px2 < p[2]; px2 += ptw){
        ctx.drawImage(pt, sx + px2, p[1], ptw, 17);
      }
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for (let px = 14; px < p[2] - 6; px += 26){
        ctx.fillRect(sx + px, p[1] + 4, 2, 11);
      }
    }
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(sx + 2, p[1] + 1, p[2] - 4, 2.5);
    ctx.fillStyle = th.grass;
    rr(sx - 1, p[1] - 4, p[2] + 2, 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(sx - 1, p[1] - 4, p[2] + 2, 3, 2); ctx.fill();
    // 지면 투영 그림자 + 밑면 덩굴 (접지감)
    if (p[1] < M.floor - 40){
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.ellipse(sx + p[2] / 2, M.floor + 8, p[2] * 0.4, 5, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(60,90,45,0.5)'; ctx.lineWidth = 1.8;
      for (const vo of [0.25, 0.7]){
        const vx5 = sx + p[2] * vo;
        const vl = 9 + h1(p[0] + vo * 100) * 9;
        ctx.beginPath();
        ctx.moveTo(vx5, p[1] + 20);
        ctx.quadraticCurveTo(vx5 + 3 + Math.sin(game.time * 1.8 + p[0]) * 2, p[1] + 20 + vl * 0.6, vx5 + 1, p[1] + 20 + vl);
        ctx.stroke();
      }
    }
  }
  // 사다리 (로프)
  for (const l of M.ladders){
    const sx = l[0] - camX;
    if (sx < -30 || sx > W + 30) continue;
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(sx, l[1] + 6); ctx.lineTo(sx, l[2]); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx + 1.5, l[1]); ctx.lineTo(sx + 1.5, l[2]); ctx.stroke();
    ctx.fillStyle = '#6b4a2c';
    for (let y = l[1] + 10; y < l[2] - 4; y += 17){
      rr(sx - 10, y, 20, 5.5, 2.5); ctx.fill();
    }
  }
  // 포탈
  for (const p of M.portals){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    const pulse = Math.sin(game.time * 4) * 4;
    ctx.save();
    ctx.translate(sx, M.floor - 48);
    const pg = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
    pg.addColorStop(0, 'rgba(150,190,255,0.85)');
    pg.addColorStop(0.6, 'rgba(80,120,255,0.35)');
    pg.addColorStop(1, 'rgba(80,120,255,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(0, 0, 34 + pulse, 50, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7aa8ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 25 + pulse * 0.6, 42, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,225,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 30, Math.sin(game.time * 3) * 0.5, 0, 7); ctx.stroke();
    // 궤도 반짝이 입자 (가산)
    ctx.globalCompositeOperation = 'lighter';
    for (let oi = 0; oi < 5; oi++){
      const oa = game.time * 2.2 + oi * 1.257;
      const ox = Math.cos(oa) * (28 + pulse * 0.5);
      const oy = Math.sin(oa) * 44;
      const tw3 = 0.4 + Math.max(0, Math.sin(game.time * 5 + oi * 2)) * 0.6;
      ctx.fillStyle = 'rgba(190,220,255,' + tw3 + ')';
      ctx.beginPath(); ctx.arc(ox, oy, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    const REC_LV = { 5:' (권장 Lv13+)', 6:' (권장 Lv16+)', 7:' (권장 Lv20+)', 8:' (권장 Lv24+)', 9:' (권장 Lv24+)', 10:' (권장 Lv28+)', 11:' (보스 Lv30+)', 12:' (권장 Lv10+)', 13:' (권장 Lv13+)', 14:' (권장 Lv32+)', 15:' (보스 Lv36+)', 16:' (권장 Lv18+)', 17:' (권장 Lv21+)', 18:' (보스 Lv24+)', 19:' (권장 Lv20+)', 20:' (권장 Lv23+)', 21:' (권장 Lv36+)', 22:' (권장 Lv40+)', 23:' (보스 Lv43+)' };
    const ptxt = '↑ ' + MAPS[p.to].name + (REC_LV[p.to] || '');
    const ptw = ctx.measureText(ptxt).width;
    ctx.fillText(ptxt, Math.max(ptw / 2 + 8, Math.min(W - ptw / 2 - 8, sx)), M.floor - 108);
  }
  for (const n of M.npcs) drawNpc(n, M.floor);
}
// 전경 풀: 플레이어보다 앞에 그려져 발밑을 스치는 깊이감 (드문드문 큰 포기)
function drawGrassFront(){
  const M = curMap(), th = M.theme;
  ctx.fillStyle = shade(th.grass, -0.28);
  ctx.globalAlpha = 0.92;
  for (let x = 40; x < M.w; x += 130){
    const r = h1(x + 19);
    if (r < 0.35) continue;
    const sx = x + r * 40 - camX;
    if (sx < -40 || sx > W + 40) continue;
    const base = 16 + r * 14;
    const sway = Math.sin(game.time * 1.6 + x * 0.03) * 3.5;
    ctx.beginPath();
    for (let b = 0; b < 4; b++){
      const bx = sx + b * 6 - 9;
      const hh = base * (0.65 + h1(x + b) * 0.5);
      ctx.moveTo(bx, M.floor + 2);
      ctx.quadraticCurveTo(bx + 2, M.floor - hh * 0.55, bx + 4 + sway, M.floor - hh);
      ctx.lineTo(bx + 7.5, M.floor + 2);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawNpc(n, floor){
  const sx = n.x - camX;
  if (sx < -70 || sx > W + 70) return;
  const bob = Math.sin(game.time * 2) * 2;
  ctx.save();
  ctx.translate(sx, floor);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
  if (n.id && n.id.startsWith('sage')){
    // 전직관 현자: 후드 로브 + 지팡이 + 차수색 보주
    const tier = { sage2:2, sage3:3, sage4:4 }[n.id] || 2;
    const SAGE_COL = { 2:['#2e6e4a', '#1f4e34', '#3fc46a'], 3:['#7a5230', '#5a3a20', '#ff6a3a'], 4:['#3a5a7e', '#28425e', '#7ad8ff'] }[tier];
    // 로브
    ctx.fillStyle = SAGE_COL[0];
    ctx.beginPath();
    ctx.moveTo(-18, 0);
    ctx.quadraticCurveTo(-16, -40 + bob, -10, -48 + bob);
    ctx.lineTo(10, -48 + bob);
    ctx.quadraticCurveTo(16, -40 + bob, 18, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(30,25,20,0.7)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = SAGE_COL[1];
    ctx.fillRect(-18, -10, 36, 4);
    // 후드 + 어두운 얼굴 + 빛나는 눈
    ctx.fillStyle = SAGE_COL[0];
    ctx.beginPath(); ctx.arc(0, -52 + bob, 15, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -48 + bob, 14, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a1410';
    ctx.beginPath(); ctx.ellipse(1, -49 + bob, 9.5, 7.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = SAGE_COL[2];
    ctx.beginPath(); ctx.arc(-2, -50 + bob, 1.8, 0, 7); ctx.arc(5, -50 + bob, 1.8, 0, 7); ctx.fill();
    // 수염
    ctx.fillStyle = '#d8d8d0';
    ctx.beginPath();
    ctx.moveTo(-5, -42 + bob); ctx.quadraticCurveTo(0, -26 + bob, 2, -40 + bob);
    ctx.closePath(); ctx.fill();
    // 지팡이 + 부유 보주 (차수색 가산 글로우)
    ctx.strokeStyle = '#6e4a26'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(20, -2); ctx.lineTo(22, -56 + bob); ctx.stroke();
    ctx.lineCap = 'butt';
    const orbY = -64 + bob + Math.sin(game.time * 2.6) * 3;
    ctx.globalCompositeOperation = 'lighter';
    const og5 = ctx.createRadialGradient(22, orbY, 1, 22, orbY, 13);
    og5.addColorStop(0, SAGE_COL[2]);
    og5.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = og5;
    ctx.beginPath(); ctx.arc(22, orbY, 13, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = SAGE_COL[2];
    ctx.beginPath(); ctx.arc(22, orbY, 5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath(); ctx.arc(20.5, orbY - 1.5, 1.8, 0, 7); ctx.fill();
  } else if (n.id === 'chief'){
    // 몸 (녹색 도포)
    ctx.fillStyle = '#4a6e3a';
    rr(-16, -44 + bob, 32, 44 - bob, 9); ctx.fill();
    ctx.fillStyle = '#3a5a2e';
    ctx.fillRect(-16, -20 + bob, 32, 5);
    // 팔
    ctx.fillStyle = '#3f5f32';
    rr(-21, -40 + bob, 7, 15, 3.5); ctx.fill();
    rr(14, -40 + bob, 7, 15, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-17.5, -25 + bob, 3.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(17.5, -25 + bob, 3.4, 0, 7); ctx.fill();
    // 팔짱
    ctx.fillStyle = '#5a7e48';
    rr(-14, -36 + bob, 28, 9, 4); ctx.fill();
    // 머리
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, -56 + bob, 14, 0, 7); ctx.fill();
    // 흰 수염
    ctx.fillStyle = '#eee';
    ctx.beginPath();
    ctx.moveTo(-9, -50 + bob);
    ctx.quadraticCurveTo(0, -34 + bob, 9, -50 + bob);
    ctx.quadraticCurveTo(0, -46 + bob, -9, -50 + bob);
    ctx.fill();
    // 밀짚모자
    ctx.fillStyle = '#c9a25a';
    ctx.beginPath(); ctx.ellipse(0, -65 + bob, 21, 6.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#d9b06a';
    ctx.beginPath(); ctx.ellipse(0, -68 + bob, 11, 8, 0, Math.PI, 0); ctx.fill();
    // 눈
    ctx.fillStyle = '#3a2a1e';
    ctx.beginPath(); ctx.arc(-5, -58 + bob, 1.8, 0, 7); ctx.arc(5, -58 + bob, 1.8, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#6e3f96';
    rr(-15, -42 + bob, 30, 42 - bob, 9); ctx.fill();
    ctx.fillStyle = '#5a3080';
    ctx.fillRect(-15, -18 + bob, 30, 5);
    // 팔
    ctx.fillStyle = '#5c3382';
    rr(-20, -38 + bob, 7, 15, 3.5); ctx.fill();
    rr(13, -38 + bob, 7, 15, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-16.5, -23 + bob, 3.4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(16.5, -23 + bob, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#f5c542';
    ctx.beginPath(); ctx.arc(-7, -30 + bob, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, -52 + bob, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a2a6e';
    ctx.beginPath(); ctx.moveTo(-17, -57 + bob); ctx.lineTo(17, -57 + bob); ctx.lineTo(2, -84 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a3a8e';
    ctx.beginPath(); ctx.ellipse(0, -57 + bob, 17, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a2a1e';
    ctx.beginPath(); ctx.arc(-5, -53 + bob, 1.8, 0, 7); ctx.arc(5, -53 + bob, 1.8, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(0, -47 + bob, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();
  // 명찰 (근처 플랫폼과 겹치면 위로 회피)
  let labelY = floor - 104;
  for (const p of curMap().plats){
    if (n.x > p[0] - 40 && n.x < p[0] + p[2] + 40 && p[1] > floor - 130 && p[1] < floor - 80){
      labelY = p[1] - 26;
      break;
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  const NPC_LABEL = { chief:'촌장 (↑)', merchant:'상인 (↑)', sage2:'숲의 현자 (↑)', sage3:'거인의 현자 (↑)', sage4:'설산의 은자 (↑)' };
  const label = NPC_LABEL[n.id] || '(↑)';
  rr(sx - 34, labelY, 68, 20, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(label, sx, labelY + 14);
  if (n.id && n.id.startsWith('sage')){
    const tier = { sage2:2, sage3:3, sage4:4 }[n.id];
    const can = tier === 2 ? (player.job !== 'beginner' && !player.job2 && player.level >= 15)
      : tier === 3 ? (player.job2 && !player.job3 && player.level >= 20)
      : (player.job3 && !player.job4 && player.level >= 28);
    if (can){
      const my = floor - 120 + Math.sin(game.time * 3) * 3;
      ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,0.85)';
      ctx.strokeText('!', sx, my);
      ctx.fillStyle = '#ffd94a';
      ctx.fillText('!', sx, my);
    }
  }
  if (n.id === 'chief'){
    const cs = chainState();
    let mark = null, color = '#ffd94a';
    if (cs.status === 'avail') mark = '!';
    else if (cs.status === 'complete') mark = '?';
    else if (cs.status === 'active'){ mark = '?'; color = '#b0b0b0'; }
    else if (cs.status === 'locked' && player.job === 'beginner' && player.level >= 8) mark = '!';
    if (mark){
      const my = floor - 120 + Math.sin(game.time * 3) * 3;
      ctx.font = 'bold 28px sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,0,0.85)';
      ctx.strokeText(mark, sx, my);
      ctx.fillStyle = color;
      ctx.fillText(mark, sx, my);
    }
  }
}

function drawDropBeam(sx, y, color){
  // 희귀 드랍 빛기둥
  ctx.globalCompositeOperation = 'lighter';
  const bg4 = ctx.createLinearGradient(sx - 16, 0, sx + 16, 0);
  const pulse = 0.35 + Math.sin(game.time * 5 + sx) * 0.12;
  bg4.addColorStop(0, 'rgba(255,255,255,0)');
  bg4.addColorStop(0.5, color.replace('ALPHA', String(pulse)));
  bg4.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bg4;
  ctx.fillRect(sx - 16, y - 150, 32, 150);
  ctx.globalCompositeOperation = 'source-over';
}
function drawDrops(){
  for (const d of drops){
    const sx = d.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const bob = d.vy === 0 ? Math.sin(game.time * 5 + d.x) * 3 : 0;
    if (d.kind === 'meso'){
      ctx.save();
      ctx.translate(sx, d.y - 9 + bob);
      const sq = Math.abs(Math.sin(game.time * 3 + d.x));
      ctx.scale(0.4 + sq * 0.6, 1);
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-2.5, -3, 2, 0, 7); ctx.fill();
      ctx.restore();
    } else if (d.kind === 'equip'){
      const def = ITEMS[d.item.id];
      const col = RARITIES[d.item.rar].color;
      // 희귀 이상은 빛기둥 (등급별 색)
      if (d.item.rar >= 2 && d.vy === 0){
        const beamCol = d.item.rar >= 4 ? 'rgba(255,217,74,ALPHA)' : (d.item.rar === 3 ? 'rgba(255,154,58,ALPHA)' : 'rgba(199,122,255,ALPHA)');
        drawDropBeam(sx, d.y, beamCol);
      }
      ctx.save();
      ctx.translate(sx, d.y - 13 + bob);
      ctx.rotate(Math.sin(game.time * 2 + d.x) * 0.2);
      if (def.slot === 'weapon'){
        ctx.rotate(-0.6);
        ctx.fillStyle = '#c8ccd8'; rr(-3, -16, 6, 24, 2); ctx.fill();
        ctx.fillStyle = '#e8ecf8'; rr(-3, -16, 2.5, 24, 1); ctx.fill();
        ctx.fillStyle = '#c8901a'; rr(-7, 8, 14, 4, 2); ctx.fill();
        ctx.fillStyle = '#6b4a2c'; rr(-2, 12, 4, 7, 2); ctx.fill();
      } else {
        ctx.fillStyle = '#9a8a7a';
        rr(-10, -9, 20, 17, 5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        rr(-10, -9, 20, 5, 3); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5 + Math.sin(game.time * 6) * 0.3;
      ctx.beginPath(); ctx.arc(sx, d.y - 13 + bob, 16, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = d.kind === 'hpPot' ? '#e84545' : '#4576e8';
      ctx.beginPath();
      ctx.arc(sx, d.y - 10 + bob, 7, 0, 7);
      ctx.fill();
      ctx.fillRect(sx - 4, d.y - 18 + bob, 8, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(sx - 2.5, d.y - 12 + bob, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9a25a';
      rr(sx - 3.5, d.y - 22 + bob, 7, 5, 1.5); ctx.fill();
    }
  }
}

// 몬스터 본체 디스패치 (인게임 + 도감 공용)
function drawMonsterBody(m, t, flash){
  if (m.type === 'snail' || m.type === 'rsnail') drawSnail(m, t, flash);
  else if (m.type === 'slime') drawSlime(m, t, flash);
  else if (m.type === 'shroom') drawShroom(m, t, flash);
  else if (m.type === 'pig') drawPig(m, t, flash);
  else if (m.type === 'boar') drawBoar(m, t, flash, false);
  else if (m.type === 'ironhog') drawBoar(m, t, flash, true);
  else if (m.type === 'lupin') drawLupin(m, t, flash);
  else if (m.type === 'golem' || m.type === 'igolem') drawGolem(m, t, flash, m.type === 'igolem');
  else if (m.type === 'clam') drawClam(m, t, flash);
  else if (m.type === 'octo') drawOcto(m, t, flash);
  else if (m.type === 'fang') drawFang(m, t, flash);
  else if (m.type === 'pepe') drawPepe(m, t, flash);
  else if (m.type === 'tick') drawTick(m, t, flash);
