function drawBar(x, y, w, h, ratio, c1, c2, label){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rr(x, y, w, h, h / 2); ctx.fill();
  if (ratio > 0.005){
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    rr(x + 2, y + 2, Math.max(4, (w - 4) * Math.min(1, ratio)), h - 4, (h - 4) / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(x + 3, y + 2.5, Math.max(3, (w - 6) * Math.min(1, ratio)), (h - 5) * 0.4, 2); ctx.fill();
  }
  if (label){
    ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.strokeText(label, x + w / 2, y + h - 2.5);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x + w / 2, y + h - 2.5);
  }
}
// 퀵슬롯 배치 (HUD 그리기와 드래그 드롭이 공유)
function quickslotRects(){
  const d1 = mySkills(), d2 = mySkills2(), d3 = mySkills3(), d4 = mySkills4();
  const sw2 = d3 ? 38 : (d2 ? 46 : 52);
  const gap = d3 ? 3 : (d2 ? 4 : 6);
  let qx = d3 ? 300 : (d2 ? 336 : 360);
  const rects = [{ key:'Z', x:qx, y:H - 76 + 12, w:sw2, h:52 }];
  qx += sw2 + gap;
  const unlocked = { 1:true, 2:!!d2, 3:!!d3, 4:!!d4 };
  for (const k of BIND_KEYS){
    if (!unlocked[KEY_TIER[k]]) continue;
    rects.push({ key:k, x:qx, y:H - 76 + 12, w:sw2, h:52 });
    qx += sw2 + gap;
  }
  return rects;
}
function drawHUD(){
  const M = curMap();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(12, 12, 260, 30, 8); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(M.name, 24, 33);
  const cs = chainState();
  let goal = '';
  if (cs.status === 'alldone') goal = game.cleared ? '모든 퀘스트 완료! 자유 사냥' : '머쉬맘을 처치하라';
  else if (cs.status === 'avail') goal = '촌장에게서 퀘스트를 받으세요';
  else if (cs.status === 'locked') goal = '다음 퀘스트: Lv' + cs.q.minLv + ' 달성';
  else if (cs.status === 'active'){
    const qs = player.quests[cs.q.id];
    goal = cs.q.name + ': ' + MTYPES[cs.q.need.t].name + ' ' + qs.c + '/' + cs.q.need.n;
  }
  else if (cs.status === 'complete') goal = cs.q.name + ' 완료! 촌장에게 보고';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '12px sans-serif';
  ctx.fillText(goal, 24, 58);
  // 미니맵 (지형 실루엣 + 마커 체계)
  const mmW = 190, mmH = 48, mmX = W - mmW - 14, mmY = 12;
  ctx.fillStyle = 'rgba(10,12,24,0.72)';
  rr(mmX - 5, mmY - 5, mmW + 10, mmH + 10, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(245,197,66,0.55)'; ctx.lineWidth = 1.5;
  rr(mmX - 5, mmY - 5, mmW + 10, mmH + 10, 9); ctx.stroke();
  const mscale = mmW / M.w;
  const myOf = wy2 => mmY + mmH - 8 - (M.floor - wy2) * (mmH - 14) / 330;
  const mclamp = v => Math.max(mmY + 2, Math.min(mmY + mmH - 4, v));
  // 지면 라인 + 발판 실루엣
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(mmX, mmY + mmH - 6); ctx.lineTo(mmX + mmW, mmY + mmH - 6); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (const p of M.plats){
    ctx.fillRect(mmX + p[0] * mscale, mclamp(myOf(p[1])), Math.max(2, p[2] * mscale), 1.5);
  }
  // 포탈(파랑 세로) / NPC(노랑) / 몬스터(빨강) / 보스(큰 빨강)
  ctx.fillStyle = '#5aa0ff';
  for (const p of M.portals) ctx.fillRect(mmX + p.x * mscale - 1.5, mmY + mmH - 14, 3, 9);
  ctx.fillStyle = '#ffd94a';
  for (const n of M.npcs){ ctx.beginPath(); ctx.arc(mmX + n.x * mscale, mmY + mmH - 9, 2.2, 0, 7); ctx.fill(); }
  for (const m of monsters){
    if (m.dead) continue;
    ctx.fillStyle = m.T.isBoss ? '#ff4a3a' : 'rgba(255,106,106,0.9)';
    const mr = m.T.isBoss ? 3.4 : 1.8;
    ctx.beginPath(); ctx.arc(mmX + Math.max(2, Math.min(mmW - 2, m.x * mscale)), mclamp(myOf(m.y)), mr, 0, 7); ctx.fill();
  }
  // 플레이어: 흰 점 + 링
  const pmx = mmX + Math.max(3, Math.min(mmW - 3, player.x * mscale));
  const pmy = mclamp(myOf(player.y));
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(pmx, pmy, 2.6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pmx, pmy, 4.6 + Math.sin(game.time * 4) * 1, 0, 7); ctx.stroke();
  // 버프
  let bx = W - 14 - 34;
  const BUFF_ICON = {
    rage:['분노','#e05a4a'], focus:['집중','#5ac25a'], shield:['보호','#6a8ae0'],
    iron:['철벽','#a8a8c0'], hawk:['호크','#5ad48a'], bless:['축복','#e8c84a'],
    haste:['신속','#c05ae0'], cloak:['은신','#7a5a9e'], wh:['심장','#ff7a5a'],
    se:['예리','#3ae87a'], hs:['심볼','#ffd83a'], sp:['분신','#8a5ae0'],
    en:['격노','#ff4a2a'], wq:['질풍','#3ae8c8'], inf:['무한','#ffe83a'], sdm:['그림자','#6a2ae8'],
    fz:['광란','#e04a2a'], aim:['조준','#2a9e8a'], amp:['증폭','#e06a3a'], sstep:['발놀림','#7a5ae0'],
  };
  for (const id in player.buffs){
    const b = player.buffs[id];
    const info = BUFF_ICON[id] || ['?', '#888'];
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    rr(bx, 68, 34, 40, 6); ctx.fill();
    ctx.fillStyle = info[1];
    rr(bx + 3, 71, 28, 24, 5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(info[0], bx + 17, 87);
    ctx.font = '10px sans-serif';
    ctx.fillText(Math.ceil(b.t) + 's', bx + 17, 104);
    bx -= 40;
  }
  // 메소
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(W - 190, mmY + mmH + 14, 176, 28, 8); ctx.fill();
  ctx.fillStyle = '#f5c542';
  ctx.beginPath(); ctx.arc(W - 172, mmY + mmH + 28, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W - 172, mmY + mmH + 28, 5, 0, 7); ctx.stroke();
  ctx.fillStyle = '#ffe28a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(player.meso.toLocaleString() + ' 메소', W - 158, mmY + mmH + 33);
  // 콤보
  if (player.combo.n >= 3){
    const cpop = player.combo.t > 2.05 ? 1 + (player.combo.t - 2.05) * 3 : 1;
    ctx.textAlign = 'right';
    ctx.font = '900 ' + Math.round(30 * cpop) + 'px sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(60,20,0,0.85)';
    ctx.strokeText(player.combo.n + ' COMBO', W - 30, 200);
    const cg = ctx.createLinearGradient(0, 170, 0, 205);
    cg.addColorStop(0, '#fff0b0'); cg.addColorStop(1, '#f0921e');
    ctx.fillStyle = cg;
    ctx.fillText(player.combo.n + ' COMBO', W - 30, 200);
  }
  // 알림
  ctx.font = 'bold 14px sans-serif';
  for (let i = 0; i < game.notifs.length; i++){
    const n = game.notifs[i];
    const a = Math.min(1, n.t);
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    const tw = ctx.measureText(n.txt).width + 40;
    rr(W / 2 - tw / 2, 90 + i * 34, tw, 28, 8); ctx.fill();
    ctx.fillStyle = '#ffe9a8'; ctx.textAlign = 'center';
    ctx.fillText(n.txt, W / 2, 109 + i * 34);
    ctx.globalAlpha = 1;
  }
  // 보스 HP
  const boss = monsters.find(m => m.T.isBoss && !m.dead);
  if (boss){
    const bw = 520;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rr(W / 2 - bw / 2 - 6, 66, bw + 12, 32, 8); ctx.fill();
    ctx.fillStyle = '#3a1010';
    ctx.fillRect(W / 2 - bw / 2, 80, bw, 12);
    // 데미지 칩: 깎인 HP가 잔상으로 남았다가 따라 줄어듦
    if (boss.chip == null || boss.chip < boss.hp) boss.chip = boss.hp;
    const cdt2 = Math.min(0.05, Math.max(0.001, game.time - (boss.chipT || game.time)));
    boss.chipT = game.time;
    boss.chip += (boss.hp - boss.chip) * (1 - Math.pow(0.06, cdt2));
    ctx.fillStyle = '#f0a03a';
    ctx.fillRect(W / 2 - bw / 2, 80, bw * Math.max(0, boss.chip / boss.maxHp), 12);
    const bg3 = ctx.createLinearGradient(0, 80, 0, 92);
    bg3.addColorStop(0, '#f05a5a'); bg3.addColorStop(1, '#b82a2a');
    ctx.fillStyle = bg3;
    ctx.fillRect(W / 2 - bw / 2, 80, bw * Math.max(0, boss.hp / boss.maxHp), 12);
    ctx.fillStyle = '#ffe9a8'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.max(0, Math.ceil(boss.hp / boss.maxHp * 100)) + '%', W / 2 + bw / 2 + 2, 78);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
    for (let i = 1; i < 10; i++){
      ctx.beginPath();
      ctx.moveTo(W / 2 - bw / 2 + bw * i / 10, 80);
      ctx.lineTo(W / 2 - bw / 2 + bw * i / 10, 92);
      ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(boss.T.name, W / 2, 78);
  }
  // 하단 바
  const bh = 76;
  const hg = ctx.createLinearGradient(0, H - bh, 0, H);
  hg.addColorStop(0, 'rgba(24,18,40,0.92)');
  hg.addColorStop(1, 'rgba(14,10,26,0.95)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, H - bh, W, bh);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, H - bh); ctx.lineTo(W, H - bh); ctx.stroke();
  const lg3 = ctx.createLinearGradient(0, H - bh + 12, 0, H - bh + 42);
  lg3.addColorStop(0, '#ffe28a'); lg3.addColorStop(1, '#e8a02e');
  ctx.fillStyle = lg3;
  rr(14, H - bh + 12, 66, 30, 8); ctx.fill();
  ctx.fillStyle = '#3a2a00'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Lv.' + player.level, 47, H - bh + 33);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('단풍 용사 · ' + jobDisplayName(), 90, H - bh + 22);
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '11px sans-serif';
  ctx.fillText('공격력 ' + totalAtk() + '  방어 ' + totalDef() + '  EXP ' + (player.exp / expNeed() * 100).toFixed(1) + '%' + (player.sp > 0 ? '  SP ' + player.sp + ' (K)' : ''), 90, H - bh + 39);
  drawBar(90, H - bh + 46, 175, 11, player.hp / maxHp(), '#ff7a7a', '#d42a2a', Math.ceil(player.hp) + '/' + maxHp());
  drawBar(90, H - bh + 60, 175, 11, player.mp / maxMp(), '#7ab0ff', '#2a5ed4', Math.ceil(player.mp) + '/' + maxMp());
  // 퀵슬롯 (바인딩 기반 — 스킬창에서 드래그로 재배치 가능)
  const defs = mySkills();
  const defs2 = mySkills2();
  const defs3 = mySkills3();
  const defs4 = mySkills4();
  const SLOT_LABELS = { ps:'파워', sb:'슬래시', rage:'분노', ds:'더블샷', ab:'애로봄', focus:'집중',
    mc:'매직', tb:'썬더', shield:'보호막', bd:'브랜디', swv:'파동', ib:'철벽',
    sf:'연사', arn:'화살비', hk:'호크', ha:'홀리', heal:'힐', bl:'축복',
    l7:'럭키7', sv:'새비지', haste:'신속', ts:'트리플', sdash:'대시', cloak:'은신',
    bs:'브레', eq:'대지', wh:'심장', hur:'폭풍', phx:'피닉', se:'샤프',
    sr:'레이', ang:'천사', hs:'심볼', ss:'수리검', sp:'분신', sm:'연막',
    rb:'레이징', en:'격노', ca:'천벌', wq:'질풍', gen:'제네', inf:'무한', qd:'쿼드', sdm:'그림자',
    rst:'레이지', bw:'흡혈', fz:'광란', bolt:'볼트', exar:'파열', aim:'조준', fb:'화염구', chl:'체인', amp:'증폭', dstab:'스탭', mbomb:'메소봄', sstep:'발놀림' };
  const rects = quickslotRects();
  const jobCol = player.job !== 'beginner' ? JOBS[player.job].color : '#8a94b8';
  let lastRect = rects[0];
  for (const r of rects){
    lastRect = r;
    const sy0 = r.y, sw2 = r.w, qx = r.x;
    let sl;
    if (r.key === 'Z'){
      sl = { key:'Z', name:'기본', cd:player.cdBasic, cdMax:0.4, ok:true };
    } else {
      const bid = bindOf(r.key);
      const d = bid ? skillDefById(bid) : null;
      sl = d
        ? { key:r.key, name:SLOT_LABELS[d.id] || d.name.slice(0, 4), cd:player.cds[d.id] || 0, cdMax:d.cd, ok: skillLevel(d.id) > 0 && player.mp >= d.mp }
        : { key:r.key, name:'-', cd:0, cdMax:1, ok:false };
    }
    ctx.fillStyle = sl.ok ? 'rgba(52,64,116,0.5)' : 'rgba(255,255,255,0.04)';
    rr(qx, sy0, sw2, 52, 8); ctx.fill();
    ctx.fillStyle = sl.ok ? 'rgba(120,145,215,0.22)' : 'rgba(255,255,255,0.03)';
    rr(qx + 2, sy0 + 2, sw2 - 4, 13, 6); ctx.fill();
    ctx.strokeStyle = sl.ok ? 'rgba(160,190,255,0.4)' : 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    rr(qx + 0.5, sy0 + 0.5, sw2 - 1, 51, 8); ctx.stroke();
    // 드래그 중: 드롭 가능한 슬롯 금색 하이라이트
    if (game.drag && r.key !== 'Z'){
      ctx.strokeStyle = 'rgba(255,217,74,' + (0.5 + Math.sin(game.time * 6) * 0.3) + ')';
      ctx.lineWidth = 2;
      rr(qx + 1, sy0 + 1, sw2 - 2, 50, 8); ctx.stroke();
    }
    if (sl.ok && sl.cd <= 0){
      ctx.fillStyle = jobCol;
      rr(qx + 5, sy0 + 46, sw2 - 10, 3, 1.5); ctx.fill();
    }
    ctx.fillStyle = sl.ok && !(sl.cd > 0.95) ? '#eaf0ff' : 'rgba(255,255,255,0.25)';
    ctx.font = 'bold ' + (defs3 ? 10 : (defs2 ? 11 : 12)) + 'px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(sl.name, qx + sw2 / 2, H - bh + 37);
    if (sl.cd > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.62)';
      const r2 = Math.min(1, sl.cd / sl.cdMax);
      ctx.save();
      rr(qx, sy0, sw2, 52, 8); ctx.clip();
      ctx.fillRect(qx, sy0 + 52 * (1 - r2), sw2, 52 * r2);
      ctx.restore();
      if (sl.cd > 0.95){
        ctx.font = 'bold 16px sans-serif';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.75)';
        ctx.strokeText(Math.ceil(sl.cd), qx + sw2 / 2, sy0 + 34);
        ctx.fillStyle = '#ffe9a8';
        ctx.fillText(Math.ceil(sl.cd), qx + sw2 / 2, sy0 + 34);
      }
    }
    // 키캡
    ctx.fillStyle = 'rgba(12,10,26,0.85)';
    rr(qx + sw2 / 2 - 11, H - bh + 52, 22, 14, 4); ctx.fill();
    ctx.fillStyle = sl.ok ? '#ffd94a' : 'rgba(255,255,255,0.4)'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(sl.key, qx + sw2 / 2, H - bh + 62);
  }
  // 물약 4칸 (1빨간/2파란/3엘릭서/4마나엘릭서)
  const pw = defs3 ? 40 : 46;
  let px3 = lastRect.x + lastRect.w + 8;
  for (const [keyLbl, pk] of [['1','hp'], ['2','mp'], ['3','hp2'], ['4','mp2']]){
    const P = POTIONS[pk];
    const cnt = player.potions[pk] || 0;
    const big = pk === 'hp2' || pk === 'mp2';
    ctx.fillStyle = cnt > 0 ? 'rgba(52,64,116,0.4)' : 'rgba(255,255,255,0.05)';
    rr(px3, H - bh + 12, pw, 52, 8); ctx.fill();
    // 병
    ctx.fillStyle = P.color;
    if (big){
      ctx.beginPath(); ctx.arc(px3 + pw / 2, H - bh + 30, 8.5, 0, 7); ctx.fill();
      ctx.fillRect(px3 + pw / 2 - 3.5, H - bh + 17, 7, 7);
    } else {
      rr(px3 + pw / 2 - 8, H - bh + 20, 16, 18, 5); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(px3 + pw / 2 - 3, H - bh + 26, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c9a25a'; ctx.fillRect(px3 + pw / 2 - 3.5, H - bh + 15, 7, 4);
    const cdR = player.potionCd[P.grp] / POTION_CD[P.grp];
    if (cdR > 0){
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.save();
      rr(px3, H - bh + 12, pw, 52, 8); ctx.clip();
      ctx.fillRect(px3, H - bh + 12 + 52 * (1 - Math.min(1, cdR)), pw, 52 * Math.min(1, cdR));
      ctx.restore();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('x' + cnt, px3 + pw / 2, H - bh + 50);
    ctx.fillStyle = 'rgba(12,10,26,0.85)';
    rr(px3 + pw / 2 - 9, H - bh + 52, 18, 14, 4); ctx.fill();
    ctx.fillStyle = cnt > 0 ? '#ffd94a' : 'rgba(255,255,255,0.4)'; ctx.font = 'bold 10px sans-serif';
    ctx.fillText(keyLbl, px3 + pw / 2, H - bh + 62);
    px3 += pw + 4;
  }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  if (defs2){
    ctx.fillText('E인벤 K스킬 S스탯 L퀘스트 M소리' + (isMuted() ? 'OFF' : ''), px3 + 8, H - bh + 30);
    ctx.fillText('↑포탈·NPC ↓엎드리기' + (game.bossRespawn > 0 ? '  보스 ' + Math.ceil(game.bossRespawn) + '초' : ''), px3 + 8, H - bh + 50);
  } else {
    ctx.fillText('E 인벤토리  K 스킬  S 스탯  L 퀘스트  M 소리' + (isMuted() ? ' OFF' : ''), px3 + 8, H - bh + 30);
    ctx.fillText('Space 점프x2  ↓ 엎드리기' + (game.bossRespawn > 0 ? '   보스 리스폰 ' + Math.ceil(game.bossRespawn) + '초' : ''), px3 + 8, H - bh + 50);
  }
  // EXP 바 (+ 흐르는 반짝임)
  ctx.fillStyle = '#2a2438';
  ctx.fillRect(0, H - 8, W, 8);
  const expW = W * Math.min(1, player.exp / expNeed());
  const eg2 = ctx.createLinearGradient(0, H - 8, 0, H);
  eg2.addColorStop(0, '#ffe86a'); eg2.addColorStop(1, '#d8b012');
  ctx.fillStyle = eg2;
  ctx.fillRect(0, H - 8, expW, 8);
  if (expW > 40){
    const shX = (game.time * 260) % (expW + 120) - 60;
    const shG = ctx.createLinearGradient(shX - 40, 0, shX + 40, 0);
    shG.addColorStop(0, 'rgba(255,255,255,0)');
    shG.addColorStop(0.5, 'rgba(255,255,255,0.5)');
    shG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.save();
    ctx.beginPath(); ctx.rect(0, H - 8, expW, 8); ctx.clip();
    ctx.fillStyle = shG;
    ctx.fillRect(shX - 40, H - 8, 80, 8);
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++){
    ctx.beginPath(); ctx.moveTo(W * i / 10, H - 8); ctx.lineTo(W * i / 10, H); ctx.stroke();
  }
  // 레벨업 임박: EXP 93%+ 시 펄스 + 안내
  if (player.exp / expNeed() > 0.93){
    const lp = 0.25 + Math.abs(Math.sin(game.time * 5)) * 0.45;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,232,106,' + lp * 0.4 + ')';
    ctx.fillRect(0, H - 8, expW, 8);
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'right';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(60,40,0,0.8)';
    ctx.strokeText('레벨업 임박!', W - 12, H - 14);
    ctx.fillStyle = 'rgba(255,232,106,' + (0.6 + lp * 0.4) + ')';
    ctx.fillText('레벨업 임박!', W - 12, H - 14);
  }
}

function drawOverlays(){
  // 비네트 (캐시된 오프스크린 — 매 프레임 그라디언트 생성 제거)
  const vc = vigCanvas();
  if (vc) ctx.drawImage(vc, 0, 0);
  // 저체력 경고: 붉은 맥동 테두리 (캐시 + 알파 변조)
  if (game.state === 'play' && player.hp < maxHp() * 0.25 && player.hp > 0){
    const pulse = 0.16 + Math.abs(Math.sin(game.time * 3.2)) * 0.2;
    const lc = lowHpCanvas();
    if (lc){
      ctx.globalAlpha = pulse;
      ctx.drawImage(lc, 0, 0);
      ctx.globalAlpha = 1;
    }
  }
  if (game.flash > 0){
    ctx.fillStyle = 'rgba(255,255,240,' + (game.flash / 0.13) * 0.45 + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (game.state === 'pause'){
    ctx.fillStyle = 'rgba(10,8,20,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('일시정지', W / 2, H / 2 - 10);
    ctx.font = '16px sans-serif';
    ctx.fillText('P 또는 Enter로 계속', W / 2, H / 2 + 30);
  }
  if (game.state === 'dead'){
    ctx.fillStyle = 'rgba(40,0,0,' + Math.min(0.7, game.deadTimer) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff6a6a'; ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('쓰러졌다...', W / 2, H / 2 - 10);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '16px sans-serif';
    ctx.fillText('경험치 일부를 잃고 맵 입구에서 부활합니다', W / 2, H / 2 + 28);
  }
  if (game.state === 'victory'){
    ctx.fillStyle = 'rgba(20,10,40,0.65)';
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createLinearGradient(0, H / 2 - 80, 0, H / 2 - 20);
    vg.addColorStop(0, '#fff0b0'); vg.addColorStop(1, '#f0a02e');
    ctx.font = '900 54px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(90,40,0,0.9)';
    ctx.strokeText('머쉬맘 처치!', W / 2, H / 2 - 40);
    ctx.fillStyle = vg;
    ctx.fillText('머쉬맘 처치!', W / 2, H / 2 - 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText('단풍 숲의 평화를 되찾았다', W / 2, H / 2 + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '15px sans-serif';
    ctx.fillText('Enter를 눌러 계속 (촌장에게 보고하는 것을 잊지 마세요)', W / 2, H / 2 + 44);
  }
  if (game.fade > 0){
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, game.fade) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
function drawMiniChar(x, y, job){
  const st = JOB_STYLE[job];
  const bob = Math.sin(game.time * 2 + x) * 1.6;
  ctx.save();
  ctx.translate(x, y + bob * 0.4);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, 14, 4.5, 0, 0, 7); ctx.fill();
  // 다리
  ctx.fillStyle = st.pants;
  rr(-9, -14, 8, 14, 3); ctx.fill();
  rr(2, -14, 8, 14, 3); ctx.fill();
  ctx.fillStyle = st.shoe;
  rr(-10, -5, 10, 5, 2); ctx.fill();

'use strict';

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 마우스 ----------
let mouseX = -1, mouseY = -1;
let pendingClick = null;
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', e => {
  audioUnlock();
  const p = canvasPos(e);
  pendingClick = p;
});
canvas.addEventListener('mouseup', e => {
  const p = canvasPos(e);
  if (game.drag){
    for (const r of quickslotRects()){
      if (r.key !== 'Z' && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h){
        setBind(r.key, game.drag.id);
        break;
      }
    }
    game.drag = null;
  }
});
canvas.addEventListener('mouseleave', () => { game.drag = null; });

// 즉시 모드 버튼: 그리고, 클릭됐으면 true
function btn(x, y, w, h, label, opts){
  opts = opts || {};
  const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  const enabled = opts.enabled !== false;
  ctx.fillStyle = enabled ? (hover ? (opts.hoverColor || '#5a6ea8') : (opts.color || '#3a4a7a')) : '#3a3a44';
  rr(x, y, w, h, 7); ctx.fill();
  // 상단 글로시 하이라이트
  ctx.fillStyle = enabled ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.05)';
  rr(x + 2, y + 2, w - 4, Math.max(4, h * 0.38), 5); ctx.fill();
  ctx.strokeStyle = enabled ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 7); ctx.stroke();
  ctx.fillStyle = enabled ? '#fff' : 'rgba(255,255,255,0.4)';
  ctx.font = 'bold ' + (opts.font || 14) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 5);
  if (enabled && pendingClick && pendingClick.x >= x && pendingClick.x <= x + w && pendingClick.y >= y && pendingClick.y <= y + h){
    pendingClick = null;
    return true;
  }
  return false;
}
function windowFrame(x, y, w, h, title){
  ctx.fillStyle = 'rgba(10,8,20,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#242038';

  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;

}
function itemLabel(inst){
  return ITEMS[inst.id].name + (itemUp(inst) > 0 ? ' +' + itemUp(inst) : '') + (inst.rar > 0 ? ' [' + RARITIES[inst.rar].name + ']' : '');
}
function itemStatText(inst){
  const def = ITEMS[inst.id];
  const parts = [];
  if (def.atk) parts.push('공격력 +' + (def.atk + RARITIES[inst.rar].bonus));
  if (def.def) parts.push('방어 +' + (def.def + RARITIES[inst.rar].bonus));
  if (def.spd) parts.push('이속 +' + (def.spd + RARITIES[inst.rar].bonus + itemUp(inst) * 2));
  if (def.slot === 'weapon') parts.push(JOBS[def.job] ? JOBS[def.job].name + ' 전용' : '');
  parts.push('Lv' + itemLvReq(def));
  return parts.join('  ');
}

    const label = inst ? itemLabel(inst) : '(' + slotNames[s] + ' 없음)';

  ctx.fillText('판매는 상인에게', wx + 30, wy + 348);
  // 그리드 6x4
  const gx = wx + 220, gy = wy + 82, cell = 58, pad = 4;
  let hoverItem = null;
  for (let i = 0; i < 24; i++){
    const cx = gx + (i % 6) * (cell + pad), cy = gy + Math.floor(i / 6) * (cell + pad);
    const inst = player.inv[i];
    ctx.fillStyle = '#3d4260';
    rr(cx, cy, cell, cell, 8); ctx.fill();
    ctx.strokeStyle = '#565d80'; ctx.lineWidth = 1;
    rr(cx + 0.5, cy + 0.5, cell - 1, cell - 1, 8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    rr(cx + 2, cy + 2, cell - 4, 8, 5); ctx.fill();
    if (inst){
      const def = ITEMS[inst.id];
      ctx.strokeStyle = RARITIES[inst.rar].color; ctx.lineWidth = 2;
      rr(cx + 1, cy + 1, cell - 2, cell - 2, 7); ctx.stroke();
      // 아이콘
      ctx.save();
      ctx.translate(cx + cell / 2, cy + cell / 2);
      const tierCol = t => t >= 5 ? '#ffd94a' : (t === 4 ? '#e86a4a' : (t === 3 ? '#d4b04a' : (t === 2 ? '#9aa0b0' : '#8a6a3a')));
      if (def.slot === 'weapon'){
        const kind = def.job;
        if (kind === 'warrior'){
          ctx.rotate(-0.7);
          ctx.fillStyle = '#c8ccd8'; rr(-3, -20, 6, 30, 2); ctx.fill();
          ctx.fillStyle = '#8a6a3a'; rr(-7, 10, 14, 5, 2); ctx.fill();
        } else if (kind === 'archer'){
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(0, 0, 15, -1.2, 1.2); ctx.stroke();
          ctx.strokeStyle = '#e8e8d8'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(Math.cos(-1.2) * 15, Math.sin(-1.2) * 15); ctx.lineTo(Math.cos(1.2) * 15, Math.sin(1.2) * 15); ctx.stroke();
        } else if (kind === 'thief'){
          ctx.fillStyle = '#c8ccd8';
          for (let s = 0; s < 4; s++){
            ctx.save();
            ctx.rotate(s * Math.PI / 2 + 0.4);
            ctx.beginPath(); ctx.moveTo(0, -3); ctx.lineTo(13, 0); ctx.lineTo(0, 3); ctx.closePath(); ctx.fill();
            ctx.restore();
          }
          ctx.fillStyle = '#7a2a8e';
          ctx.beginPath(); ctx.arc(0, 0, 3.6, 0, 7); ctx.fill();
        } else {
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -12); ctx.stroke();
          ctx.fillStyle = '#6a9dff'; ctx.beginPath(); ctx.arc(0, -15, 6, 0, 7); ctx.fill();
        }
      } else if (def.slot === 'hat'){
        ctx.fillStyle = tierCol(def.tier);
        ctx.beginPath(); ctx.arc(0, 0, 13, Math.PI * 0.9, Math.PI * 2.1); ctx.fill();
        ctx.fillRect(-15, 0, 30, 5);
      } else if (def.slot === 'glove'){
        ctx.fillStyle = tierCol(def.tier);
        rr(-9, -12, 18, 20, 7); ctx.fill();
        rr(-14, -4, 7, 9, 3.5); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-9, 4, 18, 4);
      } else if (def.slot === 'shoe'){
        ctx.fillStyle = tierCol(def.tier);
        rr(-11, -12, 12, 18, 4); ctx.fill();
        rr(-11, 2, 22, 8, 4); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.fillRect(-11, 7, 22, 3);
      } else {
        ctx.fillStyle = tierCol(def.tier) === '#8a6a3a' ? '#a3835a' : tierCol(def.tier);
        rr(-13, -14, 26, 28, 6); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(-13, -4, 26, 4);
      }
      ctx.restore();
      const hov = mouseX >= cx && mouseX <= cx + cell && mouseY >= cy && mouseY <= cy + cell;
      if (hov) hoverItem = { inst, cx, cy };
      if (pendingClick && pendingClick.x >= cx && pendingClick.x <= cx + cell && pendingClick.y >= cy && pendingClick.y <= cy + cell){
        pendingClick = null;
        equipFromInv(i);
      }
    }
  }
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(player.inv.length + ' / 24 칸', gx, wy + wh - 18);
  // 툴팁
  if (hoverItem){
    const tx = Math.min(hoverItem.cx, W - 240), ty = hoverItem.cy + 62;
    ctx.fillStyle = 'rgba(10,8,25,0.95)';
    rr(tx, ty, 225, 62, 8); ctx.fill();
    ctx.strokeStyle = RARITIES[hoverItem.inst.rar].color; ctx.lineWidth = 1.5;
    rr(tx, ty, 225, 62, 8); ctx.stroke();
    ctx.fillStyle = RARITIES[hoverItem.inst.rar].color; ctx.font = 'bold 13px sans-serif';
    ctx.fillText(itemLabel(hoverItem.inst), tx + 12, ty + 22);
    ctx.fillStyle = '#dfe8ff'; ctx.font = '12px sans-serif';
    ctx.fillText(itemStatText(hoverItem.inst), tx + 12, ty + 42);
  }
}

// ---------- 키보드 ----------
const HANDLED = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyV',
  'KeyA','KeyD','KeyF','KeyQ','KeyW','KeyR','KeyT','KeyG','KeyB','KeyN','KeyE','KeyK','KeyS','KeyL','KeyM','KeyP',
  'Digit1','Digit2','Digit3','Digit4','Enter','Escape'];
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return; // 브라우저 단축키 보호
  if (HANDLED.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  audioUnlock();
  onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const WINDOW_KEYS = { KeyE:'inv', KeyK:'skill', KeyS:'stat', KeyL:'quest', KeyN:'book' };
function onKeyPress(code){
  if (code === 'KeyM'){ toggleMute(); return; }

  if (game.state === 'title'){
    if (code === 'Enter'){
      // 저장이 있으면 파괴적 새 게임에 확인 단계
      if (game.hasSave && !game.newConfirm){ game.newConfirm = true; return; }
      startGame(false);
    }
    if (code === 'Digit3' && game.hasSave){ game.newConfirm = false; startGame(true); }
    if (code === 'Escape') game.newConfirm = false;
    return;
  }
  if (game.state === 'victory'){
    if (code === 'Enter') game.state = 'play';
    return;
  }
  if (game.state === 'dead') return;
  if (game.state === 'pause'){
    if (code === 'KeyP' || code === 'Enter') game.state = 'play';
    return;
  }
  // 창이 열려 있을 때
  if (game.uiWindow){
    if (code === 'Escape'){ game.uiWindow = null; return; }
    if (WINDOW_KEYS[code]){
      game.uiWindow = game.uiWindow === WINDOW_KEYS[code] ? null : WINDOW_KEYS[code];
      if (game.uiWindow === 'skill') game.skillTab = null;
      return;
    }
    if (game.uiWindow === 'job' && game.uiArm <= 0){
      if (code === 'Digit1') doJobAdvance('warrior');
      if (code === 'Digit2') doJobAdvance('archer');
      if (code === 'Digit3') doJobAdvance('mage');
      if (code === 'Digit4') doJobAdvance('thief');
    }
    if (game.uiWindow === 'job2' && game.uiArm <= 0){
      const opts2 = JOB2[player.job];
      if (opts2){
        if (code === 'Digit1' || code === 'Enter') doJob2Advance(opts2[0].key);
        if (code === 'Digit2' && opts2[1]) doJob2Advance(opts2[1].key);
      }
    }
    if (game.uiWindow === 'job3' && game.uiArm <= 0){
      if (code === 'Digit1' || code === 'Enter') doJob3Advance();
    }
    if (game.uiWindow === 'job4' && game.uiArm <= 0){
      if (code === 'Digit1' || code === 'Enter') doJob4Advance();
    }
    return;
  }
  if (game.state !== 'play') return;
  if (game.fadeDir !== 0) return;

  if (code === 'KeyP'){ game.state = 'pause'; return; }
  if (WINDOW_KEYS[code]){
    game.uiWindow = WINDOW_KEYS[code];
    if (game.uiWindow === 'skill') game.skillTab = null;
    return;
  }
  if (code === 'Space'){ jumpPressed(); return; }
  const bindKeyMap = { KeyX:'X', KeyC:'C', KeyV:'V', KeyA:'A', KeyD:'D', KeyF:'F', KeyQ:'Q', KeyW:'W', KeyR:'R', KeyT:'T', KeyG:'G' };
  if (bindKeyMap[code]){ castBindKey(bindKeyMap[code]); return; }
  if (code === 'KeyB'){ castSequence(); return; }
  if (code === 'Digit1'){ usePotion('hp'); return; }
  if (code === 'Digit2'){ usePotion('mp'); return; }
  if (code === 'Digit3'){ usePotion('hp2'); return; }
  if (code === 'Digit4'){ usePotion('mp2'); return; }
  if (code === 'ArrowUp'){
    if (!player.climbing) interact();
    return;
  }
  if (code === 'ArrowDown'){
    if (!player.climbing && player.onGround){
      const l = ladderBelow();
      if (l) startClimb(l, true);
    }
    return;
  }
}

// ---------- 스크린샷 디버그 모드 (?shot=game&map=1&job=warrior&pose=attack) ----------
let shotPose = null;
try {
  const sp = new URLSearchParams(location.search);
  if (sp.has('shot') && sp.get('shot') !== 'title'){
    startGame(false);
    const job = sp.get('job');
    if (job && JOBS[job]){
      player.level = parseInt(sp.get('lv') || '12', 10) || 12;
      doJobAdvance(job);
      game.uiWindow = null;
      const wantTier = sp.has('job4') ? 4 : (sp.has('job3') ? 3 : (sp.has('job2') ? 2 : 1));
      if (wantTier >= 2){ player.level = Math.max(player.level, 16); doJob2Advance(); }
      if (wantTier >= 3){ player.level = Math.max(player.level, 21); doJob3Advance(); }
      if (wantTier >= 4){ player.level = Math.max(player.level, 29); doJob4Advance(); }
      if (wantTier >= 2){
        player.sp = 99;
        for (const defs of [SKILL2_DEFS[player.job2], wantTier >= 3 ? SKILL3_DEFS[player.job] : null, wantTier >= 4 ? SKILL4_DEFS[player.job] : null]){
          if (!defs) continue;
          for (const d of defs) for (let k = 0; k < 5; k++) investSkill(d.id);
        }
        game.uiWindow = null;
      }
    }
    const mi = parseInt(sp.get('map') || '1', 10) || 0;
    loadMap(Math.max(0, Math.min(MAPS.length - 1, mi)), 'left');
    if (sp.has('x')) player.x = parseFloat(sp.get('x')) || player.x;
    camX = Math.max(0, Math.min(curMap().w - W, player.x - W / 2));
    if (sp.get('win') && ['inv','skill','stat','quest','shop','dialog','job','job2','job3','job4','book'].includes(sp.get('win'))) game.uiWindow = sp.get('win');
    shotPose = sp.get('pose');
    muted = true;
  }
} catch(e){}

// ---------- 메인 루프 ----------
let lastT = performance.now();
function frame(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0)) dt = 0.016;   // 음수/NaN 방어 (가상 타이머, 시계 되감김)
  if (dt > 0.05) dt = 0.05;
  // 히트스톱(슬로우모션)은 끊김 체감으로 제거됨 — 타격감은 셰이크/킥/파티클로만 표현
  if (shotPose === 'attack') player.attackAnim = 0.12;
  if (shotPose === 'cast') player.castAnim = 0.15;
  if (shotPose === 'walk'){ keys.ArrowRight = true; }
  if (shotPose === 'prone'){ keys.ArrowDown = true; }
  if (shotPose === 'skillA') useSkillSlot2(0);
  if (shotPose === 'skillD') useSkillSlot2(1);
  if (shotPose === 'skillQ') useSkillSlot3(0);
  if (shotPose === 'skillW') useSkillSlot3(1);
  if (shotPose === 'skillT') useSkillSlot4(0);
  updateAll(dt);
  draw();
  drawWindows();
  audioTick();
  requestAnimationFrame(frame);
}
game.hasSave = hasAnySave();
requestAnimationFrame(frame);

</script>
