function drawProjectiles(){
  for (const p of pProj){
    const sx = p.x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const dir = Math.sign(p.vx);
    if (p.kind === 'arrow'){
      ctx.strokeStyle = 'rgba(200,230,255,0.35)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx - dir * 30, p.y); ctx.lineTo(sx - dir * 8, p.y); ctx.stroke();
      ctx.strokeStyle = '#b89868'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx + dir * 9, p.y); ctx.stroke();
      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 16, p.y); ctx.lineTo(sx + dir * 6, p.y - 4.5); ctx.lineTo(sx + dir * 6, p.y + 4.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e05a4a';
      ctx.beginPath();
      ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx - dir * 20, p.y - 4); ctx.lineTo(sx - dir * 20, p.y + 4);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'orb'){
      const og = ctx.createRadialGradient(sx, p.y, 2, sx, p.y, 14);
      og.addColorStop(0, 'rgba(220,240,255,0.95)');
      og.addColorStop(0.5, 'rgba(120,170,255,0.6)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(sx, p.y, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#a8ccff';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx + dir * 1, p.y - 2, 2.8, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(150,190,255,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx - dir * 12, p.y, 5.5, 0, 7); ctx.stroke();
    } else {
      ctx.fillStyle = '#e8a03a';
      ctx.beginPath(); ctx.arc(sx, p.y, 7.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#f8d060';
      ctx.beginPath(); ctx.arc(sx, p.y, 4, 0, 7); ctx.fill();
      for (let i = 1; i <= 3; i++){
        ctx.fillStyle = 'rgba(255,170,70,' + (0.4 - i * 0.1) + ')';
        ctx.beginPath(); ctx.arc(sx - dir * i * 9, p.y + Math.sin(game.time * 20 + i) * 2, 6 - i, 0, 7); ctx.fill();
      }
    }
  }
  for (const p of eProj){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    if (p.kind === 'spore'){
      ctx.fillStyle = 'rgba(184,106,212,0.3)';
      ctx.beginPath(); ctx.arc(sx, p.y, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#b86ad4';
      ctx.beginPath(); ctx.arc(sx, p.y, 8.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#7a3a9e';
      ctx.beginPath(); ctx.arc(sx + 2, p.y + 2, 3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,240,0.8)';
      ctx.beginPath(); ctx.arc(sx - 2.5, p.y - 3, 2.6, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(180,90,220,0.65)';
      for (let i = 0; i < 3; i++){
        const h = 28 - i * 7;
        ctx.beginPath();
        ctx.ellipse(sx - Math.sign(p.vx) * i * 15, p.y - h / 2, 13 - i * 3, h / 2, 0, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(230,180,255,0.7)';
      ctx.beginPath(); ctx.ellipse(sx, p.y - 13, 7, 12, 0, 0, 7); ctx.fill();
    }
  }
}
function drawEffects(){
  for (const e of effects){
    const sx = e.x - camX;
    if (e.kind === 'slash'){
      const pr = e.t / 0.35;
      if (pr > 1) continue;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.scale(e.dir, 1);
      const a = 1 - pr;
      ctx.strokeStyle = 'rgba(130,200,255,' + a + ')';
      ctx.lineWidth = Math.max(1, 8 - pr * 5);
      ctx.beginPath(); ctx.arc(0, 0, 58 + pr * 48, -1.15, 1.15); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + a * 0.85 + ')';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.arc(0, 0, 48 + pr * 42, -0.95, 0.95); ctx.stroke();
      ctx.strokeStyle = 'rgba(180,225,255,' + a * 0.5 + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 66 + pr * 52, -0.7, 0.7); ctx.stroke();
      ctx.restore();
    } else if (e.kind === 'hitstar'){
      const pr = e.t / 0.28;
      if (pr > 1) continue;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(pr * 1.8);
      const a = 1 - pr;
      ctx.fillStyle = 'rgba(255,240,150,' + a + ')';
      const r1 = 5 + pr * 12, r2 = r1 * 0.42;
      ctx.beginPath();
      for (let i = 0; i < 8; i++){
        const ang = i * Math.PI / 4;
        const r = i % 2 === 0 ? r1 : r2;
        ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,' + a * 0.9 + ')';
      ctx.beginPath(); ctx.arc(0, 0, Math.max(0.5, 3.5 * (1 - pr)), 0, 7); ctx.fill();
      // 파편
      ctx.fillStyle = 'rgba(255,220,120,' + a * 0.8 + ')';
      for (let i = 0; i < 4; i++){
        const ang = i * 1.57 + 0.6;
        const d = 10 + pr * 22;
        ctx.beginPath(); ctx.arc(Math.cos(ang) * d, Math.sin(ang) * d, Math.max(0.5, 2.2 * (1 - pr)), 0, 7); ctx.fill();
      }
      ctx.restore();
    } else if (e.kind === 'explosion'){
      const pr = e.t / 0.45;
      if (pr > 1) continue;
      const a = 1 - pr;
      const eg = ctx.createRadialGradient(sx, e.y, 4, sx, e.y, 30 + pr * 95);
      eg.addColorStop(0, 'rgba(255,240,180,' + a * 0.9 + ')');
      eg.addColorStop(0.4, 'rgba(255,160,60,' + a * 0.65 + ')');
      eg.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(sx, e.y, 30 + pr * 95, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,220,120,' + a + ')';
      ctx.lineWidth = Math.max(1, 5 - pr * 4);
      ctx.beginPath(); ctx.arc(sx, e.y, 34 + pr * 100, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,190,90,' + a * 0.9 + ')';
      for (let i = 0; i < 6; i++){
        const ang = i * 1.05 + 0.4;
        const d = 20 + pr * 75;
        ctx.beginPath(); ctx.arc(sx + Math.cos(ang) * d, e.y + Math.sin(ang) * d * 0.7, Math.max(0.5, 4 * (1 - pr)), 0, 7); ctx.fill();
      }
    } else if (e.kind === 'lightning'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.strokeStyle = 'rgba(255,255,170,' + a + ')';
      ctx.lineWidth = Math.max(1, 4.5 - pr * 2.5);
      ctx.beginPath();
      let ly = e.y - 200, lx = sx;
      ctx.moveTo(lx, ly);
      let seg = 0;
      while (ly < e.y){
        ly += 26;
        lx = sx + Math.sin(seg * 9.7 + e.x) * 15;
        ctx.lineTo(lx, Math.min(ly, e.y));
        seg++;
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,' + a * 0.8 + ')';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      const lg2 = ctx.createRadialGradient(sx, e.y, 2, sx, e.y, 26);
      lg2.addColorStop(0, 'rgba(255,255,220,' + a + ')');
      lg2.addColorStop(1, 'rgba(255,255,180,0)');
      ctx.fillStyle = lg2;
      ctx.beginPath(); ctx.arc(sx, e.y, 26, 0, 7); ctx.fill();
    } else if (e.kind === 'claw'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      for (const off of [-14, 0, 14]){
        ctx.strokeStyle = 'rgba(210,130,255,' + a + ')';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-26 * e.dir + off * 0.4, off - 26 + pr * 16);
        ctx.quadraticCurveTo(0, off - 4 + pr * 16, 26 * e.dir + off * 0.4, off + 14 + pr * 16);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,220,255,' + a * 0.7 + ')';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
      ctx.restore();
    } else if (e.kind === 'levelup'){
      const pr = e.t / 0.7;
      const a = Math.max(0, 1 - pr);
      // 골드 필러
      const pg = ctx.createLinearGradient(sx - 44, 0, sx + 44, 0);
      pg.addColorStop(0, 'rgba(255,220,80,0)');
      pg.addColorStop(0.5, 'rgba(255,235,140,' + a * 0.55 + ')');
      pg.addColorStop(1, 'rgba(255,220,80,0)');
      ctx.fillStyle = pg;
      ctx.fillRect(sx - 44, e.y - 250, 88, 250);
      ctx.strokeStyle = 'rgba(255,220,80,' + a + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(sx, e.y - 26, 22 + pr * 85, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,245,190,' + a * 0.7 + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(sx, e.y - 26, 12 + pr * 110, 0, 7); ctx.stroke();
      ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(120,70,0,' + a + ')';
      ctx.strokeText('LEVEL UP!', sx, e.y - 100 - pr * 34);
      ctx.fillStyle = 'rgba(255,240,150,' + a + ')';
      ctx.fillText('LEVEL UP!', sx, e.y - 100 - pr * 34);
    } else if (e.kind === 'jobadv'){
      const pr = e.t / 0.7;
      const a = Math.max(0, 1 - pr);
      const pg = ctx.createLinearGradient(sx - 52, 0, sx + 52, 0);
      pg.addColorStop(0, 'rgba(180,220,255,0)');
      pg.addColorStop(0.5, 'rgba(220,240,255,' + a * 0.6 + ')');
      pg.addColorStop(1, 'rgba(180,220,255,0)');
      ctx.fillStyle = pg;
      ctx.fillRect(sx - 52, e.y - 260, 104, 260);
      ctx.strokeStyle = 'rgba(160,210,255,' + a + ')';
      ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.arc(sx, e.y - 30, 32 + pr * 95, 0, 7); ctx.stroke();
    } else if (e.kind === 'buff'){
      const pr = e.t / 0.5;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.strokeStyle = 'rgba(150,255,180,' + a + ')';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(sx, e.y - 26, 24 + pr * 22, 36 + pr * 15, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(190,255,210,' + a * 0.6 + ')';
      for (let i = 0; i < 5; i++){
        const ang = i * 1.26 + pr * 2;
        ctx.beginPath();
        ctx.arc(sx + Math.cos(ang) * 26, e.y - 26 + Math.sin(ang) * 34, 2.5, 0, 7);
        ctx.fill();
      }
    } else if (e.kind === 'djump'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - pr) * 0.75 + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sx, e.y, 18 + pr * 16, 6, 0, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(sx, e.y - 4, 10 + pr * 8, 3.5, 0, 0, 7); ctx.stroke();
    } else if (e.kind === 'poof'){
      const pr = e.t / 0.35;
      if (pr > 1) continue;
      ctx.fillStyle = 'rgba(184,106,212,' + (1 - pr) * 0.5 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y - 6, 6 + pr * 18, 0, 7); ctx.fill();
    } else if (e.kind === 'spawnpoof'){
      const pr = e.t / 0.45;
      if (pr > 1) continue;
      const a = (1 - pr) * 0.55;
      ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
      for (let i = 0; i < 5; i++){
        const ang = i * 1.26 + 0.5;
        const d = 6 + pr * 26;
        ctx.beginPath();
        ctx.arc(sx + Math.cos(ang) * d, e.y + Math.sin(ang) * d * 0.6, Math.max(0.5, 7 * (1 - pr)), 0, 7);
        ctx.fill();
      }
    } else if (e.kind === 'deathburst'){
      const pr = e.t / 0.5;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.strokeStyle = 'rgba(255,240,180,' + a * 0.8 + ')';
      ctx.lineWidth = Math.max(1, 3 - pr * 2);
      ctx.beginPath(); ctx.arc(sx, e.y, 8 + pr * 34, 0, 7); ctx.stroke();
      for (let i = 0; i < 6; i++){
        const ang = i * 1.047 + 0.3;
        const d = 8 + pr * 42;
        const px2 = sx + Math.cos(ang) * d, py2 = e.y + Math.sin(ang) * d * 0.85;
        ctx.save();
        ctx.translate(px2, py2);
        ctx.rotate(ang + pr * 3);
        ctx.fillStyle = 'rgba(255,230,140,' + a + ')';
        const r1 = Math.max(0.5, 4.5 * (1 - pr));
        ctx.beginPath();
        for (let k = 0; k < 8; k++){
          const aa = k * Math.PI / 4;
          const rr2 = k % 2 === 0 ? r1 : r1 * 0.45;
          ctx.lineTo(Math.cos(aa) * rr2, Math.sin(aa) * rr2);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    } else if (e.kind === 'impact'){
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(e.dir * 0.35);
      const ig = ctx.createLinearGradient(0, -70, 0, 70);
      ig.addColorStop(0, 'rgba(180,220,255,0)');
      ig.addColorStop(0.5, 'rgba(230,245,255,' + a * 0.95 + ')');
      ig.addColorStop(1, 'rgba(180,220,255,0)');
      ctx.fillStyle = ig;
      const w2 = Math.max(1, 13 * (1 - pr * 0.6));
      ctx.beginPath();
      ctx.moveTo(0, -74);
      ctx.quadraticCurveTo(w2, 0, 0, 74);
      ctx.quadraticCurveTo(-w2, 0, 0, -74);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,' + a * 0.85 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y, Math.max(0.5, 10 * (1 - pr)), 0, 7); ctx.fill();
    } else if (e.kind === 'whirl'){
      const pr = e.t / 0.4;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(e.dir * pr * 5.5);
      for (const off of [0, Math.PI]){
        ctx.strokeStyle = 'rgba(150,215,255,' + a * 0.9 + ')';
        ctx.lineWidth = Math.max(1, 6 - pr * 4);
        ctx.beginPath();
        ctx.arc(0, 0, 44 + pr * 40, off - 0.2, off + 1.5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + a * 0.6 + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 36 + pr * 34, off, off + 1.2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}
function dmgFill(t, size, y){
  if (t.color === '#ffb642'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#fff4c0');
    dg.addColorStop(0.55, '#ffd24a');
    dg.addColorStop(1, '#f08a1e');
    return dg;
  }
  if (t.color === '#ff5ab0'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#ffe0f0');
    dg.addColorStop(0.5, '#ff7ac0');
    dg.addColorStop(1, '#e03a8a');
    return dg;
  }
  return t.color;
}
function drawDmgTexts(){
  ctx.textAlign = 'center';
  for (const t of dmgTexts){
    const sx = t.x - camX;
    const a = Math.max(0, Math.min(1, t.life / 0.4));
    const size = t.big ? 27 : 20;
    if (/^\d+$/.test(t.txt)){
      // 메이플식: 자릿수별로 개별 팝 + 아치 배치
      const n = t.txt.length;
      const dw = size * 0.6;
      for (let i = 0; i < n; i++){
        const dPop = t.pop - i * 0.035;
        if (dPop < 0) continue;
        const pop = dPop < 0.12 ? 1 + (0.12 - dPop) * 6 : 1;
        const dx = (i - (n - 1) / 2) * dw;
        const dy = -Math.sin((i / Math.max(1, n - 1)) * Math.PI) * (n > 1 ? 4 : 0);
        const ds = size * pop;
        ctx.save();
        ctx.translate(sx + dx, t.y + dy);
        ctx.rotate((i % 2 === 0 ? -1 : 1) * 0.05);
        ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(50,25,0,' + a * 0.9 + ')';
        ctx.strokeText(t.txt[i], 0, 0);
        ctx.globalAlpha = a;
        ctx.fillStyle = dmgFill(t, ds, 0);
        ctx.fillText(t.txt[i], 0, 0);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    } else {
      const pop = t.pop < 0.14 ? 1 + (0.14 - t.pop) * 5 : 1;
      const ds = size * pop;
      ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(50,25,0,' + a * 0.9 + ')';
      ctx.strokeText(t.txt, sx, t.y);
      ctx.globalAlpha = a;
      ctx.fillStyle = dmgFill(t, ds, t.y);
      ctx.fillText(t.txt, sx, t.y);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBar(x, y, w, h, ratio, c1, c2, label){
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  rr(x, y, w, h, h / 2); ctx.fill();
  if (ratio > 0.005){
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    rr(x + 2, y + 2, Math.max(4, (w - 4) * Math.min(1, ratio)), h - 4, (h - 4) / 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(x + 3, y + 2.5, Math.max(3, (w - 6) * Math.min(1, ratio)), (h - 5) * 0.4, 2); ctx.fill();
  }
  if (label){
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y + h - 5);
  }
}

<script>

function fit(){

  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- 마우스 ----------
let mouseX = -1, mouseY = -1;
let pendingClick = null;
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('mousemove', e => {
  const p = canvasPos(e);
  mouseX = p.x; mouseY = p.y;
});
canvas.addEventListener('mousedown', e => {
  audioUnlock();
  const p = canvasPos(e);
  pendingClick = p;
});

// 즉시 모드 버튼: 그리고, 클릭됐으면 true
function btn(x, y, w, h, label, opts){
  opts = opts || {};
  const hover = mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
  const enabled = opts.enabled !== false;
  ctx.fillStyle = enabled ? (hover ? (opts.hoverColor || '#5a6ea8') : (opts.color || '#3a4a7a')) : '#3a3a44';
  rr(x, y, w, h, 7); ctx.fill();
  ctx.strokeStyle = enabled ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  rr(x, y, w, h, 7); ctx.stroke();
  ctx.fillStyle = enabled ? '#fff' : 'rgba(255,255,255,0.4)';
  ctx.font = 'bold ' + (opts.font || 14) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + w / 2, y + h / 2 + 5);
  if (enabled && pendingClick && pendingClick.x >= x && pendingClick.x <= x + w && pendingClick.y >= y && pendingClick.y <= y + h){
    pendingClick = null;
    return true;
  }
  return false;
}

function drawWindows(){

// ---------- 키보드 ----------
const HANDLED = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyZ','KeyX','KeyC','KeyV',
  'KeyE','KeyK','KeyS','KeyL','KeyM','KeyP','Digit1','Digit2','Digit3','Enter','Escape'];
addEventListener('keydown', e => {
  if (HANDLED.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  audioUnlock();
  onKeyPress(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const WINDOW_KEYS = { KeyE:'inv', KeyK:'skill', KeyS:'stat', KeyL:'quest' };
function onKeyPress(code){
  if (code === 'KeyM'){ toggleMute(); return; }

  if (game.state === 'title'){
    if (code === 'Enter'){
      // 저장이 있으면 파괴적 새 게임에 확인 단계
      if (game.hasSave && !game.newConfirm){ game.newConfirm = true; return; }
      startGame(false);
    }
    if (code === 'Digit3' && game.hasSave){ game.newConfirm = false; startGame(true); }
    if (code === 'Escape') game.newConfirm = false;
    return;
  }
  if (game.state === 'victory'){
    if (code === 'Enter') game.state = 'play';
    return;
  }
  if (game.state === 'dead') return;
  if (game.state === 'pause'){
    if (code === 'KeyP' || code === 'Enter') game.state = 'play';
    return;
  }
  // 창이 열려 있을 때
  if (game.uiWindow){
    if (code === 'Escape'){ game.uiWindow = null; return; }
    if (WINDOW_KEYS[code]){
      game.uiWindow = game.uiWindow === WINDOW_KEYS[code] ? null : WINDOW_KEYS[code];
      return;
    }
    if (game.uiWindow === 'job' && game.uiArm <= 0){
      if (code === 'Digit1') doJobAdvance('warrior');
      if (code === 'Digit2') doJobAdvance('archer');
      if (code === 'Digit3') doJobAdvance('mage');
    }
    return;
  }
  if (game.state !== 'play') return;
  if (game.fadeDir !== 0) return;

  if (code === 'KeyP'){ game.state = 'pause'; return; }
  if (WINDOW_KEYS[code]){ game.uiWindow = WINDOW_KEYS[code]; return; }
  if (code === 'Space'){ jumpPressed(); return; }
  if (code === 'KeyX'){ useSkillSlot(0); return; }
  if (code === 'KeyC'){ useSkillSlot(1); return; }
  if (code === 'KeyV'){ useSkillSlot(2); return; }
  if (code === 'Digit1'){ usePotion('hp'); return; }
  if (code === 'Digit2'){ usePotion('mp'); return; }
  if (code === 'ArrowUp'){
    if (!player.climbing) interact();
    return;
  }
  if (code === 'ArrowDown'){
    if (!player.climbing && player.onGround){
      const l = ladderBelow();
      if (l) startClimb(l, true);
    }
    return;
  }
}

// ---------- 스크린샷 디버그 모드 (?shot=game&map=1&job=warrior&pose=attack) ----------
let shotPose = null;
try {
  const sp = new URLSearchParams(location.search);
  if (sp.has('shot') && sp.get('shot') !== 'title'){
    startGame(false);
    const job = sp.get('job');
    if (job && JOBS[job]){
      player.level = parseInt(sp.get('lv') || '12', 10) || 12;
      doJobAdvance(job);
      game.uiWindow = null;
    }
    const mi = parseInt(sp.get('map') || '1', 10) || 0;
    loadMap(Math.max(0, Math.min(MAPS.length - 1, mi)), 'left');
    if (sp.has('x')) player.x = parseFloat(sp.get('x')) || player.x;
    camX = Math.max(0, Math.min(curMap().w - W, player.x - W / 2));
    if (sp.get('win')) game.uiWindow = sp.get('win');
    shotPose = sp.get('pose');
    muted = true;
  }
} catch(e){}

// ---------- 메인 루프 ----------
let lastT = performance.now();
function frame(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (!(dt > 0)) dt = 0.016;   // 음수/NaN 방어 (가상 타이머, 시계 되감김)
  if (dt > 0.05) dt = 0.05;
  if (shotPose === 'attack') player.attackAnim = 0.12;
  if (shotPose === 'cast') player.castAnim = 0.15;
  if (shotPose === 'walk'){ keys.ArrowRight = true; }
  if (shotPose === 'prone'){ keys.ArrowDown = true; }
  updateAll(dt);
  draw();
  drawWindows();
  audioTick();
  requestAnimationFrame(frame);
}
game.hasSave = hasAnySave();
requestAnimationFrame(frame);

</script>
