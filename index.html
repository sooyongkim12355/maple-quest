'use strict';
// ============================================================
// 오디오: 효과음(비프) + 칩튠 BGM 시퀀서
// 전역 제공: SFX, audioUnlock, audioTick, setBgm, toggleMute, isMuted
// ============================================================
let audioCtx = null;
let muted = false;
let bgmGain = null;
function ensureBgmGain(){
  if (!audioCtx) return null;
  if (!bgmGain){
    bgmGain = audioCtx.createGain();
    bgmGain.connect(audioCtx.destination);
  }
  return bgmGain;
}
function isMuted(){ return muted; }
function toggleMute(){
  muted = !muted;
  if (muted) stopBgmNodes();
  else if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(1, audioCtx.currentTime); } catch(e){}
  }
  return muted;
}
function audioUnlock(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}

function beep(freq, dur, type, vol, slide){
  if (muted || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
let noiseBuf = null;
function playNoise(vol, dur){
  if (muted || !audioCtx) return;
  try {
    if (!noiseBuf){
      noiseBuf = audioCtx.createBuffer(1, 8820, 44100);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    src.connect(g); g.connect(audioCtx.destination);
    src.start(); src.stop(audioCtx.currentTime + dur);
  } catch(e){}
}

// ---------- BGM 시퀀서 ----------
let bgmTrackName = null;
let bgmStep = 0;
let bgmNextTime = 0;
const midi2freq = n => 440 * Math.pow(2, (n - 69) / 12);

function stopBgmNodes(){
  bgmNextTime = 0;
  if (bgmGain && audioCtx){
    try { bgmGain.gain.cancelScheduledValues(0); bgmGain.gain.setValueAtTime(0, audioCtx.currentTime); } catch(e){}
  }
}

function setBgm(name){
  if (bgmTrackName === name) return;
  bgmTrackName = name;
  bgmStep = 0;
  bgmNextTime = 0;
}

function playNote(freq, when, dur, type, vol){
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ensureBgmGain() || audioCtx.destination);
    o.start(when); o.stop(when + dur + 0.02);
  } catch(e){}
}

// 매 프레임 호출: 룩어헤드 스케줄링
function audioTick(){
  if (muted || !audioCtx || !bgmTrackName) return;
  const tr = BGM_TRACKS[bgmTrackName];
  if (!tr) return;
  const stepDur = 60 / tr.tempo / 2;   // 8분음표
  const now = audioCtx.currentTime;
  if (bgmNextTime === 0) bgmNextTime = now + 0.1;
  // 0.25초 룩어헤드
  while (bgmNextTime < now + 0.25){
    const mi = tr.mel[bgmStep % tr.mel.length];
    const bi = tr.bass[bgmStep % tr.bass.length];
    if (mi > 0){
      playNote(midi2freq(mi), bgmNextTime, stepDur * 0.9, 'square', 0.018);
      // 부드러운 에코 (깊이감)
      playNote(midi2freq(mi), bgmNextTime + stepDur * 1.5, stepDur * 0.7, 'square', 0.006);
    }
    if (bi > 0) playNote(midi2freq(bi), bgmNextTime, stepDur * 1.7, 'triangle', 0.035);
    bgmStep = (bgmStep + 1) % tr.mel.length;
    bgmNextTime += stepDur;
  }
}

  invul:0, cdBasic:0, cds:{}, attackAnim:0, attackAlt:0, castAnim:0, walkT:0, prone:false,
};
let monsters = [], drops = [], dmgTexts = [], effects = [], pProj = [], eProj = [], spawners = [], particles = [];
let camX = 0;

const curMap = () => MAPS[game.mapIdx];
const BOSS_OF_MAP = { 5:'boss', 8:'kslime', 11:'yeti', 15:'timekeeper' };

// ---------- 스탯 ----------
function itemUp(inst){
  if (!inst) return 0;
  const u = inst.up | 0;
  return u < 0 ? 0 : (u > 10 ? 10 : u);
}
function itemStat(inst, field){
  if (!inst) return 0;
  const base = ITEMS[inst.id][field] || 0;
  return base > 0 ? base + RARITIES[inst.rar].bonus + itemUp(inst) * 2 : 0;
}
function buffLevel(id){ return player.buffs[id] ? player.buffs[id].lvl : -1; }
const maxHp = () => Math.round((100 + (player.level - 1) * 20) * (player.job === 'warrior' ? 1.3 : 1));
const maxMp = () => Math.round((60 + (player.level - 1) * 12) * (player.job === 'mage' ? 1.6 : 1));
function totalAtk(){
  let a = 8 + player.level * 3 + itemStat(player.equip.weapon, 'atk') + itemStat(player.equip.glove, 'atk');
  const rl = buffLevel('rage');
  if (rl >= 0) a *= 1 + 0.10 + 0.01 * rl;
  const bll = buffLevel('bless');
  if (bll >= 0) a *= 1.10 + 0.01 * bll;
  const el = buffLevel('en');
  if (el >= 0) a *= 1.25 + 0.02 * el;
  const apl = buffLevel('amp');
  if (apl >= 0) a *= 1.13 + 0.012 * apl;
  return Math.round(a);
}
function totalDef(){
  let d = itemStat(player.equip.hat, 'def') + itemStat(player.equip.top, 'def') + itemStat(player.equip.shoe, 'def');
  const bll = buffLevel('bless');
  if (bll >= 0) d += 10 + bll;
  return d;
}
function critChance(){
  let c = 0.12 + (player.job === 'archer' ? 0.08 : 0) + (player.job === 'thief' ? 0.06 : 0);
  const fl = buffLevel('focus');
  if (fl >= 0) c += 0.15 + 0.015 * fl;
  if (buffLevel('bless') >= 0) c += 0.05;
  const sel = buffLevel('se');
  if (sel >= 0) c += 0.15 + 0.015 * sel;
  const aml = buffLevel('aim');
  if (aml >= 0) c += 0.18 + 0.015 * aml;
  const sdl = buffLevel('sdm');
  if (sdl >= 0) c += 0.15 + 0.012 * sdl;
  return c;
}
function moveSpd(){
  let s = 285 * (player.job === 'archer' ? 1.08 : (player.job === 'thief' ? 1.05 : 1)) + itemStat(player.equip.shoe, 'spd');
  const hl = buffLevel('haste');
  if (hl >= 0) s *= 1.12 + 0.012 * hl;
  const ssl = buffLevel('sstep');
  if (ssl >= 0) s *= 1.10 + 0.01 * ssl;
  if (buffLevel('wq') >= 0) s *= 1.10;
  if (buffLevel('sdm') >= 0) s *= 1.10;
  return s;
}
const expNeed = () => Math.floor(20 * Math.pow(player.level, 1.7));
function skillLevel(id){ return player.skills[id] || 0; }
function mySkills(){ return SKILL_DEFS[player.job] || null; }
function mySkills2(){ return player.job2 ? SKILL2_DEFS[player.job2] : null; }
function job2Info(){ return player.job2 && JOB2[player.job] ? JOB2[player.job].find(o => o.key === player.job2) || null : null; }
function mySkills3(){ return player.job3 ? SKILL3_DEFS[player.job] : null; }
function mySkills4(){ return player.job4 ? SKILL4_DEFS[player.job] : null; }
// ---------- 스킬 퀵슬롯 바인딩 (드래그로 재배치) ----------
const BIND_KEYS = ['X','C','V','A','D','F','Q','W','R','T','G'];
const KEY_TIER = { X:1, C:1, V:1, A:2, D:2, F:2, Q:3, W:3, R:3, T:4, G:4 };
function allMySkillDefs(){
  return [mySkills(), mySkills2(), mySkills3(), mySkills4()].filter(Boolean).flat();
}
function skillDefById(id){
  return allMySkillDefs().find(d => d.id === id) || null;
}
function defaultBindMap(){
  const map = {};
  const tiers = [mySkills(), mySkills2(), mySkills3(), mySkills4()];
  const keysByTier = [['X','C','V'], ['A','D','F'], ['Q','W','R'], ['T','G']];
  tiers.forEach((defs, ti) => {
    if (!defs) return;
    defs.forEach((d, i) => { if (keysByTier[ti][i]) map[keysByTier[ti][i]] = d.id; });
  });
  return map;
}
function bindOf(key){
  const v = player.binds && player.binds[key];
  if (v && skillDefById(v)) return v;
  return defaultBindMap()[key] || null;
}
function castSkillById(id){
  if (!id) return;
  const tiers = [[mySkills(), useSkillSlot], [mySkills2(), useSkillSlot2], [mySkills3(), useSkillSlot3], [mySkills4(), useSkillSlot4]];
  for (const [defs, fn] of tiers){
    if (!defs) continue;
    const i = defs.findIndex(d => d.id === id);
    if (i >= 0){ fn(i); return; }
  }
}
function castBindKey(key){
  const id = bindOf(key);
  if (id){ castSkillById(id); return; }
  // 미해금 안내 (해당 키의 기본 티어 안내 재사용)
  const t = KEY_TIER[key];
  if (t === 1) useSkillSlot(0);
  else if (t === 2) useSkillSlot2(0);
  else if (t === 3) useSkillSlot3(0);
  else useSkillSlot4(0);
}
function castSequence(){
  const seq = (Array.isArray(player.seq) && player.seq.length ? player.seq : ['X', 'C', 'A', 'D']).filter(k => BIND_KEYS.includes(k));
  seq.forEach((k, i) => {
    if (i === 0) castBindKey(k);
    else after(0.07 * i, () => { if (game.state === 'play' && !game.uiWindow) castBindKey(k); });
  });
}
function setBind(key, id){
  if (!BIND_KEYS.includes(key) || !skillDefById(id)) return;
  const prevOfKey = bindOf(key);
  for (const k of BIND_KEYS){
    if (k !== key && bindOf(k) === id) player.binds[k] = prevOfKey;
  }
  player.binds[key] = id;
  notify('[' + key + '] ' + skillDefById(id).name + ' 배치');
  SFX.equip();
  saveGame();
}
function jobDisplayName(){
  if (player.job === 'beginner') return '초보자';
  if (player.job4) return JOB4[player.job].name;
  if (player.job3) return JOB3[player.job].name;
  if (player.job2){ const o = job2Info(); return o ? o.name : JOBS[player.job].name; }
  return JOBS[player.job].name;
}

}

const SAVE_V2 = 'mapleQuestSave_v2';

    }));

}
function validItem(it){
  return it && typeof it.id === 'string' && Object.prototype.hasOwnProperty.call(ITEMS, it.id)
    && Number.isInteger(it.rar) && it.rar >= 0 && it.rar < RARITIES.length;
}
function loadSaveData(){
  try {
    let d2 = null;
    try { d2 = JSON.parse(localStorage.getItem(SAVE_V2)); } catch(e){ d2 = null; }
    if (d2 && typeof d2.level === 'number'){

      player.job2 = (JOB2[player.job] && JOB2[player.job].some(o => o.key === d2.job2)) ? d2.job2 : null;
      player.job3 = (player.job2 && JOB3[player.job] && d2.job3 === JOB3[player.job].key) ? d2.job3 : null;
      player.job4 = (player.job3 && JOB4[player.job] && d2.job4 === JOB4[player.job].key) ? d2.job4 : null;
      player.level = clamp(d2.level, 1, 200);
      player.exp = clamp(d2.exp || 0, 0, 1e9);
      player.sp = Math.max(0, d2.sp || 0);
      player.skills = {};
      if (d2.skills){
        const allowed = new Set();
        for (const defs of [SKILL_DEFS[player.job], SKILL2_DEFS[player.job2], SKILL3_DEFS[player.job], SKILL4_DEFS[player.job]]){
          if (defs) for (const d of defs) allowed.add(d.id);
        }
        for (const k in d2.skills) if (allowed.has(k)) player.skills[k] = clamp(d2.skills[k] | 0, 0, 10);
      }
      player.meso = Math.max(0, d2.meso || 0);
      player.potions = { hp:0, mp:0, hp2:0, mp2:0 };
      if (d2.potions) for (const k in POTIONS) player.potions[k] = clamp(d2.potions[k] | 0, 0, 99);
      player.binds = {};
    player.seq = ['X', 'C', 'A', 'D'];
    player.book = {}; player.stats = { kills:0, boss:0, maxDmg:0, deaths:0, time:0 };
      if (d2.binds && typeof d2.binds === 'object'){
        for (const k in d2.binds) if (BIND_KEYS.includes(k) && typeof d2.binds[k] === 'string') player.binds[k] = d2.binds[k];
      }
      player.seq = Array.isArray(d2.seq) ? d2.seq.filter(k => BIND_KEYS.includes(k)).slice(0, 11) : ['X', 'C', 'A', 'D'];
      player.book = {};
      if (d2.book && typeof d2.book === 'object'){
        for (const k in d2.book) if (MTYPES[k]) player.book[k] = clamp(d2.book[k] | 0, 0, 1e9);
      }
      player.stats = { kills:0, boss:0, maxDmg:0, deaths:0, time:0 };
      if (d2.stats && typeof d2.stats === 'object'){
        for (const k of ['kills', 'boss', 'maxDmg', 'deaths', 'time']) player.stats[k] = clamp(+d2.stats[k] || 0, 0, 1e12);
      }
      player.inv = Array.isArray(d2.inv) ? d2.inv.filter(validItem).slice(0, 24) : [];
      player.equip = { weapon:null, hat:null, top:null, glove:null, shoe:null };
      if (d2.equip) for (const s of ['weapon','hat','top','glove','shoe']) if (validItem(d2.equip[s]) && ITEMS[d2.equip[s].id].slot === s) player.equip[s] = d2.equip[s];
      player.quests = {};
      if (d2.quests) for (const q of QUESTS){
        const qs = d2.quests[q.id];
        if (qs && (qs.st === 'active' || qs.st === 'done')) player.quests[q.id] = { st:qs.st, c: clamp(qs.c | 0, 0, q.need.n) };
      }
      game.mapIdx = clamp(d2.mapIdx || 0, 0, MAPS.length - 1);
      game.cleared = !!d2.cleared;
      game.bossRespawn = Math.max(0, d2.bossRespawn || 0);
      game.bossAlerted = !!d2.bossAlerted;
      game.bossRespawnMap = BOSS_OF_MAP[d2.bossRespawnMap] ? d2.bossRespawnMap : 5;
      return true;
    }
    // v1 마이그레이션
    let d1 = null;
    try { d1 = JSON.parse(localStorage.getItem(SAVE_V1)); } catch(e){ d1 = null; }
    if (d1 && typeof d1.level === 'number'){
      player.job = 'beginner';
      player.job2 = null; player.job3 = null; player.job4 = null;
      player.level = clamp(d1.level, 1, 200);
      player.exp = clamp(d1.exp || 0, 0, 1e9);
      player.sp = 0; player.skills = {};
      player.meso = Math.max(0, d1.meso || 0) + (d1.weaponTier || 0) * 800;
      player.potions = { hp: clamp((d1.potions && d1.potions.hp) || 0, 0, 99), mp: clamp((d1.potions && d1.potions.mp) || 0, 0, 99), hp2:0, mp2:0 };
      player.binds = {};
      player.seq = ['X', 'C', 'A', 'D'];
      player.book = {}; player.stats = { kills:0, boss:0, maxDmg:0, deaths:0, time:0 };
    player.seq = ['X', 'C', 'A', 'D'];
    player.book = {}; player.stats = { kills:0, boss:0, maxDmg:0, deaths:0, time:0 };
      player.inv = []; player.equip = { weapon:null, hat:null, top:null, glove:null, shoe:null };
      player.quests = {};
      game.mapIdx = 0;
      game.cleared = !!d1.cleared;
      game.bossRespawn = 0;
      game.bossAlerted = !!d1.cleared;
      // v1 경험치 곡선(30·L^1.7) → v2(20·L^1.7) 차이 정산
      while (player.exp >= expNeed() && player.level < 200){
        player.exp -= expNeed();
        player.level++;
      }
      notify('이전 모험 데이터를 이어받았습니다');
      return true;
    }
  } catch(e){}
  return false;
}
function hasAnySave(){
  try { return !!(localStorage.getItem(SAVE_V2) || localStorage.getItem(SAVE_V1)); } catch(e){ return false; }
}

// ---------- 게임 시작 / 맵 ----------
function startGame(useSave){
  game.notifs = [];
  let loaded = false;
  if (useSave) loaded = loadSaveData();
  if (!loaded){
    try { localStorage.removeItem(SAVE_V2); localStorage.removeItem(SAVE_V1); } catch(e){}
    player.job = 'beginner'; player.job2 = null; player.job3 = null; player.job4 = null; player.level = 1; player.exp = 0; player.sp = 0; player.skills = {};
    player.meso = 0; player.potions = { hp:3, mp:3, hp2:0, mp2:0 };
    player.binds = {};
    player.seq = ['X', 'C', 'A', 'D'];
    player.book = {}; player.stats = { kills:0, boss:0, maxDmg:0, deaths:0, time:0 };
    player.inv = []; player.equip = { weapon:null, hat:null, top:null, glove:null, shoe:null };
    player.quests = {};
    game.mapIdx = 0; game.cleared = false;
    game.bossRespawn = 0; game.bossAlerted = false;
  }
  player.hp = maxHp(); player.mp = maxMp();
  player.buffs = {}; player.cds = {}; player.combo = { n:0, t:0 };
  player.potionCd = { hp:0, mp:0 };
  player.channel = null;
  game.newConfirm = false;
  game.state = 'play';
  game.uiWindow = null;
  if (player.job === 'beginner' && player.level >= 8) game.jobPromptPending = true;
  loadMap(game.mapIdx, 'left');
}
function spawnMonster(t, x, fromSpawner){
  const T = MTYPES[t];
  const m = {
    type:t, T, x, y:curMap().floor, vx:0, vy:0, dir:Math.random() < 0.5 ? -1 : 1,
    hp:T.hp, maxHp:T.hp, homeX:x, chase:false, plat:null, spawnT:0.45,
    hitFlash:0, squash:0, stun:0, kb:0, dead:false, deadT:0, animT:rand(0, 6),
    spawner:fromSpawner || null,
    jumpTimer:5, sporeTimer:3, landed:true, summoned1:false, summoned2:false,
  };
  monsters.push(m);
  addEffect('spawnpoof', x, curMap().floor - T.h / 2, 1);
  return m;
}
function loadMap(idx, appear){
  game.mapIdx = idx;
  monsters = []; drops = []; effects = []; dmgTexts = []; pProj = []; eProj = [];
  spawners = []; particles = []; delayed = [];
  game.hitstop = 0; game.kickX = 0; game.kickY = 0;
  player.channel = null;
  const M = MAPS[idx];
  for (const s of M.spawns){
    const sp = { t:s.t, x:s.x, respawnT:0 };
    spawners.push(sp);
    spawnMonster(s.t, s.x, sp);
  }
  const bossType = BOSS_OF_MAP[idx];
  if (bossType && (game.bossRespawn <= 0 || game.bossRespawnMap !== idx)){
    spawnMonster(bossType, 950, null);
    if (!game.bossAlerted){ SFX.boss(); game.bossAlerted = true; }
  }
  player.x = appear === 'right' ? M.w - 120 : 120;
  player.y = M.floor; player.vx = 0; player.vy = 0;
  player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
  player.climbing = null;
  camX = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  setBgm(M.bgm);
  saveGame();
}

// ---------- 인벤토리 / 장비 ----------
function rollEquip(tier, forceRar){
  const pool = DROP_POOLS[tier];
  const id = pool[irand(0, pool.length - 1)];
  let rar = 0;
  if (typeof forceRar === 'number') rar = forceRar;
  else {
    // 희귀할수록 낮은 확률 (전설 0.7%부터 누적 판정)
    const r = Math.random();
    let acc = 0;
    for (let i = RARITIES.length - 1; i >= 1; i--){
      acc += RARITIES[i].chance;
      if (r < acc){ rar = i; break; }
    }
  }
  return { id, rar };
}
function addItem(inst){
  if (player.inv.length >= 24) return false;
  player.inv.push(inst);
  return true;
}
function itemLvReq(def){ return def.lv || TIER_LV[def.tier] || 1; }
function canEquip(inst){
  const def = ITEMS[inst.id];
  if (player.level < itemLvReq(def)) return false;
  if (def.slot === 'weapon') return def.job === player.job;
  return true;
}
function equipFromInv(idx){
  const inst = player.inv[idx];
  if (!inst) return;
  const def = ITEMS[inst.id];
  if (!canEquip(inst)){
    if (player.level < itemLvReq(def)) notify('레벨이 부족합니다 (Lv' + itemLvReq(def) + ' 필요)');
    else notify(def.slot === 'weapon' ? '이 무기는 다른 직업 전용입니다' : '장착할 수 없습니다');
    return;
  }
  const prev = player.equip[def.slot];
  player.inv.splice(idx, 1);
  player.equip[def.slot] = inst;
  if (prev) player.inv.push(prev);
  SFX.equip();
  notify(def.name + ' 장착');
  saveGame();
}
function unequipSlot(slot){
  const inst = player.equip[slot];
  if (!inst) return;
  if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }
  player.equip[slot] = null;
  player.inv.push(inst);
  SFX.equip();
  saveGame();
}
function sellPrice(inst){
  return Math.max(1, Math.floor((ITEMS[inst.id].price || 10) * 0.3)) + RARITIES[inst.rar].bonus * 50 + itemUp(inst) * Math.floor((ITEMS[inst.id].price || 100) * 0.05);
}
// ---------- 강화 (메소 소비처) ----------
function enhanceCost(inst){
  return Math.max(50, Math.round((ITEMS[inst.id].price || 100) * 0.2)) * (itemUp(inst) + 1);
}
function enhanceRate(inst){
  const up = itemUp(inst);
  return up < 4 ? 1.0 : (up < 7 ? 0.7 : (up < 9 ? 0.5 : 0.35));
}
function tryEnhance(slot){
  const inst = player.equip[slot];
  if (!inst) return;
  const up = itemUp(inst);
  if (up >= 10){ notify('이미 최대 강화(+10)입니다'); return; }
  const cost = enhanceCost(inst);
  if (player.meso < cost){ notify('메소가 부족합니다 (' + cost.toLocaleString() + ' 필요)'); return; }
  player.meso -= cost;
  if (Math.random() < enhanceRate(inst)){
    inst.up = up + 1;
    addEffect('jobadv', player.x, player.y, 1);
    burstGlow(player.x, player.y - 30, 8, '#ffd94a', true);
    SFX.levelup();
    notify(ITEMS[inst.id].name + ' 강화 성공! +' + inst.up);
  } else {
    SFX.hurt();
    notify('강화 실패… 장비는 무사합니다 (+' + up + ' 유지, 메소만 소모)');
  }
  saveGame();
}
function sellFromInv(idx){
  const inst = player.inv[idx];
  if (!inst) return;
  player.meso += sellPrice(inst);
  player.inv.splice(idx, 1);
  SFX.buy();
  saveGame();
}

// ---------- 상점 ----------
function shopEntries(){
  const list = Object.keys(POTIONS).map(k => ({
    kind:'potion', pot:k,
    name:POTIONS[k].name + ' (' + (POTIONS[k].stat === 'hp' ? 'HP' : 'MP') + ' +' + POTIONS[k].amt + ')',
    price:POTIONS[k].price,
  }));
  if (player.job !== 'beginner'){
    const base = { warrior:'sword', archer:'bow', mage:'staff', thief:'dagger' }[player.job];
    list.push({ kind:'item', id:base + '1' });
    list.push({ kind:'item', id:base + '2' });
  }
  list.push({ kind:'item', id:'hat1' });
  list.push({ kind:'item', id:'top1' });
  list.push({ kind:'item', id:'glove1' });
  list.push({ kind:'item', id:'shoe1' });
  list.push({ kind:'item', id:'hat2' });
  list.push({ kind:'item', id:'top2' });
  list.push({ kind:'item', id:'glove2' });
  list.push({ kind:'item', id:'shoe2' });
  return list;
}
function buyShop(entry, qty){
  qty = qty || 1;
  if (entry.kind === 'potion'){
    const P = POTIONS[entry.pot];
    const cur = player.potions[entry.pot] || 0;
    let n = Math.min(qty, 99 - cur, Math.floor(player.meso / P.price));
    if (99 - cur <= 0){ notify('더 가질 수 없습니다'); return; }
    if (n <= 0){ notify('메소가 부족합니다'); return; }
    player.meso -= P.price * n;
    player.potions[entry.pot] = cur + n;
    SFX.buy();
    if (qty > 1) notify(P.name + ' ' + n + '개 구매 (' + (P.price * n).toLocaleString() + '메소)');
  } else {
    const def = ITEMS[entry.id];
    if (player.meso < def.price){ notify('메소가 부족합니다'); return; }
    if (player.inv.length >= 24){ notify('인벤토리가 가득 찼습니다'); return; }
    player.meso -= def.price;
    player.inv.push({ id:entry.id, rar:0 });
    SFX.buy();
    notify(def.name + ' 구매');
  }
  saveGame();
}

// ---------- 퀘스트 ----------
function chainState(){
  // 순서대로 진행되는 체인에서 현재 퀘스트와 상태 반환
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (!qs){
      if (player.level < q.minLv) return { q, status:'locked' };
      return { q, status:'avail' };
    }
    if (qs.st === 'active'){
      return { q, status: qs.c >= q.need.n ? 'complete' : 'active' };
    }
    // done → 다음 퀘스트로
  }
  return { q:null, status:'alldone' };
}
function acceptQuest(q){
  player.quests[q.id] = { st:'active', c:0 };
  notify('퀘스트 수락: ' + q.name);
  SFX.questOk();
  saveGame();
}
function questOnKill(type){
  for (const q of QUESTS){
    const qs = player.quests[q.id];
    if (qs && qs.st === 'active' && q.need.t === type && qs.c < q.need.n){
      qs.c++;
      if (qs.c === q.need.n){ notify('퀘스트 목표 달성: ' + q.name); SFX.questOk(); }
    }
  }
}
function jobWeaponId(tier){
  const base = { warrior:'sword', archer:'bow', mage:'staff', thief:'dagger' }[player.job];
  return base ? base + tier : null;
}
function completeQuest(q){
  const qs = player.quests[q.id];
  if (!qs || qs.st !== 'active' || qs.c < q.need.n) return;
  const rw = q.reward;
  // 아이템 보상 먼저 확인 (인벤토리 공간)
  let inst = null;
  if (rw.item){
    let id = null, rar = rw.item.rar || 0;
    if (rw.item.kind === 'id') id = rw.item.id;
    else if (rw.item.kind === 'weapon'){
      id = jobWeaponId(rw.item.tier);
      if (!id){ // 미전직: 메소로 대체
        player.meso += rw.item.tier * 1000;
        notify('무기 대신 ' + (rw.item.tier * 1000) + ' 메소를 받았습니다');
      }
    }
    if (id){
      if (player.inv.length >= 24){ notify('인벤토리를 비우고 다시 오세요'); return; }
      inst = { id, rar };
      player.inv.push(inst);
      notify('보상 획득: ' + ITEMS[id].name + (rar > 0 ? ' (' + RARITIES[rar].name + ')' : ''));
    }
  }
  qs.st = 'done';
  if (rw.meso) player.meso += rw.meso;
  if (rw.hpPot) player.potions.hp = Math.min(99, player.potions.hp + rw.hpPot);
  if (rw.mpPot) player.potions.mp = Math.min(99, player.potions.mp + rw.mpPot);
  notify('퀘스트 완료: ' + q.name);
  SFX.questOk();
  if (rw.exp) gainExp(rw.exp);
  saveGame();
}

// ---------- 전직 / 스킬 ----------
function doJobAdvance(jobKey){
  if (player.job !== 'beginner' || !JOBS[jobKey]) return;
  player.job = jobKey;
  player.sp += Math.max(0, (player.level - 7)) * 3;
  const wid = JOBS[jobKey].startWeapon;
  player.equip.weapon = { id:wid, rar:0 };
  player.hp = maxHp(); player.mp = maxMp();
  addEffect('jobadv', player.x, player.y, 1);
  SFX.jobadv();
  notify(JOBS[jobKey].name + '(으)로 전직했습니다!');
  game.uiWindow = null;
  game.jobPromptPending = false;
  saveGame();
}
function doJob2Advance(choiceKey){
  if (player.job === 'beginner' || player.job2 || player.level < 15) return;
  const opts = JOB2[player.job];
  const pick = opts.find(o => o.key === choiceKey) || opts[0];
  player.job2 = pick.key;
  player.sp += 3;
  player.hp = maxHp(); player.mp = maxMp();
  addEffect('jobadv', player.x, player.y, 1);
  SFX.jobadv();
  notify(pick.name + '(으)로 2차 전직했습니다!');
  game.uiWindow = null;
  saveGame();
}

function investSkill(id){
  if (player.sp <= 0) return;
  const known = [mySkills(), mySkills2(), mySkills3(), mySkills4()]
    .some(defs => defs && defs.some(d => d.id === id));
  if (!known) return;
  const cur = skillLevel(id);
  if (cur >= 10) return;
  player.skills[id] = cur + 1;
  player.sp--;
  SFX.buff();
  saveGame();
}
function addBuff(id, dur, lvl){
  player.buffs[id] = { t:dur, lvl };
  addEffect('buff', player.x, player.y, 1);
  SFX.buff();
}
function useSkillSlot(i){
  if (player.climbing || player.prone || player.channel) return;
  const defs = mySkills();
  if (!defs){ notify('Lv8에 전직하면 스킬을 배웁니다'); return; }
  const def = defs[i];
  const lvl = skillLevel(def.id);
  if (lvl < 1){ notify('스킬창(K)에서 ' + def.name + '에 SP를 투자하세요'); return; }
  if ((player.cds[def.id] || 0) > 0) return;
  if (player.mp < def.mp){ notify('MP가 부족합니다'); return; }
  player.mp -= def.mp;
  player.cds[def.id] = def.cd;
  const mult = def.base + def.per * lvl;
  player.castAnim = 0.25;
  switch (def.id){
    case 'ps': {
      const box = { x: player.facing > 0 ? player.x : player.x - 105, y:player.y - 80, w:105, h:88 };
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      SFX.skill();
      if (best){
        hitMonster(best, mult);
        addEffect('impact', best.x, best.y - best.T.h / 2, player.facing);
      }
      break;
    }
    case 'sb': {
      const box = { x:player.x - 140, y:player.y - 120, w:280, h:130 };
      let hits = 0;
      addEffect('slash', player.x + player.facing * 45, player.y - 36, player.facing);
      addEffect('slash', player.x - player.facing * 45, player.y - 36, -player.facing);
      addEffect('whirl', player.x, player.y - 42, player.facing);
      SFX.skill();
      for (const m of monsters){
        if (m.dead || hits >= 8) continue;
        if (overlap(box, monsterRect(m))){ hitMonster(m, mult); hits++; }
      }
      break;
    }
    case 'rage': addBuff('rage', def.dur, lvl); break;
    case 'focus': addBuff('focus', def.dur, lvl); break;
    case 'shield': addBuff('shield', def.dur, lvl); break;
    case 'ds':
      spawnArrow(mult, -6);
      spawnArrow(mult, 0);
      SFX.arrow();
      break;
    case 'ab':
      pProj.push({ kind:'bomb', x:player.x + player.facing * 20, y:player.y - 28, vx:player.facing * 640, mult, dist:0, maxDist:560 });
      SFX.skill();
      break;
    case 'mc': {
      let best = null, bestD = 1e9;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x;
        if (dx * player.facing < 0) continue;
        const d = Math.abs(dx);
        if (d < 430 && Math.abs((m.y - m.T.h / 2) - (player.y - 30)) < 130 && d < bestD){ bestD = d; best = m; }
      }
      SFX.magic();
      if (best){
        addEffect('claw', best.x, best.y - best.T.h / 2, player.facing);
        hitMonster(best, mult);
        const bm = best;
        after(0.08, () => {
          if (game.state !== 'play' || bm.dead) return;
          addEffect('claw', bm.x, bm.y - bm.T.h / 2, -player.facing);
          hitMonster(bm, mult);
        });
      } else {
        addEffect('claw', player.x + player.facing * 120, player.y - 40, player.facing);
      }
      break;
    }
    case 'tb': {
      SFX.thunder();
      game.shake = Math.max(game.shake, 0.35);
      game.flash = 0.13;
      for (const m of monsters){
        if (m.dead) continue;
        const dx = m.x - player.x, dy = (m.y - m.T.h / 2) - (player.y - 30);
        if (dx * dx + dy * dy < 210 * 210){
          addEffect('lightning', m.x, m.y - m.T.h, 1);
          hitMonster(m, mult);
        }
      }
      break;
    }
    case 'l7':
      spawnStar(mult, -5);
      spawnStar(mult, 2);
      SFX.arrow();
      break;
    case 'sv': {
      // 새비지 블로우: 전방 최근접 1마리 4연타
      let best = null, bestD = 1e9;
      const box = { x: player.facing > 0 ? player.x : player.x - 110, y:player.y - 84, w:110, h:92 };
      for (const m of monsters){
        if (m.dead) continue;
        if (overlap(box, monsterRect(m))){
          const d = Math.abs(m.x - player.x);
          if (d < bestD){ bestD = d; best = m; }
        }
      }
      addEffect('claw', player.x + player.facing * 55, player.y - 36, player.facing);
      SFX.skill();
      if (best){
        for (let k = 0; k < 4 && !best.dead; k++) hitMonster(best, mult);
        addEffect('impact', best.x, best.y - best.T.h / 2, player.facing);
      }
      break;
    }
    case 'haste': addBuff('haste', def.dur, lvl); break;
  }
}
function spawnArrow(mult, yOff, kind){
  pProj.push({ kind:kind || 'arrow', x:player.x + player.facing * 16, y:player.y - 28 + (yOff || 0), vx:player.facing * 760, mult, dist:0, maxDist:540 });
  addEffect('muzzle', player.x + player.facing * 24, player.y - 28 + (yOff || 0), player.facing);
}
function spawnStar(mult, yOff, vyy, kind){
  pProj.push({ kind:kind || 'star', x:player.x + player.facing * 16, y:player.y - 28 + (yOff || 0), vx:player.facing * 700, vy:vyy || 0, mult, dist:0, maxDist:520 });
}

function useSkillSlot2(i){

  if (!defs){
    notify(player.job === 'beginner' ? 'Lv8에 전직하면 스킬을 배웁니다' : 'Lv15에 촌장에게서 2차 전직할 수 있습니다');
    return;
  }

  if ((player.cds[def.id] || 0) > 0) return;
  if (player.mp < def.mp){ notify('MP가 부족합니다'); return; }
  player.mp -= def.mp;
  player.cds[def.id] = def.cd;
  const mult = def.base + def.per * lvl;
  player.castAnim = 0.25;
  switch (def.id){
    case 'bd': {
      // 브랜디시: 전방 최대 4마리 2연타
      const box = { x: player.facing > 0 ? player.x : player.x - 150, y:player.y - 100, w:150, h:110 };

        if (m.dead || hits >= 4) continue;

          hitMonster(m, mult);
          const mm2 = m;
          after(0.09, () => { if (game.state === 'play' && !mm2.dead) hitMonster(mm2, mult); });
          hits++;
        }
      }
      break;

    case 'swv':
      // 쇼크 웨이브: 관통 지면 충격파
      pProj.push({ kind:'wave2', x:player.x + player.facing * 26, y:player.y - 12, vx:player.facing * 520, mult, dist:0, maxDist:520, pierce:true, hit:new Set() });
      game.shake = Math.max(game.shake, 0.4);

function addDmgText(x, y, txt, color, big){

// ---------- 파티클 ----------
const P_MAX = 420;
function spawnP(o){
  if (particles.length >= P_MAX) particles.shift();
  o.t = 0;
  particles.push(o);
}
// 스파크: 진행 방향으로 튀는 빛줄기 (가산합성)

      g:1500, dr:2.6, life:rand(0.22, 0.4), size:rand(1.6, 3), col });
  }
}
// 파편: 회전하는 사각 조각 (몬스터 색)
function burstShards(x, y, n, col){

// 불티: 폭발 잔불
function burstEmbers(x, y, n){
  for (let i = 0; i < n; i++){
    const ang = rand(0, Math.PI * 2);

    spawnP({ k:'ember', x, y, vx:Math.cos(ang) * sp, vy:Math.sin(ang) * sp * 0.75 - rand(60, 200),
      g:1100, dr:1.4, life:rand(0.35, 0.7), size:rand(1.8, 3.6), col:null });
  }

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life){ particles.splice(i, 1); continue; }
    p.vy += (p.g || 0) * dt;
    const d = Math.pow(Math.max(0.0001, 1 - (p.dr || 0) * dt), 1);
    p.vx *= d; p.vy *= (p.k === 'dust' ? d : 1 - Math.min(0.9, (p.dr || 0) * 0.4 * dt));
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    // 바닥에 닿은 파편은 튕김
    if ((p.k === 'shard' || p.k === 'ember') && p.y > curMap().floor && p.vy > 0){
      p.y = curMap().floor; p.vy *= -0.45; p.vx *= 0.6;
    }
  }
}
// 타격 반동: 카메라 킥만 사용 (히트스톱 슬로우는 끊김 체감으로 제거)
function feelHit(strength, dir){
  if (dir) game.kickX = clamp(game.kickX + dir * strength * 55, -9, 9);
}
// 지연 실행 큐: 히트스톱 슬로우를 함께 타는 연출용 (setTimeout 금지)
let delayed = [];
function after(t, fn){ delayed.push({ t, fn }); }
function updateDelayed(dt){
  for (let i = delayed.length - 1; i >= 0; i--){
    delayed[i].t -= dt;
    if (delayed[i].t <= 0){
      const fn = delayed[i].fn;
      delayed.splice(i, 1);
      fn();
    }
  }
}
function monsterRect(m){
  return { x:m.x - m.T.w / 2, y:m.y - m.T.h, w:m.T.w, h:m.T.h };
}
let spGuard = false;
function hitMonster(m, mult){
  if (m.dead) return;
  let dmg = totalAtk() * mult * rand(0.85, 1.15);
  const crit = Math.random() < critChance();
  if (crit) dmg *= 1.5;
  dmg = Math.max(1, Math.round(dmg));
  m.hp -= dmg;
  m.hitFlash = 0.15;
  if (!m.T.isBoss){
    m.stun = Math.max(m.stun, m.T.kbResist ? 0.12 : 0.30);
    m.kb = player.facing * (m.T.kbResist ? 55 : (crit ? 230 : 150));
  }
  if (dmg > (player.stats.maxDmg || 0)) player.stats.maxDmg = dmg;
  addDmgText(m.x, m.y - m.T.h - 8, String(dmg), crit ? '#ff5ab0' : '#ffb642', crit);
  addEffect('hitstar', m.x + rand(-8, 8), m.y - m.T.h / 2 + rand(-8, 8), 1);
  const hy = m.y - m.T.h / 2;
  m.squash = 0.22;
  if (crit){
    burstSparks(m.x, hy, player.facing, 11, '#ffd0e8');
    addEffect('critring', m.x, hy, player.facing);
    feelHit(0.09, player.facing);
  } else {
    burstSparks(m.x, hy, player.facing, 5, '#ffe9a0');
    feelHit(0.045, 0);
  }
  player.combo.n++; player.combo.t = 2.2;
  if (crit) SFX.crit(); else SFX.hit();
  if (m.hp <= 0) killMonster(m);
  // 섀도 파트너: 분신 추가타 (재귀 방지 가드)
  if (!spGuard && !m.dead && buffLevel('sp') >= 0){
    spGuard = true;
    hitMonster(m, mult * (0.5 + 0.02 * buffLevel('sp')));
    spGuard = false;
  }
}
function explodeAt(x, y, mult){
  addEffect('explosion', x, y, 1);
  SFX.explode();
  game.shake = Math.max(game.shake, 0.28);
  burstEmbers(x, y, 14);
  burstDust(x, Math.min(y + 30, curMap().floor), 6, 30);
  feelHit(0.06, 0);
  for (const m of monsters){
    if (m.dead) continue;
    const dx = m.x - x, dy = (m.y - m.T.h / 2) - y;
    if (dx * dx + dy * dy < 120 * 120) hitMonster(m, mult);
  }
}
const M_SHARD = { snail:'#4a74d0', rsnail:'#d05a48', slime:'#5cbf4a', shroom:'#e08a3a', pig:'#f0a0b8', boar:'#8a5040', stump:'#9a7a4e', eye:'#9a5ad0', zshroom:'#8a6ab8', boss:'#d85450', lupin:'#a0703c', ironhog:'#6a7a8a', golem:'#8a8a7a', kslime:'#5cbf4a', clam:'#f0a0b0', octo:'#5a8ad0', fang:'#e8eef6', pepe:'#f0d040', igolem:'#a8c8e0', tick:'#c8a050', yeti:'#e8eef6', timekeeper:'#c8a050' };

function gainExp(e){

    if (player.job !== 'beginner' && !player.job2 && player.level >= 15) notify('Lv15 달성! 촌장에게서 2차 전직이 가능합니다');
    if (player.job2 && !player.job3 && player.level >= 20) notify('Lv20 달성! 촌장에게서 3차 전직이 가능합니다');
    if (player.job3 && !player.job4 && player.level >= 28) notify('Lv28 달성! 촌장에게서 4차 전직이 가능합니다');
    saveGame();
  }
}
function hurtPlayer(dmg, fromX){
  if (player.invul > 0 || game.state !== 'play') return;
  let d = dmg * rand(0.9, 1.1);
  const sl = buffLevel('shield');
  if (sl >= 0) d *= 1 - (0.20 + 0.02 * sl);
  const il = buffLevel('iron');
  if (il >= 0) d *= 1 - (0.15 + 0.015 * il);
  const cl = buffLevel('cloak');
  if (cl >= 0) d *= 1 - (0.18 + 0.015 * cl);
  const ssl2 = buffLevel('sstep');
  if (ssl2 >= 0) d *= 1 - (0.10 + 0.01 * ssl2);
  const reduced = Math.max(1, Math.round(d - totalDef() * 0.7 - player.level * 0.3));
  player.hp -= reduced;
  player.invul = 1.3;
  player.climbing = null;
  player.channel = null;
  player.vy = -320;
  player.vx = (player.x < fromX ? -1 : 1) * 240;
  player.combo = { n:0, t:0 };
  addDmgText(player.x, player.y - player.h - 10, String(reduced), '#ff4646');
  SFX.hurt();
  game.shake = Math.max(game.shake, 0.4);
  burstSparks(player.x, player.y - 30, player.x < fromX ? -1 : 1, 7, '#ff9a8a');
  feelHit(0.07, player.x < fromX ? -1 : 1);
  if (player.hp <= 0){
    player.hp = 0;
    player.stats.deaths++;
    game.state = 'dead';
    game.uiWindow = null;
    game.deadTimer = 0;
    SFX.die();
  }
}

// ---------- 상호작용 (↑키) ----------
function ladderAt(){
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && player.y > l[1] + 8 && player.y <= l[2] + 2) return l;
  }
  return null;
}
function ladderBelow(){
  // 사다리 꼭대기 발판 위에 서 있을 때 (아래로 진입)
  for (const l of curMap().ladders){
    if (Math.abs(player.x - l[0]) < 20 && Math.abs(player.y - l[1]) < 5 && player.onGround) return l;
  }
  return null;
}
function startClimb(l, fromTop){
  player.climbing = { x:l[0], y1:l[1], y2:l[2] };
  player.channel = null;
  player.x = l[0];
  player.vx = 0; player.vy = 0;
  player.onGround = false; player.jumpsUsed = 1; player.dropT = 0;
  if (fromTop) player.y = l[1] + 14;
  SFX.climb();
}
function openNpc(n){
  if (n.id === 'merchant'){
    game.uiWindow = 'shop';
  } else {
    game.uiWindow = 'dialog';
    game.dialogNpc = n;
  }
}
function startPortal(p){
  SFX.portal();
  game.fadeDir = 1; game.fade = 0;
  game.pendingMap = { to:p.to, appear:p.appear };
}
function interact(){
  const M = curMap();
  for (const n of M.npcs){
    if (Math.abs(player.x - n.x) < 50 && player.onGround && !player.groundIsPlat){ openNpc(n); return true; }
  }
  for (const p of M.portals){
    if (Math.abs(player.x - p.x) < 36 && player.y >= M.floor - 4){ startPortal(p); return true; }
  }
  const l = ladderAt();
  if (l && !player.climbing){ startClimb(l, false); return true; }
  return false;
}
function jumpPressed(){
  if (player.climbing){
    player.climbing = null;
    player.vy = -450;
    player.vx = keys.ArrowLeft ? -200 : (keys.ArrowRight ? 200 : 0);
    player.jumpsUsed = 1;
    SFX.jump();
    return;
  }
  if (keys.ArrowDown && player.onGround){
    const l = ladderBelow();
    if (l){ startClimb(l, true); return; }
    if (player.groundIsPlat){
      player.dropT = 0.22; player.vy = 160; player.onGround = false;
      return;
    }
  }
  if (player.onGround){
    player.vy = -820; player.jumpsUsed = 1; player.onGround = false; SFX.jump();
  } else if (player.jumpsUsed < 2){
    player.vy = -720; player.jumpsUsed = 2; SFX.jump();
    addEffect('djump', player.x, player.y, player.facing);
    burstGlow(player.x, player.y - 6, 4, '#cfe6ff', false);
  }
}
const POTION_CD = { hp:3.5, mp:5 };
// 포션 카탈로그: grp가 같으면 쿨다운 공유 (연속 흡입 방지)
const POTIONS = {
  hp:  { name:'빨간 포션',   stat:'hp', amt:100, price:50,  grp:'hp', color:'#e84545' },
  mp:  { name:'파란 포션',   stat:'mp', amt:70,  price:60,  grp:'mp', color:'#4576e8' },
  hp2: { name:'엘릭서',      stat:'hp', amt:350, price:230, grp:'hp', color:'#f08a2e' },
  mp2: { name:'마나 엘릭서', stat:'mp', amt:250, price:280, grp:'mp', color:'#9a5ae0' },
};
function usePotion(kind){
  const P = POTIONS[kind];
  if (!P) return;
  if (player.potionCd[P.grp] > 0) return;
  if ((player.potions[kind] || 0) <= 0) return;
  if (P.stat === 'hp' ? player.hp >= maxHp() : player.mp >= maxMp()) return;
  player.potions[kind]--;
  if (P.stat === 'hp'){
    player.hp = Math.min(maxHp(), player.hp + P.amt);
    addDmgText(player.x, player.y - player.h - 10, '+' + P.amt, '#66ff8a');
  } else {
    player.mp = Math.min(maxMp(), player.mp + P.amt);
    addDmgText(player.x, player.y - player.h - 10, '+' + P.amt + ' MP', '#6ab8ff');
  }
  player.potionCd[P.grp] = POTION_CD[P.grp];
  SFX.potion();
}

// ---------- 물리 ----------
function resolveVertical(ent, prevY, isPlayer){
  const M = curMap();
  let landed = false, onPlat = false;
  if (ent.vy >= 0){
    if (prevY <= M.floor && ent.y >= M.floor){
      ent.y = M.floor; ent.vy = 0; landed = true;
    } else if (!(isPlayer && player.dropT > 0)){
      for (const p of M.plats){
        if (ent.x > p[0] - 4 && ent.x < p[0] + p[2] + 4 && prevY <= p[1] && ent.y >= p[1]){
          ent.y = p[1]; ent.vy = 0; landed = true; onPlat = true;
          if (!isPlayer) ent.plat = p;
          break;
        }
      }
    }
  }
  return { landed, onPlat };
}

// ---------- 플레이어 업데이트 ----------
function doBasicAttack(){
  const job = player.job;
  if (job === 'archer'){
    player.cdBasic = 0.42;
    player.attackAnim = 0.2;
    spawnArrow(1.0, 0);
    SFX.arrow();
  } else if (job === 'thief'){
    player.cdBasic = 0.36;
    player.attackAnim = 0.2;
    spawnStar(0.95, 0);
    SFX.arrow();
  } else if (job === 'mage'){
    player.cdBasic = 0.48;
    player.attackAnim = 0.2;
    pProj.push({ kind:'orb', x:player.x + player.facing * 16, y:player.y - 28, vx:player.facing * 600, mult:1.05, dist:0, maxDist:480 });
    SFX.magic();
  } else {
    const range = job === 'warrior' ? 95 : 80;
    const multB = job === 'warrior' ? 1.1 : 1.0;
    player.cdBasic = job === 'warrior' ? 0.36 : 0.4;
    player.attackAnim = 0.2;
    player.attackAlt = 1 - player.attackAlt;
    const box = { x: player.facing > 0 ? player.x + 4 : player.x - 4 - range, y:player.y - 66, w:range, h:74 };
    addEffect('swing', player.x + player.facing * 40, player.y - 34, player.facing * (player.attackAlt ? 1 : -1));
    let hit = false;
    for (const m of monsters){
      if (m.dead) continue;
      if (overlap(box, monsterRect(m))){ hitMonster(m, multB); hit = true; }
    }
    if (!hit) beep(180, 0.05, 'square', 0.02);
  }
  // 공격 속도 버프 (호크 아이 / 바람의 축복 / 그림자 지배)
  const hl0 = buffLevel('hawk');
  if (hl0 >= 0) player.cdBasic *= 1 - (0.10 + 0.01 * hl0);
  const fzl = buffLevel('fz');
  if (fzl >= 0) player.cdBasic *= 1 - (0.12 + 0.012 * fzl);
  if (buffLevel('wq') >= 0) player.cdBasic *= 0.80;
  if (buffLevel('sdm') >= 0) player.cdBasic *= 0.90;
}
function updatePlayer(dt){
  const M = curMap();
  player.invul = Math.max(0, player.invul - dt);
  player.cdBasic = Math.max(0, player.cdBasic - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);
  player.castAnim = Math.max(0, player.castAnim - dt);
  player.dropT = Math.max(0, player.dropT - dt);
  player.potionCd.hp = Math.max(0, player.potionCd.hp - dt);
  player.potionCd.mp = Math.max(0, player.potionCd.mp - dt);
  for (const k in player.cds) player.cds[k] = Math.max(0, player.cds[k] - dt);
  for (const k in player.buffs){
    player.buffs[k].t -= dt;
    if (player.buffs[k].t <= 0) delete player.buffs[k];
  }
  if (player.combo.t > 0){
    player.combo.t -= dt;
    if (player.combo.t <= 0) player.combo = { n:0, t:0 };
  }

  // 폭풍의 시 채널링: 0.1초마다 화살 발사
  if (player.channel){
    const ch = player.channel;
    ch.t -= dt; ch.tickT -= dt;
    if (ch.tickT <= 0){
      ch.tickT = 0.1;
      spawnArrow(ch.mult, rand(-18, 4), 'hurr');
      player.attackAnim = 0.14;
      ch.n = (ch.n || 0) + 1;
      if (ch.n % 3 === 1) addEffect('windfan', player.x + player.facing * 30, player.y - 28, player.facing);
      SFX.arrow();
    }
    if (ch.t <= 0) player.channel = null;
  }
  // 지속 재생 버프 (워리어 하트 / 인피니티)
  const whl = buffLevel('wh');
  if (whl >= 0) player.hp = Math.min(maxHp(), player.hp + maxHp() * (0.02 + 0.002 * whl) * dt);
  const ifl = buffLevel('inf');
  if (ifl >= 0) player.mp = Math.min(maxMp(), player.mp + (12 + 1.2 * ifl) * dt);

  // 등반 중
  if (player.climbing){
    const c = player.climbing;
    if (keys.ArrowUp) player.y -= 155 * dt;
    if (keys.ArrowDown) player.y += 165 * dt;
    if (player.y <= c.y1){
      player.y = c.y1; player.climbing = null;
      player.onGround = true; player.groundIsPlat = (c.y1 !== M.floor); player.jumpsUsed = 0;
    } else if (player.y >= c.y2){
      player.y = c.y2; player.climbing = null;
      player.onGround = true; player.groundIsPlat = false; player.jumpsUsed = 0;
    }
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
    return;
  }

  // 이동
  const L = keys.ArrowLeft, R = keys.ArrowRight;
  let mv = 0;
  if (L && !R) mv = -1;
  if (R && !L) mv = 1;
  // 엎드리기 (메이플식: 지상에서 ↓ 홀드)
  player.prone = !!(keys.ArrowDown && player.onGround && mv === 0);
  if (mv !== 0){ player.facing = mv; player.walkT += dt * 9; }
  const targetVx = player.prone ? 0 : mv * moveSpd() * (player.channel ? 0.25 : 1);
  player.vx += (targetVx - player.vx) * Math.min(1, dt * 14);

  // 기본 공격 (Z 홀드, 엎드린 상태 불가)
  if (keys.KeyZ && player.cdBasic <= 0 && !player.prone) doBasicAttack();

  // 달리기 흙먼지
  player.dustT = (player.dustT || 0) - dt;
  if (player.onGround && Math.abs(player.vx) > 190 && player.dustT <= 0){
    player.dustT = 0.16;
    burstDust(player.x - player.facing * 12, player.y, 1, 4);
  }
  // 버프 오라 (첫 버프 색으로 상승 글로우)
  player.auraT = (player.auraT || 0) - dt;
  if (player.auraT <= 0){
    const AURA_COL = { rage:'#ff9a6a', focus:'#8affa0', shield:'#8ab8ff', iron:'#d8d8e8', hawk:'#b8ffa0', bless:'#ffe98a' };
    for (const bid in player.buffs){
      if (AURA_COL[bid]){ burstGlow(player.x, player.y - 28, 1, AURA_COL[bid], true); break; }
    }
    player.auraT = 0.14;
  }

  // 중력
  player.vy += GRAV * dt;
  if (player.vy > 900) player.vy = 900;
  const prevY = player.y;
  const fallVy = player.vy;
  const wasGround = player.onGround;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.x = clamp(player.x, 18, M.w - 18);

  const res = resolveVertical(player, prevY, true);
  player.onGround = res.landed;
  player.groundIsPlat = res.onPlat;
  if (res.landed) player.jumpsUsed = 0;
  else if (player.jumpsUsed === 0 && player.vy > 0) player.jumpsUsed = 1; // 발판 낙하 = 첫 점프 소모
  // 착지 먼지
  if (res.landed && !wasGround && fallVy > 480){
    burstDust(player.x, player.y, fallVy > 860 ? 7 : 4, 16);
    if (fallVy > 860) addEffect('shockring', player.x, player.y, 1);
  }

  // 자연 회복
  if (M.safe){
    player.hp = Math.min(maxHp(), player.hp + 25 * dt);
    player.mp = Math.min(maxMp(), player.mp + 15 * dt);
  } else {
    if (player.onGround && mv === 0) player.hp = Math.min(maxHp(), player.hp + 3.5 * dt);
    player.mp = Math.min(maxMp(), player.mp + 2.4 * dt);
  }
  // 아이언 바디 재생
  if (buffLevel('iron') >= 0) player.hp = Math.min(maxHp(), player.hp + maxHp() * 0.01 * dt);
}

// ---------- 몬스터 업데이트 ----------
function updateMonster(m, dt){
  const M = curMap();
  m.animT += dt;
  if (m.dead){ m.deadT += dt; return; }
  if (m.spawnT > 0){ m.spawnT -= dt; return; }
  m.hitFlash = Math.max(0, m.hitFlash - dt);
  m.squash = Math.max(0, m.squash - dt);
  m.stun = Math.max(0, m.stun - dt);
  m.kb *= Math.pow(0.0015, dt);

  if (m.T.isBoss){ updateBoss(m, dt); return; }

  const dx = player.x - m.x, dy = player.y - m.y;
  if (m.T.aggro && Math.abs(dx) < 270 && Math.abs(dy) < 90 && game.state === 'play') m.chase = true;
  if (Math.abs(dx) > 500) m.chase = false;

  // 원거리 투척몹: 루팡(바나나) / 옥토퍼스(먹물)
  if ((m.type === 'lupin' || m.type === 'octo') && m.stun <= 0 && game.state === 'play'){
    if (m.throwT == null) m.throwT = rand(1, 2.5);
    m.throwT -= dt;
    const adx = Math.abs(dx);
    if (m.throwT <= 0 && adx > 120 && adx < 340 && Math.abs(dy) < 70){
      m.throwT = 2.5;
      const ink = m.type === 'octo';
      eProj.push({ x:m.x + Math.sign(dx) * 12, y:m.y - (ink ? 26 : 36), vx:Math.sign(dx) * 260, vy:-300, kind:'spore', vis:ink ? 'ink' : 'banana', dmg:ink ? 20 : 18 });
      SFX.arrow();
    }
  }
  // 골렘 계열: 근접 내리찍기 (예고 진동 후 충격)
  if ((m.type === 'golem' || m.type === 'igolem') && m.stun <= 0 && game.state === 'play'){
    if (m.slamT == null) m.slamT = 2;
    m.slamT -= dt;
    if (m.slamT <= 0 && Math.abs(dx) < 100){
      m.slamT = 4;
      addEffect('shockring', m.x, m.y, 1);
      burstDust(m.x, m.y, 6, 34);
      game.shake = Math.max(game.shake, 0.3);
      SFX.boss();
      if (Math.abs(player.x - m.x) < 140 && Math.abs(player.y - m.y) < 70) hurtPlayer(m.type === 'igolem' ? 78 : 45, m.x);
    }
  }

  let dir = m.dir;
  if (m.chase) dir = dx > 0 ? 1 : -1;

  let vx = 0;
  if (m.stun <= 0){
    vx = dir * m.T.spd;
    if (m.chase && m.type === 'ironhog') vx *= 1.3; // 돌진 가속
    if (!m.chase){
      if (m.x > m.homeX + 130) dir = -1;
      if (m.x < m.homeX - 130) dir = 1;
      vx = dir * m.T.spd * 0.6;
      if (m.plat){
        if (m.x < m.plat[0] + 14) dir = 1;
        if (m.x > m.plat[0] + m.plat[2] - 14) dir = -1;
        vx = dir * m.T.spd * 0.6;
      }
    }
    m.dir = dir;
  }
  m.vy += GRAV * dt;
  if (m.vy > 900) m.vy = 900;
  const prevY = m.y;
  m.x += (vx + m.kb) * dt;
  m.y += m.vy * dt;
  m.x = clamp(m.x, 20, M.w - 20);
  m.plat = null;
  resolveVertical(m, prevY, false);
}
// 보스 패턴 테이블: enr 격노 임계 / jn·je 점프주기 / wv·wd 파동 속도·피해 / spread·vd 살포 / s1·s2 소환 임계
const BOSS_TUNE = {
  boss:       { enr:0.5,  jn:5,   je:3.2, wv:430, wd:28, vis:null,    spread:[-140, 0, 140],          vd:30, s1:0.6,  k1:[['shroom', -200], ['shroom', 180], ['shroom', 280]], s2:0.3,  k2:[['zshroom', -240], ['zshroom', 240]], dbl:false,
                c1:'부하들이여!', c2:'일어나라, 저주받은 자들이여!' },
  kslime:     { enr:0.3,  jn:5,   je:1.8, wv:460, wd:32, vis:'jelly', spread:[-160, -80, 0, 80, 160], vd:26, s1:0.65, k1:[['slime', -260], ['slime', -160], ['slime', 180], ['slime', 280]], s2:0.35, k2:[['slime', -280], ['slime', -180], ['slime', 200], ['slime', 300]], dbl:true,
                c1:'나의 아이들아!', c2:'왕국을 지켜라!' },
  yeti:       { enr:0.35, jn:4.2, je:2.2, wv:520, wd:44, vis:'ice',   spread:[-180, -60, 60, 180],    vd:38, s1:0.6,  k1:[['fang', -240], ['fang', 200], ['fang', 300]], s2:0.3,  k2:[['pepe', -260], ['pepe', 260]], dbl:true,
                c1:'크아아앙!', c2:'설산이 분노한다!' },
  timekeeper: { enr:0.4,  jn:3.6, je:1.6, wv:600, wd:55, vis:'clock', spread:[-200, -100, 0, 100, 200], vd:48, s1:0.65, k1:[['tick', -240], ['tick', 240]], s2:0.35, k2:[['tick', -280], ['tick', 0], ['tick', 280]], dbl:true,
                c1:'시간은 나의 것.', c2:'종말의 태엽이 감긴다.' },
};
function updateBoss(b, dt){
  const M = curMap();
  const P = BOSS_TUNE[b.type] || BOSS_TUNE.boss;
  const dx = player.x - b.x;
  b.dir = dx > 0 ? 1 : -1;
  const enraged = b.hp < b.maxHp * P.enr;
  b.jumpTimer -= dt;
  b.sporeTimer -= dt;
  // 격노 시 착지 후 지연 저속 파동 (2중 파동 — 틈 읽기)
  if (b.waveDelay != null){
    b.waveDelay -= dt;
    if (b.waveDelay <= 0){
      b.waveDelay = null;
      eProj.push({ x:b.x - 60, y:M.floor, vx:-P.wv * 0.62, vy:0, kind:'wave', life:1.8, dmg:Math.round(P.wd * 0.8), vis:P.vis });
      eProj.push({ x:b.x + 60, y:M.floor, vx:P.wv * 0.62, vy:0, kind:'wave', life:1.8, dmg:Math.round(P.wd * 0.8), vis:P.vis });
    }
  }

  if (b.landed && b.jumpTimer <= 0){
    b.vy = -880;
    b.vx = clamp(dx, -420, 420) / 1.1;
    b.landed = false;
    b.jumpTimer = enraged ? P.je : P.jn;
  }
  // 투사체 살포 (착지 상태에서)
  if (b.landed && b.sporeTimer <= 0){
    b.sporeTimer = enraged ? 3.2 : 4.5;
    for (const a of P.spread){
      eProj.push({ x:b.x + b.dir * 40, y:b.y - b.T.h + 30, vx: clamp(dx * 0.8, -350, 350) + a, vy:-rand(380, 480), kind:'spore', dmg:P.vd, vis:P.vis });
    }
    SFX.explode();
  }
  if (b.landed && b.stun <= 0){
    b.x += b.dir * b.T.spd * dt;
  } else if (!b.landed){
    b.x += (b.vx || 0) * dt;
  }
  b.vy += GRAV * dt;
  if (b.vy > 1000) b.vy = 1000;
  const prevY = b.y;
  b.y += b.vy * dt;
  b.x = clamp(b.x, 90, M.w - 90);
  if (prevY <= M.floor && b.y >= M.floor && b.vy >= 0){
    b.y = M.floor; b.vy = 0;
    if (!b.landed){
      b.landed = true;
      game.shake = Math.max(game.shake, 0.75);
      SFX.boss();
      burstDust(b.x, M.floor, 12, 80);
      addEffect('shockring', b.x, M.floor, 1);
      eProj.push({ x:b.x - 60, y:M.floor, vx:-P.wv, vy:0, kind:'wave', life:1.5, dmg:P.wd, vis:P.vis });
      eProj.push({ x:b.x + 60, y:M.floor, vx:P.wv, vy:0, kind:'wave', life:1.5, dmg:P.wd, vis:P.vis });
      if (P.dbl && enraged) b.waveDelay = 0.3;
    }
  }
  if (!b.summoned1 && b.hp < b.maxHp * P.s1){
    b.summoned1 = true;
    for (const [kk, ox] of P.k1){
      const mm = spawnMonster(kk, clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, P.c1, '#ffdd66', true);
  }
  if (!b.summoned2 && b.hp < b.maxHp * P.s2){
    b.summoned2 = true;
    for (const [kk, ox] of P.k2){
      const mm = spawnMonster(kk, clamp(b.x + ox, 60, M.w - 60), null);
      mm.chase = true;
    }
    addDmgText(b.x, b.y - b.T.h - 30, P.c2, '#c77aff', true);
  }
}

// ---------- 월드 업데이트 ----------
function updateWorld(dt){
  const M = curMap();
  for (const sp of spawners){
    if (sp.respawnT > 0){
      sp.respawnT -= dt;
      if (sp.respawnT <= 0) spawnMonster(sp.t, sp.x, sp);
    }
  }
  if (game.bossRespawn > 0){
    game.bossRespawn -= dt;
    if (game.bossRespawn <= 0 && BOSS_OF_MAP[game.mapIdx] && game.mapIdx === game.bossRespawnMap){
      const bx = player.x < 750 ? 1200 : 300;
      const b = spawnMonster(BOSS_OF_MAP[game.mapIdx], bx, null);
      addDmgText(b.x, b.y - b.T.h - 30, b.T.name + '이(가) 나타났다!', '#ff8a8a', true);
      SFX.boss();
    }
  }
  for (let i = monsters.length - 1; i >= 0; i--){
    updateMonster(monsters[i], dt);
    if (monsters[i].dead && monsters[i].deadT > 0.5) monsters.splice(i, 1);
  }
  // 플레이어 투사체
  const TRAIL_COL = { arrow:'#cfe6ff', rain:'#cfe6ff', orb:'#9ac2ff', bomb:'#ffc270', holy:'#ffe9a0', wave2:'#aadcff', star:'#d8a0f0', phx:'#ffb060', holybig:'#fff0b0' };
  for (let i = pProj.length - 1; i >= 0; i--){
    const p = pProj[i];
    if (p.kind === 'wave2'){
      p.dustT = (p.dustT || 0) - dt;
      if (p.dustT <= 0){ p.dustT = 0.05; burstDust(p.x, M.floor, 2, 8); }
      game.shake = Math.max(game.shake, 0.06);
    }
    if (p.kind === 'phx'){
      p.emberT = (p.emberT || 0) - dt;
      if (p.emberT <= 0){ p.emberT = 0.08; burstEmbers(p.x - Math.sign(p.vx) * 20, p.y, 2); }
    }
    p.trailT = (p.trailT || 0) - dt;
    if (p.trailT <= 0){
      p.trailT = 0.035;
      spawnP({ k:'glow', x:p.x, y:p.y, vx:rand(-14, 14), vy:rand(-14, 14), g:0, dr:1,
        life:0.22, size:p.kind === 'arrow' || p.kind === 'rain' ? 2 : 3.2, col:TRAIL_COL[p.kind] || '#fff' });
    }
    p.x += p.vx * dt;
    if (p.vy) p.y += p.vy * dt;
    p.dist += (Math.abs(p.vx) + Math.abs(p.vy || 0)) * dt;
    let remove = p.dist > p.maxDist || p.x < 0 || p.x > M.w;
    if (remove && p.kind === 'phx'){
      // 불사조 소멸: 대폭발 피니시
      addEffect('explosion', p.x, p.y, 1);
      burstEmbers(p.x, p.y, 12);
      game.shake = Math.max(game.shake, 0.25);
      SFX.explode();
    }
    if (p.kind === 'rain' && p.y > M.floor - 4){
      addEffect('djump', p.x, M.floor, 1);
      remove = true;
    }
    if (!remove){
      for (const m of monsters){
        if (m.dead || m.spawnT > 0) continue;
        if (p.pierce && p.hit.has(m)) continue;
        const r = monsterRect(m);
        if (p.x > r.x && p.x < r.x + r.w && p.y > r.y - 24 && p.y < r.y + r.h + 6){
          if (p.kind === 'bomb'){ explodeAt(p.x, p.y, p.mult); remove = true; }
          else {
            hitMonster(m, p.mult);
            if (p.kind === 'wave2'){ addEffect('shockring', m.x, M.floor, 1); feelHit(0.05, player.facing); }
            if (p.pierce){ p.hit.add(m); if (p.hit.size >= (p.maxHits || 8)) remove = true; }
            else remove = true;
          }
          break;
        }
      }
    } else if (p.kind === 'bomb'){
      explodeAt(p.x, p.y, p.mult);
    }
    if (remove) pProj.splice(i, 1);
  }
  // 적 투사체 (포자, 충격파)
  const pr = { x:player.x - player.w / 2, y:player.y - player.h, w:player.w, h:player.h };
  for (let i = eProj.length - 1; i >= 0; i--){
    const p = eProj[i];
    if (p.kind === 'spore'){
      p.vy += 850 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (overlap({ x:p.x - 10, y:p.y - 10, w:20, h:20 }, pr)){
        hurtPlayer(p.dmg || 30, p.x);
        eProj.splice(i, 1);
        continue;
      }
      if (p.y > M.floor){ addEffect('poof', p.x, M.floor, 1); eProj.splice(i, 1); }
    } else { // wave
      p.x += p.vx * dt;
      p.life -= dt;
      if (overlap({ x:p.x - 22, y:p.y - 30, w:44, h:30 }, pr)) hurtPlayer(p.dmg || 28, p.x);
      if (p.life <= 0 || p.x < 0 || p.x > M.w) eProj.splice(i, 1);
    }
  }
  // 몬스터 접촉 피해 (등반 중에도)
  if (player.invul <= 0){
    for (const m of monsters){
      if (m.dead || m.spawnT > 0) continue;
      if (overlap(pr, monsterRect(m))){ hurtPlayer(m.T.touch, m.x); break; }
    }
  }
  // 드랍
  for (let i = drops.length - 1; i >= 0; i--){
    const d = drops[i];
    d.t += dt;
    d.vy += 1900 * dt;
    d.y += d.vy * dt;
    if (d.y > M.floor - 6){ d.y = M.floor - 6; d.vy = 0; }
    if (d.noPickT) d.noPickT -= dt;
    const dx = player.x - d.x, dy = (player.y - 24) - d.y;
    const dist = Math.hypot(dx, dy);
    if (d.t > 0.45 && dist < 60 && !(d.noPickT > 0)){
      d.x += dx * dt * 9; d.y += dy * dt * 9;
    }
    if (d.t > 0.45 && dist < 24 && !(d.noPickT > 0)){
      if (d.kind === 'meso'){
        player.meso += d.value;
        addDmgText(player.x, player.y - player.h - 12, '+' + d.value + ' 메소', '#ffd94a');
      } else if (d.kind === 'hpPot'){
        player.potions.hp = Math.min(99, player.potions.hp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'HP 물약 획득', '#ff8a8a');
      } else if (d.kind === 'mpPot'){
        player.potions.mp = Math.min(99, player.potions.mp + 1);
        addDmgText(player.x, player.y - player.h - 12, 'MP 물약 획득', '#8ab8ff');
      } else if (d.kind === 'equip'){
        if (!addItem(d.item)){
          if (!d.notified){ notify('인벤토리가 가득 찼습니다'); d.notified = true; }
          d.noPickT = 2.5;
          continue;
        }
        const def = ITEMS[d.item.id];
        addDmgText(player.x, player.y - player.h - 12, def.name + ' 획득', RARITIES[d.item.rar].color);
      }
      SFX.pickup();
      drops.splice(i, 1);
      continue;
    }
    if (d.t > 40) drops.splice(i, 1);
  }
  // 카메라
  const target = clamp(player.x - W / 2, 0, Math.max(0, M.w - W));
  camX += (target - camX) * Math.min(1, dt * 8);
  game.saveTimer += dt;
  if (game.saveTimer > 10){ game.saveTimer = 0; saveGame(); }
}

function updateFloaters(dt){
  game.flash = Math.max(0, game.flash - dt);
  updateParticles(dt);
  updateDelayed(dt);
  // 셰이크/킥 감쇠: 전 상태(승리/사망/창 열림)에서 지속되도록 여기서 처리
  // 지수 감쇠 — 초반 펀치 강조, 잔진동 빠르게 컷
  game.shake = Math.max(0, game.shake * Math.pow(0.002, dt) - dt * 0.25);
  game.kickX *= Math.pow(0.0005, dt);
  game.kickY *= Math.pow(0.0005, dt);
  for (let i = dmgTexts.length - 1; i >= 0; i--){
    const t = dmgTexts[i];
    t.y += t.vy * dt; t.vy *= Math.pow(0.3, dt); t.life -= dt; t.pop += dt;
    if (t.life <= 0) dmgTexts.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--){
    effects[i].t += dt;
    if (effects[i].t > 0.7) effects.splice(i, 1);
  }
  for (let i = game.notifs.length - 1; i >= 0; i--){
    game.notifs[i].t -= dt;
    if (game.notifs[i].t <= 0) game.notifs.splice(i, 1);
  }
}

// ---------- 메인 업데이트 ----------
function updateAll(dt){
  game.time += dt;
  if (game.fadeDir === 1){
    game.fade += dt * 3;
    if (game.fade >= 1){
      game.fade = 1; game.fadeDir = -1;
      if (game.pendingMap){ loadMap(game.pendingMap.to, game.pendingMap.appear); game.pendingMap = null; }
    }
  } else if (game.fadeDir === -1){
    game.fade -= dt * 3;
    if (game.fade <= 0){ game.fade = 0; game.fadeDir = 0; }
  }
  if (game.state === 'title') return;
  game.uiArm = Math.max(0, game.uiArm - dt);
  updateFloaters(dt);

  if (game.state === 'play') player.stats.time += dt;
  if (game.state === 'play' && game.fadeDir === 0 && !game.uiWindow){
    if (game.jobPromptPending && player.job === 'beginner'){
      game.uiWindow = 'job';
      game.uiArm = 0.45;   // 자동 오픈 직후 오입력 방지
      return;
    }
    updatePlayer(dt);
    if (game.state === 'play') updateWorld(dt);
  } else if (game.state === 'dead'){
    game.deadTimer += dt;
    if (game.deadTimer > 2.6){
      player.exp = Math.max(0, Math.floor(player.exp - expNeed() * 0.05));
      player.hp = maxHp(); player.mp = maxMp();
      game.state = 'play';
      loadMap(game.mapIdx, 'left');
    }
  }
}

// ===== js/render.js =====
'use strict';
// ============================================================
// 렌더링 v3: 메이플풍 2등신 캐릭터, 몬스터 리디자인, 레이어드 배경,
//            앰비언트 파티클, 강화 이펙트, HUD
// 전역 제공: canvas, ctx, rr, draw
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 결정적 의사난수 (장식 배치용)
function h1(i){ const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
// 오프스크린 캔버스 (매 프레임 그라디언트 생성 방지) — 스텁 환경이면 null
function makeCanvas(w, h){
  try {
    if (typeof document.createElement === 'function'){
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
  } catch(e){}
  return null;
}
let _vigCv = null, _lowCv = null;
function vigCanvas(){
  if (_vigCv !== null) return _vigCv;
  _vigCv = makeCanvas(W, H);
  if (_vigCv){
    const g2 = _vigCv.getContext('2d');
    const vg = g2.createRadialGradient(W / 2, H * 0.44, H * 0.52, W / 2, H * 0.44, H * 1.02);
    vg.addColorStop(0, 'rgba(10,8,24,0)');
    vg.addColorStop(1, 'rgba(10,8,24,0.34)');
    g2.fillStyle = vg;
    g2.fillRect(0, 0, W, H);
  }
  return _vigCv;
}
function lowHpCanvas(){
  if (_lowCv !== null) return _lowCv;
  _lowCv = makeCanvas(W, H);
  if (_lowCv){
    const g2 = _lowCv.getContext('2d');
    const rg = g2.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.85);
    rg.addColorStop(0, 'rgba(200,20,20,0)');
    rg.addColorStop(1, 'rgba(200,20,20,1)');
    g2.fillStyle = rg;
    g2.fillRect(0, 0, W, H);
  }
  return _lowCv;
}
// 색상 밝기 조절: f>0 밝게(0~1), f<0 어둡게(-1~0)
function shade(hex, f){
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0){ r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
}

// ============================================================
// 배경 (하늘 + 3단 패럴랙스 + 앰비언트)
// ============================================================
function drawCloud(cx, cy, s, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, 22 * s, 0, 7);
  ctx.arc(cx + 26 * s, cy - 8 * s, 18 * s, 0, 7);
  ctx.arc(cx + 50 * s, cy, 20 * s, 0, 7);
  ctx.arc(cx + 26 * s, cy + 8 * s, 24 * s, 0, 7);
  ctx.arc(cx - 22 * s, cy + 5 * s, 16 * s, 0, 7);
  ctx.fill();
  ctx.globalAlpha = 1;
}
function drawBG(){
  const M = curMap(), th = M.theme, style = M.bgm;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky1); g.addColorStop(1, th.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 해/달
  if (style === 'swamp' || style === 'boss'){
    ctx.fillStyle = 'rgba(240,240,215,0.85)';
    ctx.beginPath(); ctx.arc(190, 100, 34, 0, 7); ctx.fill();
    ctx.fillStyle = th.sky1;
    ctx.beginPath(); ctx.arc(204, 91, 30, 0, 7); ctx.fill();
    // 별
    for (let i = 0; i < 14; i++){
      const tw = 0.3 + Math.max(0, Math.sin(game.time * 1.6 + i * 2.1)) * 0.6;
      ctx.fillStyle = 'rgba(255,255,240,' + tw + ')';
      ctx.beginPath();
      ctx.arc(60 + h1(i + 61) * (W - 120), 30 + h1(i + 71) * 220, 1.4 + h1(i) * 1.2, 0, 7);
      ctx.fill();
    }
  } else {
    const sg = ctx.createRadialGradient(150, 100, 10, 150, 100, 90);
    sg.addColorStop(0, 'rgba(255,245,200,0.95)');
    sg.addColorStop(0.35, 'rgba(255,240,180,0.45)');
    sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(30, 0, 260, 220);
    ctx.fillStyle = '#fff7d8';
    ctx.beginPath(); ctx.arc(150, 100, 30, 0, 7); ctx.fill();
    // 햇살 광선
    ctx.save();
    ctx.translate(150, 100);
    ctx.fillStyle = 'rgba(255,245,200,0.09)';
    for (const ang of [0.55, 0.85, 1.2]){
      ctx.save();
      ctx.rotate(ang + Math.sin(game.time * 0.4) * 0.03);
      ctx.beginPath();
      ctx.moveTo(20, 0);
      ctx.lineTo(660, -42);
      ctx.lineTo(660, 42);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // 구름
  for (let i = 0; i < 5; i++){
    const cx = ((i * 300 + game.time * (8 + i * 2) - camX * 0.06) % (W + 360) + W + 360) % (W + 360) - 180;
    drawCloud(cx, 66 + h1(i + 3) * 120, 0.8 + h1(i) * 0.7, style === 'swamp' || style === 'boss' ? 0.18 : 0.7);
  }
  // 원경 산 (레이어 1) - 불투명 밝은 톤 (색분리로 원근 표현)
  ctx.fillStyle = th.hill1 || th.hill;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  {
    const off1 = (camX * 0.15) % 840;
    for (let i = -1; i < 4; i++){
      const hx = i * 420 - off1;
      ctx.quadraticCurveTo(hx + 105, M.floor - 340 - (((i % 2) + 2) % 2) * 70, hx + 420, M.floor - 60);
    }
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
  // 중경 언덕 (레이어 2)
  ctx.fillStyle = th.hill2 || th.hill;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  {
    const off2 = (camX * 0.3) % 760;
    for (let i = -1; i < 4; i++){
      const hx = i * 380 - off2;
      ctx.quadraticCurveTo(hx + 95, M.floor - 160 - (((i % 2) + 2) % 2) * 60, hx + 380, M.floor - 30);
    }
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
  // 맵별 중경 시그니처 소품
  if (style === 'coast'){
    // 수평선 바다 (중경 언덕 위로 살짝 보이는 띠) + 돛단배
    const seaG = ctx.createLinearGradient(0, M.floor - 200, 0, M.floor - 90);
    seaG.addColorStop(0, 'rgba(90,168,204,0.55)');
    seaG.addColorStop(1, 'rgba(142,212,232,0.15)');
    ctx.fillStyle = seaG;
    ctx.fillRect(0, M.floor - 200, W, 110);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, M.floor - 200); ctx.lineTo(W, M.floor - 200); ctx.stroke();
    for (let i = 0; i < 6; i++){
      const tw4 = Math.max(0, Math.sin(game.time * 2.4 + i * 2.2));
      ctx.strokeStyle = 'rgba(255,255,240,' + tw4 * 0.5 + ')';
      ctx.lineWidth = 1.4;
      const wx4 = ((h1(i + 33) * (W + 100) - camX * 0.2) % (W + 100) + W + 100) % (W + 100) - 50;
      ctx.beginPath(); ctx.moveTo(wx4 - 7, M.floor - 190 + h1(i) * 70); ctx.lineTo(wx4 + 7, M.floor - 190 + h1(i) * 70); ctx.stroke();
    }
    const bx4 = ((game.time * 7 - camX * 0.15) % (W + 500) + W + 500) % (W + 500) - 250;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#6e4a30';
    ctx.beginPath();
    ctx.moveTo(bx4 - 22, M.floor - 186); ctx.lineTo(bx4 + 22, M.floor - 186); ctx.lineTo(bx4 + 14, M.floor - 178); ctx.lineTo(bx4 - 14, M.floor - 178);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f0ead0';
    ctx.beginPath();
    ctx.moveTo(bx4, M.floor - 218); ctx.lineTo(bx4, M.floor - 188); ctx.lineTo(bx4 + 17, M.floor - 192);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (style === 'field' || style === 'town'){
    // 풍차 실루엣 (회전 날개)
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = th.hill2 || th.hill;
    for (let i = 0; i < 2; i++){
      const wx5 = ((i * 980 + 420 - camX * 0.35) % (W + 700) + W + 700) % (W + 700) - 350;
      const wy5 = M.floor - 95;
      ctx.beginPath();
      ctx.moveTo(wx5 - 16, M.floor - 20); ctx.lineTo(wx5 - 8, wy5); ctx.lineTo(wx5 + 8, wy5); ctx.lineTo(wx5 + 16, M.floor - 20);
      ctx.closePath(); ctx.fill();
      ctx.save();
      ctx.translate(wx5, wy5);
      ctx.rotate(game.time * 0.7 + i);
      for (let b5 = 0; b5 < 4; b5++){
        ctx.rotate(Math.PI / 2);
        ctx.fillRect(-3, 0, 6, 46);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (style === 'forest'){
    // 대형 버섯 군락 실루엣
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = th.hill2 || th.hill;
    for (let i = 0; i < 4; i++){
      const bx5 = ((i * 420 + 150 - camX * 0.4) % (W + 500) + W + 500) % (W + 500) - 250;
      const s5 = 0.7 + h1(i + 91) * 0.8;
      ctx.fillRect(bx5 - 8 * s5, M.floor - 90 * s5, 16 * s5, 90 * s5);
      ctx.beginPath(); ctx.ellipse(bx5, M.floor - 90 * s5, 42 * s5, 26 * s5, 0, Math.PI, 0); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 보스맵 배경 버섯 군락 실루엣
  if (style === 'boss'){
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#c07888';
    for (let i = 0; i < 6; i++){
      const bx = ((i * 300 + 90 - camX * 0.4) % (W + 400) + W + 400) % (W + 400) - 200;
      const s = 0.6 + h1(i + 83) * 0.9;
      ctx.fillRect(bx - 9 * s, M.floor - 95 * s, 18 * s, 95 * s);
      ctx.beginPath(); ctx.ellipse(bx, M.floor - 95 * s, 46 * s, 30 * s, 0, Math.PI, 0); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 근경 나무 실루엣 (레이어 3)
  ctx.globalAlpha = 0.85;
  for (let i = -1; i < 14; i++){
    const tx = i * 260 - (camX * 0.55) % 260;
    const r = h1(i + 40 + game.mapIdx * 7);
    if (r < 0.45) continue;
    const s = 0.5 + r * 0.45;
    ctx.fillStyle = th.hill3 || th.hill;
    if (style === 'swamp' || style === 'boss'){
      ctx.fillRect(tx - 4 * s, M.floor - 110 * s, 8 * s, 110 * s);
      ctx.lineWidth = 8 * s; ctx.strokeStyle = th.hill3 || th.hill; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, M.floor - 88 * s); ctx.lineTo(tx - 26 * s, M.floor - 112 * s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(tx, M.floor - 70 * s); ctx.lineTo(tx + 24 * s, M.floor - 96 * s);
      ctx.stroke();
      ctx.lineCap = 'butt';
    } else {
      ctx.fillRect(tx - 5 * s, M.floor - 90 * s, 10 * s, 90 * s);
      ctx.beginPath(); ctx.arc(tx, M.floor - 105 * s, 34 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx - 22 * s, M.floor - 85 * s, 24 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(tx + 22 * s, M.floor - 85 * s, 24 * s, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- 앰비언트 파티클 (무상태, 시간 기반) ----------
function drawAmbient(){
  const style = curMap().theme.amb || curMap().bgm, t = game.time;
  if (style === 'snow'){
    // 눈송이: 좌우로 흔들리며 낙하
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 26; i++){
      const speed = 34 + h1(i) * 40;
      const lx = ((h1(i + 11) * (W + 80) + Math.sin(t * 0.9 + i) * 34 - camX * 0.2) % (W + 80) + W + 80) % (W + 80) - 40;
      const ly = ((h1(i + 23) * H + t * speed) % (H - 40));
      ctx.globalAlpha = 0.4 + h1(i + 5) * 0.5;
      ctx.beginPath(); ctx.arc(lx, ly, 1.4 + h1(i + 3) * 1.8, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return;
  }
  if (style === 'clock'){
    // 부유 기어 글린트 + 금색 먼지
    for (let i = 0; i < 10; i++){
      const lx = ((h1(i + 7) * (W + 60) - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = 80 + h1(i + 31) * 380 + Math.sin(t * 1.2 + i * 2) * 14;
      const pulse = 0.25 + Math.max(0, Math.sin(t * 2 + i * 2.4)) * 0.4;
      ctx.strokeStyle = 'rgba(220,180,90,' + pulse + ')';
      ctx.lineWidth = 1.5;
      const r6 = 4 + h1(i + 5) * 5;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(t * (0.5 + h1(i) * 0.8));
      for (let g6 = 0; g6 < 6; g6++){
        ctx.rotate(Math.PI / 3);
        ctx.beginPath(); ctx.moveTo(r6, 0); ctx.lineTo(r6 + 3, 0); ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0, 0, r6, 0, 7); ctx.stroke();
      ctx.restore();
    }
    return;
  }
  if (style === 'town' || style === 'field'){
    // 흩날리는 단풍잎 (3갈래 잎 실루엣)
    for (let i = 0; i < 10; i++){
      const speed = 26 + h1(i) * 30;
      const lx = ((h1(i + 11) * (W + 80) + t * speed * 0.7 + Math.sin(t * 1.4 + i) * 22 - camX * 0.2) % (W + 80) + W + 80) % (W + 80) - 40;
      const ly = ((h1(i + 23) * H + t * speed) % (H - 60));
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(t * 1.6 + i * 2);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = h1(i + 41) < 0.5 ? '#e8843a' : '#d4552f';
      const s = 0.8 + h1(i + 6) * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 5 * s);
      ctx.quadraticCurveTo(-6 * s, 2 * s, -4.5 * s, -3.5 * s);
      ctx.quadraticCurveTo(-2 * s, -2 * s, 0, -6 * s);
      ctx.quadraticCurveTo(2 * s, -2 * s, 4.5 * s, -3.5 * s);
      ctx.quadraticCurveTo(6 * s, 2 * s, 0, 5 * s);
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,50,20,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, 6.5 * s); ctx.lineTo(0, -4 * s); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (style === 'forest'){
    // 떠오르는 포자 빛
    for (let i = 0; i < 12; i++){
      const lx = ((h1(i + 7) * (W + 60) - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - ((h1(i + 31) * 300 + t * (14 + h1(i) * 16)) % 380);
      const pulse = 0.35 + Math.sin(t * 2 + i * 3) * 0.25;
      ctx.fillStyle = 'rgba(200,255,190,' + Math.max(0.05, pulse) + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.5 + h1(i + 5) * 2, 0, 7); ctx.fill();
    }
  } else if (style === 'coast'){
    // 햇살 반짝임
    for (let i = 0; i < 8; i++){
      const lx = ((h1(i + 9) * (W + 60) - camX * 0.3) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = 120 + h1(i + 17) * 320;
      const tw = Math.max(0, Math.sin(t * 3 + i * 2.4));
      ctx.strokeStyle = 'rgba(255,250,210,' + tw * 0.7 + ')';
      ctx.lineWidth = 1.6;
      const r = 4 + tw * 4;
      ctx.beginPath();
      ctx.moveTo(lx - r, ly); ctx.lineTo(lx + r, ly);
      ctx.moveTo(lx, ly - r); ctx.lineTo(lx, ly + r);
      ctx.stroke();
    }
  } else if (style === 'swamp'){
    // 반딧불
    for (let i = 0; i < 9; i++){
      const lx = ((h1(i + 3) * (W + 60) + Math.sin(t * 0.6 + i) * 40 - camX * 0.3) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - 40 - h1(i + 13) * 260 + Math.sin(t * 1.4 + i * 2) * 18;
      const pulse = Math.max(0, Math.sin(t * 1.8 + i * 2.7));
      ctx.fillStyle = 'rgba(210,255,140,' + pulse * 0.8 + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(210,255,140,' + pulse * 0.25 + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 6.5, 0, 7); ctx.fill();
    }
    // 안개
    ctx.fillStyle = 'rgba(160,180,165,0.12)';
    for (let i = 0; i < 3; i++){
      const fy = 320 + i * 85 + Math.sin(t * 0.5 + i * 2) * 18;
      ctx.beginPath();
      ctx.ellipse(((t * (12 + i * 6)) % (W + 700)) - 350, fy, 330, 44, 0, 0, 7);
      ctx.fill();
    }
  } else if (style === 'boss'){
    // 떠오르는 포자 + 떨어지는 재
    for (let i = 0; i < 10; i++){
      const lx = ((h1(i + 7) * (W + 60) + Math.sin(t * 0.8 + i) * 30 - camX * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = curMap().floor - ((h1(i + 31) * 300 + t * (12 + h1(i) * 14)) % 420);
      const pulse = 0.3 + Math.sin(t * 2 + i * 3) * 0.2;
      ctx.fillStyle = 'rgba(210,150,235,' + Math.max(0.08, pulse) + ')';
      ctx.beginPath(); ctx.arc(lx, ly, 2.5 + h1(i + 5) * 2.2, 0, 7); ctx.fill();
    }
    for (let i = 0; i < 8; i++){
      const speed = 18 + h1(i) * 22;
      const lx = ((h1(i + 19) * (W + 60) + Math.sin(t + i) * 24) % (W + 60) + W + 60) % (W + 60) - 30;
      const ly = ((h1(i + 29) * H + t * speed) % (H - 40));
      ctx.fillStyle = 'rgba(200,140,220,' + (0.25 + h1(i + 2) * 0.3) + ')';
      ctx.fillRect(lx, ly, 3, 3);
    }
  }
}

function drawDecor(d, floor){
  const sx = d.x - camX;
  if (sx < -280 || sx > W + 280) return;
  ctx.save();
  ctx.translate(sx, floor);
  if (d.k === 'tree'){
    const coast = curMap().bgm === 'coast';
    const c1 = coast ? '#9a6a34' : '#3f8034';
    const c2 = coast ? '#b8834a' : '#559a45';
    ctx.fillStyle = '#6e4a26';
    ctx.beginPath();
    ctx.moveTo(-11, 0); ctx.quadraticCurveTo(-7, -50, -6, -95);
    ctx.lineTo(6, -95); ctx.quadraticCurveTo(7, -50, 11, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.arc(0, -128, 46, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(-32, -100, 33, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(32, -100, 33, 0, 7); ctx.fill();
    ctx.fillStyle = c2;
    ctx.beginPath(); ctx.arc(-10, -132, 30, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(20, -114, 24, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8762a';
    ctx.beginPath(); ctx.arc(-18, -118, 5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(24, -100, 4.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -142, 4.5, 0, 7); ctx.fill();
  } else if (d.k === 'deadtree'){
    ctx.strokeStyle = '#3a3028'; ctx.lineCap = 'round';

    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-8, -60, -4, -105); ctx.stroke();
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(-5, -70); ctx.quadraticCurveTo(-28, -88, -46, -108); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-5, -95); ctx.quadraticCurveTo(14, -112, 30, -134); ctx.stroke();
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-46, -108); ctx.lineTo(-56, -124); ctx.stroke();
    ctx.lineCap = 'butt';
  } else if (d.k === 'rock'){
    ctx.fillStyle = '#6a6f7a';
    ctx.beginPath();
    ctx.moveTo(-32, 0);
    ctx.quadraticCurveTo(-33, -20, -14, -27);
    ctx.quadraticCurveTo(4, -33, 20, -24);
    ctx.quadraticCurveTo(33, -14, 32, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a8f9a';
    ctx.beginPath();
    ctx.moveTo(-26, -8);
    ctx.quadraticCurveTo(-26, -20, -12, -25);
    ctx.quadraticCurveTo(2, -29, 14, -22);
    ctx.quadraticCurveTo(6, -16, -4, -14);
    ctx.quadraticCurveTo(-16, -12, -26, -8);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(8, -6, 12, 6, 0, 0, 7); ctx.fill();
  } else if (d.k === 'mushtree'){
    ctx.fillStyle = '#c9b89a';
    ctx.beginPath();
    ctx.moveTo(-13, 0); ctx.quadraticCurveTo(-9, -50, -8, -88);
    ctx.lineTo(8, -88); ctx.quadraticCurveTo(9, -50, 13, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a34a64';
    ctx.beginPath(); ctx.ellipse(0, -88, 58, 36, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#c05a78';
    ctx.beginPath(); ctx.ellipse(-8, -96, 40, 22, -0.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,240,0.9)';
    ctx.beginPath(); ctx.arc(-30, -100, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -114, 7.5, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(42, -94, 5, 0, 7); ctx.fill();

    ctx.beginPath(); ctx.ellipse(-12, -106, 20, 7, -0.35, 0, 7); ctx.fill();
  } else if (d.k === 'house'){
    ctx.fillStyle = '#d9b06a';
    ctx.fillRect(-66, -86, 132, 86);
    ctx.fillStyle = '#c9a25a';
    ctx.fillRect(-66, -86, 132, 8);
    ctx.fillStyle = '#a3452a';
    ctx.beginPath(); ctx.moveTo(-82, -84); ctx.lineTo(82, -84); ctx.lineTo(38, -138); ctx.lineTo(-38, -138); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a3520';
    ctx.beginPath(); ctx.moveTo(-82, -84); ctx.lineTo(-38, -138); ctx.lineTo(-30, -138); ctx.lineTo(-72, -84); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    rr(-19, -52, 38, 52, 4); ctx.fill();
    ctx.fillStyle = '#54371f';
    rr(-15, -48, 30, 48, 3); ctx.fill();
    ctx.fillStyle = '#f5c542';
    ctx.beginPath(); ctx.arc(8, -24, 2.5, 0, 7); ctx.fill();
    for (const wx of [-50, 34]){
      ctx.fillStyle = '#7a5230'; rr(wx - 3, -73, 30, 28, 3); ctx.fill();
      ctx.fillStyle = '#bfe4f5'; rr(wx, -70, 24, 22, 2); ctx.fill();
      ctx.strokeStyle = '#7a5230'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(wx + 12, -70); ctx.lineTo(wx + 12, -48); ctx.moveTo(wx, -59); ctx.lineTo(wx + 24, -59); ctx.stroke();

    rr(-38, -70, 76, 28, 5); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('사냥터 →', 0, -51);
