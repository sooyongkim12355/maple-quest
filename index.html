  ctx.restore();
}
function drawTerrain(){
  const M = curMap(), th = M.theme;
  for (const d of M.decor) drawDecor(d, M.floor);
  // 지면 (흙 + 텍스처)
  ctx.fillStyle = th.ground;
  ctx.fillRect(-camX, M.floor, M.w, H - M.floor);
  // 흙 얼룩
  for (let i = 0; i < M.w / 46; i++){
    const px = i * 46 + h1(i) * 30 - camX;
    if (px < -20 || px > W + 20) continue;
    const py = M.floor + 22 + h1(i + 51) * 50;
    if (py > H - 6) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.beginPath(); ctx.ellipse(px, py, 7 + h1(i + 3) * 8, 4, 0, 0, 7); ctx.fill();
  }
  // 잔디 층
  const gg = ctx.createLinearGradient(0, M.floor, 0, M.floor + 16);
  gg.addColorStop(0, th.grass);
  gg.addColorStop(1, th.ground);
  ctx.fillStyle = gg;
  ctx.fillRect(-camX, M.floor, M.w, 16);
  // 뒷층 풀: 키 큰 풀잎이 바람에 흔들림 (밝은 톤)
  ctx.fillStyle = shade(th.grass, 0.16);
  for (let x = 0; x < M.w; x += 36){
    const sx = x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const hh = 13 + h1(x + 7) * 12;
    const sway = Math.sin(game.time * 1.5 + x * 0.045) * 3;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.quadraticCurveTo(sx + 2, M.floor - hh * 0.6, sx + 3.5 + sway, M.floor - hh);
    ctx.lineTo(sx + 7, M.floor);
    ctx.fill();
  }
  // 중간층 풀: 촘촘한 포기
  ctx.fillStyle = th.grass;
  for (let x = 0; x < M.w; x += 30){
    const sx = x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const hh = 9 + h1(x) * 9;
    const sway = Math.sin(game.time * 1.8 + x * 0.06) * 2;
    ctx.beginPath();
    ctx.moveTo(sx, M.floor);
    ctx.quadraticCurveTo(sx + 3, M.floor - hh * 0.55, sx + 5 + sway, M.floor - hh);
    ctx.lineTo(sx + 11, M.floor);
    ctx.quadraticCurveTo(sx + 12, M.floor - hh * 0.4, sx + 14 + sway, M.floor - hh * 0.7);
    ctx.lineTo(sx + 19, M.floor);
    ctx.fill();
  }
  // 풀꽃/돌 (밝은 맵)
  if (M.bgm === 'town' || M.bgm === 'field'){
    for (let i = 0; i < M.w / 120; i++){
      const fx = i * 120 + h1(i + 77) * 90 - camX;
      if (fx < -20 || fx > W + 20) continue;
      if (h1(i + 91) < 0.5){
        ctx.fillStyle = h1(i + 13) < 0.5 ? '#ffde59' : '#ff8fb3';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 3, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 1.2, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'coast'){
    // 조개 / 불가사리
    for (let i = 0; i < M.w / 150; i++){
      const fx = i * 150 + h1(i + 57) * 110 - camX;
      if (fx < -20 || fx > W + 20) continue;
      const r = h1(i + 67);
      if (r < 0.35){
        // 조개
        ctx.fillStyle = '#f2e0c8';
        ctx.beginPath(); ctx.arc(fx, M.floor + 8, 6.5, Math.PI, 0); ctx.fill();
        ctx.strokeStyle = '#c9a882'; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx - 3.5, M.floor + 2.5);
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx, M.floor + 1.5);
        ctx.moveTo(fx, M.floor + 8); ctx.lineTo(fx + 3.5, M.floor + 2.5);
        ctx.stroke();
      } else if (r < 0.55){
        // 불가사리
        ctx.save();
        ctx.translate(fx, M.floor + 8);
        ctx.rotate(h1(i + 3) * 6);
        ctx.fillStyle = '#e88a5a';
        ctx.beginPath();
        for (let k = 0; k < 10; k++){
          const ang = k * Math.PI / 5 - Math.PI / 2;
          const rad = k % 2 === 0 ? 7 : 3;
          ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  } else if (M.bgm === 'swamp'){
    // 물웅덩이
    for (let i = 0; i < M.w / 260; i++){
      const fx = i * 260 + h1(i + 87) * 160 - camX;
      if (fx < -60 || fx > W + 60) continue;
      if (h1(i + 97) < 0.55){
        const pw = 26 + h1(i + 5) * 22;
        ctx.fillStyle = 'rgba(30,50,45,0.75)';
        ctx.beginPath(); ctx.ellipse(fx, M.floor + 10, pw, 5.5, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(160,200,180,0.35)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.ellipse(fx, M.floor + 10, pw, 5.5, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.fillStyle = 'rgba(180,220,200,' + (0.12 + Math.sin(game.time * 1.2 + i) * 0.06) + ')';
        ctx.beginPath(); ctx.ellipse(fx - pw * 0.3, M.floor + 9, pw * 0.3, 2, 0, 0, 7); ctx.fill();
      }
    }
  } else if (M.bgm === 'boss'){
    // 빛나는 독버섯
    for (let i = 0; i < M.w / 180; i++){
      const fx = i * 180 + h1(i + 27) * 120 - camX;
      if (fx < -20 || fx > W + 20) continue;
      if (h1(i + 37) < 0.5){
        const glow = 0.4 + Math.sin(game.time * 2 + i * 2) * 0.25;
        ctx.fillStyle = '#cfcbb4';
        ctx.fillRect(fx - 1.5, M.floor - 8, 3, 8);
        ctx.fillStyle = 'rgba(200,120,235,0.95)';
        ctx.beginPath(); ctx.ellipse(fx, M.floor - 8, 5.5, 4, 0, Math.PI, 0); ctx.fill();
        ctx.fillStyle = 'rgba(220,160,255,' + glow * 0.4 + ')';
        ctx.beginPath(); ctx.arc(fx, M.floor - 9, 9, 0, 7); ctx.fill();
      }
    }
  }
  // 플랫폼 (나무 판자 + 잔디)
  for (const p of M.plats){
    const sx = p[0] - camX;
    if (sx + p[2] < -20 || sx > W + 20) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    rr(sx + 3, p[1] + 15, p[2] - 6, 8, 4); ctx.fill();
    ctx.fillStyle = '#57381c';
    rr(sx + 1, p[1] + 11, p[2] - 2, 9, 4); ctx.fill();
    ctx.fillStyle = '#6e4a26';
    rr(sx, p[1], p[2], 17, 6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (let px = 14; px < p[2] - 6; px += 26){
      ctx.fillRect(sx + px, p[1] + 4, 2, 11);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(sx + 2, p[1] + 1, p[2] - 4, 2.5);
    ctx.fillStyle = th.grass;
    rr(sx - 1, p[1] - 4, p[2] + 2, 9, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    rr(sx - 1, p[1] - 4, p[2] + 2, 3, 2); ctx.fill();
    // 지면 투영 그림자 + 밑면 덩굴 (접지감)
    if (p[1] < M.floor - 40){
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath(); ctx.ellipse(sx + p[2] / 2, M.floor + 8, p[2] * 0.4, 5, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(60,90,45,0.5)'; ctx.lineWidth = 1.8;
      for (const vo of [0.25, 0.7]){
        const vx5 = sx + p[2] * vo;
        const vl = 9 + h1(p[0] + vo * 100) * 9;
        ctx.beginPath();
        ctx.moveTo(vx5, p[1] + 20);
        ctx.quadraticCurveTo(vx5 + 3 + Math.sin(game.time * 1.8 + p[0]) * 2, p[1] + 20 + vl * 0.6, vx5 + 1, p[1] + 20 + vl);
        ctx.stroke();
      }
    }
  }
  // 사다리 (로프)
  for (const l of M.ladders){
    const sx = l[0] - camX;
    if (sx < -30 || sx > W + 30) continue;
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.moveTo(sx, l[1] + 6); ctx.lineTo(sx, l[2]); ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx + 1.5, l[1]); ctx.lineTo(sx + 1.5, l[2]); ctx.stroke();
    ctx.fillStyle = '#6b4a2c';
    for (let y = l[1] + 10; y < l[2] - 4; y += 17){
      rr(sx - 10, y, 20, 5.5, 2.5); ctx.fill();
    }
  }
  // 포탈
  for (const p of M.portals){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    const pulse = Math.sin(game.time * 4) * 4;
    ctx.save();
    ctx.translate(sx, M.floor - 48);
    const pg = ctx.createRadialGradient(0, 0, 4, 0, 0, 44);
    pg.addColorStop(0, 'rgba(150,190,255,0.85)');
    pg.addColorStop(0.6, 'rgba(80,120,255,0.35)');
    pg.addColorStop(1, 'rgba(80,120,255,0)');
    ctx.fillStyle = pg;
    ctx.beginPath(); ctx.ellipse(0, 0, 34 + pulse, 50, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7aa8ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 25 + pulse * 0.6, 42, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,225,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 15, 30, Math.sin(game.time * 3) * 0.5, 0, 7); ctx.stroke();
    // 궤도 반짝이 입자 (가산)
    ctx.globalCompositeOperation = 'lighter';
    for (let oi = 0; oi < 5; oi++){
      const oa = game.time * 2.2 + oi * 1.257;
      const ox = Math.cos(oa) * (28 + pulse * 0.5);
      const oy = Math.sin(oa) * 44;
      const tw3 = 0.4 + Math.max(0, Math.sin(game.time * 5 + oi * 2)) * 0.6;
      ctx.fillStyle = 'rgba(190,220,255,' + tw3 + ')';
      ctx.beginPath(); ctx.arc(ox, oy, 2.2, 0, 7); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    const REC_LV = { 5:' (권장 Lv13+)', 6:' (권장 Lv16+)', 7:' (권장 Lv20+)', 8:' (권장 Lv24+)', 9:' (권장 Lv24+)', 10:' (권장 Lv28+)', 11:' (보스 Lv30+)', 12:' (권장 Lv10+)', 13:' (권장 Lv13+)', 14:' (권장 Lv32+)', 15:' (보스 Lv36+)' };
    const ptxt = '↑ ' + MAPS[p.to].name + (REC_LV[p.to] || '');
    const ptw = ctx.measureText(ptxt).width;
    ctx.fillText(ptxt, Math.max(ptw / 2 + 8, Math.min(W - ptw / 2 - 8, sx)), M.floor - 108);
  }
  for (const n of M.npcs) drawNpc(n, M.floor);
}
// 전경 풀: 플레이어보다 앞에 그려져 발밑을 스치는 깊이감 (드문드문 큰 포기)
function drawGrassFront(){
  const M = curMap(), th = M.theme;
  ctx.fillStyle = shade(th.grass, -0.28);
  ctx.globalAlpha = 0.92;
  for (let x = 40; x < M.w; x += 130){
    const r = h1(x + 19);
    if (r < 0.35) continue;
    const sx = x + r * 40 - camX;
    if (sx < -40 || sx > W + 40) continue;
    const base = 16 + r * 14;
    const sway = Math.sin(game.time * 1.6 + x * 0.03) * 3.5;
    ctx.beginPath();
    for (let b = 0; b < 4; b++){
      const bx = sx + b * 6 - 9;
      const hh = base * (0.65 + h1(x + b) * 0.5);
      ctx.moveTo(bx, M.floor + 2);
      ctx.quadraticCurveTo(bx + 2, M.floor - hh * 0.55, bx + 4 + sway, M.floor - hh);
      ctx.lineTo(bx + 7.5, M.floor + 2);
    }
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

    ctx.beginPath(); ctx.moveTo(-17, -57 + bob); ctx.lineTo(17, -57 + bob); ctx.lineTo(2, -84 + bob); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5a3a8e';

function drawDropBeam(sx, y, color){
  // 희귀 드랍 빛기둥
  ctx.globalCompositeOperation = 'lighter';
  const bg4 = ctx.createLinearGradient(sx - 16, 0, sx + 16, 0);
  const pulse = 0.35 + Math.sin(game.time * 5 + sx) * 0.12;
  bg4.addColorStop(0, 'rgba(255,255,255,0)');
  bg4.addColorStop(0.5, color.replace('ALPHA', String(pulse)));
  bg4.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bg4;
  ctx.fillRect(sx - 16, y - 150, 32, 150);
  ctx.globalCompositeOperation = 'source-over';
}
function drawDrops(){
  for (const d of drops){
    const sx = d.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const bob = d.vy === 0 ? Math.sin(game.time * 5 + d.x) * 3 : 0;
    if (d.kind === 'meso'){
      ctx.save();
      ctx.translate(sx, d.y - 9 + bob);
      const sq = Math.abs(Math.sin(game.time * 3 + d.x));
      ctx.scale(0.4 + sq * 0.6, 1);
      ctx.fillStyle = '#f5c542';
      ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-2.5, -3, 2, 0, 7); ctx.fill();
      ctx.restore();
    } else if (d.kind === 'equip'){
      const def = ITEMS[d.item.id];
      const col = RARITIES[d.item.rar].color;
      // 희귀 이상은 빛기둥 (등급별 색)
      if (d.item.rar >= 2 && d.vy === 0){
        const beamCol = d.item.rar >= 4 ? 'rgba(255,217,74,ALPHA)' : (d.item.rar === 3 ? 'rgba(255,154,58,ALPHA)' : 'rgba(199,122,255,ALPHA)');
        drawDropBeam(sx, d.y, beamCol);
      }
      ctx.save();
      ctx.translate(sx, d.y - 13 + bob);
      ctx.rotate(Math.sin(game.time * 2 + d.x) * 0.2);
      if (def.slot === 'weapon'){
        ctx.rotate(-0.6);
        ctx.fillStyle = '#c8ccd8'; rr(-3, -16, 6, 24, 2); ctx.fill();
        ctx.fillStyle = '#e8ecf8'; rr(-3, -16, 2.5, 24, 1); ctx.fill();
        ctx.fillStyle = '#c8901a'; rr(-7, 8, 14, 4, 2); ctx.fill();
        ctx.fillStyle = '#6b4a2c'; rr(-2, 12, 4, 7, 2); ctx.fill();
      } else {
        ctx.fillStyle = '#9a8a7a';
        rr(-10, -9, 20, 17, 5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        rr(-10, -9, 20, 5, 3); ctx.fill();
      }
      ctx.restore();
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.globalAlpha = 0.5 + Math.sin(game.time * 6) * 0.3;
      ctx.beginPath(); ctx.arc(sx, d.y - 13 + bob, 16, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = d.kind === 'hpPot' ? '#e84545' : '#4576e8';
      ctx.beginPath();
      ctx.arc(sx, d.y - 10 + bob, 7, 0, 7);
      ctx.fill();
      ctx.fillRect(sx - 4, d.y - 18 + bob, 8, 7);
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.arc(sx - 2.5, d.y - 12 + bob, 2.4, 0, 7); ctx.fill();
      ctx.fillStyle = '#c9a25a';
      rr(sx - 3.5, d.y - 22 + bob, 7, 5, 1.5); ctx.fill();
    }
  }
}

// 몬스터 본체 디스패치 (인게임 + 도감 공용)
function drawMonsterBody(m, t, flash){
  if (m.type === 'snail' || m.type === 'rsnail') drawSnail(m, t, flash);
  else if (m.type === 'slime') drawSlime(m, t, flash);
  else if (m.type === 'shroom') drawShroom(m, t, flash);
  else if (m.type === 'pig') drawPig(m, t, flash);
  else if (m.type === 'boar') drawBoar(m, t, flash, false);
  else if (m.type === 'ironhog') drawBoar(m, t, flash, true);
  else if (m.type === 'lupin') drawLupin(m, t, flash);
  else if (m.type === 'golem' || m.type === 'igolem') drawGolem(m, t, flash, m.type === 'igolem');
  else if (m.type === 'clam') drawClam(m, t, flash);
  else if (m.type === 'octo') drawOcto(m, t, flash);
  else if (m.type === 'fang') drawFang(m, t, flash);
  else if (m.type === 'pepe') drawPepe(m, t, flash);
  else if (m.type === 'tick') drawTick(m, t, flash);
  else if (m.type === 'stump') drawStump(m, t, flash);
  else if (m.type === 'eye') drawEye(m, t, flash);
  else if (m.type === 'zshroom') drawZshroom(m, t, flash);
  else if (m.type === 'boss') drawBoss(m, t, flash);
  else if (m.type === 'kslime') drawKslime(m, t, flash);
  else if (m.type === 'yeti') drawYeti(m, t, flash);
  else if (m.type === 'timekeeper') drawTimekeeper(m, t, flash);
}
function drawMonster(m){
  const sx = m.x - camX;
  if (sx < -240 || sx > W + 240) return;
  const t = m.animT;
  ctx.save();
  ctx.translate(sx, m.y);
  if (m.dead){
    ctx.globalAlpha = Math.max(0, 1 - m.deadT * 2);
    ctx.rotate(m.deadT * 2.5 * m.dir);
    const s = Math.max(0.05, 1 - m.deadT * 1.2);
    ctx.scale(s, s);
  } else if (m.squash > 0){
    // 피격 스쿼시 2상: 압축 후 살짝 늘어나며 복원 (리바운드)
    const q = m.squash / 0.22;
    if (q > 0.55){
      const c = (q - 0.55) / 0.45;
      ctx.scale(1 + c * 0.18, 1 - c * 0.22);
    } else {
      const st2 = Math.sin((q / 0.55) * Math.PI);
      ctx.scale(1 - st2 * 0.06, 1 + st2 * 0.08);
    }
  }
  if (!m.dead && m.spawnT > 0){
    const sp = 1 - m.spawnT / 0.45;
    ctx.globalAlpha = Math.max(0.05, sp);
    const ss = 0.35 + sp * 0.65;
    ctx.scale(ss, ss);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 2, m.T.w * 0.48, 6, 0, 0, 7); ctx.fill();

  const flash = m.hitFlash > 0;
  drawMonsterBody(m, t, flash);
  if (flash && !m.dead){
    ctx.globalAlpha = 0.35;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(0, -m.T.h / 2, m.T.w * 0.65, m.T.h * 0.65, 0, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (!m.dead && m.type !== 'boss' && m.hp < m.maxHp){
    const bw = 38;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    rr(sx - bw / 2 - 1, m.y - m.T.h - 14, bw + 2, 7, 3); ctx.fill();
    ctx.fillStyle = '#4ade4a';
    const r = Math.max(0, m.hp / m.maxHp);
    if (r > 0.02){ rr(sx - bw / 2, m.y - m.T.h - 13, Math.max(3, bw * r), 5, 2); ctx.fill(); }
  }
}
function drawSnail(m, t, flash){
  const slide = Math.sin(t * 3) * 0.06;
  const red = m.type === 'rsnail';
  const shellC = flash ? '#eee' : (red ? '#d04838' : '#3f68c0');
  const shellS = flash ? '#ccc' : (red ? '#8e2418' : '#2a4890');
  // 몸 (연노랑)
  ctx.fillStyle = flash ? '#fff' : '#f0e2b8';
  ctx.beginPath();
  ctx.moveTo(-16, 0);
  ctx.quadraticCurveTo(-18, -8, -8, -9);
  ctx.lineTo(m.dir * 14, -9);
  ctx.quadraticCurveTo(m.dir * 20, -9, m.dir * 19, -3);
  ctx.quadraticCurveTo(m.dir * 18, 0, m.dir * 14, 0);
  ctx.closePath(); ctx.fill();
  // 머리
  ctx.fillStyle = flash ? '#fff' : '#f0e2b8';
  ctx.beginPath(); ctx.arc(m.dir * 13, -12, 7.5, 0, 7); ctx.fill();
  // 껍질 (파랑 나선)
  ctx.save();
  ctx.translate(-m.dir * 4, -15);
  ctx.scale(1 + slide, 1 - slide);
  ctx.fillStyle = shellC;
  ctx.beginPath(); ctx.arc(0, 0, 12.5, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.85)'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.strokeStyle = shellS; ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.arc(0, 0, 8.5, 0.4, 4.6);
  ctx.arc(-1, -1, 4.5, 4.6, 8.4);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(-4, -5, 3.5, 0, 7); ctx.fill();
  ctx.restore();
  // 더듬이
  ctx.strokeStyle = flash ? '#ddd' : '#d8c898'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(m.dir * 15, -17); ctx.quadraticCurveTo(m.dir * 17, -24, m.dir * 20, -26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(m.dir * 10, -18); ctx.quadraticCurveTo(m.dir * 11, -25, m.dir * 13, -28); ctx.stroke();
  ctx.lineCap = 'butt';
  // 더듬이 끝 눈
  ctx.fillStyle = '#2a2a33';
  ctx.beginPath(); ctx.arc(m.dir * 20, -26, 2.6, 0, 7); ctx.arc(m.dir * 13, -28, 2.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(m.dir * 20 + 0.8, -27, 0.9, 0, 7); ctx.arc(m.dir * 13 + 0.8, -29, 0.9, 0, 7); ctx.fill();
}
function drawSlime(m, t, flash){
  const sq = 1 + Math.sin(t * 5) * 0.1;
  ctx.save();
  ctx.scale(1 / Math.sqrt(sq), sq);
  // 물방울형 젤리
  const bodyG = ctx.createLinearGradient(0, -30, 0, 0);

const JOB_STYLE = {
  beginner: { hair:'#5a3a1e', top:'#3a6ecc', topD:'#2a4e9e', pants:'#3a2e6e', shoe:'#7a4a2a' },
  warrior:  { hair:'#4a2c14', top:'#b83a30', topD:'#8a2620', pants:'#43391f'.replace('43391f','3a3050'), shoe:'#54371f' },
  archer:   { hair:'#7a4f22', top:'#3a8a4a', topD:'#2a6236', pants:'#4a3a26', shoe:'#54371f' },
  mage:     { hair:'#3e2a4e', top:'#6a4ac0', topD:'#4e3494', pants:'#2e2440', shoe:'#3a2a50' },
  thief:    { hair:'#2e2438', top:'#8a3aa8', topD:'#5f2478', pants:'#2a2036', shoe:'#3a2a44' },
};
function drawPlayer(){
  const sx = player.x - camX;
  const blink = player.invul > 0 && Math.floor(game.time * 14) % 2 === 0;
  if (blink && game.state === 'play') return;
  const st = JOB_STYLE[player.job] || JOB_STYLE.beginner;
  const climbing = !!player.climbing;
  const moving = Math.abs(player.vx) > 30 && player.onGround;
  const air = !player.onGround && !climbing;
  const wt = player.walkT;
  const leg = moving ? Math.sin(wt) * 7 : 0;
  const armSwing = moving ? Math.sin(wt) * 0.5 : 0;
  const breathe = (!moving && !air && !climbing) ? Math.sin(game.time * 2.2) * 1.2 : 0;
  const atk = player.attackAnim > 0;
  const cast = player.castAnim > 0;
  const eyeBlink = ((game.time % 3.1) > 2.94);

  ctx.save();
  ctx.translate(sx, player.y);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 2, 16, 5, 0, 0, 7); ctx.fill();
  // 캐스팅 마법진
  if (cast && player.job === 'mage'){
    const ca = player.castAnim / 0.25;
    ctx.save();
    ctx.rotate(0);
    ctx.strokeStyle = 'rgba(154,122,255,' + (0.75 * ca) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 8, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,180,255,' + (0.55 * ca) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 5.5, 0, game.time * 5, game.time * 5 + 4.6); ctx.stroke();
    for (let i = 0; i < 4; i++){
      const ang = game.time * 4 + i * 1.57;
      ctx.fillStyle = 'rgba(190,160,255,' + (0.7 * ca) + ')';
      ctx.beginPath(); ctx.arc(Math.cos(ang) * 24, Math.sin(ang) * 7, 2, 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  ctx.scale(player.facing, 1);
  ctx.translate(0, breathe * 0.5);

  // ---- 엎드리기 (메이플 시그니처) ----
  if (player.prone && !climbing){
    // 다리 (뒤로 뻗음)
    ctx.fillStyle = st.pants;
    rr(-34, -10, 18, 8, 4); ctx.fill();
    ctx.fillStyle = st.shoe;
    rr(-40, -9, 9, 7, 3); ctx.fill();
    // 몸통 (수평)
    const pg2 = ctx.createLinearGradient(0, -16, 0, -2);
    pg2.addColorStop(0, st.top);
    pg2.addColorStop(1, st.topD);
    ctx.fillStyle = pg2;
    rr(-20, -16, 30, 14, 6); ctx.fill();
    // 팔 (턱 밑에)
    ctx.fillStyle = st.topD;
    rr(4, -12, 12, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(16, -8.5, 3.6, 0, 7); ctx.fill();
    // 머리 (앞쪽, 위를 봄)
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(14, -22, 14.5, 0, 7); ctx.fill();
    ctx.fillStyle = st.hair;
    ctx.beginPath(); ctx.arc(12, -25, 14.8, Math.PI * 0.8, Math.PI * 2.05); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-2, -28); ctx.quadraticCurveTo(2, -37, 12, -38);
    ctx.lineTo(14, -32); ctx.lineTo(19, -37.5); ctx.lineTo(23, -31);
    ctx.quadraticCurveTo(27, -32, 28, -25);
    ctx.quadraticCurveTo(26, -38, 12, -39.5);
    ctx.quadraticCurveTo(0, -37, -2, -28);
    ctx.fill();
    // 얼굴 (편안)
    ctx.fillStyle = '#2e2018';
    ctx.beginPath();
    ctx.ellipse(18, -21, 2.1, 3, 0, 0, 7);
    ctx.ellipse(24.5, -21, 2.1, 3, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(18.7, -22.2, 0.9, 0, 7); ctx.arc(25.2, -22.2, 0.9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(21.5, -15.5, 2.2, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.fillStyle = 'rgba(255,150,140,0.35)';
    ctx.beginPath(); ctx.ellipse(26.5, -16.5, 3, 2, 0, 0, 7); ctx.fill();
    ctx.restore();
    return;
  }

  // ---- 다리/신발 ----
  const legY = air ? -16 : -15;
  ctx.fillStyle = st.pants;
  rr(-10 + (air ? -2 : leg * 0.55), legY, 9, 15, 3.5); ctx.fill();
  rr(2 + (air ? 3 : -leg * 0.55), legY + (air ? -4 : 0), 9, air ? 12 : 15, 3.5); ctx.fill();
  ctx.fillStyle = st.shoe;
  rr(-12 + (air ? -2 : leg * 0.55), -6, 12, 6, 2.5); ctx.fill();
  rr(1 + (air ? 3 : -leg * 0.55), -6 + (air ? -4 : 0), 12, 6, 2.5); ctx.fill();

  // ---- 4차: 은은한 금빛 오라 (몸 뒤) ----
  if (player.job4 && !climbing){
    ctx.globalCompositeOperation = 'lighter';
    const a4 = 0.10 + Math.sin(game.time * 3) * 0.05;
    ctx.fillStyle = 'rgba(255,220,120,' + a4 + ')';
    ctx.beginPath(); ctx.ellipse(0, -28, 24, 38, 0, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  }
  // ---- 3차+: 망토 (등 뒤 펄럭임) ----
  if (player.job3 && !climbing){
    const capeCol = player.job4 ? JOB4[player.job].color : JOB3[player.job].color;
    const wob = Math.sin(game.time * 5 + player.walkT * 0.7) * 2.5;
    ctx.fillStyle = shade(capeCol, -0.25);
    ctx.beginPath();
    ctx.moveTo(-3, -36);
    ctx.quadraticCurveTo(-19, -30, -17 - wob, -6);
    ctx.quadraticCurveTo(-11, -9 - wob * 0.4, -8, -14);
    ctx.quadraticCurveTo(-9, -26, -3, -36);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = capeCol;
    ctx.beginPath();
    ctx.moveTo(-4, -36);
    ctx.quadraticCurveTo(-16, -29, -14 - wob, -8);
    ctx.quadraticCurveTo(-9, -12, -7, -18);
    ctx.quadraticCurveTo(-8, -28, -4, -36);
    ctx.closePath(); ctx.fill();
    // 어깨 고정 브로치
    ctx.fillStyle = '#ffd94a';
    ctx.beginPath(); ctx.arc(-6, -35, 2.6, 0, 7); ctx.fill();
  }
  // ---- 몸통 ----
  const topG = ctx.createLinearGradient(0, -36, 0, -13);
  topG.addColorStop(0, st.top);
  topG.addColorStop(1, st.topD);
  ctx.fillStyle = topG;
  rr(-12, -36, 24, 23, 7); ctx.fill();
  // ---- 갑옷 (장비 외형 반영) ----
  if (player.equip.top){
    const tt = ITEMS[player.equip.top.id].tier;
    if (tt === 1){
      // 여행자의 조끼
      ctx.fillStyle = 'rgba(122,82,48,0.9)';
      rr(-12, -32, 24, 12, 5); ctx.fill();
      ctx.strokeStyle = 'rgba(70,45,25,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(0, -20); ctx.stroke();
    } else if (tt === 2){
      // 사슬 갑옷 (리벳 점)
      ctx.fillStyle = 'rgba(150,158,176,0.95)';
      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.fillStyle = 'rgba(92,100,118,0.95)';
      for (const px of [-7, 0, 7]){
        ctx.beginPath(); ctx.arc(px, -31, 1.5, 0, 7); ctx.arc(px, -25, 1.5, 0, 7); ctx.fill();
      }
    } else if (tt === 3){
      // 용사의 판금 + 금 어깨
      ctx.fillStyle = '#c8ccd8';
      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      rr(-12, -36, 24, 5, 4); ctx.fill();
      ctx.fillStyle = '#e8c05a';
      rr(-14, -37, 8, 7, 3); ctx.fill();
      rr(6, -37, 8, 7, 3); ctx.fill();
      ctx.fillStyle = '#4a6ecc';
      ctx.beginPath(); ctx.arc(0, -28, 3, 0, 7); ctx.fill();
    } else {
      // 용린 갑주 (붉은 비늘 + 금테)
      ctx.fillStyle = '#b0402e';
      rr(-12, -36, 24, 17, 6); ctx.fill();
      ctx.strokeStyle = 'rgba(70,15,10,0.8)'; ctx.lineWidth = 1.4;
      for (const py of [-32, -27, -22]){
        ctx.beginPath();
        ctx.arc(-6, py, 4, 0.3, Math.PI - 0.3);
        ctx.arc(6, py, 4, 0.3, Math.PI - 0.3);
        ctx.stroke();
      }
      ctx.fillStyle = '#ffd94a';
      rr(-14, -37, 8, 7, 3); ctx.fill();
      rr(6, -37, 8, 7, 3); ctx.fill();
    }
  }
  // 벨트
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(-12, -18, 24, 4);
  ctx.fillStyle = '#e8c05a';
  ctx.fillRect(-3, -18.5, 6, 5);
  // 직업 디테일
  if (player.job === 'warrior'){
    ctx.fillStyle = player.job2 ? '#e8c05a' : '#d8dce8';
    rr(-13, -37, 26, 7, 3); ctx.fill();   // 어깨 갑주 (2차: 금장)
  } else if (player.job === 'mage'){
    ctx.fillStyle = st.topD;
    ctx.beginPath();
    ctx.moveTo(-12, -14); ctx.lineTo(-15, -2); ctx.lineTo(15, -2); ctx.lineTo(12, -14);
    ctx.closePath(); ctx.fill();          // 로브 자락
    if (player.job2){
      ctx.fillStyle = '#e8d05a';
      ctx.fillRect(-14, -5, 28, 2.5);      // 클레릭 금테
      ctx.fillRect(-2, -34, 4, 18);        // 성직자 세로줄
    }
  } else if (player.job === 'archer'){
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-12, -34); ctx.lineTo(12, -18); ctx.stroke();  // 화살통 끈
    // 등의 화살통
    ctx.save();
    ctx.translate(-13, -33);
    ctx.rotate(0.35);
    ctx.fillStyle = '#6e4a26';
    rr(-4, -6, 8, 18, 3.5); ctx.fill();
    ctx.fillStyle = '#e05a4a';
    ctx.beginPath(); ctx.moveTo(-3, -6); ctx.lineTo(-5, -12); ctx.lineTo(-1, -8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(3, -6); ctx.lineTo(5, -12); ctx.lineTo(1, -8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c8b89a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(-3.5, -10); ctx.moveTo(2, -6); ctx.lineTo(3.5, -10); ctx.stroke();
    ctx.restore();
  }

  // ---- 뒷팔 ----
  if (!climbing){
    ctx.save();
    ctx.translate(-9, -33);
    ctx.rotate(-armSwing);
    ctx.fillStyle = st.topD;
    rr(-3.5, 0, 7, 13, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(0, 13, 3.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  // ---- 무기 + 앞팔 ----
  if (climbing){
    const ph = Math.sin(game.time * 8) * 4;
    ctx.fillStyle = st.top;
    rr(-14, -50 + ph, 7, 18, 3.5); ctx.fill();
    rr(7, -50 - ph, 7, 18, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(-10.5, -50 + ph, 3.6, 0, 7); ctx.arc(10.5, -50 - ph, 3.6, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 활
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    const pull = atk && prog < 0.55 ? (0.55 - prog) * 16 : 0;
    ctx.save();
    ctx.translate(13, -27);
    ctx.strokeStyle = '#7a4a1e'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, 0, 19, -1.25, 1.25); ctx.stroke();
    ctx.strokeStyle = '#5a3512'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 19, -0.5, 0.5); ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ece8d8'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-1.25) * 19, Math.sin(-1.25) * 19);
    ctx.lineTo(-5 - pull, 0);
    ctx.lineTo(Math.cos(1.25) * 19, Math.sin(1.25) * 19);
    ctx.stroke();
    if (pull > 0){
      ctx.strokeStyle = '#d8ccb8'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(-5 - pull, 0); ctx.lineTo(17, 0); ctx.stroke();
      ctx.fillStyle = '#c8ccd8';
      ctx.beginPath(); ctx.moveTo(21, 0); ctx.lineTo(15, -3); ctx.lineTo(15, 3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // 앞팔
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else if (player.job === 'thief'){
    // 단검 + 투척 자세
    const prog = atk ? 1 - player.attackAnim / 0.2 : 0;
    const throwArm = atk && prog < 0.5 ? (0.5 - prog) * 2 : 0;
    ctx.save();
    ctx.translate(11, -30);
    ctx.rotate(-0.3 - throwArm * 0.8);
    ctx.fillStyle = '#c8ccd8';
    ctx.beginPath();
    ctx.moveTo(0, -4); ctx.lineTo(15, -1.5); ctx.lineTo(17, 0); ctx.lineTo(15, 1.5); ctx.lineTo(0, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5f2478';
    rr(-6, -3.5, 7, 7, 2.5); ctx.fill();
    ctx.restore();
    // 앞팔
    ctx.fillStyle = st.top;
    rr(1, -33 - throwArm * 6, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5 - throwArm * 7, 3.8, 0, 7); ctx.fill();
  } else if (player.job === 'mage'){
    // 지팡이
    ctx.save();
    ctx.translate(11, -28);
    ctx.rotate(cast ? -0.6 : 0.3);
    ctx.strokeStyle = '#6e4a26'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -24); ctx.stroke();
    ctx.lineCap = 'butt';
    const glow = cast || atk;
    if (glow){
      const og = ctx.createRadialGradient(0, -29, 2, 0, -29, 16);
      og.addColorStop(0, 'rgba(170,220,255,0.9)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(0, -29, 16, 0, 7); ctx.fill();
    }
    ctx.fillStyle = glow ? '#cfe6ff' : '#5a8ae0';
    ctx.beginPath(); ctx.arc(0, -29, glow ? 7.5 : 6, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(-1.8, -31, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c8901a'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, -29, 8.6, 2.4, 4.0); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = st.top;
    rr(1, -33, 11, 7, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(12, -29.5, 3.8, 0, 7); ctx.fill();
  } else {
    // 검 (전사/초보자) - 스윙
    const prog = (cast ? 1 - player.castAnim / 0.25 : (atk ? 1 - player.attackAnim / 0.2 : 1));
    const ang = (atk || cast) ? (-2.1 + prog * 2.9) : 0.75;
    // 스윙 잔상
    if ((atk || cast) && prog < 0.85){
      ctx.save();
      ctx.translate(9, -29);
      const trailN = 4;
      for (let i = 1; i <= trailN; i++){
        const ta = ang - i * 0.28;
        ctx.strokeStyle = 'rgba(200,230,255,' + (0.3 - i * 0.06) + ')';
        ctx.lineWidth = 8 - i;
        ctx.beginPath();
        ctx.arc(0, 0, 38, ta - 0.1, ta + 0.15);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save();
    ctx.translate(9, -29);
    ctx.rotate(ang);
    // 팔
    ctx.fillStyle = st.top;
    rr(-2, -3.5, 13, 8, 3.5); ctx.fill();
    ctx.fillStyle = '#ffe0c2';
    ctx.beginPath(); ctx.arc(11, 0, 3.8, 0, 7); ctx.fill();
    // 검
    const blade = player.job === 'warrior' ? 40 : 32;
    const bg2 = ctx.createLinearGradient(0, -4, 0, 4);
    bg2.addColorStop(0, '#eef2fc');
    bg2.addColorStop(0.5, '#b8c0d4');
    bg2.addColorStop(1, '#8a94ac');
    ctx.fillStyle = bg2;
    ctx.beginPath();
    ctx.moveTo(15, -4);
    ctx.lineTo(15 + blade - 7, -4);
    ctx.lineTo(15 + blade, 0);
    ctx.lineTo(15 + blade - 7, 4);
    ctx.lineTo(15, 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillRect(15, -3.5, blade - 8, 2);
    // 가드/손잡이
    ctx.fillStyle = '#e0a82e';
    rr(12.5, -7, 4, 14, 2); ctx.fill();
    ctx.fillStyle = '#6b4a2c';
    rr(6, -3, 7, 6, 2.5); ctx.fill();
    ctx.restore();
  }

  // ---- 상위 무기 오라 (티어4 진홍 / 티어5 금빛) ----
  if (!climbing && player.equip.weapon){
    const wt5 = ITEMS[player.equip.weapon.id].tier || 1;
    if (wt5 >= 4){
      const gpos = { warrior:[16, -36], archer:[13, -27], mage:[11, -46], thief:[13, -31] }[player.job];
      if (gpos){
        ctx.globalCompositeOperation = 'lighter';
        const wa = 0.15 + Math.sin(game.time * 4) * 0.07;
        ctx.fillStyle = wt5 >= 5 ? 'rgba(255,200,80,' + wa + ')' : 'rgba(255,90,60,' + wa + ')';
        ctx.beginPath(); ctx.arc(gpos[0], gpos[1], 24, 0, 7); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }
  // ---- 머리 (2등신 대두) ----
  const headY = -50;
  ctx.fillStyle = '#ffe0c2';
  ctx.beginPath(); ctx.arc(0, headY, 15.5, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(45,30,22,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  // 볼터치
  ctx.fillStyle = 'rgba(255,150,140,0.35)';
  ctx.beginPath(); ctx.ellipse(11, headY + 6, 3.4, 2.2, 0, 0, 7); ctx.fill();
  // 뒷머리
  ctx.fillStyle = st.hair;
  ctx.beginPath();
  ctx.arc(0, headY - 2.5, 15.8, Math.PI * 0.86, Math.PI * 2.14);
  ctx.fill();
  // 앞머리 (가르마 스파이크)
  ctx.beginPath();
  ctx.moveTo(-15, headY - 5);
  ctx.quadraticCurveTo(-13, headY - 12, -6, headY - 13);
  ctx.lineTo(-4, headY - 8);
  ctx.lineTo(0, headY - 14);
  ctx.lineTo(4, headY - 8.5);
  ctx.lineTo(8, headY - 13.5);
  ctx.lineTo(11, headY - 8);
  ctx.quadraticCurveTo(14.5, headY - 9, 15.5, headY - 4);
  ctx.quadraticCurveTo(15, headY - 15, 0, headY - 16.5);
  ctx.quadraticCurveTo(-14, headY - 15, -15, headY - 5);
  ctx.fill();
  // 옆머리
  ctx.beginPath();
  ctx.moveTo(-15.5, headY - 4);
  ctx.quadraticCurveTo(-17.5, headY + 4, -14.5, headY + 9);
  ctx.quadraticCurveTo(-13.5, headY + 2, -13, headY - 4);
  ctx.fill();
  // ---- 모자 (장비) ----
  if (player.equip.hat){
    const tier = ITEMS[player.equip.hat.id].tier;
    if (tier === 1){
      ctx.fillStyle = '#8a6238';
      ctx.beginPath(); ctx.ellipse(0, headY - 9, 17, 5.5, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#a3763f';
      ctx.beginPath(); ctx.ellipse(0, headY - 12, 10.5, 7, 0, Math.PI, 0); ctx.fill();
    } else if (tier === 2){
      const hg2 = ctx.createLinearGradient(0, headY - 22, 0, headY - 4);
      hg2.addColorStop(0, '#c8cede');
      hg2.addColorStop(1, '#8a94ac');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#6a7490';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#d8dee8';
      ctx.fillRect(-2, headY - 23, 4, 6);
    } else if (tier === 3){
      const hg3 = ctx.createLinearGradient(0, headY - 24, 0, headY - 2);
      hg3.addColorStop(0, '#f0d068');
      hg3.addColorStop(1, '#c8901a');
      ctx.fillStyle = hg3;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#a87610';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#e05a6a';
      ctx.beginPath(); ctx.moveTo(0, headY - 20); ctx.lineTo(5, headY - 30); ctx.lineTo(-5, headY - 30); ctx.closePath(); ctx.fill();
    } else {
      // 드래곤 헬름: 진홍 투구 + 흰 뿔
      const hg4 = ctx.createLinearGradient(0, headY - 24, 0, headY - 2);
      hg4.addColorStop(0, '#d05040');
      hg4.addColorStop(1, '#8a2a1e');
      ctx.fillStyle = hg4;
      ctx.beginPath(); ctx.arc(0, headY - 4, 15.8, Math.PI * 0.92, Math.PI * 2.08); ctx.fill();
      ctx.fillStyle = '#5f1c14';
      rr(-16, headY - 6, 32, 4.5, 2); ctx.fill();
      ctx.fillStyle = '#f0ead8';
      for (const sx2 of [-1, 1]){
        ctx.beginPath();
        ctx.moveTo(sx2 * 10, headY - 14);
        ctx.quadraticCurveTo(sx2 * 18, headY - 22, sx2 * 15, headY - 32);
        ctx.quadraticCurveTo(sx2 * 13, headY - 22, sx2 * 6, headY - 16);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#ffd94a';
      ctx.beginPath(); ctx.arc(0, headY - 16, 3, 0, 7); ctx.fill();
    }
  } else if (player.job === 'mage'){
    // 마법사 고깔모자
    ctx.fillStyle = '#4e3494';
    ctx.beginPath();
    ctx.moveTo(-17, headY - 8);
    ctx.quadraticCurveTo(-2, headY - 13, 17, headY - 8);
    ctx.lineTo(8, headY - 34);
    ctx.quadraticCurveTo(4, headY - 38, 1, headY - 33);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6a4ac0';
    ctx.beginPath(); ctx.ellipse(0, headY - 8.5, 18, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8c05a';
    ctx.beginPath(); ctx.arc(4, headY - 33, 3, 0, 7); ctx.fill();
  } else if (player.job === 'archer'){
    // 궁수 두건 깃털
    ctx.fillStyle = '#2a6236';
    ctx.beginPath(); ctx.ellipse(0, headY - 10, 16.5, 5.5, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = player.job2 ? '#e8c05a' : '#e05a4a';
    ctx.save();
    ctx.translate(-10, headY - 13);
    ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0, 0, 9, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
  } else if (player.job === 'warrior'){
    // 전사 머리띠
    ctx.fillStyle = '#b83a30';
    rr(-15.5, headY - 8, 31, 5, 2.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    rr(-15.5, headY - 8, 31, 1.8, 1); ctx.fill();
  }
  // ---- 얼굴 ----
  // 눈썹 (표정)
  ctx.strokeStyle = 'rgba(46,32,24,0.85)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  if (atk || cast){
    ctx.moveTo(2, headY - 5); ctx.lineTo(7.5, headY - 3.5);
    ctx.moveTo(15, headY - 5); ctx.lineTo(9.5, headY - 3.5);
  } else {
    ctx.moveTo(2.5, headY - 4); ctx.lineTo(7.5, headY - 4.5);
    ctx.moveTo(9.5, headY - 4.5); ctx.lineTo(14.5, headY - 4);
  }
  ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#2e2018';
  if (eyeBlink){
    ctx.fillRect(3, headY + 1, 4.5, 1.6);
    ctx.fillRect(10, headY + 1, 4.5, 1.6);
  } else {
    ctx.beginPath();
    ctx.ellipse(5, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.ellipse(12, headY + 1, 2.3, 3.4, 0, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(5.8, headY - 0.5, 1, 0, 7); ctx.arc(12.8, headY - 0.5, 1, 0, 7); ctx.fill();
  }
  // 입
  ctx.strokeStyle = '#8a5a4a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (atk || cast) { ctx.arc(9, headY + 8, 2.4, 0, Math.PI); }
  else { ctx.moveTo(7, headY + 8.5); ctx.lineTo(11.5, headY + 8.5); }
  ctx.stroke();
  ctx.restore();
}

// ============================================================
// 투사체 / 이펙트
// ============================================================
function drawProjectiles(){
  for (const p of pProj){
    const sx = p.x - camX;
    if (sx < -40 || sx > W + 40) continue;
    const dir = Math.sign(p.vx);
    if (p.kind === 'arrow'){
      ctx.strokeStyle = 'rgba(200,230,255,0.35)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(sx - dir * 30, p.y); ctx.lineTo(sx - dir * 8, p.y); ctx.stroke();
      ctx.strokeStyle = '#b89868'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx + dir * 9, p.y); ctx.stroke();
      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 16, p.y); ctx.lineTo(sx + dir * 6, p.y - 4.5); ctx.lineTo(sx + dir * 6, p.y + 4.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e05a4a';
      ctx.beginPath();
      ctx.moveTo(sx - dir * 15, p.y); ctx.lineTo(sx - dir * 20, p.y - 4); ctx.lineTo(sx - dir * 20, p.y + 4);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'orb'){
      const og = ctx.createRadialGradient(sx, p.y, 2, sx, p.y, 14);
      og.addColorStop(0, 'rgba(220,240,255,0.95)');
      og.addColorStop(0.5, 'rgba(120,170,255,0.6)');
      og.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(sx, p.y, 14, 0, 7); ctx.fill();
      ctx.fillStyle = '#a8ccff';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx + dir * 1, p.y - 2, 2.8, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(150,190,255,0.45)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(sx - dir * 12, p.y, 5.5, 0, 7); ctx.stroke();
    } else if (p.kind === 'bomb'){
      ctx.fillStyle = '#e8a03a';
      ctx.beginPath(); ctx.arc(sx, p.y, 7.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#f8d060';
      ctx.beginPath(); ctx.arc(sx, p.y, 4, 0, 7); ctx.fill();
      for (let i = 1; i <= 3; i++){
        ctx.fillStyle = 'rgba(255,170,70,' + (0.4 - i * 0.1) + ')';
        ctx.beginPath(); ctx.arc(sx - dir * i * 9, p.y + Math.sin(game.time * 20 + i) * 2, 6 - i, 0, 7); ctx.fill();
      }
    } else if (p.kind === 'wave2'){
      // 지면 충격파: 대형 파도 + 가산 글로우 + 빛 커튼
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.scale(dir, 1);
      ctx.globalCompositeOperation = 'lighter';
      const wgl = ctx.createRadialGradient(10, -8, 4, 10, -8, 42);
      wgl.addColorStop(0, 'rgba(160,215,255,0.55)');
      wgl.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.fillStyle = wgl;
      ctx.beginPath(); ctx.arc(10, -8, 42, 0, 7); ctx.fill();
      const wc = ctx.createLinearGradient(0, -60, 0, 0);
      wc.addColorStop(0, 'rgba(150,210,255,0)');
      wc.addColorStop(1, 'rgba(150,210,255,0.5)');
      ctx.fillStyle = wc;
      ctx.fillRect(-14, -60, 34, 60);
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 4; i++){
        const a = 0.9 - i * 0.18;
        ctx.strokeStyle = 'rgba(150,210,255,' + a + ')';
        ctx.lineWidth = 7 - i;
        ctx.beginPath();
        ctx.arc(-i * 16, -2, 26 + i * 8, -2.2, -0.9);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(220,240,255,0.9)';
      ctx.beginPath(); ctx.ellipse(6, -20, 12, 20, -0.3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(160,190,220,0.45)';
      ctx.beginPath(); ctx.ellipse(-18, -5, 13, 6, 0, 0, 7); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'rain'){
      // 낙하 화살
      ctx.strokeStyle = 'rgba(200,230,255,0.3)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(sx, p.y - 26); ctx.lineTo(sx, p.y - 8); ctx.stroke();
      ctx.strokeStyle = '#b89868'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(sx, p.y - 15); ctx.lineTo(sx, p.y + 9); ctx.stroke();
      ctx.fillStyle = '#e8ecf4';
      ctx.beginPath();
      ctx.moveTo(sx, p.y + 16); ctx.lineTo(sx - 4.5, p.y + 6); ctx.lineTo(sx + 4.5, p.y + 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e05a4a';
      ctx.beginPath();
      ctx.moveTo(sx, p.y - 15); ctx.lineTo(sx - 4, p.y - 20); ctx.lineTo(sx + 4, p.y - 20);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'holy'){
      const hg2 = ctx.createRadialGradient(sx, p.y, 2, sx, p.y, 16);
      hg2.addColorStop(0, 'rgba(255,250,220,0.95)');
      hg2.addColorStop(0.5, 'rgba(255,225,120,0.6)');
      hg2.addColorStop(1, 'rgba(255,225,120,0)');
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(sx, p.y, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe9a0';
      ctx.beginPath(); ctx.arc(sx, p.y, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(sx + dir, p.y - 2, 2.6, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,180,0.7)'; ctx.lineWidth = 2;
      const tw2 = 5 + Math.sin(game.time * 16) * 2;
      ctx.beginPath();
      ctx.moveTo(sx - tw2, p.y); ctx.lineTo(sx + tw2, p.y);
      ctx.moveTo(sx, p.y - tw2); ctx.lineTo(sx, p.y + tw2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,225,120,0.4)'; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(sx - dir * 26, p.y); ctx.lineTo(sx - dir * 9, p.y); ctx.stroke();
    } else if (p.kind === 'hurr'){
      // 폭풍의 시: 대형 화살 + 청록 3겹 가산 트레일
      ctx.globalCompositeOperation = 'lighter';
      for (const [len, lw, a2] of [[46, 7, 0.45], [30, 4.5, 0.32], [16, 2.5, 0.2]]){
        ctx.strokeStyle = 'rgba(120,255,190,' + a2 + ')';
        ctx.lineWidth = lw; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sx - dir * len, p.y); ctx.lineTo(sx - dir * 6, p.y); ctx.stroke();
      }
      ctx.lineCap = 'butt';
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = '#d8c8a0'; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(sx - dir * 20, p.y); ctx.lineTo(sx + dir * 12, p.y); ctx.stroke();
      ctx.fillStyle = '#f4fff0';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 24, p.y); ctx.lineTo(sx + dir * 8, p.y - 6.5); ctx.lineTo(sx + dir * 8, p.y + 6.5);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5ae88a';
      ctx.beginPath();
      ctx.moveTo(sx - dir * 20, p.y); ctx.lineTo(sx - dir * 27, p.y - 5.5); ctx.lineTo(sx - dir * 27, p.y + 5.5);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'star4'){
      // 쿼드러플: 대형 금색 표창 + 핑크 글로우
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,140,220,0.4)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx - (p.vx > 0 ? 1 : -1) * 26, p.y); ctx.lineTo(sx - (p.vx > 0 ? 1 : -1) * 6, p.y); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.rotate(game.time * 24 + p.x * 0.05);
      ctx.fillStyle = '#e8e0f0';
      for (let s4 = 0; s4 < 4; s4++){
        ctx.save();
        ctx.rotate(s4 * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -3.6); ctx.lineTo(16, 0); ctx.lineTo(0, 3.6);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#e8b83a';
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(-1.2, -1.2, 1.6, 0, 7); ctx.fill();
      ctx.restore();
    } else if (p.kind === 'bolt'){
      // 아이언 볼트: 강철 다트
      ctx.strokeStyle = 'rgba(200,210,230,0.4)'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(sx - dir * 26, p.y); ctx.lineTo(sx - dir * 8, p.y); ctx.stroke();
      ctx.strokeStyle = '#9aa4b8'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(sx - dir * 16, p.y); ctx.lineTo(sx + dir * 10, p.y); ctx.stroke();
      ctx.fillStyle = '#d8e0f0';
      ctx.beginPath();
      ctx.moveTo(sx + dir * 20, p.y); ctx.lineTo(sx + dir * 6, p.y - 6); ctx.lineTo(sx + dir * 6, p.y + 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5f6a80';
      ctx.beginPath();
      ctx.moveTo(sx - dir * 16, p.y); ctx.lineTo(sx - dir * 22, p.y - 4.5); ctx.lineTo(sx - dir * 22, p.y + 4.5);
      ctx.closePath(); ctx.fill();
    } else if (p.kind === 'star'){
      // 회전 표창
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.rotate(game.time * 22 + p.x * 0.05);
      ctx.fillStyle = '#d8dce8';
      for (let s = 0; s < 4; s++){
        ctx.save();
        ctx.rotate(s * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, -2.6); ctx.lineTo(11, 0); ctx.lineTo(0, 2.6);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = '#8a3aa8';
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(200,140,230,0.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx - (p.vx > 0 ? 1 : -1) * 20, p.y); ctx.lineTo(sx - (p.vx > 0 ? 1 : -1) * 6, p.y); ctx.stroke();
    } else if (p.kind === 'phx'){
      // 불사조: 대형 화염 새
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.scale(dir, 1);
      const flap2 = Math.sin(game.time * 16) * 0.5;
      ctx.globalCompositeOperation = 'lighter';
      const pg3 = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
      pg3.addColorStop(0, 'rgba(255,230,150,0.85)');
      pg3.addColorStop(0.5, 'rgba(255,140,50,0.5)');
      pg3.addColorStop(1, 'rgba(255,100,30,0)');
      ctx.fillStyle = pg3;
      ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      // 몸통
      ctx.fillStyle = '#ff9a3a';
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 11, 0, 0, 7); ctx.fill();
      // 머리 + 부리
      ctx.fillStyle = '#ffb85a';
      ctx.beginPath(); ctx.arc(19, -4, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe83a';
      ctx.beginPath(); ctx.moveTo(26, -5); ctx.lineTo(34, -2); ctx.lineTo(26, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3a1a08';
      ctx.beginPath(); ctx.arc(21, -6, 1.8, 0, 7); ctx.fill();
      // 날개 (펄럭)
      ctx.fillStyle = '#ff7a2a';
      ctx.save();
      ctx.translate(-2, -6);
      ctx.rotate(-0.5 + flap2);
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.quadraticCurveTo(-16, -22, -34, -18);
      ctx.quadraticCurveTo(-20, -8, -14, 2); ctx.closePath(); ctx.fill();
      ctx.restore();
      // 꼬리 불꽃
      ctx.fillStyle = 'rgba(255,160,60,0.8)';
      for (let i = 1; i <= 3; i++){
        ctx.beginPath();
        ctx.ellipse(-18 - i * 9, Math.sin(game.time * 14 + i) * 4, 8 - i * 2, 4, 0, 0, 7);
        ctx.fill();
      }
      ctx.restore();
    } else if (p.kind === 'holybig'){
      // 천벌의 화살: 거대 관통 화살
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.scale(dir, 1);
      ctx.globalCompositeOperation = 'lighter';
      const hb = ctx.createLinearGradient(-140, 0, 40, 0);
      hb.addColorStop(0, 'rgba(255,240,180,0)');
      hb.addColorStop(1, 'rgba(255,240,180,0.6)');
      ctx.fillStyle = hb;
      ctx.beginPath();
      ctx.moveTo(-140, -17); ctx.lineTo(28, -17); ctx.lineTo(28, 17); ctx.lineTo(-140, 17);
      ctx.closePath(); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff7d8';
      ctx.beginPath();
      ctx.moveTo(60, 0); ctx.lineTo(20, -19); ctx.lineTo(20, 19);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffe9a0'; ctx.lineWidth = 11;
      ctx.beginPath(); ctx.moveTo(-56, 0); ctx.lineTo(20, 0); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-56, 0); ctx.lineTo(20, 0); ctx.stroke();
      // 금색 링 회전 장식
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,220,120,0.7)'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(-10, 0, 10, 21, game.time * 8, 0, 7); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    }
  }
  for (const p of eProj){
    const sx = p.x - camX;
    if (sx < -60 || sx > W + 60) continue;
    if (p.kind === 'spore'){
      if (p.vis === 'banana'){
        // 루팡 바나나: 회전하는 노란 초승달
        ctx.save();
        ctx.translate(sx, p.y);
        ctx.rotate(game.time * 9 + p.x * 0.05);
        ctx.strokeStyle = '#f0d040'; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0.4, 2.7); ctx.stroke();
        ctx.strokeStyle = '#c8a428'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 9, 0.5, 2.6); ctx.stroke();
        ctx.lineCap = 'butt';
        ctx.restore();
      } else if (p.vis === 'ink'){
        // 옥토퍼스 먹물: 검보라 방울 + 궤적 물방울
        ctx.fillStyle = 'rgba(40,30,60,0.35)';
        ctx.beginPath(); ctx.arc(sx, p.y, 12, 0, 7); ctx.fill();
        ctx.fillStyle = '#2e2444';
        ctx.beginPath(); ctx.arc(sx, p.y, 7.5, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(120,100,180,0.7)';
        ctx.beginPath(); ctx.arc(sx - 2, p.y - 2.5, 2.2, 0, 7); ctx.fill();
      } else if (p.vis === 'ice'){
        // 예티 고드름: 하늘색 결정
        ctx.save();
        ctx.translate(sx, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
        ctx.fillStyle = 'rgba(190,230,255,0.9)';
        ctx.beginPath();
        ctx.moveTo(0, 12); ctx.lineTo(-6, -6); ctx.lineTo(0, -12); ctx.lineTo(6, -6);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(110,170,230,0.9)'; ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      } else if (p.vis === 'clock'){
        // 타임키퍼 톱니: 회전 금색 기어
        ctx.save();
        ctx.translate(sx, p.y);
        ctx.rotate(game.time * 10 + p.x * 0.03);
        ctx.fillStyle = '#c8a050';
        for (let g7 = 0; g7 < 8; g7++){
          ctx.rotate(Math.PI / 4);
          ctx.fillRect(-2.5, 6, 5, 5);
        }
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
        ctx.fillStyle = '#5f4a20';
        ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fill();
        ctx.restore();
      } else if (p.vis === 'jelly'){
        // 킹 슬라임 젤리탄: 초록 젤리 방울
        ctx.fillStyle = 'rgba(92,191,74,0.3)';
        ctx.beginPath(); ctx.arc(sx, p.y, 13, 0, 7); ctx.fill();
        ctx.fillStyle = '#5cbf4a';

      hrg.addColorStop(1, 'rgba(140,255,180,0)');
      ctx.fillStyle = hrg;
      ctx.beginPath(); ctx.arc(sx, e.y - 30, 70, 0, 7); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      // 발밑 확산 링
      ctx.strokeStyle = 'rgba(120,255,170,' + a * 0.8 + ')';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(sx, e.y + 28, 14 + pr * 44, 5 + pr * 12, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(120,255,170,' + a * 0.9 + ')';
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(sx, e.y, 26 + pr * 26, 38 + pr * 18, 0, 0, 7); ctx.stroke();
      // 금빛/초록 교차 십자 상승
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 8; i++){
        const ang = i * 0.785 + 0.4;
        const d = 16 + pr * 34;
        const px2 = sx + Math.cos(ang) * d, py2 = e.y + Math.sin(ang) * d * 0.9 - pr * 48;
        ctx.strokeStyle = (i % 2 === 0 ? 'rgba(255,240,170,' : 'rgba(160,255,190,') + a + ')';
        ctx.lineWidth = 2.8;
        const cs2 = Math.max(1.5, 10 * (1 - pr * 0.5));
        ctx.beginPath();
        ctx.moveTo(px2 - cs2, py2); ctx.lineTo(px2 + cs2, py2);
        ctx.moveTo(px2, py2 - cs2); ctx.lineTo(px2, py2 + cs2);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    } else if (e.kind === 'dashline'){
      // 섀도 대시: 수평 잔상 속도선
      const pr = e.t / 0.32;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.scale(e.dir, 1);
      for (const [oy, len, lw] of [[-14, 130, 3], [0, 170, 5], [14, 120, 3], [-26, 90, 2], [26, 85, 2]]){
        ctx.strokeStyle = 'rgba(190,130,240,' + a * 0.75 + ')';
        ctx.lineWidth = lw;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-len / 2 - pr * 30, oy);
        ctx.lineTo(len / 2 - pr * 60, oy);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
      ctx.restore();
    } else if (e.kind === 'pillar'){
      // 빛기둥 (샤이닝 레이/제네시스): 3톤 풀높이 기둥 + 낙하 코어
      const pr = e.t / 0.5;
      if (pr > 1) continue;
      const a = 1 - pr;
      const wPil = 26 * (pr < 0.15 ? pr / 0.15 : 1);
      ctx.globalCompositeOperation = 'lighter';
      const plg = ctx.createLinearGradient(sx - wPil, 0, sx + wPil, 0);
      plg.addColorStop(0, 'rgba(255,216,58,0)');
      plg.addColorStop(0.35, 'rgba(255,216,58,' + a * 0.5 + ')');
      plg.addColorStop(0.5, 'rgba(255,251,232,' + a * 0.9 + ')');
      plg.addColorStop(0.65, 'rgba(255,216,58,' + a * 0.5 + ')');
      plg.addColorStop(1, 'rgba(255,216,58,0)');
      ctx.fillStyle = plg;
      ctx.fillRect(sx - wPil, 0, wPil * 2, e.y);
      // 낙하 코어 (초반 0.3에 하늘에서 착탄점으로)
      if (pr < 0.3){
        const cy2 = (pr / 0.3) * e.y;
        ctx.fillStyle = 'rgba(255,255,240,0.95)';
        ctx.beginPath(); ctx.arc(sx, cy2, 10, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(255,235,150,' + a * 0.85 + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(sx, e.y, 14 + pr * 30, 5 + pr * 9, 0, 0, 7); ctx.stroke();
    } else if (e.kind === 'holyburst'){
      // 엔젤 스트라이크: 성폭발
      const pr = e.t / 0.55;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.globalCompositeOperation = 'lighter';
      const hbg = ctx.createRadialGradient(sx, e.y, 6, sx, e.y, 40 + pr * 130);
      hbg.addColorStop(0, 'rgba(255,250,220,' + a * 0.95 + ')');
      hbg.addColorStop(0.5, 'rgba(255,220,110,' + a * 0.6 + ')');
      hbg.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = hbg;
      ctx.beginPath(); ctx.arc(sx, e.y, 40 + pr * 130, 0, 7); ctx.fill();
      // 날개 실루엣
      ctx.fillStyle = 'rgba(255,255,240,' + a * 0.5 + ')';
      for (const s of [-1, 1]){
        ctx.save();
        ctx.translate(sx, e.y - 20);
        ctx.scale(s, 1);
        ctx.rotate(-0.2 - pr * 0.3);
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.quadraticCurveTo(60, -46 - pr * 20, 96, -30);
        ctx.quadraticCurveTo(60, -12, 16, 16);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'rgba(255,240,170,' + a + ')';
      ctx.lineWidth = Math.max(1, 5 - pr * 4);
      ctx.beginPath(); ctx.arc(sx, e.y, 46 + pr * 140, 0, 7); ctx.stroke();
    } else if (e.kind === 'smokebomb'){
      // 연막탄
      const pr = e.t / 0.7;
      if (pr > 1) continue;
      const a = 1 - pr;
      for (let i = 0; i < 7; i++){
        const ang = i * 0.9 + 0.4;
        const d = 14 + pr * 90;
        ctx.fillStyle = 'rgba(70,50,95,' + a * 0.5 + ')';
        ctx.beginPath();
        ctx.arc(sx + Math.cos(ang) * d, e.y + Math.sin(ang) * d * 0.6 - pr * 18, 16 + pr * 22, 0, 7);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(140,100,180,' + a * 0.4 + ')';
      ctx.beginPath(); ctx.arc(sx, e.y - pr * 12, 22 + pr * 34, 0, 7); ctx.fill();
    } else if (e.kind === 'genesis'){
      // 제네시스: 짧은 상단 성광 (워시아웃 방지 — 알파/지속 축소)
      const pr = e.t / 0.3;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.globalCompositeOperation = 'lighter';
      const gg3 = ctx.createLinearGradient(0, 0, 0, H * 0.7);
      gg3.addColorStop(0, 'rgba(255,250,220,' + a * 0.22 + ')');
      gg3.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = gg3;
      ctx.fillRect(-40, 0, W + 80, H * 0.7);
      ctx.globalCompositeOperation = 'source-over';
    } else if (e.kind === 'magiccircle'){
      // 제네시스 마법진: 하늘의 회전 이중 링 + 룬 스포크
      const pr = e.t / 0.65;
      if (pr > 1) continue;
      const a = pr < 0.15 ? pr / 0.15 : 1 - (pr - 0.15) / 0.85;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.globalCompositeOperation = 'lighter';
      ctx.rotate(game.time * 1.8);
      ctx.strokeStyle = 'rgba(255,225,120,' + a * 0.9 + ')';
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 180, 46, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,245,200,' + a * 0.7 + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(0, 0, 132, 33, 0, 0, 7); ctx.stroke();
      for (let i = 0; i < 8; i++){
        const ang = i * Math.PI / 4;
        ctx.strokeStyle = 'rgba(255,235,160,' + a * 0.6 + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * 132, Math.sin(ang) * 33);
        ctx.lineTo(Math.cos(ang) * 180, Math.sin(ang) * 46);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,250,220,' + a * 0.85 + ')';
        ctx.beginPath(); ctx.arc(Math.cos(ang) * 156, Math.sin(ang) * 39, 3.5, 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    } else if (e.kind === 'windfan'){
      // 폭풍의 시: 부채꼴 바람 잔상
      const pr = e.t / 0.25;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.scale(e.dir, 1);
      ctx.globalCompositeOperation = 'lighter';
      for (const [r0, lw] of [[40 + pr * 30, 3], [54 + pr * 34, 2]]){
        ctx.strokeStyle = 'rgba(140,255,190,' + a * 0.55 + ')';
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.arc(-20, 0, r0, -0.5, 0.5); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.restore();
    } else if (e.kind === 'whirl'){
      const pr = e.t / 0.4;
      if (pr > 1) continue;
      const a = 1 - pr;
      ctx.save();
      ctx.translate(sx, e.y);
      ctx.rotate(e.dir * pr * 5.5);
      for (const off of [0, Math.PI]){
        ctx.strokeStyle = 'rgba(150,215,255,' + a * 0.9 + ')';
        ctx.lineWidth = Math.max(1, 6 - pr * 4);
        ctx.beginPath();
        ctx.arc(0, 0, 44 + pr * 40, off - 0.2, off + 1.5);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,' + a * 0.6 + ')';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 36 + pr * 34, off, off + 1.2);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}
// ---------- 파티클 렌더 (2패스: 일반 -> 가산 배칭) ----------
function drawParticles(){
  // 패스1: 일반 합성 (파편/먼지)
  for (const p of particles){
    if (p.k !== 'shard' && p.k !== 'dust') continue;
    const sx = p.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const lf = 1 - p.t / p.life;
    if (p.k === 'shard'){
      ctx.save();
      ctx.translate(sx, p.y);
      ctx.rotate(p.rot || 0);
      ctx.globalAlpha = Math.min(1, lf * 1.6);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.35);
      ctx.restore();
    } else {
      ctx.globalAlpha = lf * 0.4;
      ctx.fillStyle = '#cbb694';
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * (1 + p.t * 2.2), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 패스2: 가산 합성 (스파크/글로우/불티) — 전환 1회
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of particles){
    if (p.k === 'shard' || p.k === 'dust') continue;
    const sx = p.x - camX;
    if (sx < -30 || sx > W + 30) continue;
    const lf = 1 - p.t / p.life;
    if (p.k === 'spark'){
      const sp2 = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(16, sp2 * 0.03);
      const nx = p.vx / sp2, ny = p.vy / sp2;
      ctx.strokeStyle = p.col;
      ctx.globalAlpha = lf;
      ctx.lineWidth = p.size * lf + 0.6;
      ctx.beginPath();
      ctx.moveTo(sx - nx * len, p.y - ny * len);
      ctx.lineTo(sx, p.y);
      ctx.stroke();
    } else if (p.k === 'glow'){
      // 그라디언트 대신 2겹 원 (프레임당 gradient 생성 제거)
      ctx.fillStyle = p.col;
      ctx.globalAlpha = lf * 0.22;
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * 2.4, 0, 7); ctx.fill();
      ctx.globalAlpha = lf * 0.85;
      ctx.beginPath(); ctx.arc(sx, p.y, p.size, 0, 7); ctx.fill();
    } else if (p.k === 'ember'){
      ctx.globalAlpha = lf;
      ctx.fillStyle = lf > 0.55 ? '#ffd890' : '#ff8a4a';
      ctx.beginPath(); ctx.arc(sx, p.y, p.size * lf + 0.5, 0, 7); ctx.fill();
    }
  }
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}
function dmgFill(t, size, y){
  if (t.color === '#ffb642'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#fff4c0');
    dg.addColorStop(0.55, '#ffd24a');
    dg.addColorStop(1, '#f08a1e');
    return dg;
  }
  if (t.color === '#ff5ab0'){
    const dg = ctx.createLinearGradient(0, y - size, 0, y);
    dg.addColorStop(0, '#ffe0f0');
    dg.addColorStop(0.5, '#ff7ac0');
    dg.addColorStop(1, '#e03a8a');
    return dg;
  }
  return t.color;
}
function drawDmgTexts(){
  ctx.textAlign = 'center';
  for (const t of dmgTexts){
    const sx = t.x - camX;
    const a = Math.max(0, Math.min(1, t.life / 0.4));
    const size = t.big ? 33 : 23;
    if (/^\d+$/.test(t.txt)){
      // 메이플식: 자릿수별로 개별 팝 + 아치 배치
      const n = t.txt.length;
      const isCrit = t.color === '#ff5ab0';
      const dw = size * 0.6;
      // 크리티컬: 뒤에 회전하는 4방 광선 플레어
      if (isCrit && t.pop < 0.4){
        ctx.save();
        ctx.translate(sx, t.y - size * 0.35);
        ctx.rotate(t.pop * 2.4);
        ctx.globalCompositeOperation = 'lighter';
        const fa = (1 - t.pop / 0.4) * a;
        ctx.fillStyle = 'rgba(255,140,200,' + fa * 0.55 + ')';
        for (let i = 0; i < 4; i++){
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(size * 1.9, -size * 0.28);
          ctx.lineTo(size * 1.9, size * 0.28);
          ctx.closePath(); ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();
      }
      for (let i = 0; i < n; i++){
        const dPop = t.pop - i * 0.035;
        if (dPop < 0) continue;
        const pop = dPop < 0.12 ? 1 + (0.12 - dPop) * 6 : 1;
        const dx = (i - (n - 1) / 2) * dw;
        const dy = -Math.sin((i / Math.max(1, n - 1)) * Math.PI) * (n > 1 ? 4 : 0);
        const ds = size * pop;
        ctx.save();
        ctx.translate(sx + dx, t.y + dy);
        ctx.rotate((i % 2 === 0 ? -1 : 1) * 0.05);
        ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
        ctx.lineWidth = isCrit ? 6 : 5;
        ctx.strokeStyle = isCrit ? 'rgba(90,10,50,' + a * 0.92 + ')' : 'rgba(50,25,0,' + a * 0.9 + ')';
        ctx.strokeText(t.txt[i], 0, 0);
        ctx.globalAlpha = a;
        // 팝 첫 순간은 흰색 플래시 → 본색
        ctx.fillStyle = dPop < 0.05 ? '#ffffff' : dmgFill(t, ds, 0);
        ctx.fillText(t.txt[i], 0, 0);
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    } else {
      const pop = t.pop < 0.14 ? 1 + (0.14 - t.pop) * 5 : 1;
      const ds = size * pop;
      ctx.font = '900 ' + ds.toFixed(0) + 'px sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(50,25,0,' + a * 0.9 + ')';
      ctx.strokeText(t.txt, sx, t.y);
      ctx.globalAlpha = a;
      ctx.fillStyle = dmgFill(t, ds, t.y);
      ctx.fillText(t.txt, sx, t.y);
      ctx.globalAlpha = 1;
    }
  }
}
